<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Acceso / Registro</title>
    <style>
        /* ... (CSS completo de la interfaz, mantenido) ... */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: url('images/fondo.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #2c7a7b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            padding: 0; 
            display: flex;
            flex-direction: column;
            position: relative;
            height: 250px; 
            background: none; 
            width: 100%;
        }

        .header-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('images/iafuturo.png') no-repeat center center;
            background-size: cover;
            opacity: 0.3;
            z-index: -1;
        }

        .header-content {
            position: relative;
            z-index: 1;
            color: white;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .title {
            font-size: 3rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-weight: bold;
        }

        .subtitle {
            font-size: 1.2rem;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
        }

        .user-count {
            position: absolute;
            top: 30px;
            right: 30px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #2c7a7b;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        }

        .auth-container {
            background-color: rgba(31, 41, 55, 0.95);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            margin-top: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease-in-out;
            border-top: 5px solid #48bb78;
        }

        .auth-container h2 {
            color: #48bb78;
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #a0aec0;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #4a5568;
            border-radius: 5px;
            background-color: #2d3748;
            color: white;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #48bb78;
            box-shadow: 0 0 0 3px rgba(72, 187, 120, 0.5);
        }

        .auth-button {
            width: 100%;
            padding: 12px;
            background-color: #48bb78;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .auth-button:hover {
            background-color: #38a169;
            transform: translateY(-1px);
        }

        .switch-form {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .switch-form button {
            background: none;
            border: none;
            color: #63b3ed;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            font-size: inherit;
        }

        .error-message, .success-message {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .error-message {
            color: #f56565;
            background-color: rgba(245, 101, 101, 0.1);
        }

        .success-message {
            color: #48bb78;
            background-color: rgba(72, 187, 120, 0.1);
        }


        .form-login.hidden, .form-register.hidden, .form-recovery.hidden {
            display: none;
        }
        
        .recovery-link {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        
        .recovery-link button {
            background: none;
            border: none;
            color: #90cdf4;
            cursor: pointer;
            text-decoration: none;
            padding: 0;
            font-size: inherit;
        }
        
        .recovery-link button:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    
    <div class="header">
        <div class="header-background"></div>
        <div class="header-content">
            <h1 class="title">Literatura Musical</h1>
            <p class="subtitle">El Portal de Acceso al Conocimiento</p>
        </div>
        <span class="user-count">Usuarios: <span id="userCountDisplay">?</span></span>
    </div>

    <div class="auth-container">
        <div id="formLogin" class="form-login">
            <h2>Iniciar Sesión</h2>
            <div id="loginError" class="error-message"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Usuario</label> 
                    <input type="text" id="loginUsername" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="auth-button">Acceder</button>
            </form>
            <div class="recovery-link">
                <button onclick="setFormMode('recovery')">¿Olvidaste tu contraseña?</button>
            </div>
        </div>

        <div id="formRegister" class="form-register hidden">
            <h2>Crear Cuenta</h2>
            <div id="registerError" class="error-message"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="registerUsername">Usuario</label>
                    <input type="text" id="registerUsername" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Correo Electrónico</label>
                    <input type="email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Contraseña (Mínimo 6 caracteres)</label>
                    <input type="password" id="registerPassword" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" required>
                </div>
                <button type="submit" class="auth-button">Registrarme</button>
            </form>
        </div>
        
        <div id="formRecovery" class="form-recovery hidden">
            <h2>Recuperar Cuenta</h2>
            <p style="color: #a0aec0; margin-bottom: 20px;">Introduce el correo electrónico asociado a tu cuenta para recibir las instrucciones de restablecimiento de contraseña.</p>
            <div id="recoveryError" class="error-message"></div>
            <div id="recoverySuccess" class="success-message"></div>
            <form id="recoveryForm">
                <div class="form-group">
                    <label for="recoveryEmail">Correo Electrónico</label>
                    <input type="email" id="recoveryEmail" required>
                </div>
                <button type="submit" class="auth-button">Enviar Enlace</button>
            </form>
        </div>


        <div class="switch-form">
            <p id="switchText">¿No tienes cuenta? <button onclick="setFormMode('register')">Regístrate</button></p>
        </div>
    </div>

    <script type="module">
        // ----------------------------------------------------------------------------------
        // 1. CONFIGURACIÓN E IMPORTACIÓN DE FIREBASE 🔑
        // ----------------------------------------------------------------------------------

        // !!! CLAVES DE TU PROYECTO FIREBASE. ASEGÚRATE DE QUE SEAN LAS CORRECTAS !!!
        const firebaseConfig = {
            apiKey: "AIzaSyDW3Yv0AQAVlf3zTuxlqNq6dkZ6kQtpysM",
            authDomain: "laiamusical-4fba7.firebaseapp.com",
            projectId: "laiamusical-4fba7",
            storageBucket: "laiamusical-4fba7.firebasestorage.app",
            messagingSenderId: "49783369602",
            appId: "1:49783369602:web:91e287c094a8f2403d699b",
            measurementId: "G-WC2JT6DRF4"
        };

        // Importaciones de los módulos de Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            sendPasswordResetEmail // NUEVA FUNCIÓN PARA RECUPERACIÓN
        } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
        
        // Importación de Firestore (para guardar el nombre de usuario)
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc,
            query, 
            where, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        // Inicializa Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app); 
        const db = getFirestore(app); 

        // --- CONSTANTES GLOBALES ---
        const TEMAS_URL = 'temas.html'; 

        // --- UTILIDADES ---

        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(String(email).toLowerCase());
        }

        function updateUserCount() {
            // Esta función debe ser actualizada para contar usuarios en Firestore si deseas un número preciso
            document.getElementById('userCountDisplay').textContent = '?';
        }

        // --- GESTIÓN DE LA INTERFAZ ---

        window.setFormMode = function(mode) {
            const loginForm = document.getElementById('formLogin');
            const registerForm = document.getElementById('formRegister');
            const recoveryForm = document.getElementById('formRecovery'); // NUEVO
            const switchText = document.getElementById('switchText');
            
            // Ocultar todos los mensajes al cambiar de formulario
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('registerError').style.display = 'none';
            document.getElementById('recoveryError').style.display = 'none';
            document.getElementById('recoverySuccess').style.display = 'none';


            if (mode === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                recoveryForm.classList.add('hidden'); // OCULTAR
                switchText.innerHTML = '¿No tienes cuenta? <button onclick="setFormMode(\'register\')">Regístrate</button>';
            } else if (mode === 'register') {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                recoveryForm.classList.add('hidden'); // OCULTAR
                switchText.innerHTML = '¿Ya tienes cuenta? <button onclick="setFormMode(\'login\')">Inicia Sesión</button>';
            } else if (mode === 'recovery') { // NUEVO MODO
                loginForm.classList.add('hidden');
                registerForm.classList.add('hidden');
                recoveryForm.classList.remove('hidden'); // MOSTRAR
                switchText.innerHTML = '<button onclick="setFormMode(\'login\')">Volver al inicio de sesión</button>';
            }
        }

        function showLoginError(message) {
            const errorElement = document.getElementById('loginError');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function showRegisterError(message) {
            const errorElement = document.getElementById('registerError');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
        
        function showRecoveryError(message) {
            const errorElement = document.getElementById('recoveryError');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }
        
        function showRecoverySuccess(message) {
            const successElement = document.getElementById('recoverySuccess');
            successElement.textContent = message;
            successElement.style.display = 'block';
        }

        // --- HANDLERS DE AUTENTICACIÓN FIREBASE ---

        // Esta función busca el email real de Firestore usando el identificador (Usuario o Email)
        async function getEmailFromIdentifier(identifier) {
            const usersRef = collection(db, "users");
            const lowerIdentifier = identifier.toLowerCase();
            
            // 1. Intentar buscar por nombre de usuario (en Firestore)
            let q = query(usersRef, where("username", "==", lowerIdentifier));
            let querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                // Se encontró el usuario por el username
                return querySnapshot.docs[0].data().email;
            }

            // 2. Si no se encuentra, verificar si el input es un email válido (aunque el campo diga 'Usuario')
            if (isValidEmail(lowerIdentifier)) {
                q = query(usersRef, where("email", "==", lowerIdentifier));
                querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    // Se encontró el usuario por el email
                    return querySnapshot.docs[0].data().email;
                }
            }

            return null; // Usuario/Email no encontrado en Firestore
        }

        // 1. Manejar el Login 
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginUsername').value.trim(); 
            const password = document.getElementById('loginPassword').value;
            showLoginError('');

            if (identifier === "" || password === "") {
                showLoginError('Por favor, rellena todos los campos.');
                return;
            }

            try {
                // Paso 1: Obtener el email real de Firestore usando el input (Usuario o Email)
                const email = await getEmailFromIdentifier(identifier);

                if (!email) {
                    // Si Firestore no encuentra el identificador, devolvemos un error genérico
                    showLoginError('Usuario o Contraseña incorrectos.');
                    return;
                }

                // Paso 2: Autenticar usando el email y la contraseña con Firebase Auth
                const userCredential = await signInWithEmailAndPassword(auth, email, password);

                // Login Exitoso
                window.location.href = TEMAS_URL;

            } catch (error) {
                // Manejo de Errores de Firebase Auth (MEJORADO PARA DEBUGGING)
                let errorMessage = "Error de inicio de sesión.";
                
                // Si la búsqueda en Firestore falló, el error ya fue manejado arriba.
                // Aquí manejamos los errores del signInWithEmailAndPassword
                if (error.code === 'auth/wrong-password') {
                    errorMessage = 'Contraseña incorrecta.';
                } else if (error.code === 'auth/user-not-found') {
                    // Esto puede ocurrir si el registro en Firestore se hizo, pero el Auth falló, o fue eliminado
                    errorMessage = 'Usuario no encontrado en la autenticación de Firebase.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'El formato de correo no es válido.'; 
                } else if (error.message.includes("network")) {
                     errorMessage = 'Error de conexión. Revisa tu internet.';
                }
                
                showLoginError(errorMessage);
                console.error("Error de Login:", error.code, error.message);
            }
        });

        // 2. Manejar el Registro 
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('registerEmail').value.trim().toLowerCase(); 
            const username = document.getElementById('registerUsername').value.trim().toLowerCase();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            showRegisterError('');

            // --- Validaciones de Frontend ---
            if (password.length < 6) {
                showRegisterError('La contraseña debe tener al menos 6 caracteres.');
                return;
            }
            if (password !== confirmPassword) {
                showRegisterError('Las contraseñas no coinciden.');
                return;
            }
            if (!isValidEmail(email)) {
                showRegisterError('Por favor, introduce un correo electrónico válido.');
                return;
            }
            if (username.length < 3) {
                 showRegisterError('El nombre de usuario debe tener al menos 3 caracteres.');
                return;
            }
            
            try {
                // Paso 1: Verificación de nombre de usuario duplicado en Firestore 
                // Usamos getEmailFromIdentifier para verificar si el nombre de usuario ya está tomado
                const checkUsername = await getEmailFromIdentifier(username);
                if (checkUsername) {
                     showRegisterError('Este nombre de usuario ya está en uso. Elige otro.');
                     return;
                }
                
                // Paso 2: Crea el usuario en Firebase Authentication (verifica duplicado de email)
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Paso 3: Guarda el nombre de usuario y email en Firestore (colección "users")
                await setDoc(doc(db, "users", user.uid), {
                    username: username, 
                    email: email,
                    created: new Date()
                });

                // Registro Exitoso
                alert('Registro exitoso para ' + username + '. ¡Ahora puedes iniciar sesión!');
                
                // Limpiar y cambiar a login, pre-rellenando el campo con el email para iniciar sesión
                document.getElementById('loginUsername').value = username; // Usamos el username para login
                document.getElementById('registerForm').reset();
                setFormMode('login');

            } catch (error) {
                // Manejo de Errores de Firebase Auth
                let errorMessage = "Error al registrar.";
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'Ese correo electrónico ya está registrado.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'La contraseña es demasiado débil (mínimo 6 caracteres).';
                }
                showRegisterError(errorMessage);
                console.error("Error de Registro:", error.code);
            }
        });
        
        // 3. NUEVO: Manejar la Recuperación de Contraseña
        document.getElementById('recoveryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('recoveryEmail').value.trim(); 
            showRecoveryError('');
            showRecoverySuccess('');

            if (!isValidEmail(email)) {
                showRecoveryError('Por favor, introduce un correo electrónico válido.');
                return;
            }

            try {
                // Función de Firebase para enviar el email de restablecimiento
                await sendPasswordResetEmail(auth, email);

                showRecoverySuccess(`Se ha enviado un correo electrónico a ${email} con instrucciones para restablecer tu contraseña. Revisa tu bandeja de entrada.`);
                document.getElementById('recoveryEmail').value = '';
                
                // Opcional: Volver al login después de 5 segundos
                setTimeout(() => {
                    setFormMode('login');
                }, 5000);

            } catch (error) {
                let errorMessage = 'Error al intentar enviar el enlace de recuperación.';
                if (error.code === 'auth/user-not-found') {
                    // Por seguridad, es mejor dar un mensaje genérico incluso si el usuario no existe.
                    errorMessage = 'Si esta cuenta existe, recibirás un correo electrónico pronto.';
                    showRecoverySuccess(errorMessage);
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Correo electrónico inválido.';
                }
                showRecoveryError(errorMessage);
                console.error("Error de Recuperación:", error.code);
            }
        });
        
        // ----------------------------------------------------------------------------------
        // 4. INICIALIZACIÓN: GESTIÓN DE SESIÓN
        // ----------------------------------------------------------------------------------
        
        function init() {
            // onAuthStateChanged comprueba si Firebase ya tiene una sesión abierta
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // Si hay un usuario, redirige
                    window.location.href = TEMAS_URL;
                } else {
                    // Si no hay sesión, muestra el formulario
                    setFormMode('login'); 
                    updateUserCount();
                }
            });
        }

        init();
    </script>
</body>
</html>
