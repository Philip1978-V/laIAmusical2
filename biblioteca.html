            --dark-brown: #8B4513;
            --light-tan: #D2B48C;

            --dark-red: #4B0000;
            --primary-orange: #FF8C00;
            --dark-orange: #E67E22;
            --primary-purple: #4B0082;
            --dark-purple: #2E0854;
            --primary-crimson: #C00000;
            --dark-crimson: #800000;
            --primary-violet: #6B46C1;
            --dark-violet: #4C1D95;
            --star-gold: #FFD700;
            --bg-light: #f8f8f8;
            --bg-dark: #1a1a1a;
            --disabled-grey: #ccc;
            --ia-blue: #007bff;
        }

        /* Estilos para la vista biblioteca */
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .biblioteca-view .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .biblioteca-view h1 { color: #0056b3; text-align: center; flex-grow: 1; margin: 0; }
        .temas-btn { background-color: #BEF264; color: #1a1a1a; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; border: 1px solid #a7e555; transition: 0.3s; }
        .temas-btn:hover { background-color: #a7e555; transform: scale(1.05); }
        #salas-container ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        #salas-container li a { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; background: #007bff; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; transition: all 0.3s ease; }
        #salas-container li a:hover { background: #0056b3; transform: translateY(-3px); box-shadow: 0 5px 10px rgba(0,0,0,0.2); }
        .count { background: rgba(255,255,255,0.25); padding: 4px 12px; border-radius: 20px; font-size: 0.85em; }
        .search-container { margin: 25px 0; display: flex; gap: 10px; }
        #search-input { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .search-btn { padding: 10px 25px; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .result-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .result-item:hover { background-color: #f8fbff; }
        hr { border: 0; border-top: 1px solid #eee; margin: 30px 0; }

        /* Estilos para las salas literarias */
        .sala-view {
            background-color: var(--bg-light);
            color: #333;
        }

        .sala-view .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .sala-view h1 {
            text-align: center;
            border-bottom: 3px solid;
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        .header-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .back-link { text-decoration: none; color: #007bff; font-weight: bold; }

        .info-panel {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid;
            text-align: center;
            font-weight: bold;
        }

        .ia-notice {
            display: block;
            margin-top: 10px;
            font-size: 0.95em;
            border-top: 1px solid;
            padding-top: 10px;
        }

        .entrada-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #eee;
            background-color: #fff;
        }

        .titulo-autor { flex-grow: 1; text-align: left; }
        .titulo-original { font-size: 1.1em; font-weight: bold; color: #444; }
        .autor { font-size: 0.9em; color: #777; font-style: italic; }
        .titulo-ia { 
            font-size: 1.15em; 
            font-weight: 800; 
            color: var(--ia-blue); 
            margin-top: 6px;
            display: block;
        }

        .controles-votacion {
            display: flex;
            gap: 15px;
            align-items: center;
            min-width: 250px;
            justify-content: flex-end;
        }
        
        .vote-btn {
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .vote-btn:disabled { background: var(--disabled-grey); cursor: not-allowed; }

        .vote-stats {
            display: flex;
            flex-direction: column;
            font-size: 0.85em;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid;
        }
        
        .rating-avg { color: var(--star-gold); font-weight: 800; }
        .genre-top { color: var(--ia-blue); font-weight: 600; }
        
        .voted-badge { color: #10b981; font-weight: 600; }
        .not-voted-badge { color: #999; font-weight: 400; }

        .stars-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            flex-direction: row-reverse;
        }

        .stars-container i {
            font-size: 3em;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s;
        }

        .stars-container i:hover,
        .stars-container i:hover ~ i {
            color: var(--star-gold);
        }

        .modal { 
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(4px); 
        }
        
        .modal-content { 
            background: #fff; 
            margin: 10vh auto; 
            padding: 40px; 
            width: 90%; 
            max-width: 500px; 
            border-radius: 20px; 
            text-align: center; 
            position: relative; 
        }
        
        .close { 
            position: absolute; 
            right: 20px; 
            top: 15px; 
            font-size: 28px; 
            cursor: pointer; 
            color: #aaa; 
        }
        
        .genre-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            margin-top: 20px; 
        }
        
        .genre-btn { 
            padding: 10px; 
            border: 2px solid; 
            border-radius: 8px; 
            background: none; 
            cursor: pointer; 
            font-weight: bold; 
        }

        /* Estilos específicos para cada sala */
        .sala-literaria h1 { color: var(--primary-brown); border-bottom-color: var(--primary-brown); }
        .sala-literaria .info-panel { background: #fff8e1; border-color: #ffe082; }
        .sala-literaria .ia-notice { color: #856404; border-top-color: #ffe082; }
        .sala-literaria .vote-btn { background: var(--primary-brown); }
        .sala-literaria .vote-stats { background: #f0f7ff; border-color: #d0e0f0; }
        .sala-literaria .genre-btn { border-color: var(--primary-brown); }
        .sala-literaria .genre-btn:hover { background: var(--primary-brown); color: #fff; }

        .sala-cine h1 { color: var(--primary-red); border-bottom-color: var(--primary-red); }

        .sala-cine .vote-btn { background: var(--primary-red); }
        .sala-cine .vote-stats { background: #fff9e6; border-color: #ffeeba; }
        .sala-cine .genre-btn { border-color: var(--primary-red); }

        .sala-animacion .vote-btn { background: var(--primary-orange); }
        .sala-animacion .vote-stats { background: #fffdf5; border-color: #fff3e0; }
        .sala-animacion .genre-btn { border-color: var(--primary-orange); }
        .sala-animacion .genre-btn:hover { background: var(--primary-orange); color: #fff; }

        .sala-opera .ia-notice { color: var(--primary-purple); border-top-color: #d1c4e9; }
        .sala-opera .vote-btn { background: var(--primary-purple); }
        .sala-opera .vote-stats { background: #f8f0ff; border-color: #e1bee7; }
        .sala-opera .rating-avg { color: #ccac00; }
        .sala-opera .genre-btn { border-color: var(--primary-purple); }
        .sala-opera .genre-btn:hover { background: var(--primary-purple); color: #fff; }

        .sala-teatro { background-color: var(--bg-dark); color: #eee; }
        .sala-teatro .container { background: #2b2b2b; }

        .sala-teatro .vote-btn { background: var(--primary-crimson); }
        .sala-teatro .vote-btn:disabled { background: #555; color: #888; }
        .sala-teatro .vote-stats { background: #444; }

        .sala-teatro .modal-content { background: #222; color: white; border: 2px solid var(--primary-crimson); }

        .sala-teatro .genre-btn { border-color: var(--primary-crimson); color: white; }
        .sala-teatro .genre-btn:hover { background: var(--primary-crimson); }
        .sala-teatro .back-link { color: var(--ia-blue); }

        .sala-extras .vote-btn { background: var(--primary-violet); }

        .sala-extras .genre-btn { border-color: var(--primary-violet); }

        .sala-anime .vote-btn { background: var(--primary-purple); }

        .sala-anime .rating-avg { color: #ccac00; }
        .sala-anime .genre-btn { border-color: var(--primary-purple); }
        .sala-anime .genre-btn:hover { background: var(--primary-purple); color: #fff; }

        .sala-series .genre-btn:hover { background: var(--dark-red); color: #fff; }

        @media (max-width: 600px) {
            .entrada-item { flex-direction: column; text-align: center; }
            .controles-votacion { margin-top: 15px; width: 100%; justify-content: center; }
        }

        .hidden { display: none; }
    </style>
</head>

    // Función para obtener parámetros de URL
    function getURLParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    // Funciones para cambiar vistas
    function mostrarBiblioteca() {
        document.body.className = 'biblioteca-view';
        document.getElementById('biblioteca-container').classList.remove('hidden');
        document.getElementById('sala-container').classList.add('hidden');
    }

    function mostrarSala(sala) {
        document.body.className = `sala-view sala-${sala}`;
        document.getElementById('biblioteca-container').classList.add('hidden');
        document.getElementById('sala-container').classList.remove('hidden');
    }

    window.volverABiblioteca = () => {
        history.pushState({}, '', 'biblioteca.html');
        mostrarBiblioteca();
        mostrarSalas();
    };

    // Variable para la suscripción en tiempo real
    let unsubscribe = null;

    // Función para inicializar la sala (se llama tras autenticación anónima)
    function initSala() {
        const sala = getURLParameter('sala');

        // Limpiar suscripción anterior si existe
        if (unsubscribe) {
            unsubscribe();
            unsubscribe = null;
        }

        if (sala && salasConfig[sala]) {
            currentSala = sala;
            salaConfig = salasConfig[sala];

            mostrarSala(sala);

            document.getElementById('titulo-sala').textContent = salaConfig.titulo;
            document.getElementById('ia-notice-text').textContent = salaConfig.iaNotice;

            // Mostrar indicador de carga
            document.getElementById('lista-entradas').innerHTML =
                '<p style="padding:16px;color:#888;text-align:center"><i class="fas fa-spinner fa-spin"></i> Cargando votos desde Firebase...</p>';

            // Suscripción en tiempo real con SDK compat (igual que reproductor.html)
            // Cada vez que reproductor.html vota, este listener se dispara automáticamente
            unsubscribe = db.collection('ranking').doc('stars')
                .onSnapshot(
                    (docSnapshot) => {
                        const rankingStars = docSnapshot.exists
                            ? (docSnapshot.data().rankingStars || {})
                            : {};
                        renderList(rankingStars);
                    },
                    (error) => {
                        console.error('Error Firestore onSnapshot:', error.code, error.message);
                        document.getElementById('lista-entradas').innerHTML =
                            '<p style="padding:16px;color:red;text-align:center"><i class="fas fa-exclamation-triangle"></i> Error al leer votos: ' + error.message + '</p>';
                    }
                );
        } else {
            mostrarBiblioteca();
            mostrarSalas();
        }
    }

    // Datos para búsqueda
    function obtenerDatos() {
        const datos = [];
        Object.entries(salasConfig).forEach(([key, config]) => {
            config.entries.forEach(entry => {
                datos.push({
                    t: entry.titulo,
                    a: entry.basadoEn,
                    s: `biblioteca.html?sala=${key}`,
                    sala: key
                });
            });
        });
        return datos;
    }

    function mostrarSalas() {
        const container = document.getElementById('salas-container');
        const counts = {};
        
        // Contar entradas por sala
        Object.keys(salasConfig).forEach(key => {
            counts[key] = salasConfig[key].entries.length;
        });

        const ul = document.createElement('ul');
        salasConfigMenu.forEach(sala => {
            const num = counts[sala.key] || 0;
            const li = document.createElement('li');
            li.innerHTML = `
                <a href="${sala.archivo}">
                    <span>${sala.nombre}</span>
                    <span class="count">${num} temas</span>
                </a>
            `;
            ul.appendChild(li);
        });
        container.innerHTML = '';
        container.appendChild(ul);
    }

    window.realizarBusqueda = function() {
        const term = document.getElementById('search-input').value.toLowerCase();
        const resCont = document.getElementById('results-container');
        resCont.innerHTML = '';
        if (!term) return;
        
        const resultados = obtenerDatos().filter(i => 
            i.t.toLowerCase().includes(term) || 
            i.a.toLowerCase().includes(term)
        );
        
        if (resultados.length === 0) {
            resCont.innerHTML = '<p>No se encontraron resultados.</p>';
            return;
        }

        resultados.forEach(r => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `<b>${r.t}</b> - ${r.a}`;
            div.onclick = () => window.location.href = r.s;
            resCont.appendChild(div);
        });
    };

    // Renderizar lista de entradas con datos de Firebase en tiempo real
    function renderList(globalData) {
        const contenedor = document.getElementById('lista-entradas');
        globalData = globalData || {};

        if (!salaConfig.entries || salaConfig.entries.length === 0) {
            contenedor.innerHTML = '<p style="padding:16px;color:#888;text-align:center">No hay entradas en esta sala.</p>';
            return;
        }

        contenedor.innerHTML = '';

        // Ordenar por votos (más votados primero), mismo criterio que reproductor.html
        const sortedEntries = [...salaConfig.entries].sort((a, b) => {
            // Las claves en Firebase son el id numérico como string, ej: "13"
            const votesA = globalData[a.id] || globalData[String(parseInt(a.id))] || 0;
            const votesB = globalData[b.id] || globalData[String(parseInt(b.id))] || 0;
            return votesB - votesA;
        });

        sortedEntries.forEach((e) => {
            // Buscar votos con la clave numérica tal como los guarda reproductor.html
            const totalStars = globalData[e.id] || globalData[String(parseInt(e.id))] || 0;
            const hasVotes = totalStars > 0;

            const votedBadge = hasVotes
                ? '<span class="voted-badge"><i class="fas fa-check-circle"></i> Votada</span>'
                : '<span class="not-voted-badge"><i class="fas fa-circle"></i> Sin votos</span>';

            const div = document.createElement('div');
            div.className = 'entrada-item';
            div.innerHTML = `
                <div class="titulo-autor">
                    <span class="titulo-original">${salaConfig.emoji} ${e.titulo}</span><br>
                    <span class="autor">Basado en: ${e.basadoEn}</span>
                </div>
                <div class="controles-votacion">
                    <div class="vote-stats">
                        <span class="rating-avg"><i class="fas fa-star"></i> ${totalStars} votos</span>
                        <span class="genre-top">${votedBadge}</span>
                    </div>
                </div>
            `;
            contenedor.appendChild(div);
        });
    }

    // Inicializar: autenticación anónima primero (igual que el flujo de reproductor.html)
    // Esto es necesario si las reglas de Firestore requieren autenticación para leer
    document.addEventListener('DOMContentLoaded', () => {
        mostrarSalas(); // Menú principal no necesita Firebase

        auth.onAuthStateChanged((user) => {
            if (user) {
                // Ya autenticado (anónimo o normal), inicializar sala
                initSala();
            } else {
                // Sin sesión: iniciar sesión anónima para poder leer Firestore
                auth.signInAnonymously()
                    .then(() => {
                        // onAuthStateChanged volverá a dispararse con el usuario anónimo
                    })
                    .catch((error) => {
                        console.error('Error auth anónima:', error.code, error.message);
                        // Intentar cargar igualmente (por si las reglas permiten lectura pública)
                        initSala();
                    });
            }
        });
    });
