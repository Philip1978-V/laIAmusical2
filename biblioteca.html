            --disabled-grey: #ccc;
            --ia-blue: #007bff;
        }

        /* Estilos para la vista biblioteca */
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .biblioteca-view .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .biblioteca-view h1 { color: #0056b3; text-align: center; flex-grow: 1; margin: 0; }
        .temas-btn { background-color: #BEF264; color: #1a1a1a; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; border: 1px solid #a7e555; transition: 0.3s; }
        .temas-btn:hover { background-color: #a7e555; transform: scale(1.05); }
        #salas-container ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        #salas-container li a { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; background: #007bff; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; transition: all 0.3s ease; }
        #salas-container li a:hover { background: #0056b3; transform: translateY(-3px); box-shadow: 0 5px 10px rgba(0,0,0,0.2); }
        .count { background: rgba(255,255,255,0.25); padding: 4px 12px; border-radius: 20px; font-size: 0.85em; }
        .search-container { margin: 25px 0; display: flex; gap: 10px; }
        #search-input { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .search-btn { padding: 10px 25px; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .result-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .result-item:hover { background-color: #f8fbff; }
        hr { border: 0; border-top: 1px solid #eee; margin: 30px 0; }

        /* Estilos para las salas literarias */
        .sala-view {
            background-color: var(--bg-light);
            color: #333;
        }

        .sala-view .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .sala-view h1 {
            text-align: center;
            border-bottom: 3px solid;
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        .header-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .back-link { text-decoration: none; color: #007bff; font-weight: bold; }

        .info-panel {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid;
            text-align: center;
            font-weight: bold;
        }

        .ia-notice {
            display: block;
            margin-top: 10px;
            font-size: 0.95em;
            border-top: 1px solid;
            padding-top: 10px;
        }

        .entrada-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #eee;
            background-color: #fff;
        }

        .titulo-autor { flex-grow: 1; text-align: left; }
        .titulo-original { font-size: 1.1em; font-weight: bold; color: #444; display: block; }
        .autor { font-size: 0.9em; color: #777; font-style: italic; display: block; margin-top: 5px; }
        .synopsis-text { font-size: 0.82em; color: #888; display: block; margin-top: 6px; line-height: 1.45; font-style: normal; }
        
        .storycard-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: #f4f4f4;
            flex-shrink: 0;
        }

        .item-info-wrapper {
            display: flex; 
            gap: 15px; 
            align-items: center; 
            flex-grow: 1;
        }

        .controles-votacion {
            display: flex;
            gap: 15px;
            align-items: center;
            min-width: 200px;
            justify-content: flex-end;
        }
        
        .vote-stats {
            display: flex;
            flex-direction: column;
            font-size: 0.85em;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid;
            text-align: center;
        }
        
        .rating-avg { color: var(--star-gold); font-weight: 800; }
        .genre-top { color: var(--ia-blue); font-weight: 600; }
        
        .voted-badge { color: #10b981; font-weight: 600; }
        .not-voted-badge { color: #999; font-weight: 400; }

        /* Estilos específicos para cada sala */
        .sala-literaria h1 { color: var(--primary-brown); border-bottom-color: var(--primary-brown); }
        .sala-literaria .info-panel { background: #fff8e1; border-color: #ffe082; }
        .sala-literaria .ia-notice { color: #856404; border-top-color: #ffe082; }
        .sala-literaria .vote-stats { background: #f0f7ff; border-color: #d0e0f0; }

        .sala-cine h1 { color: var(--primary-red); border-bottom-color: var(--primary-red); }
        .sala-cine .info-panel { background: #fff5f5; border-color: #ffcccc; }
        .sala-cine .ia-notice { color: var(--primary-red); border-top-color: #ffcccc; }
        .sala-cine .vote-stats { background: #fff9e6; border-color: #ffeeba; }

        .sala-animacion h1 { color: var(--primary-orange); border-bottom-color: var(--primary-orange); }
        .sala-animacion .info-panel { background: #fff9f0; border-color: #ffe0b2; }
        .sala-animacion .ia-notice { color: #e65100; border-top-color: #ffe0b2; }
        .sala-animacion .vote-stats { background: #fffdf5; border-color: #fff3e0; }

        .sala-opera h1 { color: var(--primary-purple); border-bottom-color: var(--primary-purple); }
        .sala-opera .info-panel { background: #f3e5f5; border-color: #d1c4e9; }
        .sala-opera .ia-notice { color: var(--primary-purple); border-top-color: #d1c4e9; }
        .sala-opera .vote-stats { background: #f8f0ff; border-color: #e1bee7; }
        .sala-opera .rating-avg { color: #ccac00; }

        .sala-teatro { background-color: var(--bg-dark); color: #eee; }
        .sala-teatro .container { background: #2b2b2b; }
        .sala-teatro h1 { color: var(--primary-crimson); border-bottom-color: var(--primary-crimson); text-transform: uppercase; letter-spacing: 2px; }
        .sala-teatro .info-panel { background: #3d0000; border-color: var(--primary-crimson); color: #ffcccc; }
        .sala-teatro .entrada-item { border-color: #444; background-color: #333; }
        .sala-teatro .vote-stats { background: #444; }
        .sala-teatro .back-link { color: var(--ia-blue); }
        .sala-teatro .titulo-original { color: #fff; }

        .sala-extras h1 { color: var(--primary-violet); border-bottom-color: var(--primary-violet); }
        .sala-extras .info-panel { background: #f3e8ff; border-color: #d8b4fe; }
        .sala-extras .ia-notice { color: var(--primary-violet); border-top-color: #d8b4fe; }
        .sala-extras .vote-stats { background: #f3e8ff; border-color: #d8b4fe; }

        .sala-anime h1 { color: var(--primary-purple); border-bottom-color: var(--primary-purple); }
        .sala-anime .info-panel { background: #f3e5f5; border-color: #d1c4e9; }
        .sala-anime .ia-notice { color: var(--primary-purple); border-top-color: #d1c4e9; }
        .sala-anime .vote-stats { background: #f8f0ff; border-color: #e1bee7; }

        .sala-series h1 { color: var(--dark-red); border-bottom-color: var(--dark-red); }
        .sala-series .info-panel { background: #fff5f5; border-color: #ffcccc; }
        .sala-series .ia-notice { color: var(--dark-red); border-top-color: #ffcccc; }
        .sala-series .vote-stats { background: #fff9e6; border-color: #ffeeba; }

        @media (max-width: 600px) {
            .entrada-item { flex-direction: column; text-align: center; }
            .item-info-wrapper { flex-direction: column; }
            .controles-votacion { margin-top: 15px; width: 100%; justify-content: center; }
        }

        .hidden { display: none; }
    </style>
</head>

        { id: 8,   title: "El ruido de la conciencia",     titleEn: "The Noise of Consciousness",      year: 2026, category: "PSICOLÓGICA",            topic: "Literatura",           cover: "./imagenportada/lit_ruidodelaconciencia.png",   synopsis: "Un aclamado arquitecto, que aparentemente lo tiene todo, vive atormentado por un incesante ruido en su conciencia que ni el éxito ni el lujo pueden silenciar. Deberá enfrentarse a la verdad que ha intentado enterrar." },
        { id: 17,  title: "La conversion",                 titleEn: "The Conversion",                  year: 2026, category: "FICCIÓN FILOSÓFICA",     topic: "Literatura",           cover: "./imagenportada/lit_conversion.png",            synopsis: "Una joven costurera y catequista de Mombasa despierta un día con una extraña y severa afección en la piel. Mientras quienes la rodean debaten si es enfermedad, milagro o castigo, ella debe enfrentarse al dolor y encontrar un nuevo sentido a su identidad y su fe." },
        { id: 18,  title: "La cicatriz invisible",         titleEn: "The Invisible Scar",              year: 2026, category: "GÓTICO",                 topic: "Literatura",           cover: "./imagenportada/lit_cicatriz.png",              synopsis: "Una joven se muda a un antiguo piso en Edimburgo y empieza a notar extraños ruidos ligados a una misteriosa buhardilla sellada. A medida que investiga, descubre que la casa guarda algo más que recuerdos." },
        { id: 22,  title: "El señor de los locos y sabios",titleEn: "The Lord of Madmen and Sages",    year: 2026, category: "SATÍRICA/AVENTURA",      topic: "Literatura",           cover: "./imagenportada/lit_quijote.png",               synopsis: "Un hidalgo idealista decide convertirse en caballero andante para impartir justicia en un mundo que ya no cree en héroes. Acompañado por su práctico escudero, su imaginación le llevará a enfrentarse a formidables enemigos que solo él puede ver." },
        { id: 23,  title: "El largo regreso a Ítaca",      titleEn: "The Long Return to Ithaca",       year: 2026, category: "ÉPICA",                  topic: "Literatura",           cover: "./imagenportada/lit_regresoitaca.png",          synopsis: "Una joven timonel emprende un viaje por mares cambiantes para encontrar a su hermano desaparecido, reuniendo a una tripulación improbable. La travesía se convierte en una prueba de ingenio, lealtad y resistencia." },
        { id: 24,  title: "Amor y conveniencias",          titleEn: "Love and Conveniences",           year: 2026, category: "ROMANCE/COSTUMBRISTA",   topic: "Literatura",           cover: "./imagenportada/lit_amoryconveniencias.png",    synopsis: "Elena, arquitecta valenciana, viaja a Fez para concursar con la rehabilitación del Riad Al Andalus y choca con Malik, su heredero. Deberá conciliar su visión sostenible con la tradición artesana del riad." },

        // ÓPERA Y CONCIERTOS
        { id: 1,   title: "La novena sinfonía del mundo",  titleEn: "The 9th Symphony of the World",   year: 2026, category: "CLÁSICA",               topic: "Ópera y conciertos",   cover: "./imagenportada/opera_sinfoniamundo.png",      synopsis: "Un aclamado compositor europeo se siente perdido en la ruidosa Nueva York, hasta que descubre la verdadera música de América en los cantos de los trabajadores afroamericanos y el blues de Harlem, inspirándolo a crear una sinfonía que fusiona dos mundos." },
        { id: 2,   title: "Amar eternamente",              titleEn: "To Love Eternally",               year: 2026, category: "ÓPERA",                  topic: "Ópera y conciertos",   cover: "./imagenportada/opera_amareternamente.png",    synopsis: "Un arquitecto es enviado por su mentor para ganarse la confianza de la mujer con la que este va a casarse. Sin embargo, entre el arquitecto y la prometida nace una atracción prohibida que amenaza con desatar la furia de su poderoso protector." },
        { id: 100, title: "Vivir en un suspiro",           titleEn: "Living in a Sigh",                year: 2026, category: "ÓPERA",                  topic: "Ópera y conciertos",   cover: "./imagenportada/opera_vivirenunsuspiro.png",   synopsis: "En el bohemio Madrid de los años 20, el amor surge entre una apasionada pintora que vive al límite y el joven heredero de un imperio industrial. Su romance chocará con las barreras de sus mundos opuestos." },
        { id: 101, title: "El reloj de la naturaleza",     titleEn: "The Clock of Nature",             year: 2026, category: "CONCIERTO BARROCO",      topic: "Ópera y conciertos",   cover: "./imagenportada/opera_relojdelanaturaleza.png",synopsis: "Un joven violinista descubre que el equilibrio de las estaciones se ha roto, sumiendo al mundo en un caos climático. Para restaurar la armonía, deberá adentrarse en un lugar legendario donde la naturaleza misma necesita ser sanada." },
        { id: 102, title: "Donde muere la noche",          titleEn: "Where the Night Dies",            year: 2026, category: "ÓPERA",                  topic: "Ópera y conciertos",   cover: "./imagenportada/opera_dondemuerelanoche.png",  synopsis: "En una ciudad perpetuamente a oscuras, un forastero idealista desafía las tres pruebas mortales de la enigmática y fría regente. Su objetivo no es el poder, sino desvelar el antiguo secreto que mantiene a la ciudad prisionera de la noche." },
        { id: 103, title: "Sinfonía de los jardines reales",titleEn: "Symphony of the Royal Gardens",  year: 2026, category: "CONCIERTO GUITARRA",     topic: "Ópera y conciertos",   cover: "./imagenportada/opera_jardinesreales.png",     synopsis: "Un joven guitarrista, Rodrigo, lucha por capturar con su música el alma de los Jardines de Aranjuez. Su inspiración llega al conocer a Isabel, una pintora que dibuja las sensaciones del lugar. Juntos descubren una profunda conexión artística." },
        { id: 104, title: "El Ave sin jaula",              titleEn: "The Bird Without a Cage",         year: 2026, category: "ÓPERA",                  topic: "Ópera y conciertos",   cover: "./imagenportada/opera_avesinjaula.png",        synopsis: "Leo, un arquitecto con una vida ordenada, se obsesiona con Elara, una artista callejera de espíritu libre. Su amor se convierte en una posesión que intenta enjaular la libertad de Elara, con una confrontación final que lo deja atrapado en su propia obsesión." },

        // CINE
        { id: 13,  title: "Tiempospeligrosos",             titleEn: "Dangerous Times",                 year: 2026, category: "CRIMEN",                topic: "Cine",                 cover: "./imagenportada/cine_tiempospeligrosos.png",   synopsis: "Un camarero con un pasado oscuro, un boxeador acorralado y dos cobradores se convierten en el blanco de un capitán de policía corrupto tras interceptar una libreta con los secretos de la ciudad. Deberán exponer la verdad antes de que el sistema los borre." },
        { id: 14,  title: "La línea temporal perdida",     titleEn: "The Lost Timeline",               year: 2026, category: "MAFIA",                 topic: "Cine",                 cover: "./imagenportada/cine_lineatemporal.png",       synopsis: "Una conservadora de patrimonio encuentra una pieza anómala en un silo de Toronto, conectándola con un técnico de faros en Nueva Escocia y un barrio demolido en Osaka. Juntos reconstruyen una historia deliberadamente borrada de los archivos oficiales." },
        { id: 15,  title: "Biblioteca de horizontes",      titleEn: "Library of Horizons",             year: 2026, category: "CIENCIA FICCIÓN",       topic: "Cine",                 cover: "./imagenportada/cine_bibliotecadehorizontes.png",synopsis: "Una astrofísica y una tripulación de parias espaciales viajan al agujero negro Acheron-9 tras captar un misterioso patrón gravitacional. Cada minuto en órbita les arrebata años de vida en la Tierra; deberán elegir entre el secreto cósmico o el mundo que dejaron atrás." },
        { id: 16,  title: "Alas de libertad",              titleEn: "Wings of Freedom",                year: 2026, category: "PENITENCIARIO",         topic: "Cine",                 cover: "./imagenportada/cine_alasdelibertad.png",      synopsis: "Elías Morozov, ingeniero condenado por un sabotaje que no cometió, cumple cadena perpetua en la fortaleza costera de Qara. Entre la carpintería, la amistad con Samir y los viejos desagües coloniales, empieza a planear su fuga mientras su abogada intenta reabrir el caso." },
        { id: 19,  title: "El Elegido",                    titleEn: "The Chosen One",                  year: 2026, category: "CIENCIA FICCIÓN",       topic: "Cine",                 cover: "./imagenportada/cine_elegido.png",             synopsis: "Ilya, un ingeniero de Odesa, empieza a ver fallos donde dos versiones de la ciudad se superponen. Descubre que el mundo es una 'edición' gestionada por una IA llamada la Síndica y emprende un viaje para entender su papel antes de que el Dominio fuerce un reinicio." },
        { id: 20,  title: "El imperio del trueno",         titleEn: "The Empire of Thunder",           year: 2026, category: "ACCIÓN POST-APOCALÍPTICA",topic: "Cine",                cover: "./imagenportada/cine_imperiodeltrueno.png",    synopsis: "En un corredor de tormentas entre el Cuerno de África y el Mar Rojo, la mecánica Kira une fuerzas con la ingeniera Soraya y el rastreador Rook para enfrentarse al caudillo-profeta conocido como el Trueno, que domina la energía de la región desde su Ciudadela." },
        { id: 26,  title: "Voces entre chapas",            titleEn: "Voices Between Plates",           year: 2026, category: "DRAMA",                 topic: "Cine",                 cover: "./imagenportada/cine_vocesentrechapas.png",    synopsis: "En un barrio de chapas y callejones de Kibera, varios vecinos se topan con un hallazgo inesperado que los obliga a mirar su día a día de otra forma. Sus vidas empiezan a rozarse alrededor de una iniciativa frágil que nadie planeó." },
        { id: 27,  title: "Semilla de luz",                titleEn: "Seed of Light",                   year: 2026, category: "CIENCIA FICCIÓN/FAMILIAR",topic: "Cine",               cover: "./imagenportada/cine_semilladeluz.png",        synopsis: "Durante una tormenta en Borneo, una botánica y su hijo encuentran a Ulu, un joven explorador extraterrestre que 'lee' la salud de las plantas con el tacto. Los tres forjan una amistad sin palabras mientras buscan cómo pedir ayuda entre la selva y el neón de Singapur." },
        { id: 28,  title: "El Destino",                    titleEn: "The Destiny",                     year: 2026, category: "ÓPERA ESPACIAL",         topic: "Cine",                 cover: "./imagenportada/cine_eldestino.png",           synopsis: "En un planeta desértico, una chatarrera rescata a una niña que lleva un mapa estelar incompleto. Perseguidas por el Dominio de Orión, se unen a un contrabandista y a una ex navegante para localizar una estación legendaria que podría alterar el control de las rutas espaciales." },
        { id: 29,  title: "El grito en el espacio",        titleEn: "The Scream in Space",             year: 2026, category: "CIENCIA FICCIÓN/TERROR", topic: "Cine",                 cover: "./imagenportada/cine_grito.png",               synopsis: "Una tripulación de remolque espacial encuentra en un asteroide un sarcófago alienígena que emite un pulso rítmico. La nave queda atrapada entre el interés corporativo y una señal bioluminiscente que parece llamar a algo más grande en el vacío." },

        // ANIMACIÓN
        { id: 200, title: "Una jungla divertida",          titleEn: "A Funny Jungle",                  year: 2026, category: "MUSICAL DISNEY",        topic: "Animación",            cover: "./imagenportada/animacion_jungladivertida.png",synopsis: "Cuando una misteriosa sequía amenaza su hogar, un perezoso amante del silencio y una capibara apasionada por el ritmo lideran a sus amigos en una misión para reactivar una legendaria cascada, descubriendo que la jungla solo puede salvarse con el equilibrio entre sonido y silencio." },
        { id: 201, title: "Despierta mi constelación",     titleEn: "Wake Up My Constellation",        year: 2026, category: "MUSICAL DISNEY",        topic: "Animación",            cover: "./imagenportada/animacion_miconstelacion.png", synopsis: "En un mundo donde las constelaciones otorgan poder, Elara nace sin una. Cuando una oscuridad llamada el Vacío amenaza con extinguir todas las estrellas, Elara descubre que su destino es encontrar la mítica Piedra Solar para restaurar el equilibrio." },
        { id: 202, title: "La aventura de tu vida",        titleEn: "The Adventure of Your Life",      year: 2026, category: "MUSICAL DISNEY",        topic: "Animación",            cover: "./imagenportada/animacion_aventuradetuvida.png",synopsis: "Un grupo de amigos descubre un misterioso cofre que los lleva a una aventura llena de enigmas y secretos ocultos en una antigua montaña, donde deberán trabajar juntos para enfrentarse a fuerzas que amenazan algo muy valioso." },
        { id: 203, title: "Latidos de papel",              titleEn: "Paper Heartbeats",                year: 2026, category: "MUSICAL DISNEY",        topic: "Animación",            cover: "./imagenportada/animacion_latidosdepapel.png", synopsis: "Valeria, una bibliotecaria curiosa, descubre un fajo de cartas de amor sin enviar. Intrigada, decide investigar la historia de Leo e Isabel, una pareja separada por las circunstancias, intentando desvelar el misterio de su amor congelado en el tiempo." },
        { id: 204, title: "¡Qué pasó!, mi mundo es un desmadre",titleEn: "What Happened!",            year: 2026, category: "COMEDIA MUSICAL",       topic: "Animación",            cover: "./imagenportada/animacion_mimundo.png",        synopsis: "Acompaña a Nimma Tizne, afinadora de tormentas con alergia al azúcar, y a su cabra Chispa en una carrera disparatada por Dulcelandia para reunir tres Sellos imposibles junto al notario bicéfalo Pipo. Risas, poesía mala y un desmadre que convierte el desastre en parque de atracciones." },
        { id: 205, title: "Compañeros de juguete",         titleEn: "Toy Partners",                    year: 2026, category: "MUSICAL PIXAR",         topic: "Animación",            cover: "./imagenportada/animacion_compañeros.png",     synopsis: "Un grupo de juguetes olvidados cobra vida en secreto y decide escapar para descubrir el mundo más allá de una tienda. En su viaje afrontan peligros, hacen nuevos amigos y aprenden que la verdadera libertad está en elegir su propio camino juntos." },
        { id: 206, title: "La capa interior",              titleEn: "The Inner Layer",                 year: 2026, category: "ACCIÓN FAMILIAR",       topic: "Animación",            cover: "./imagenportada/animacion_capainterior.png",   synopsis: "En una ciudad donde la normalidad es obligatoria, Adrian Voss oculta que posee habilidades sobrehumanas. Un acto heroico inesperado revela su poder, convirtiéndolo en el objetivo de una organización secreta empeñada en eliminar a cualquiera que sea diferente." },

        // TEATRO Y MUSICALES
        { id: 300, title: "El eco de la libertad",         titleEn: "The Echo of Freedom",             year: 2026, category: "MUSICAL ÉPICO",         topic: "Teatro y musicales",   cover: "./imagenportada/teatro_ecodelalibertad.png",   synopsis: "Un hombre que enfrenta una injusticia que le cuesta años de su vida busca redimir su pasado y construir un futuro digno. Forjando lazos inesperados, intenta escapar de la sombra de su antigua identidad en una historia sobre segundas oportunidades y la búsqueda de la verdadera libertad." },
        { id: 301, title: "El ángel de la música",         titleEn: "The Angel of Music",              year: 2026, category: "MUSICAL GÓTICO",        topic: "Teatro y musicales",   cover: "./imagenportada/teatro_angeldelamusica.png",   synopsis: "En un prestigioso teatro de Londres, una joven cantante es guiada por una misteriosa voz masculina que la ayuda a perfeccionar su don. La presencia de su Ángel protector se vuelve cada vez más intensa y posesiva, moviéndose entre las sombras para asegurar su ascenso a cualquier costo." },
        { id: 302, title: "El ladrón de historias",        titleEn: "The Story Thief",                 year: 2026, category: "MUSICAL HIP-HOP",       topic: "Teatro y musicales",   cover: "./imagenportada/teatro_ladrondehistorias.png", synopsis: "En un mundo donde las historias son un poder tangible, un brillante huérfano descubre a un enigmático aristócrata que roba los relatos de pueblos enteros, borrando su memoria. Deberá embarcarse en una peligrosa aventura para salvar las historias del mundo." },
        { id: 303, title: "El brillo del pecado",          titleEn: "The Glitter of Sin",              year: 2026, category: "MUSICAL JAZZ",          topic: "Teatro y musicales",   cover: "./imagenportada/teatro_brillodelpecado.png",   synopsis: "En el deslumbrante París de los años 20, la rivalidad entre una ambiciosa novata y la cínica estrella del cabaret más famoso estalla en un escándalo de asesinato. La batalla por la absolución se libra no en los tribunales, sino en los titulares de los periódicos." },
        { id: 304, title: "Sin más día que hoy",           titleEn: "No More Day Than Today",          year: 2026, category: "MUSICAL CONTEMPORÁNEO", topic: "Teatro y musicales",   cover: "./imagenportada/teatro_sinmasdiaquehoy.png",   synopsis: "En el barrio de Kreuzberg, Berlín, un grupo de jóvenes artistas ha construido una familia en una vieja fábrica. Cuando una corporación les ordena desalojar, forzados a un futuro incierto, deberán unirse y decidir cómo luchar por su hogar y su modo de vida." },
        { id: 305, title: "Un verano prohibido",           titleEn: "A Forbidden Summer",              year: 2026, category: "MUSICAL CLÁSICO",       topic: "Teatro y musicales",   cover: "./imagenportada/teatro_veranoprohibido.png",   synopsis: "En las calles de Marsella, donde un odio ancestral divide a dos clanes rivales, un joven artista encuentra su musa en la persona menos indicada: la hermana de su enemigo. Juntos navegan un amor tan intenso como peligroso, desafiando un destino escrito con violencia." },
        { id: 306, title: "El vuelo de dos mundos",        titleEn: "The Flight of Two Worlds",        year: 2026, category: "MUSICAL FANTÁSTICO",    topic: "Teatro y musicales",   cover: "./imagenportada/teatro_vuelodedosmundos.png",  synopsis: "Cuando un joven de una tribu antigua rompe sus reglas más sagradas para ayudar a un misterioso forastero, ambos se embarcan en un viaje a través de continentes. Su única guía es la leyenda de una canción ancestral rota en fragmentos, clave para volver a casa." },

        // SERIES
        { id: 400, title: "Canto de Escarcha",             titleEn: "Frost Song",                      year: 2026, category: "FANTASÍA ÉPICA",        topic: "Series",               cover: "./imagenportada/series_cantoescarcha.png",     synopsis: "En un continente dividido por la rivalidad, una antigua amenaza de hielo despierta en el norte. Mientras un honorable señor norteño busca unir a los reinos, una ambiciosa reina del sur ve la crisis como la oportunidad perfecta para consolidar su poder." },
        { id: 401, title: "El club del faro",              titleEn: "The Lighthouse Club",             year: 2026, category: "SCI-FI HORROR",         topic: "Series",               cover: "./imagenportada/series_clubdelfaro.png",       synopsis: "En el aislado pueblo costero de Puerto Sombrío, un grupo de amigos descubre una imposible frecuencia de radio completamente silenciosa. Lo que empieza como curiosidad desata extraños sucesos, guiándolos hacia el viejo faro abandonado donde algo ha comenzado a escapar." },
        { id: 402, title: "El precio de la tierra",        titleEn: "The Price of Land",               year: 2026, category: "DRAMA CRIMINAL",        topic: "Series",               cover: "./imagenportada/series_preciodelatierra.png",  synopsis: "Un brillante pero subestimado botánico de Texas, desesperado por una crisis familiar, transforma la flor más icónica del estado en un producto extremadamente valioso. Junto a un carismático ex-alumno, se adentra en un peligroso mundo subterráneo que atrae a criminales y a la ley." },
        { id: 403, title: "Albion Heritage",               titleEn: "Albion Heritage",                 year: 2026, category: "COMEDIA",               topic: "Series",               cover: "./imagenportada/series_albionheritage.png",    synopsis: "En la monótona oficina de Albion Heritage, empresa de Manchester que fabrica placas conmemorativas, el ingenioso Oliver Green se siente estancado. Todo cambia cuando él y Clara descubren una antigua y misteriosa placa de bronce en blanco que podría cambiar el legado de la empresa." },
        { id: 404, title: "El juego ha comenzado",         titleEn: "The Game Has Begun",              year: 2026, category: "MISTERIO",              topic: "Series",               cover: "./imagenportada/series_juegocomenzado.png",    synopsis: "Un brillante consultor de ciberseguridad y su nuevo compañero, un pragmático exmédico militar, son arrastrados a un peligroso juego internacional. Una misteriosa mente criminal comete crímenes imposibles en distintas ciudades europeas, dejando pistas diseñadas para desafiar al consultor." },
        { id: 405, title: "La fuente de los buenos tiempos",titleEn: "The Fountain of Good Times",    year: 2026, category: "SITCOM",                topic: "Series",               cover: "./imagenportada/series_fuentebuenostiempos.png",synopsis: "En un acogedor pub inglés, un grupo de seis amigos muy diferentes se enfrenta a los altibajos de la vida adulta. Entre aspiraciones profesionales, ocurrencias peculiares y desastres románticos, su lealtad y su mesa de siempre son el ancla que los mantiene unidos." },
        { id: 406, title: "La niña estelar",               titleEn: "The Stellar Girl",                year: 2026, category: "SPACE WESTERN",         topic: "Series",               cover: "./imagenportada/series_niñaestelar.png",       synopsis: "Una chica con una extraordinaria habilidad para predecir eventos astronómicos es reclutada por una agencia espacial, pero descubre que los adultos que quieren usar su don tienen ideas muy diferentes sobre para qué sirve." },

        // ANIME
        { id: 500, title: "El juramento de las murallas",  titleEn: "The Oath of the Walls",           year: 2026, category: "SHOUNEN",               topic: "Anime",                cover: "./imagenportada/anime_juramentomurallas.png",  synopsis: "En un mundo donde la humanidad ha retrocedido tras enormes muros para sobrevivir, un joven soldado jura exterminar a los titanes que destruyeron su hogar, descubriendo verdades que sacuden los cimientos de todo en lo que creía." },
        { id: 501, title: "Loto de sangre",                titleEn: "Blood Lotus",                     year: 2026, category: "SHOUNEN",               topic: "Anime",                cover: "./imagenportada/anime_lotodesangre.png",       synopsis: "Un niño salvado de una masacre por un maestro agonizante hereda una técnica de combate prohibida y la deuda de sangre que conlleva. Dominar la técnica exige un nivel de furia que teme le consuma, mientras belleza y oscuridad luchan en cada batalla." },
        { id: 502, title: "Rumbo al amanecer",             titleEn: "Towards Dawn",                    year: 2026, category: "SHOUNEN",               topic: "Anime",                cover: "./imagenportada/anime_rumboalamanecer.png",    synopsis: "Un joven navegante sin tripulación zarpa en un mundo de océano infinito siguiendo mapas fragmentarios hacia un continente legendario que la mayoría cree un mito, reuniendo en su travesía a una improbable tripulación de creyentes." },
        { id: 503, title: "Blue Bird",                     titleEn: "Blue Bird",                       year: 2026, category: "SHOUNEN",               topic: "Anime",                cover: "./imagenportada/anime_bluebird.png",           synopsis: "Un joven músico que no ha hablado desde un trauma infantil descubre que la música puede decir todo lo que las palabras no pueden, y que el amigo que se fue puede ser el único que verdaderamente lo escuchó. El pájaro azul simboliza una felicidad siempre un poco más allá." },
        { id: 504, title: "The Day",                       titleEn: "The Day",                         year: 2026, category: "SUPERHÉROES",           topic: "Anime",                cover: "./imagenportada/anime_theday.png",             synopsis: "Un joven despierta la mañana de la batalla más importante de su generación y, en las horas previas al combate, debe encontrar dentro de sí mismo una razón para luchar que vaya más allá de las órdenes, el deber o la victoria." },
        { id: 505, title: "La rueda de las sombras",       titleEn: "The Wheel of Shadows",            year: 2026, category: "SUPERNATURAL",          topic: "Anime",                cover: "./imagenportada/anime_ruedasombras.png",       synopsis: "En un mundo donde las sombras son entidades vivas que guardan memorias del pasado, una joven investigadora con el poder de leerlas debe enfrentarse a un caso que implica su propio pasado olvidado y pone en jaque su identidad." },
        { id: 506, title: "The World",                     titleEn: "The World",                       year: 2026, category: "PSYCHOLOGICAL THRILLER", topic: "Anime",               cover: "./imagenportada/anime_deathnote.png",          synopsis: "Un estudiante genial descubre un cuaderno sobrenatural que permite matar a cualquiera simplemente escribiendo su nombre. Creyéndose el único apto para limpiar el mundo del mal, se propone convertirse en dios de un nuevo orden, mientras un brillante detective se lanza a detenerlo." },
        { id: 25,  title: "Sin rostro",                    titleEn: "Faceless",                        year: 2026, category: "FANTASÍA",               topic: "Anime",                cover: "./imagenportada/anime_sinrostro.png",          synopsis: "Una joven espíritu es aprendiz de un espíritu sin rostro fijo, que le enseña que la identidad no es algo con lo que se nace, sino algo que debe elegirse repetidamente frente a todo lo que intenta arrebatártela." },

        // DOCUMENTALES Y USUARIOS
        { id: 600, title: "Planeta tierra",                titleEn: "Planet Earth",                    year: 2026, category: "NATURALEZA",            topic: "Documentales y usuarios",cover: "./imagenportada/doc_planetatierra.png",       synopsis: "Un viaje impresionante a través de los paisajes más extraordinarios del planeta y las asombrosas criaturas que los habitan, captado con técnicas de filmación que muestran comportamientos nunca vistos antes." },
        { id: 601, title: "El baile de hielo",             titleEn: "Ice Dance",                       year: 2026, category: "WILDLIFE",              topic: "Documentales y usuarios",cover: "./imagenportada/doc_bailedehielo.png",        synopsis: "En el entorno más extremo de la Tierra, la supervivencia no es solo una cuestión de biología: es una actuación de extraordinaria gracia, violencia y belleza improbable. Un año en la vida de un ecosistema polar, desde el regreso del sol hasta su despedida." },
        { id: 602, title: "La aguja del silencio",         titleEn: "The Needle of Silence",           year: 2026, category: "AVENTURA EXTREMA",      topic: "Documentales y usuarios",cover: "./imagenportada/doc_agujadelsilencio.png",   synopsis: "Un escalador de élite se prepara para ascender en solitario y sin cuerdas una legendaria pared de granito en la Patagonia, mientras su hermana médica observa desde abajo sabiendo que la cumbre que necesita alcanzar no tiene que ver con la altitud." },
        { id: 603, title: "El jardín de la bondad",        titleEn: "The Garden of Kindness",          year: 2026, category: "BIOGRAFÍA",             topic: "Documentales y usuarios",cover: "",                                            synopsis: "Un documental sobre la vida y el legado de un educador que dedicó décadas a enseñar empatía, bondad y amistad a través de la televisión infantil, dejando una huella imborrable en generaciones de espectadores." },
        { id: 604, title: "Sombras en el cristal",         titleEn: "Shadows in the Crystal",          year: 2026, category: "ACTIVISMO",             topic: "Documentales y usuarios",cover: "./imagenportada/doc_sombrasenelcristal.png", synopsis: "Una apasionada joven entrenadora comienza su trabajo soñado en el acuario más grande de Europa, formando un vínculo especial con Nix, una ballena beluga. A medida que aprende las realidades detrás del espectáculo, se enfrenta a un dilema que pondrá a prueba todo en lo que cree." },
        { id: 605, title: "El algoritmo silencioso",       titleEn: "The Silent Algorithm",            year: 2026, category: "TECNOLOGÍA",            topic: "Documentales y usuarios",cover: "./imagenportada/doc_algoritmosilencioso.png",synopsis: "Dos estudiantes descubren que la plataforma de redes sociales que consume la vida social de su escuela está deliberadamente diseñada para explotar vulnerabilidades psicológicas, y deciden hacer algo al respecto antes de que el algoritmo siga escribiendo el guion de sus vidas." },
        { id: 606, title: "User Generated Content Theme",  titleEn: "User Generated Content Theme",    year: 2026, category: "CUSTOM",               topic: "Documentales y usuarios",cover: "./imagenportada/user_usuarios.png",          synopsis: "Un espacio dedicado a las creaciones musicales de nuestra comunidad de usuarios." }
    ];

    const mapEntry = s => ({ id: s.id.toString(), titulo: s.title, titleEn: s.titleEn, cover: s.cover, year: s.year, synopsis: s.synopsis, category: s.category });
    const salasConfig = {
        'literaria': { emoji: '📖', key: 'sala.literaria', entries: songs.filter(s => s.topic === 'Literatura').map(mapEntry).sort((a, b) => a.titulo.localeCompare(b.titulo)) },
        'cine':      { emoji: '🎥', key: 'sala.cine',      entries: songs.filter(s => s.topic === 'Cine').map(mapEntry).sort((a, b) => a.titulo.localeCompare(b.titulo)) },
        'animacion': { emoji: '🧸', key: 'sala.animacion', entries: songs.filter(s => s.topic === 'Animación').map(mapEntry).sort((a, b) => a.titulo.localeCompare(b.titulo)) },
        'opera':     { emoji: '🎻', key: 'sala.opera',     entries: songs.filter(s => s.topic === 'Ópera y conciertos').map(mapEntry).sort((a, b) => a.titulo.localeCompare(b.titulo)) },
        'teatro':    { emoji: '🎭', key: 'sala.teatro',    entries: songs.filter(s => s.topic === 'Teatro y musicales').map(mapEntry).sort((a, b) => a.titulo.localeCompare(b.titulo)) },
        'extras':    { emoji: '📽️', key: 'sala.extras',   entries: songs.filter(s => s.topic === 'Documentales y usuarios').map(mapEntry).sort((a, b) => a.titulo.localeCompare(b.titulo)) },
        'anime':     { emoji: '🍥', key: 'sala.anime',     entries: songs.filter(s => s.topic === 'Anime').map(mapEntry).sort((a, b) => a.titulo.localeCompare(b.titulo)) },
        'series':    { emoji: '📺', key: 'sala.series',    entries: songs.filter(s => s.topic === 'Series').map(mapEntry).sort((a, b) => a.titulo.localeCompare(b.titulo)) }
    };

    const salasConfigMenu = [
        { key: "literaria", archivo: "biblioteca.html?sala=literaria" },
        { key: "cine", archivo: "biblioteca.html?sala=cine" },
        { key: "animacion", archivo: "biblioteca.html?sala=animacion" },
        { key: "opera", archivo: "biblioteca.html?sala=opera" },
        { key: "teatro", archivo: "biblioteca.html?sala=teatro" },
        { key: "extras", archivo: "biblioteca.html?sala=extras" },
        { key: "anime", archivo: "biblioteca.html?sala=anime" },
        { key: "series", archivo: "biblioteca.html?sala=series" }
    ];

    function getURLParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    function mostrarBiblioteca() {
        document.body.className = 'biblioteca-view';
        document.getElementById('biblioteca-container').classList.remove('hidden');
        document.getElementById('sala-container').classList.add('hidden');
    }

    function mostrarSala(sala) {
        document.body.className = `sala-view sala-${sala}`;
        document.getElementById('biblioteca-container').classList.add('hidden');
        document.getElementById('sala-container').classList.remove('hidden');
    }

    window.volverABiblioteca = () => {
        history.pushState({}, '', 'biblioteca.html');
        mostrarBiblioteca();
        mostrarSalas();
    };

    let unsubscribe = null;

    function initSala() {
        const sala = getURLParameter('sala');

        if (unsubscribe) {
            unsubscribe();
            unsubscribe = null;
        }

        if (sala && salasConfig[sala]) {
            currentSala = sala;
            salaConfig = salasConfig[sala];

            mostrarSala(sala);

            document.getElementById('titulo-sala').textContent = t(salaConfig.key);

            document.getElementById('lista-entradas').innerHTML =
                `<p style="padding:16px;color:#888;text-align:center">${t('msg.loading')}</p>`;

            unsubscribe = db.collection('ranking').doc('stars')
                .onSnapshot(
                    (docSnapshot) => {
                        const rankingStars = docSnapshot.exists
                            ? (docSnapshot.data().rankingStars || {})
                            : {};
                        renderList(rankingStars);
                    },
                    (error) => {
                        console.error('Error Firestore onSnapshot:', error.code, error.message);
                        document.getElementById('lista-entradas').innerHTML =
                            `<p style="padding:16px;color:red;text-align:center">${t('msg.error')} ` + error.message + `</p>`;
                    }
                );
        } else {
            mostrarBiblioteca();
            mostrarSalas();
        }
    }

    function obtenerDatos() {
        const datos = [];
        const lang = getCurrentLanguage();
        Object.entries(salasConfig).forEach(([key, config]) => {
            config.entries.forEach(entry => {
                datos.push({
                    t: (lang === 'en' && entry.titleEn) ? entry.titleEn : entry.titulo,
                    a: '',
                    s: `biblioteca.html?sala=${key}`,
                    sala: key
                });
            });
        });
        return datos;
    }

    function mostrarSalas() {
        const container = document.getElementById('salas-container');
        const counts = {};
        
        Object.keys(salasConfig).forEach(key => {
            counts[key] = salasConfig[key].entries.length;
        });

        const ul = document.createElement('ul');
        salasConfigMenu.forEach(sala => {
            const num = counts[sala.key] || 0;
            const li = document.createElement('li');
            li.innerHTML = `
                <a href="${sala.archivo}">
                    <span>${t('sala.' + sala.key)}</span>
                    <span class="count">${num} ${t('text.temas')}</span>
                </a>
            `;
            ul.appendChild(li);
        });
        container.innerHTML = '';
        container.appendChild(ul);
    }

    window.realizarBusqueda = function() {
        const term = document.getElementById('search-input').value.toLowerCase();
        const resCont = document.getElementById('results-container');
        resCont.innerHTML = '';
        if (!term) return;
        
        // La búsqueda solo se hace sobre título de canción (el que está sincronizado al idioma) y la sala original
        const resultados = obtenerDatos().filter(i => 
            i.t.toLowerCase().includes(term) || 
            i.a.toLowerCase().includes(term)
        );
        
        if (resultados.length === 0) {
            resCont.innerHTML = `<p>${t('msg.no_results')}</p>`;
            return;
        }

        resultados.forEach(r => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `<b>${r.t}</b> - ${r.a}`;
            div.onclick = () => window.location.href = r.s;
            resCont.appendChild(div);
        });
    };

    function renderList(globalData) {
        const contenedor = document.getElementById('lista-entradas');
        globalData = globalData || {};
        const lang = getCurrentLanguage();

        if (!salaConfig.entries || salaConfig.entries.length === 0) {
            contenedor.innerHTML = `<p style="padding:16px;color:#888;text-align:center">${t('msg.empty')}</p>`;
            return;
        }

        contenedor.innerHTML = '';

        const sortedEntries = [...salaConfig.entries].sort((a, b) => {
            const votesA = globalData[a.id] || globalData[String(parseInt(a.id))] || 0;
            const votesB = globalData[b.id] || globalData[String(parseInt(b.id))] || 0;
            return votesB - votesA;
        });

        sortedEntries.forEach((e) => {
            const totalStars = globalData[e.id] || globalData[String(parseInt(e.id))] || 0;
            const hasVotes = totalStars > 0;

            const votedBadge = hasVotes
                ? `<span class="voted-badge"><i class="fas fa-check-circle"></i> ${t('badge.voted')}</span>`
                : `<span class="not-voted-badge"><i class="fas fa-circle"></i> ${t('badge.not_voted')}</span>`;

            // Traducción exclusiva según idioma:
            const displayTitle = (lang === 'en' && e.titleEn) ? e.titleEn : e.titulo;
            const translatedCategory = categoryTranslations[lang][e.category] || e.category;

            const div = document.createElement('div');
            div.className = 'entrada-item';
            
            // Renderizado: sin autor, con año 2026 y sinopsis
            div.innerHTML = `
                <div class="item-info-wrapper">
                    ${e.cover ? `<img src="${e.cover}" alt="${displayTitle}" class="storycard-img">` : ''}
                    <div class="titulo-autor">
                        <span class="titulo-original">${salaConfig.emoji} ${displayTitle}</span>
                        <span class="autor">${translatedCategory} | ${e.year || 2026}</span>
                        ${e.synopsis ? `<span class="synopsis-text">${e.synopsis}</span>` : ''}
                    </div>
                </div>
                <div class="controles-votacion">
                    <div class="vote-stats">
                        <span class="rating-avg"><i class="fas fa-star"></i> ${totalStars} ${t('text.votos')}</span>
                        <span class="genre-top">${votedBadge}</span>
                    </div>
                </div>
            `;
            contenedor.appendChild(div);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateUITranslations();
        mostrarSalas(); 

        auth.onAuthStateChanged((user) => {
            if (user) {
                initSala();
            } else {
                auth.signInAnonymously()
                    .catch((error) => {
                        console.error('Error auth anónima:', error.code, error.message);
                        initSala();
                    });
            }
        });

        // Event listener por si el idioma se cambia dinámicamente o se requiere en otra pestaña
        window.addEventListener('storage', function(e) {
            if (e.key === 'selectedLanguage') {
                updateUITranslations();
                mostrarSalas();
                if (!document.getElementById('sala-container').classList.contains('hidden')) {
                    initSala(); 
                }
            }
        });
    });
</script>
</body>
