<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca LaIAmusical</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root {
            --primary-brown: #A0522D;
            --dark-brown: #8B4513;
            --light-tan: #D2B48C;
            --primary-red: #8B0000;
            --dark-red: #4B0000;
            --primary-orange: #FF8C00;
            --dark-orange: #E67E22;
            --primary-purple: #4B0082;
            --dark-purple: #2E0854;
            --primary-crimson: #C00000;
            --dark-crimson: #800000;
            --primary-violet: #6B46C1;
            --dark-violet: #4C1D95;
            --star-gold: #FFD700;
            --bg-light: #f8f8f8;
            --bg-dark: #1a1a1a;
            --disabled-grey: #ccc;
            --ia-blue: #007bff;
        }

        /* Estilos para la vista biblioteca */
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .biblioteca-view .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .biblioteca-view h1 { color: #0056b3; text-align: center; flex-grow: 1; margin: 0; }
        .temas-btn { background-color: #BEF264; color: #1a1a1a; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; border: 1px solid #a7e555; transition: 0.3s; }
        .temas-btn:hover { background-color: #a7e555; transform: scale(1.05); }
        #salas-container ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        #salas-container li a { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; background: #007bff; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; transition: all 0.3s ease; }
        #salas-container li a:hover { background: #0056b3; transform: translateY(-3px); box-shadow: 0 5px 10px rgba(0,0,0,0.2); }
        .count { background: rgba(255,255,255,0.25); padding: 4px 12px; border-radius: 20px; font-size: 0.85em; }
        .search-container { margin: 25px 0; display: flex; gap: 10px; }
        #search-input { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .search-btn { padding: 10px 25px; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .result-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .result-item:hover { background-color: #f8fbff; }
        hr { border: 0; border-top: 1px solid #eee; margin: 30px 0; }

        /* Estilos para las salas literarias */
        .sala-view {
            background-color: var(--bg-light);
            color: #333;
        }

        .sala-view .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .sala-view h1 {
            text-align: center;
            border-bottom: 3px solid;
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        .header-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .back-link { text-decoration: none; color: #007bff; font-weight: bold; }

        .info-panel {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid;
            text-align: center;
            font-weight: bold;
        }

        .ia-notice {
            display: block;
            margin-top: 10px;
            font-size: 0.95em;
            border-top: 1px solid;
            padding-top: 10px;
        }

        .entrada-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #eee;
            background-color: #fff;
        }

        .titulo-autor { flex-grow: 1; text-align: left; }
        .titulo-original { font-size: 1.1em; font-weight: bold; color: #444; }
        .autor { font-size: 0.9em; color: #777; font-style: italic; }
        .titulo-ia { 
            font-size: 1.15em; 
            font-weight: 800; 
            color: var(--ia-blue); 
            margin-top: 6px;
            display: block;
        }

        .controles-votacion {
            display: flex;
            gap: 15px;
            align-items: center;
            min-width: 250px;
            justify-content: flex-end;
        }
        
        .vote-btn {
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .vote-btn:disabled { background: var(--disabled-grey); cursor: not-allowed; }

        .vote-stats {
            display: flex;
            flex-direction: column;
            font-size: 0.85em;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid;
        }
        
        .rating-avg { color: var(--star-gold); font-weight: 800; }
        .genre-top { color: var(--ia-blue); font-weight: 600; }

        .stars-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            flex-direction: row-reverse;
        }

        .stars-container i {
            font-size: 3em;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s;
        }

        .stars-container i:hover,
        .stars-container i:hover ~ i {
            color: var(--star-gold);
        }

        .modal { 
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(4px); 
        }
        
        .modal-content { 
            background: #fff; 
            margin: 10vh auto; 
            padding: 40px; 
            width: 90%; 
            max-width: 500px; 
            border-radius: 20px; 
            text-align: center; 
            position: relative; 
        }
        
        .close { 
            position: absolute; 
            right: 20px; 
            top: 15px; 
            font-size: 28px; 
            cursor: pointer; 
            color: #aaa; 
        }
        
        .genre-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            margin-top: 20px; 
        }
        
        .genre-btn { 
            padding: 10px; 
            border: 2px solid; 
            border-radius: 8px; 
            background: none; 
            cursor: pointer; 
            font-weight: bold; 
        }

        /* Estilos específicos para cada sala */
        .sala-literaria h1 { color: var(--primary-brown); border-bottom-color: var(--primary-brown); }
        .sala-literaria .info-panel { background: #fff8e1; border-color: #ffe082; }
        .sala-literaria .ia-notice { color: #856404; border-top-color: #ffe082; }
        .sala-literaria .vote-btn { background: var(--primary-brown); }
        .sala-literaria .vote-stats { background: #f0f7ff; border-color: #d0e0f0; }
        .sala-literaria .genre-btn { border-color: var(--primary-brown); }
        .sala-literaria .genre-btn:hover { background: var(--primary-brown); color: #fff; }

        .sala-cine h1 { color: var(--primary-red); border-bottom-color: var(--primary-red); }
        .sala-cine .info-panel { background: #fff5f5; border-color: #ffcccc; }
        .sala-cine .ia-notice { color: var(--primary-red); border-top-color: #ffcccc; }
        .sala-cine .vote-btn { background: var(--primary-red); }
        .sala-cine .vote-stats { background: #fff9e6; border-color: #ffeeba; }
        .sala-cine .genre-btn { border-color: var(--primary-red); }
        .sala-cine .genre-btn:hover { background: var(--primary-red); color: #fff; }

        .sala-animacion h1 { color: var(--primary-orange); border-bottom-color: var(--primary-orange); }
        .sala-animacion .info-panel { background: #fff9f0; border-color: #ffe0b2; }
        .sala-animacion .ia-notice { color: #e65100; border-top-color: #ffe0b2; }
        .sala-animacion .vote-btn { background: var(--primary-orange); }
        .sala-animacion .vote-stats { background: #fffdf5; border-color: #fff3e0; }
        .sala-animacion .genre-btn { border-color: var(--primary-orange); }
        .sala-animacion .genre-btn:hover { background: var(--primary-orange); color: #fff; }

        .sala-opera h1 { color: var(--primary-purple); border-bottom-color: var(--primary-purple); }
        .sala-opera .info-panel { background: #f3e5f5; border-color: #d1c4e9; }
        .sala-opera .ia-notice { color: var(--primary-purple); border-top-color: #d1c4e9; }
        .sala-opera .vote-btn { background: var(--primary-purple); }
        .sala-opera .vote-stats { background: #f8f0ff; border-color: #e1bee7; }
        .sala-opera .rating-avg { color: #ccac00; }
        .sala-opera .genre-btn { border-color: var(--primary-purple); }
        .sala-opera .genre-btn:hover { background: var(--primary-purple); color: #fff; }

        .sala-teatro { background-color: var(--bg-dark); color: #eee; }
        .sala-teatro .container { background: #2b2b2b; }
        .sala-teatro h1 { 
            color: var(--primary-crimson); 
            border-bottom-color: var(--primary-crimson);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .sala-teatro .info-panel { background: #3d0000; border-color: var(--primary-crimson); color: #ffcccc; }
        .sala-teatro .entrada-item { border-color: #444; background-color: #333; }
        .sala-teatro .vote-btn { background: var(--primary-crimson); }
        .sala-teatro .vote-btn:disabled { background: #555; color: #888; }
        .sala-teatro .vote-stats { background: #444; }
        .sala-teatro .modal { background: rgba(0,0,0,0.85); }
        .sala-teatro .modal-content { background: #222; color: white; border: 2px solid var(--primary-crimson); }
        .sala-teatro .stars-container i { color: #444; }
        .sala-teatro .genre-btn { border-color: var(--primary-crimson); color: white; }
        .sala-teatro .genre-btn:hover { background: var(--primary-crimson); }
        .sala-teatro .back-link { color: var(--ia-blue); }

        .sala-extras h1 { color: var(--primary-violet); border-bottom-color: var(--primary-violet); }
        .sala-extras .info-panel { background: #f3e8ff; border-color: #d8b4fe; }
        .sala-extras .ia-notice { color: var(--primary-violet); border-top-color: #d8b4fe; }
        .sala-extras .vote-btn { background: var(--primary-violet); }
        .sala-extras .vote-stats { background: #f3e8ff; border-color: #d8b4fe; }
        .sala-extras .genre-btn { border-color: var(--primary-violet); }
        .sala-extras .genre-btn:hover { background: var(--primary-violet); color: #fff; }

        .sala-anime .vote-btn { background: var(--dark-purple); }
        .sala-cine_nueva .vote-btn { background: var(--dark-red); }

        @media (max-width: 600px) {
            .entrada-item { flex-direction: column; text-align: center; }
            .controles-votacion { margin-top: 15px; width: 100%; justify-content: center; }
        }

        .hidden { display: none; }
    </style>
</head>

        <h1>Biblioteca LaIAmusical</h1>
    </div>

    <div class="search-container">

        <button class="search-btn" onclick="realizarBusqueda()">Buscar</button>

    <div id="results-container"></div>

    <hr>
    <h3>Explorar por Salas:</h3>

</div>

<!-- Vista Sala -->
<div id="sala-container" class="container hidden">

    <div id="lista-entradas"></div>
</div>

<!-- Modales -->
<div id="voteModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModals()">&times;</span>
        <h2 id="vote-title">Califica esta obra</h2>
        <div class="stars-container">
            <i class="fas fa-star" onclick="selectStar(5)"></i>
            <i class="fas fa-star" onclick="selectStar(4)"></i>
            <i class="fas fa-star" onclick="selectStar(3)"></i>
            <i class="fas fa-star" onclick="selectStar(2)"></i>
            <i class="fas fa-star" onclick="selectStar(1)"></i>
        </div>
        <p>Selecciona de 1 a 5 estrellas</p>
    </div>
</div>

<div id="genreModal" class="modal">

</div>

    // Configuración de salas para el menú de biblioteca
    const salasConfigMenu = [
        { nombre: "Sala Literaria 📚", key: "literaria", archivo: "biblioteca.html?sala=literaria" },
        { nombre: "Sala de Cine 🎬", key: "cine", archivo: "biblioteca.html?sala=cine" },
        { nombre: "Animación y Dibujos Animados 🧸", key: "animacion", archivo: "biblioteca.html?sala=animacion" },

        { nombre: "Teatro y Musicales 🎭", key: "teatro", archivo: "biblioteca.html?sala=teatro" },
        { nombre: "Extra y documentales 📽️", key: "extras", archivo: "biblioteca.html?sala=extras" },
        { nombre: "Sala de Anime 🍥", key: "anime", archivo: "biblioteca.html?sala=anime" },
        { nombre: "Sala Series 🎬", key: "cine_nueva", archivo: "biblioteca.html?sala=cine_nueva" }
    ];

    // Función para obtener parámetros de URL
    function getURLParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    // Funciones para cambiar vistas
    function mostrarBiblioteca() {
        document.body.className = 'biblioteca-view';
        document.getElementById('biblioteca-container').classList.remove('hidden');
        document.getElementById('sala-container').classList.add('hidden');
    }

    function mostrarSala(sala) {
        document.body.className = `sala-view sala-${sala}`;
        document.getElementById('biblioteca-container').classList.add('hidden');
        document.getElementById('sala-container').classList.remove('hidden');
    }

    window.volverABiblioteca = () => {
        history.pushState({}, '', 'biblioteca.html');
        mostrarBiblioteca();
        mostrarSalas();
    };

    // Función para inicializar la sala
    function initSala() {
        const sala = getURLParameter('sala');
        if (sala && salasConfig[sala]) {
            currentSala = sala;
            salaConfig = salasConfig[sala];
            
            mostrarSala(sala);
            
            // Configurar UI
            document.getElementById('titulo-sala').textContent = salaConfig.titulo;
            document.getElementById('ia-notice-text').textContent = salaConfig.iaNotice;
            document.getElementById('genre-modal-title').textContent = salaConfig.genreModalTitle;

            // Configurar géneros
            const genreGrid = document.getElementById('genre-grid');
            genreGrid.innerHTML = '';
            salaConfig.genres.forEach(genre => {
                const button = document.createElement('button');
                button.className = 'genre-btn';
                button.textContent = genre;
                button.onclick = () => finishVote(genre);
                genreGrid.appendChild(button);
            });

            // Solo inicializar Firebase si estamos en una sala
            if (auth) {
                onAuthStateChanged(auth, async (user) => {
                    if (user) { 
                        currentUser = user;
                        isAuthenticated = true;
                        await checkUserVoteStatus(); 
                        renderList(); 
                        onSnapshot(collection(db, salaConfig.collection), () => renderList());
                    } else { 
                        window.location.href = 'index.html'; 
                    }
                });
            }
        } else {
            mostrarBiblioteca();
            mostrarSalas();
        }
    }

    // Datos para búsqueda
    function obtenerDatos() {
        const datos = [];
        Object.entries(salasConfig).forEach(([key, config]) => {
            config.entries.forEach(entry => {
                datos.push({
                    t: entry.titulo,
                    a: entry.autor,
                    s: `biblioteca.html?sala=${key}`,
                    sala: key
                });
            });
        });
        return datos;
    }

    function mostrarSalas() {
        const container = document.getElementById('salas-container');
        const datos = obtenerDatos();
        const counts = {};
        
        // Contar entradas por sala
        Object.keys(salasConfig).forEach(key => {
            counts[key] = salasConfig[key].entries.length;
        });

        const ul = document.createElement('ul');
        salasConfigMenu.forEach(sala => {
            const num = counts[sala.key] || 0;
            const li = document.createElement('li');
            li.innerHTML = `
                <a href="${sala.archivo}">
                    <span>${sala.nombre}</span>
                    <span class="count">${num} temas</span>
                </a>
            `;
            ul.appendChild(li);
        });
        container.innerHTML = '';
        container.appendChild(ul);
    }

    window.realizarBusqueda = function() {
        const term = document.getElementById('search-input').value.toLowerCase();
        const resCont = document.getElementById('results-container');
        resCont.innerHTML = '';
        if (!term) return;
        
        const resultados = obtenerDatos().filter(i => 
            i.t.toLowerCase().includes(term) || 
            i.a.toLowerCase().includes(term)
        );
        
        if (resultados.length === 0) {
            resCont.innerHTML = '<p>No se encontraron resultados.</p>';
            return;
        }

        resultados.forEach(r => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `<b>${r.t}</b> - ${r.a}`;
            div.onclick = () => window.location.href = r.s;
            resCont.appendChild(div);
        });
    };

    // Funciones para las salas (solo se ejecutan si estamos autenticados)
    window.openVoteModal = (index) => {
        if (!isAuthenticated) return;
        if (userVotesCount >= 3) return alert("Límite de 3 votos alcanzado.");
        currentItemIndex = index;
        document.getElementById('vote-title').innerText = `${salaConfig.voteTitle}: "${salaConfig.entries[index].titulo}"`;
        document.getElementById('voteModal').style.display = 'block';
    };

    window.selectStar = (rating) => {
        selectedRating = rating;
        document.getElementById('voteModal').style.display = 'none';
        document.getElementById('genreModal').style.display = 'block';
    };

    window.closeModals = () => {
        document.getElementById('voteModal').style.display = 'none';
        document.getElementById('genreModal').style.display = 'none';
    };

    window.finishVote = async (genre) => {
        if (!isAuthenticated || !currentUser) return;
        
        const item = salaConfig.entries[currentItemIndex];
        const now = new Date();
        const monday = new Date(now.setDate(now.getDate() - (now.getDay() || 7) + 1));
        monday.setHours(0,0,0,0);
        const weekId = `${salaConfig.weekPrefix}-${monday.getTime()}`;

        try {
            const globalRef = doc(db, salaConfig.collection, item.id);
            
            await setDoc(globalRef, { 
                totalRating: increment(selectedRating),
                voteCount: increment(1),
                [`genres.${genre}`]: increment(1)
            }, { merge: true });

            const userDocRef = doc(db, "users", currentUser.uid, salaConfig.userCollection, weekId);
            userVotedTitles.push(item.id);
            userVotesCount++;

            await setDoc(userDocRef, { count: userVotesCount, voted_ids: userVotedTitles }, { merge: true });

            closeModals();
            await checkUserVoteStatus();
            renderList();
            alert("¡Calificación guardada!");
        } catch (e) { 
            console.error(e); 
            alert("Error al guardar la calificación");
        }
    };

    async function checkUserVoteStatus() {
        if (!isAuthenticated || !currentUser || !salaConfig.userCollection) return;
        
        const now = new Date();
        const monday = new Date(now.setDate(now.getDate() - (now.getDay() || 7) + 1));
        monday.setHours(0,0,0,0);
        const weekId = `${salaConfig.weekPrefix}-${monday.getTime()}`;
        
        try {
            const docSnap = await getDoc(doc(db, "users", currentUser.uid, salaConfig.userCollection, weekId));
            if (docSnap.exists()) {
                userVotesCount = docSnap.data().count || 0;
                userVotedTitles = docSnap.data().voted_ids || [];
            } else {
                userVotesCount = 0;
                userVotedTitles = [];
            }
            document.getElementById('votos-info').innerText = `Votos realizados esta semana: ${userVotesCount}/3`;
        } catch (e) {
            console.error("Error checking vote status:", e);
        }
    }

    async function renderList() {
        if (!isAuthenticated || !salaConfig.collection) return;
        
        const contenedor = document.getElementById('lista-entradas');
        
        try {
            const querySnapshot = await getDocs(collection(db, salaConfig.collection));
            const globalData = {};
            querySnapshot.forEach(d => globalData[d.id] = d.data());

            contenedor.innerHTML = ''; 

            salaConfig.entries.forEach((e, i) => {
                const data = globalData[e.id] || { totalRating: 0, voteCount: 0, genres: {} };
                
                const avg = data.voteCount > 0 ? (data.totalRating / data.voteCount).toFixed(1) : "0.0";
                
                let topGenre = "";
                let maxVotes = 0;
                for (const g in data.genres) {
                    if (data.genres[g] > maxVotes) { 
                        maxVotes = data.genres[g]; 
                        topGenre = g; 
                    }
                }

                const tituloIA = maxVotes > 0 ? `${e.titulo} (${topGenre})` : "";
                const yaVoto = userVotedTitles.includes(e.id);

                // Iconos específicos por sala
                const genreIcon = salaConfig.genreIcon || 'fas fa-music';
                const fallbackGenre = salaConfig.fallbackGenre || 'Ninguno';

                const div = document.createElement('div');
                div.className = 'entrada-item';
                div.innerHTML = `
                    <div class="titulo-autor">
                        <span class="titulo-original">${salaConfig.emoji} ${e.titulo}</span><br>
                        <span class="autor">${salaConfig.autorPrefix} ${e.autor}</span><br>
                        <span class="titulo-ia">✨ Título IA: ${tituloIA}</span>
                    </div>
                    <div class="controles-votacion">
                        <div class="vote-stats">
                            <span class="rating-avg"><i class="fas fa-star"></i> ${avg}</span>
                            <span class="genre-top"><i class="${genreIcon}"></i> ${topGenre || fallbackGenre}</span>
                        </div>
                        <button class="vote-btn" ${yaVoto || userVotesCount >= 3 ? 'disabled' : ''} onclick="window.openVoteModal(${i})">
                            ${yaVoto ? 'Votado' : 'Votar'}
                        </button>
                    </div>
                `;
                contenedor.appendChild(div);
            });
        } catch (e) {
            console.error("Error rendering list:", e);
        }
    }

    // Inicializar al cargar la página
    document.addEventListener('DOMContentLoaded', initSala);
</script>
