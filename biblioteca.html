<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Cartas/Canciones 🎶</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { color: #0056b3; text-align: center; flex-grow: 1; margin: 0; }
        .temas-btn { background-color: #BEF264; color: #1a1a1a; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; border: 1px solid #a7e555; transition: 0.3s; }
        .temas-btn:hover { background-color: #a7e555; transform: scale(1.05); }
        #salas-container ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        #salas-container li a { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; background: #007bff; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; transition: all 0.3s ease; }
        #salas-container li a:hover { background: #0056b3; transform: translateY(-3px); box-shadow: 0 5px 10px rgba(0,0,0,0.2); }
        .count { background: rgba(255,255,255,0.25); padding: 4px 12px; border-radius: 20px; font-size: 0.85em; }
        .search-container { margin: 25px 0; display: flex; gap: 10px; }
        #search-input { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        .search-btn { padding: 10px 25px; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .result-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .result-item:hover { background-color: #f8fbff; }
        hr { border: 0; border-top: 1px solid #eee; margin: 30px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-wrapper">
        <a href="temas.html" class="temas-btn">Volver a Temas</a>
        <h1>Biblioteca Musical 🎶</h1>
    </div>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Buscar canción, autor o sala...">
        <button class="search-btn" onclick="realizarBusqueda()">Buscar</button>
    </div>

    <div id="results-container"></div>

    <hr>
    <h3>Explorar por Salas:</h3>
    <div id="salas-container"></div>
</div>

<script>
    const salasConfig = [
        { nombre: "Sala Literaria 📚", archivo: "sala-literaria.html" },
        { nombre: "Sala de Cine 🎬", archivo: "sala-cine.html" },
        { nombre: "Animación y Dibujos Animados 🧸", archivo: "sala-animacion y dibujos animados.html" },
        { nombre: "Ópera y Concierto 🎻", archivo: "sala-opera y concierto.html" },
        { nombre: "Teatro y Musicales 🎭", archivo: "sala-teatro y musicales.html" }
    ];

    function obtenerDatos() {
        return [
            // SALA LITERARIA (30 temas detectados)
            { t: "La Odisea", a: "Homero", s: "sala-literaria.html" },
            { t: "Don Quijote de la Mancha", a: "Miguel de Cervantes", s: "sala-literaria.html" },
            { t: "Orgullo y Prejuicio", a: "Jane Austen", s: "sala-literaria.html" },
            { t: "Cien años de soledad", a: "Gabriel García Márquez", s: "sala-literaria.html" },
            { t: "1984", a: "George Orwell", s: "sala-literaria.html" },
            { t: "Crónica de una muerte anunciada", a: "Gabriel García Márquez", s: "sala-literaria.html" },
            { t: "El amor en los tiempos del cólera", a: "Gabriel García Márquez", s: "sala-literaria.html" },
            { t: "Rayuela", a: "Julio Cortázar", s: "sala-literaria.html" },
            { t: "Ficciones", a: "Jorge Luis Borges", s: "sala-literaria.html" },
            { t: "Pedro Páramo", a: "Juan Rulfo", s: "sala-literaria.html" },
            { t: "La casa de los espíritus", a: "Isabel Allende", s: "sala-literaria.html" },
            { t: "Los pasos perdidos", a: "Alejo Carpentier", s: "sala-literaria.html" },
            { t: "El túnel", a: "Ernesto Sabato", s: "sala-literaria.html" },
            { t: "Sobre héroes y tumbas", a: "Ernesto Sabato", s: "sala-literaria.html" },
            { t: "Abaddón el exterminador", a: "Ernesto Sabato", s: "sala-literaria.html" },
            { t: "La ciudad y los perros", a: "Mario Vargas Llosa", s: "sala-literaria.html" },
            { t: "Conversación en La Catedral", a: "Mario Vargas Llosa", s: "sala-literaria.html" },
            { t: "La fiesta del Chivo", a: "Mario Vargas Llosa", s: "sala-literaria.html" },
            { t: "El Aleph", a: "Jorge Luis Borges", s: "sala-literaria.html" },
            { t: "La tregua", a: "Mario Benedetti", s: "sala-literaria.html" },
            { t: "Gracias por el fuego", a: "Mario Benedetti", s: "sala-literaria.html" },
            { t: "El astillero", a: "Juan Carlos Onetti", s: "sala-literaria.html" },
            { t: "Juntacadáveres", a: "Juan Carlos Onetti", s: "sala-literaria.html" },
            { t: "Paradiso", a: "José Lezama Lima", s: "sala-literaria.html" },
            { t: "Tres tristes tigres", a: "Guillermo Cabrera Infante", s: "sala-literaria.html" },
            { t: "Yo el Supremo", a: "Augusto Roa Bastos", s: "sala-literaria.html" },
            { t: "Terra Nostra", a: "Carlos Fuentes", s: "sala-literaria.html" },
            { t: "La muerte de Artemio Cruz", a: "Carlos Fuentes", s: "sala-literaria.html" },
            { t: "Aura", a: "Carlos Fuentes", s: "sala-literaria.html" },
            { t: "Palinuro de México", a: "Fernando del Paso", s: "sala-literaria.html" },

            // SALA DE CINE (20 temas detectados)
            { t: "El Padrino", a: "Francis Ford Coppola", s: "sala-cine.html" },
            { t: "Pulp Fiction", a: "Quentin Tarantino", s: "sala-cine.html" },
            { t: "Inception", a: "Christopher Nolan", s: "sala-cine.html" },
            { t: "The Dark Knight", a: "Christopher Nolan", s: "sala-cine.html" },
            { t: "Schindler's List", a: "Steven Spielberg", s: "sala-cine.html" },
            { t: "Forrest Gump", a: "Robert Zemeckis", s: "sala-cine.html" },
            { t: "The Matrix", a: "Lana & Lilly Wachowski", s: "sala-cine.html" },
            { t: "Goodfellas", a: "Martin Scorsese", s: "sala-cine.html" },
            { t: "The Silence of the Lambs", a: "Jonathan Demme", s: "sala-cine.html" },
            { t: "Fight Club", a: "David Fincher", s: "sala-cine.html" },
            { t: "Star Wars: A New Hope", a: "George Lucas", s: "sala-cine.html" },
            { t: "The Lord of the Rings", a: "Peter Jackson", s: "sala-cine.html" },
            { t: "Gladiator", a: "Ridley Scott", s: "sala-cine.html" },
            { t: "Titanic", a: "James Cameron", s: "sala-cine.html" },
            { t: "Saving Private Ryan", a: "Steven Spielberg", s: "sala-cine.html" },
            { t: "Jurassic Park", a: "Steven Spielberg", s: "sala-cine.html" },
            { t: "Braveheart", a: "Mel Gibson", s: "sala-cine.html" },
            { t: "The Green Mile", a: "Frank Darabont", s: "sala-cine.html" },
            { t: "Apocalypse Now", a: "Francis Ford Coppola", s: "sala-cine.html" },
            { t: "Se7en", a: "David Fincher", s: "sala-cine.html" },

            // ANIMACIÓN (15 temas)
            ...Array.from({length: 15}, (_, i) => ({ t: `Animación ${i+1}`, a: "Varios", s: "sala-animacion y dibujos animados.html" })),
            // ÓPERA (10 temas)
            ...Array.from({length: 10}, (_, i) => ({ t: `Ópera ${i+1}`, a: "Varios", s: "sala-opera y concierto.html" })),
            // TEATRO (10 temas)
            ...Array.from({length: 10}, (_, i) => ({ t: `Teatro ${i+1}`, a: "Varios", s: "sala-teatro y musicales.html" }))
        ];
    }

    function mostrarSalas() {
        const container = document.getElementById('salas-container');
        const datos = obtenerDatos();
        const counts = datos.reduce((acc, item) => {
            acc[item.s] = (acc[item.s] || 0) + 1;
            return acc;
        }, {});

        const ul = document.createElement('ul');
        salasConfig.forEach(sala => {
            const num = counts[sala.archivo] || 0;
            const li = document.createElement('li');
            li.innerHTML = `
                <a href="${sala.archivo}">
                    <span>${sala.nombre}</span>
                    <span class="count">${num} temas</span>
                </a>
            `;
            ul.appendChild(li);
        });
        container.innerHTML = '';
        container.appendChild(ul);
    }

    function realizarBusqueda() {
        const term = document.getElementById('search-input').value.toLowerCase();
        const resCont = document.getElementById('results-container');
        resCont.innerHTML = '';
        if (!term) return;
        const resultados = obtenerDatos().filter(i => i.t.toLowerCase().includes(term) || i.a.toLowerCase().includes(term));
        resultados.forEach(r => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `<b>${r.t}</b> - ${r.a}`;
            div.onclick = () => window.location.href = r.s;
            resCont.appendChild(div);
        });
    }

    document.addEventListener('DOMContentLoaded', mostrarSalas);
</script>
</body>
</html>
