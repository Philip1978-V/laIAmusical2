<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala 1 - Literatura Musical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Animaciones */
        @keyframes pulse-custom { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.3; } }
        @keyframes bounce-custom { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes blink-custom { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse-custom { animation: pulse-custom 3s ease-in-out infinite; }
        .animate-bounce-custom { animation: bounce-custom 2s ease-in-out infinite; }
        .animate-blink-custom { animation: blink-custom 1s step-start infinite; }
        @keyframes bounce-sala1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .animate-bounce-sala1 { animation: bounce-sala1 1.5s ease-in-out infinite; }

        /* Estilos Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: url('images/fondo.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #2c7a7b;
            min-height: 100vh;
            background-repeat: no-repeat;
            background-position: center top;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- ESTILOS DEL REPRODUCTOR (NUEVO/ACTUALIZADO) --- */
        .progress-bar {
            width: 100%;
            height: 8px; /* Hacemos la barra visible */
            background-color: #4b5563; /* Fondo gris oscuro */
            border-radius: 4px;
            cursor: pointer; /* Cursor de mano para indicar que se puede hacer clic */
            margin-top: 10px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%; /* Se inicializa en 0% */
            background-color: #10b981; /* Color verde esmeralda para el progreso */
            border-radius: 4px;
            transition: width 0.1s linear; /* Transición suave del progreso */
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(16, 185, 129, 0.8);
            display: none; /* Ocultamos el indicador, pero podemos usarlo */
        }

        /* Contenedor Principal */
        #mainContent {
            flex-grow: 1;
            padding-top: 20px;
            padding-bottom: 50px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estilos de la Cabecera */
        .header {
            width: 100%;
            text-align: center;
            padding: 20px 0 10px 0;
            background-color: rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid #34d399;
        }

        .title {
            font-size: 1.8rem;
            color: #34d399;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 1rem;
            color: #a0aec0;
            font-style: italic;
        }

        /* Indicador */
        .test-indicator {
            background-color: #f6e05e; 
            color: #2d3748; 
            font-weight: bold;
            text-align: center;
            padding: 10px 20px;
            width: 100%;
            position: sticky; 
            top: 0;
            z-index: 50; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Contenedores de Ranking */
        .ranking-header {
            font-size: 1.6rem;
            color: #e2e8f0;
            margin: 25px 0 15px 0;
            text-align: center;
            font-weight: 600;
            width: 90%;
            max-width: 800px;
        }
        
        #top3Container {
            width: 95%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        #rankingContainer {
            width: 95%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Carta de Canción */
        .song-card {
            background-color: rgba(31, 41, 55, 0.95); 
            border-radius: 12px;
            padding: 15px;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border-left: 5px solid #34d399;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .song-card.top1 { border-left-color: #ffd700; }
        .song-card.top2 { border-left-color: #c0c0c0; }
        .song-card.top3 { border-left-color: #cd7f32; }
        
        .song-card:hover { 
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rank-badge {
            font-size: 1.5rem;
            font-weight: bold;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #1f2937;
            background-color: #34d399;
            flex-shrink: 0;
        }

        .details { flex-grow: 1; }
        .song-title { font-size: 1.1rem; font-weight: bold; }
        .song-author { font-size: 0.85rem; color: #a0aec0; }

        .votes-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #a0aec0;
        }

        .votes-info span {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
            color: #34d399;
        }
        
        .votes-info .text-yellow-400 { color: #facc15; }
        .votes-info .text-blue-400 { color: #60a5fa; }

        /* Controles de Audio */
        .audio-controls {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .player-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .play-pause-btn {
            background-color: #facc15;
            color: #1f2937;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        
        .play-pause-btn:active { transform: scale(0.95); background-color: #eab308; }

        .time-display {
            font-size: 0.9rem;
            color: #a0aec0;
        }

        /* Botón de Voto */
        .vote-section {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .vote-btn {
            background-color: #facc15;
            color: #1f2937;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        
        .vote-btn:hover { background-color: #eab308; }
        .vote-btn:active { transform: scale(0.95); }

        .coming-soon-badge {
            background-color: #ef4444;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            animation: bounce-sala1 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        /* Footer */
        .app-footer {
            margin-top: auto;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.4); 
            color: #a0a0a0; 
            text-align: center; 
            font-size: 0.75rem; 
            padding: 15px 10px;
        }

        /* Media Queries */
        @media (min-width: 640px) {
            .title { font-size: 2.5rem; }
            .subtitle { font-size: 1.2rem; }
            .song-card { padding: 20px; }
            .song-title { font-size: 1.25rem; }
            .rank-badge { width: 50px; height: 50px; font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="test-indicator">
        🛠️ SALA LITERATURA EN PRUEBAS - ¡Vota y Gana Estrellas! 🛠️
    </div>
    
    <div id="mainContent">
        <header class="header">
            <h1 class="title">LA LITERATURA MUSICAL</h1>
            <p class="subtitle">Canciones inspiradas en la palabra escrita</p>
        </header>

        <h2 class="ranking-header">🏆 Top 3 Canciones (Las más votadas)</h2>
        <div id="top3Container">
            </div>

        <h2 class="ranking-header">Otras Canciones y Novedades</h2>
        <div id="rankingContainer">
            </div>

        <div class="app-footer">
            <p>© 2025 La IA Musical. Todos los derechos reservados.</p>
        </div>
    </div>
    
    <script>
        // --- DATA SIMULADA (REEMPLAZAR CON FIRESTORE) ---
        const appData = [
            {
                id: 'song1',
                rank: 1,
                title: "Viaje al Centro de la IA",
                author: "Basado en 'Viaje al Centro de la Tierra' de Julio Verne",
                votes: 1200,
                stars: 15000,
                comingSoon: false,
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                duration: "03:30"
            },
            {
                id: 'song2',
                rank: 2,
                title: "El Quijote Digital",
                author: "Basado en 'Don Quijote de la Mancha' de Cervantes",
                votes: 950,
                stars: 12000,
                comingSoon: false,
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                duration: "02:50"
            },
            {
                id: 'song3',
                rank: 3,
                title: "Cien Años de soledad Vocal",
                author: "Basado en 'Cien Años de Soledad' de G.G. Márquez",
                votes: 700,
                stars: 10000,
                comingSoon: false,
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                duration: "04:15"
            },
            {
                id: 'song4',
                rank: 4,
                title: "Las Uvas de la Ira (Versión IA)",
                author: "Basado en 'Las Uvas de la Ira' de John Steinbeck",
                votes: 450,
                stars: 6000,
                comingSoon: false,
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
                duration: "03:05"
            },
            {
                id: 'song5',
                rank: 5,
                title: "Próximamente: 1984 y el Big Data",
                author: "Basado en '1984' de George Orwell",
                votes: 0,
                stars: 0,
                comingSoon: true,
                audioUrl: ""
            },
            {
                id: 'song6',
                rank: 6,
                title: "Próximamente: El Señor de los Anillos Sinfónico",
                author: "Basado en 'El Señor de los Anillos' de Tolkien",
                votes: 0,
                stars: 0,
                comingSoon: true,
                audioUrl: ""
            }
        ];

        let currentAudio = null; // Variable global para rastrear el audio que se está reproduciendo

        // --- FUNCIONES DE FORMATO ---
        const formatNumber = (num) => new Intl.NumberFormat('es-ES').format(num);
        
        const formatTime = (seconds) => {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        };

        // --- FUNCIONES DEL REPRODUCTOR DE AUDIO (ACTUALIZADO) ---
        
        /**
         * Maneja el clic en la barra de progreso para adelantar/rebobinar.
         * @param {HTMLAudioElement} audio El elemento de audio.
         * @param {HTMLElement} progressBar El contenedor de la barra de progreso.
         * @param {MouseEvent} event El evento de clic.
         */
        function setAudioTime(audio, progressBar, event) {
            if (!audio || !audio.duration || audio.duration === 0) return;

            const rect = progressBar.getBoundingClientRect();
            const clickPositionX = event.clientX - rect.left;
            const percentage = clickPositionX / rect.width;
            
            // Establecer el nuevo tiempo de reproducción
            audio.currentTime = audio.duration * percentage;
        }

        /**
         * Actualiza el progreso visual de la barra y el tiempo.
         * Se llama constantemente por el evento 'timeupdate'.
         * @param {HTMLAudioElement} audio El elemento de audio.
         * @param {HTMLElement} progressFill La barra de llenado de progreso.
         * @param {HTMLElement} timeDisplay El elemento que muestra el tiempo.
         */
        function updateProgress(audio, progressFill, timeDisplay) {
            if (!audio || !audio.duration || audio.duration === 0) return;
            
            const percentage = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percentage}%`;
            
            const currentTime = formatTime(audio.currentTime);
            const durationTime = formatTime(audio.duration);
            timeDisplay.textContent = `${currentTime} / ${durationTime}`;
        }
        
        /**
         * Alterna entre reproducir y pausar, y maneja la lógica del reproductor global.
         * @param {HTMLAudioElement} audio El elemento de audio actual.
         * @param {HTMLElement} btn El botón de play/pause.
         */
        function togglePlayPause(audio, btn) {
            // 1. Manejar el estado global (si hay otro audio reproduciéndose)
            if (currentAudio && currentAudio !== audio) {
                // Pausar el audio anterior
                const prevBtn = document.querySelector(`[data-audio-id="${currentAudio.id}"]`);
                if (prevBtn) {
                    prevBtn.innerHTML = '<i class="fas fa-play"></i> Reproducir';
                }
                currentAudio.pause();
                currentAudio = null; 
            }

            // 2. Controlar la reproducción del audio actual
            if (audio.paused) {
                audio.play();
                btn.innerHTML = '<i class="fas fa-pause"></i> Pausar';
                currentAudio = audio;
            } else {
                audio.pause();
                btn.innerHTML = '<i class="fas fa-play"></i> Reproducir';
                currentAudio = null;
            }
        }

        // --- GENERACIÓN DE HTML ---
        
        /**
         * Crea la tarjeta HTML para cada canción.
         */
        function createSongCard(song, index, isTop3 = false) {
            const rankClass = isTop3 ? `top${index}` : '';
            const rankSymbol = isTop3 ? `&#x${(9311 + index).toString(16)};` : index; // ➀, ➁, ➂
            const badgeClass = isTop3 ? `top${index}-badge` : '';
            
            if (song.comingSoon) {
                return `
                    <div id="${song.id}" class="song-card bg-gray-700/80 border-l-4 border-red-500">
                        <div class="song-info">
                            <div class="rank-badge bg-gray-500">${song.rank}</div>
                            <div class="details flex-grow">
                                <p class="song-title text-red-400">${song.title}</p>
                                <p class="song-author">${song.author}</p>
                            </div>
                            <span class="coming-soon-badge">PRÓXIMAMENTE</span>
                        </div>
                    </div>
                `;
            }

            // --- Estructura del reproductor actualizada ---
            const playerControls = `
                <div class="audio-controls" id="controls-${song.id}">
                    <audio id="audio-${song.id}" src="${song.audioUrl}" preload="none"></audio>
                    
                    <div class="progress-bar" id="progress-bar-${song.id}">
                        <div class="progress-fill" id="progress-fill-${song.id}"></div>
                    </div>
                    
                    <div class="player-actions">
                        <button 
                            id="play-btn-${song.id}"
                            data-audio-id="audio-${song.id}"
                            class="play-pause-btn"
                            onclick="handlePlayPause('${song.id}')">
                            <i class="fas fa-play"></i> Reproducir
                        </button>
                        <span class="time-display" id="time-display-${song.id}">00:00 / ${song.duration}</span>
                    </div>
                </div>
            `;
            // -----------------------------------------------

            const card = document.createElement('div');
            card.id = song.id;
            card.className = `song-card ${rankClass}`;
            card.innerHTML = `
                <div class="song-info">
                    <div class="rank-badge ${badgeClass}">${rankSymbol}</div>
                    <div class="details">
                        <p class="song-title">${song.title}</p>
                        <p class="song-author">${song.author}</p>
                    </div>
                </div>
                <div class="votes-info">
                    <span class="text-yellow-400"><i class="fas fa-star"></i> ${formatNumber(song.stars)}</span>
                    <span class="text-blue-400"><i class="fas fa-vote-yea"></i> ${formatNumber(song.votes)} Votos</span>
                </div>
                ${playerControls}
                <div class="vote-section">
                    <button class="vote-btn" onclick="openVoteModal('${song.id}')">
                        VOTAR <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
            `;
            return card.outerHTML;
        }

        // --- MANEJADORES GLOBALES DE EVENTOS ---
        
        /**
         * Función global para manejar el Play/Pause desde el HTML (onclick).
         */
        function handlePlayPause(songId) {
            const audio = document.getElementById(`audio-${songId}`);
            const btn = document.getElementById(`play-btn-${songId}`);
            togglePlayPause(audio, btn);
        }
        window.handlePlayPause = handlePlayPause;

        /**
         * Inicializa los listeners de audio para todas las tarjetas.
         */
        function initAudioListeners() {
            appData.filter(s => !s.comingSoon).forEach(song => {
                const audio = document.getElementById(`audio-${song.id}`);
                const progressFill = document.getElementById(`progress-fill-${song.id}`);
                const progressBar = document.getElementById(`progress-bar-${song.id}`);
                const timeDisplay = document.getElementById(`time-display-${song.id}`);
                const playBtn = document.getElementById(`play-btn-${song.id}`);

                if (!audio || !progressFill || !progressBar || !timeDisplay || !playBtn) return;
                
                // 1. Actualizar la barra de progreso constantemente (timeupdate)
                audio.addEventListener('timeupdate', () => {
                    updateProgress(audio, progressFill, timeDisplay);
                });
                
                // 2. Manejar el final de la reproducción
                audio.addEventListener('ended', () => {
                    playBtn.innerHTML = '<i class="fas fa-play"></i> Reproducir';
                    audio.currentTime = 0; // Opcional: rebobinar al principio
                    currentAudio = null;
                });
                
                // 3. Permitir arrastrar/clickear en la barra de progreso (seek functionality)
                progressBar.addEventListener('click', (e) => {
                    setAudioTime(audio, progressBar, e);
                });
            });
        }

        // --- LÓGICA DE LA PÁGINA ---

        function renderRanking() {
            const songs = [...appData].sort((a, b) => b.totalStars - a.totalStars); // Asumiendo totalStars si estuviera en Firestore
            const top3 = document.getElementById('top3Container');
            const ranking = document.getElementById('rankingContainer');
            top3.innerHTML = '';
            ranking.innerHTML = '';
            
            const regularSongs = appData.filter(s => !s.comingSoon);
            const comingSoonSongs = appData.filter(s => s.comingSoon);
            
            regularSongs.slice(0, 3).forEach((s, i) => top3.innerHTML += createSongCard(s, i + 1, true));
            regularSongs.slice(3).forEach((s, i) => ranking.innerHTML += createSongCard(s, i + 4, false));
            
            comingSoonSongs.forEach(s => ranking.innerHTML += createSongCard(s));

            // Inicializar los listeners de audio DESPUÉS de que el HTML haya sido inyectado
            initAudioListeners();
        }

        function openVoteModal(songId) { 
             alert(`Preparado para votar por la canción ${songId}. (Lógica de votación pendiente)`);
        }
        window.openVoteModal = openVoteModal;
        
        function openGlobalInfoModal() { 
             alert("Mecánica de Votación:\n\n* Cada usuario dispone de 5 votos semanales.\n* El voto se realiza gastando 5, 6, 7, 8, 9 o 10 estrellas.\n* Solo se puede votar con una cantidad igual o menor a las estrellas acumuladas.\n\nMecánica de Quiz y Estrellas:\n\n* **Moneda (Estrellas):** Se ganan **5 estrellas** por cada pregunta acertada.\n* **Bonificación:** Se ganan **10 estrellas más de bonificación** si aciertas las 5 preguntas.");
        }
        window.openGlobalInfoModal = openGlobalInfoModal;

        // Función de inicialización
        document.addEventListener('DOMContentLoaded', () => {
            renderRanking();
            // No hay una función loadAppData real en este snippet, así que llamamos directamente a renderRanking.
        });
    </script>
</body>
</html>
