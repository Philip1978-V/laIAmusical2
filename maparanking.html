// Función para obtener los datos del usuario desde Firestore
async function getUserData() {
    if (!auth.currentUser) {
        return null;
    }
    
    try {
        const userRef = db.collection('users').doc(auth.currentUser.uid);
        const doc = await userRef.get();
        
        if (doc.exists) {
            return doc.data();
        } else {
            return null;
        }
    } catch (error) {
        console.error("Error al obtener datos del usuario:", error);
        return null;
    }
}

// Función para actualizar el nivel basado en las estrellas de Firebase
async function updateLevelFromFirebase() {
    const userData = await getUserData();
    
    if (!userData) {
        // Si no hay usuario logueado, redirigir al login
        window.location.href = 'index.html';
        return;
    }
    
    // Obtener las estrellas del usuario desde Firestore

    const lvl = getCurrentLevel(stars);
    const ld = LEVELS[lvl-1]; 
    const ri = RANK_INFO[ld.rankNum];
    
    document.getElementById('currentBadge').textContent = `Nivel ${lvl} · ${ld.name} (⭐ ${stars})`;
    const badge = document.getElementById('rankBadge'); 
    badge.style.background = ri.bg;
    document.getElementById('rankLabel').textContent = ri.label;
    document.getElementById('rankIcon').textContent = ri.icon;
    document.getElementById('rankName').textContent = ri.name;
    
    buildMap(lvl);
    
    setTimeout(() => {
        const c = document.querySelector('.level-node.current');
        if (c) c.scrollIntoView({behavior:'smooth', block:'center'});
    }, 300);
}

// Función para obtener el nivel y rango (igual que perfil.html)
function getUserRank(stars) {
    for (let i = 0; i < rankingSystem.length; i++) {
        if (stars >= rankingSystem[i].minStars && stars <= rankingSystem[i].maxStars) {
            return {
                current: rankingSystem[i],
                next: rankingSystem[i + 1] || null,
                level: i + 1
            };
        }
    }
    return {
        current: rankingSystem[rankingSystem.length - 1],
        next: null,
        level: rankingSystem.length
    };
}

// Función para obtener el nivel actual basado en las estrellas
function getCurrentLevel(stars) {
    const rank = getUserRank(stars);
    return rank.level;
}

  RANK_GROUPS.forEach((group,gi)=>{
    const div=document.createElement('div'); 
    div.className=`rank-group ${group.cls}`;
    const title=document.createElement('div'); 
    title.className='rank-group-title'; 
    title.textContent=group.label; 
    div.appendChild(title);
    
    const groupLevels=LEVELS.filter(l=>l.lvl>=group.min&&l.lvl<=group.max);
    
    if(group.key==='dios'){
      const row=document.createElement('div'); 
      row.className='levels-row'; row.style.justifyContent='center';
      const nd=document.createElement('div');
      nd.className='level-node god-node'+(currentLvl===50?' current':currentLvl>50?' completed':' locked');
      nd.innerHTML='<span class="level-num">🌟</span>';
      row.appendChild(nd); div.appendChild(row);
    } else {
      const r1=groupLevels.slice(0,4), r2=groupLevels.slice(4);
      [r1,r2].forEach((rowLevels,ri)=>{
        if(!rowLevels.length) return;
        const row=document.createElement('div'); 
        row.className='levels-row';
        rowLevels.forEach(ld=>{
          const nd=document.createElement('div');
          let cls='level-node';
          if(ld.lvl===currentLvl) cls+=' current';
          else if(ld.lvl<currentLvl) cls+=' completed';
          else cls+=' locked';
          nd.className=cls; 
          const num=ld.lvl<currentLvl?'✓':String(ld.lvl);
          const nameW=ld.name.split(' ').slice(0,3).join(' ');
          nd.innerHTML=`<span class="level-num">${num}</span><span class="level-name">${nameW}</span>`;
          row.appendChild(nd);
        });
        div.appendChild(row);
        if(ri===0&&r2.length){
          const c=document.createElement('div'); c.className='connector'; div.appendChild(c);
        }
      });
    }
    if(gi<RANK_GROUPS.length-1){
      const p=document.createElement('div'); p.className='path-line'; div.appendChild(p);
    }
    map.appendChild(div);
  });
}

// La función updateLevelFromFirebase ya se encarga de actualizar el nivel
// Los eventos de Firebase auth.onAuthStateChanged manejan la autenticación en tiempo real
