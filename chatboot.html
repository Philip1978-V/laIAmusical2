<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual · La IA Musical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        body {
            background-image: url('./images/fondostorycards.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .chat-container {
            height: calc(100vh - 160px);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
        }
        .message-bot {
            background: #1e293b;
            border-left: 4px solid #f59e0b;
        }
        .message-user {
            background: #0369a1;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.5s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
        }
        .suggestion-chip {
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
        }
        .suggestion-chip:hover {
            background: #f59e0b;
            color: black;
            transform: scale(1.05);
        }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="text-white">

    <header class="p-4 flex justify-between items-center bg-black/40 border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-yellow-500 rounded-full flex items-center justify-center text-black">
                <i class="fas fa-robot text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Asistente Gemini IA</h1>
                <span class="text-xs text-green-400"><i class="fas fa-circle text-[8px]"></i> Sistema Activo</span>
            </div>
        </div>
        <a href="index.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm transition">
            Volver al inicio
        </a>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        <div id="chatBox" class="chat-container rounded-t-2xl p-4 overflow-y-auto custom-scroll flex flex-col gap-4">
            <div class="message-bot p-4 rounded-r-xl rounded-bl-xl max-w-[85%] self-start">
                <p>¡Hola! Soy la inteligencia artificial de <b>La IA Musical</b>. Puedo ayudarte con dudas sobre la web, crear letras de canciones o analizar historias. ¿Qué necesitas?</p>
            </div>
        </div>

        <div id="typingIndicator" class="hidden ml-4 mb-2 flex gap-1">
            <div class="typing-dot" style="animation-delay: 0s"></div>
            <div class="typing-dot" style="animation-delay: 0.2s"></div>
            <div class="typing-dot" style="animation-delay: 0.4s"></div>
        </div>

        <div id="suggestions" class="bg-black/20 p-3 flex flex-wrap gap-2 overflow-x-auto border-t border-white/5">
            <button onclick="sendQuick('¿Qué puedo hacer en esta web?')" class="suggestion-chip px-3 py-1.5 rounded-full text-xs">🤔 Guía de inicio</button>
            <button onclick="sendQuick('Ayúdame a escribir una letra de trap')" class="suggestion-chip px-3 py-1.5 rounded-full text-xs">🎙️ Escribir canción</button>
            <button onclick="sendQuick('¿Cómo funciona el Duelo de Cartas?')" class="suggestion-chip px-3 py-1.5 rounded-full text-xs">🎴 Reglas del juego</button>
        </div>

        <div class="bg-slate-900/90 p-4 rounded-b-2xl flex gap-2">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje aquí..." class="bg-white/5 border border-white/10 rounded-xl px-4 py-3 flex-1 focus:outline-none focus:border-yellow-500 transition">
            <button id="sendBtn" class="bg-yellow-500 hover:bg-yellow-400 text-black w-12 h-12 rounded-xl flex items-center justify-center transition">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </main>

<script type="module">
    // --- 1. IMPORTACIONES FIREBASE ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

    // --- 2. CONFIGURACIÓN (RECUERDA PEGAR TU API KEY ABAJO) ---
    const firebaseConfig = {
        apiKey: "AIzaSyDW3Yv0AQAVlf3zTuxlqNq6dkZ6kQtpysM",
        authDomain: "laiamusical-4fba7.firebaseapp.com",
        projectId: "laiamusical-4fba7",
        storageBucket: "laiamusical-4fba7.firebasestorage.app",
        messagingSenderId: "49783369602",
        appId: "1:49783369602:web:91e287c094a8f2403d699b"
    };

    const GEMINI_API_KEY = "AIzaSyCTvfDvadcHGX4V-HqeZPohqjFCHFeZ--E"; // <--- PEGA AQUÍ TU CLAVE DE GOOGLE AI STUDIO
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // --- 3. BASE DE CONOCIMIENTO LOCAL (Respuestas rápidas sin usar la API) ---
    const LOCAL_KNOWLEDGE = [
        { keys: ['ranking', 'puntos', 'ganar'], answer: "Puedes ver quién va ganando en la sección de <a href='storycardsranking.html' class='text-yellow-400 underline'>Rankings</a>." },
        { keys: ['juego', 'cartas', 'duelo'], answer: "El <b>StoryCard Duel</b> se basa en estrategia y combos. ¡Prueba tu mazo en la sección de juegos!" },
        { keys: ['biblioteca', 'salas'], answer: "En la <a href='biblioteca.html' class='text-yellow-400 underline'>Biblioteca</a> puedes explorar y votar por las mejores creaciones." }
    ];

    // Elementos del DOM
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');
    const sendBtn = document.getElementById('sendBtn');

    // Seguridad: Redirigir si no hay sesión
    onAuthStateChanged(auth, (user) => {
        if (!user) window.location.href = 'login.html';
    });

    // Función para llamar a la API de Gemini
    async function fetchGemini(prompt) {
        try {
            const response = await fetch(GEMINI_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `Eres el asistente experto de "La IA Musical". Tu tono es moderno, creativo y servicial. Ayuda al usuario con su consulta: ${prompt}`
                        }]
                    }]
                })
            });
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        } catch (error) {
            console.error("Error API Gemini:", error);
            return "Lo siento, hubo un error al conectar con mi núcleo de IA. ¿Tienes configurada tu API Key?";
        }
    }

    // Mostrar mensajes en pantalla
    function addMessage(text, isBot = true) {
        const div = document.createElement('div');
        div.className = isBot 
            ? "message-bot p-4 rounded-r-xl rounded-bl-xl max-w-[85%] self-start" 
            : "message-user p-4 rounded-l-xl rounded-br-xl max-w-[85%] self-end";
        
        // Convertir formato markdown básico a HTML
        const formatted = text
            .replace(/\n/g, '<br>')
            .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
            .replace(/\*(.*?)\*/g, '<i>$1</i>');

        div.innerHTML = `<p>${formatted}</p>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Procesar mensaje del usuario
    async function handleChat() {
        const query = userInput.value.trim();
        if (!query) return;

        addMessage(query, false);
        userInput.value = '';
        showTyping(true);

        // 1. Intentar respuesta local rápida
        const lowQuery = query.toLowerCase();
        const localMatch = LOCAL_KNOWLEDGE.find(item => item.keys.some(k => lowQuery.includes(k)));

        let finalResponse;
        if (localMatch) {
            await new Promise(r => setTimeout(r, 600)); // Simular rapidez
            finalResponse = localMatch.answer;
        } else {
            // 2. Si no es local, usar Gemini
            finalResponse = await fetchGemini(query);
        }

        showTyping(false);
        addMessage(finalResponse, true);
    }

    function showTyping(show) {
        typingIndicator.classList.toggle('hidden', !show);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Eventos
    sendBtn.addEventListener('click', handleChat);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChat(); });
    
    // Función global para los botones de sugerencia
    window.sendQuick = (text) => {
        userInput.value = text;
        handleChat();
    };

</script>
</body>
</html>
