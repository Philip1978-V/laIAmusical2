<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual · La IA Musical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        body {
            background-image: url('./images/fondostorycards.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .chat-container {
            height: calc(100vh - 160px);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
        }
        .message-bot {
            background: #1e293b;
            border-left: 4px solid #f59e0b;
        }
        .message-user {
            background: #0369a1;
        }
        /* Personalización de barra de desplazamiento */
        #chatBox::-webkit-scrollbar { width: 6px; }
        #chatBox::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-200">

    <header class="p-4 flex justify-between items-center bg-slate-900/50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-amber-500 rounded-full flex items-center justify-center text-slate-900 font-bold">
                IA
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Asistente Musical</h1>
                <p id="userDisplay" class="text-xs text-slate-400 italic">Verificando sesión...</p>
            </div>
        </div>
        <button onclick="window.location.href='index.html'" class="text-sm bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg transition">
            Volver
        </button>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        <div class="chat-container rounded-2xl flex flex-col overflow-hidden border border-slate-700/50 shadow-2xl">
            <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="message-bot p-4 rounded-2xl max-w-[85%]">
                    <p>¡Hola! Soy tu asistente en <strong>La IA Musical</strong>. Estoy aquí para ayudarte con tus proyectos o resolver dudas sobre la web. ¿En qué puedo ayudarte hoy?</p>
                </div>
            </div>

            <div id="typingIndicator" class="px-6 py-2 text-xs text-amber-400 hidden">
                <i class="fas fa-circle-notch fa-spin mr-2"></i> La IA está componiendo una respuesta...
            </div>

            <div class="p-4 bg-slate-900/80 border-t border-slate-700/50">
                <div class="flex gap-2">
                    <input type="text" id="userInput" 
                        class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-amber-500 transition"
                        placeholder="Escribe tu mensaje aquí...">
                    <button id="sendBtn" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-6 py-3 rounded-xl font-bold transition flex items-center gap-2">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

        // 1. Configuración de Firebase (Extraída de tu login.html)
        const firebaseConfig = {
            apiKey: "AIzaSyDW3Yv0AQAVlf3zTuxlqNq6dkZ6kQtpysM",
            authDomain: "laiamusical-4fba7.firebaseapp.com",
            projectId: "laiamusical-4fba7",
            storageBucket: "laiamusical-4fba7.firebasestorage.app",
            appId: "1:49783369602:web:91e287c094a8f2403d699b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 2. Configuración de Gemini (Sustituye TU_API_KEY)
        const GEMINI_API_KEY = "AIzaSyB1P6k9hAK1RWJw37E8sVbbDTD7SGdfcoM"; 
        const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

        let currentUserName = "Músico";

        // Control de Sesión
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                alert("Debes estar logueado para usar el asistente.");
                window.location.href = 'login.html';
            } else {
                currentUserName = user.email.split('@')[0];
                document.getElementById('userDisplay').textContent = `Sesión activa: ${user.email}`;
            }
        });

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');

        async function fetchGemini(prompt) {
            try {
                const response = await fetch(GEMINI_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Actúa como el asistente experto de "La IA Musical". 
                                       El usuario se llama ${currentUserName}. 
                                       Responde de forma amable y profesional a: ${prompt}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                return data.candidates[0].content.parts[0].text;
            } catch (error) {
                console.error("Error API:", error);
                return "Lo siento, tuve un problema al conectar con mi núcleo. Verifica que tu API Key sea correcta.";
            }
        }

        function addMessage(text, isBot) {
            const div = document.createElement('div');
            div.className = isBot ? 'message-bot p-4 rounded-2xl max-w-[85%]' : 'message-user p-4 rounded-2xl max-w-[85%] ml-auto';
            
            // Formateo simple para negritas y saltos de línea
            const formatted = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            div.innerHTML = `<p>${formatted}</p>`;
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleChat() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, false);
            userInput.value = '';
            typingIndicator.classList.remove('hidden');

            const response = await fetchGemini(text);
            
            typingIndicator.classList.add('hidden');
            addMessage(response, true);
        }

        sendBtn.addEventListener('click', handleChat);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleChat();
        });
    </script>
</body>
</html>
