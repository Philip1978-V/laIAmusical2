<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>El club del faro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f8f3ea;
    --cream-dark: #ede5d4;
    --ink: #2a1f14;
    --ink-light: #6b5a47;
    --gold: #c8a96e;
    --spine: #8b6e50;
  }

  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
  }

  body {
    background: radial-gradient(ellipse at center, #3a2a1a 0%, #1a1008 100%);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-family: 'Crimson Text', Georgia, serif;
    overflow: hidden;
    position: relative;
    padding: 0;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* ── UI WRAPPER ── */
  .ui-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100dvh;
    position: relative;
    z-index: 10;
    padding: 10px 10px 8px;
    gap: 8px;
  }

  /* ── TOP BAR ── */
  .top-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    max-width: 440px;
    flex-shrink: 0;
    gap: 6px;
  }

  .book-title-header {
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.75;
    white-space: nowrap;
    flex-shrink: 0;
    text-align: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── AUDIO CONTROLS BAR ── */
  .audio-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
    flex-wrap: wrap;
    width: 100%;
    max-width: 100%;
  }
  .audio-bar.visible { opacity: 1; pointer-events: all; }

  .audio-btn {
    background: rgba(200,169,110,0.12);
    border: 1px solid rgba(200,169,110,0.3);
    border-radius: 50%;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
    color: var(--gold);
    padding: 0;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .audio-btn:active { background: rgba(200,169,110,0.25); }
  .audio-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

  .audio-label {
    font-family: 'Playfair Display', serif;
    font-size: 0.46rem;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: rgba(200,169,110,0.55);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .audio-divider {
    width: 1px;
    height: 18px;
    background: rgba(200,169,110,0.2);
    flex-shrink: 0;
    margin: 0 2px;
  }

  /* Voice indicator */
  .voice-indicator {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 14px;
    flex-shrink: 0;
  }
  .voice-indicator span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: var(--gold);
    opacity: 0;
    animation: none;
  }
  .voice-indicator.playing span { opacity: 0.7; animation: voiceBar 1s ease-in-out infinite; }
  .voice-indicator.playing span:nth-child(1) { animation-delay: 0s; }
  .voice-indicator.playing span:nth-child(2) { animation-delay: 0.15s; }
  .voice-indicator.playing span:nth-child(3) { animation-delay: 0.3s; }
  .voice-indicator.playing span:nth-child(4) { animation-delay: 0.15s; }
  @keyframes voiceBar {
    0%, 100% { height: 4px; }
    50%       { height: 13px; }
  }

  #musicVolume {
    width: 44px;
    accent-color: var(--gold);
    cursor: pointer;
    vertical-align: middle;
    flex-shrink: 0;
  }

  /* ── BOOK WRAPPER ── */
  .book-wrapper {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    overflow: hidden;
  }

  /* ── OPEN HINT ── */
  .open-hint-badge {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(200,169,110,0.15);
    border: 1px solid rgba(200,169,110,0.35);
    backdrop-filter: blur(6px);
    border-radius: 30px;
    padding: 6px 16px;
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 0.66rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    animation: pulseHint 2.4s ease-in-out infinite;
    transition: opacity 0.4s;
    z-index: 30;
    white-space: nowrap;
  }
  .open-hint-badge.hidden { opacity: 0; pointer-events: none; }
  .open-hint-badge svg { opacity: 0.7; flex-shrink: 0; }
  @keyframes pulseHint {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200,169,110,0); }
    50%       { box-shadow: 0 0 0 6px rgba(200,169,110,0.12); }
  }

  /* ── BOOK CARD ── */
  .book-card {
    width: 100%;
    height: 100%;
    border-radius: 14px;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.05),
      inset -3px 0 8px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
    background: var(--cream);
    -webkit-tap-highlight-color: transparent;
    perspective: 1400px;
  }

  /* Lomo del libro */
  .book-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 8px;
    background: linear-gradient(to right, var(--spine), rgba(139,110,80,0.3));
    z-index: 20;
    pointer-events: none;
  }

  /* ── COVER PAGE ── */
  .cover-page {
    width: 100%;
    height: 100%;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .cover-page img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cover-bg-placeholder {
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, #4a3520, #1a1008);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6rem;
    opacity: 0.5;
  }
  .cover-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, transparent 55%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 28px 24px;
  }
  .cover-overlay h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: #fff;
    line-height: 1.2;
    text-shadow: 0 2px 16px rgba(0,0,0,0.8);
    margin-bottom: 8px;
  }
  .cover-overlay .author {
    font-family: 'Crimson Text', serif;
    font-size: 1rem;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.1em;
  }

  .cover-page::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(200,169,110,0);
    transition: background 0.3s;
    pointer-events: none;
  }
  .cover-page:active::after { background: rgba(200,169,110,0.08); }

  /* ── STORY PAGE ── */
  .story-page {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    background: var(--cream);
  }

  /* Contenedor de la ilustración */
  .page-illustration {
    width: 100%;
    flex-shrink: 0;
    position: relative;
    background: var(--cream-dark);
    line-height: 0;
  }

  .page-illustration img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }

  .img-placeholder {
    width: 100%;
    padding: 40px 0;
    background: var(--cream-dark);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .img-placeholder svg {
    opacity: 0.15;
    width: 70px; height: 70px;
  }

  /* Marco perimetral */
  .page-illustration::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    box-shadow:
      inset 0    30px 22px -8px var(--cream),
      inset 0   -42px 28px -8px var(--cream),
      inset  28px 0   22px -8px var(--cream),
      inset -28px 0   22px -8px var(--cream);
  }

  /* Degradado imagen → texto */
  .page-illustration::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 55px;
    z-index: 3;
    background: linear-gradient(to bottom, transparent, var(--cream));
    pointer-events: none;
  }

  /* Sección de texto */
  .page-text-section {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 16px 22px 20px 26px;
    position: relative;
    background: var(--cream);
  }

  /* Líneas de cuaderno */
  .page-text-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      transparent, transparent 31px,
      rgba(180,160,130,0.13) 31px,
      rgba(180,160,130,0.13) 32px
    );
    background-position: 0 52px;
    pointer-events: none;
  }

  .chapter-label {
    font-family: 'Playfair Display', serif;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 14px;
    opacity: 0.6;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .drop-cap {
    font-family: 'Playfair Display', serif;
    font-size: 4.4rem;
    font-weight: 700;
    line-height: 0.75;
    float: left;
    margin-right: 6px;
    margin-top: 4px;
    color: var(--ink);
  }

  .page-text {
    font-family: 'Crimson Text', serif;
    font-size: 1.12rem;
    line-height: 1.7;
    color: var(--ink);
    text-align: justify;
    position: relative;
    z-index: 1;
  }
  .page-text p { margin-bottom: 0.8em; }
  .page-text p::after { content: ''; display: table; clear: both; }

  .page-number {
    margin-top: 10px;
    text-align: right;
    font-family: 'Playfair Display', serif;
    font-size: 0.72rem;
    color: var(--ink-light);
    opacity: 0.5;
    position: relative;
    z-index: 2;
  }

  /* Indicador "desliza" al final del contenido */
  .swipe-hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 14px 0 16px;
    color: var(--ink-light);
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-family: 'Playfair Display', serif;
    opacity: 0.4;
    flex-shrink: 0;
    background: var(--cream);
  }

  /* ── NAVIGATION ARROWS ── */
  @keyframes arrowPulse {
    0%, 100% {
      box-shadow: 0 0 0 0 rgba(200,169,110,0.55),
                  0 0 10px 2px rgba(200,169,110,0.25);
      background: rgba(200,169,110,0.22);
      border-color: rgba(200,169,110,0.7);
    }
    50% {
      box-shadow: 0 0 0 8px rgba(200,169,110,0),
                  0 0 18px 4px rgba(200,169,110,0.45);
      background: rgba(200,169,110,0.42);
      border-color: var(--gold);
    }
  }

  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(200,169,110,0.22);
    border: 1.5px solid rgba(200,169,110,0.7);
    border-radius: 50%;
    color: var(--gold);
    cursor: pointer;
    transition: background 0.2s, opacity 0.3s;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
    animation: arrowPulse 1.5s ease-in-out infinite;
  }
  .nav-arrow:active { background: rgba(200,169,110,0.55); }
  .nav-arrow.hidden { opacity: 0; pointer-events: none; animation: none; }
  .nav-arrow svg { width: 18px; height: 18px; filter: drop-shadow(0 0 3px rgba(200,169,110,0.6)); }
  .nav-arrow-left  { left: 6px; }
  .nav-arrow-right { right: 6px; }

  /* ── END PAGE ── */
  .end-page {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
  }
  .end-page-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 30px;
    text-align: center;
  }
  .end-page-content .ornament { color: var(--gold); font-size: 1.8rem; opacity: 0.6; }
  .end-page-content h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--ink);
  }
  .end-page-content p {
    font-family: 'Crimson Text', serif;
    font-size: 0.95rem;
    color: var(--ink-light);
    opacity: 0.7;
    letter-spacing: 0.1em;
  }
  .back-btn {
    margin-top: 6px;
    padding: 10px 24px;
    border: 1px solid var(--gold);
    background: none;
    color: var(--ink-light);
    font-family: 'Playfair Display', serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn:active { background: var(--gold); color: var(--cream); }

  /* ── NAV DOTS ── */
  .nav-dots {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    padding: 2px 0;
    z-index: 10;
    position: relative;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(200,169,110,0.3);
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid rgba(200,169,110,0.4);
    -webkit-tap-highlight-color: transparent;
  }
  .dot.active { background: var(--gold); transform: scale(1.3); }

  /* ══════════════════════════════════════════════════════
     PAGE FLIP ANIMATIONS
     ══════════════════════════════════════════════════════ */

  @keyframes pageFlipInForward {
    0%   { transform: perspective(1400px) rotateY(-88deg); transform-origin: left center; opacity: 0.4; filter: brightness(0.6); }
    40%  { opacity: 0.85; filter: brightness(0.85); }
    100% { transform: perspective(1400px) rotateY(0deg);  transform-origin: left center; opacity: 1;   filter: brightness(1); }
  }
  @keyframes pageFlipInBackward {
    0%   { transform: perspective(1400px) rotateY(88deg);  transform-origin: right center; opacity: 0.4; filter: brightness(0.6); }
    40%  { opacity: 0.85; filter: brightness(0.85); }
    100% { transform: perspective(1400px) rotateY(0deg);   transform-origin: right center; opacity: 1;   filter: brightness(1); }
  }
  @keyframes pageFlipOutForward {
    0%   { transform: perspective(1400px) rotateY(0deg);   transform-origin: left center; opacity: 1;   filter: brightness(1); }
    60%  { opacity: 0.5; filter: brightness(0.7); }
    100% { transform: perspective(1400px) rotateY(-88deg); transform-origin: left center; opacity: 0;   filter: brightness(0.4); }
  }
  @keyframes pageFlipOutBackward {
    0%   { transform: perspective(1400px) rotateY(0deg);  transform-origin: right center; opacity: 1;   filter: brightness(1); }
    60%  { opacity: 0.5; filter: brightness(0.7); }
    100% { transform: perspective(1400px) rotateY(88deg); transform-origin: right center; opacity: 0;   filter: brightness(0.4); }
  }

  .anim-in-forward   { animation: pageFlipInForward   0.42s cubic-bezier(0.25,0.46,0.45,0.94) both; }
  .anim-in-backward  { animation: pageFlipInBackward  0.42s cubic-bezier(0.25,0.46,0.45,0.94) both; }
  .anim-out-forward  { animation: pageFlipOutForward  0.22s cubic-bezier(0.4,0,1,1) both; }
  .anim-out-backward { animation: pageFlipOutBackward 0.22s cubic-bezier(0.4,0,1,1) both; }

  /* Sombra de página en movimiento */
  .page-shadow-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 15;
    opacity: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.18) 0%, transparent 40%);
    animation: shadowSweepForward 0.55s ease-out forwards;
  }
  .page-shadow-overlay.backward {
    background: linear-gradient(to left, rgba(0,0,0,0.18) 0%, transparent 40%);
    animation: shadowSweepBackward 0.55s ease-out forwards;
  }
  @keyframes shadowSweepForward  { 0% { opacity: 0.8; } 100% { opacity: 0; } }
  @keyframes shadowSweepBackward { 0% { opacity: 0.8; } 100% { opacity: 0; } }
</style>
</head>
<body>

<div class="ui-wrapper">

  <!-- TOP BAR -->
  <div class="top-bar">
    <p class="book-title-header">✦ El club del faro ✦</p>

    <!-- Audio controls (visibles al abrir el libro) -->
    <div class="audio-bar" id="audioBar">
      <!-- NARRADOR -->
      <div class="voice-indicator" id="voiceIndicator">
        <span></span><span></span><span></span><span></span>
      </div>
      <span class="audio-label">NARRADOR</span>
      <button class="audio-btn" id="btnVoicePause" title="Pausar/Reanudar narración" onclick="toggleVoicePause()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" id="iconVoicePause">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
      <button class="audio-btn" title="Detener narración" onclick="stopVoice()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="4" y="4" width="16" height="16" rx="1"/>
        </svg>
      </button>

      <div class="audio-divider"></div>

      <!-- MÚSICA -->
      <span class="audio-label">MÚSICA</span>
      <button class="audio-btn" id="btnMusicPause" title="Pausar/Reanudar música" onclick="toggleMusicPause()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" id="iconMusicPause">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
      <button class="audio-btn" title="Silenciar música" onclick="toggleMusic()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" id="iconMusic">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </button>
      <input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.4"
        title="Volumen música" oninput="setMusicVolume(this.value)">
    </div>
  </div>

  <!-- BOOK WRAPPER -->
  <div class="book-wrapper" id="bookWrapper">

    <!-- Pista "Toca para abrir" -->
    <div class="open-hint-badge" id="openHintBadge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      Toca para abrir
    </div>

    <!-- Flechas de navegación -->
    <div class="nav-arrow nav-arrow-left hidden" id="navLeft" onclick="prevPage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </div>
    <div class="nav-arrow nav-arrow-right hidden" id="navRight" onclick="nextPage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </div>

    <!-- Tarjeta libro -->
    <div class="book-card" id="bookCard"></div>
  </div>

  <!-- NAV DOTS -->
  <div class="nav-dots" id="navDots"></div>

</div>

<script>
/* ============================================================
   ░░  CONFIGURACIÓN DE AUDIO  ░░
============================================================ */

const MUSIC_SRC = 'storycard/clubdelfaro.mp3';

/* ============================================================
   ░░  CONFIGURACIÓN DEL LIBRO  ░░
============================================================ */

const pages = [
{
 type:'cover', coverImg:'storycard/clubdelfaro/portada.png', coverMobileImg:'storycard/clubdelfaro/portadamovil.png', title:'El club del faro', author:'De la IA musical'
},
{type:'story',pageNum:1,chapterTitle:'Capítulo 1: La frecuencia silenciosa',illustrationSrc:'storycard/clubdelfaro/imagen1.png',voiceSrc:'storycard/clubdelfaro/voz1.wav',text:`El garaje de Leo en octubre se recordaba por el olor, no por la vista. Olía a estaño frío, a aceite de motor y al café que su padre recalentaba tres veces en la misma taza. Leo tenía catorce años, las manos manchadas de soldadura y una Hallicrafters SX-100 que había rescatado del desguace porque, según el chatarrero, ya no cogía nada. Para Leo eso era una virtud. Las radios que no cogen nada son las que mejor escuchan.
Aquella noche la niebla se colaba por debajo de la puerta. Leo giraba el dial milímetro a milímetro y anotaba cada crujido. A las 3:32 pasó por Radio Coruña, por una emisora de taxis, por un pitido lejano. A las 3:33 la aguja cayó en un hueco entre el 87.9 y el 88.1.
No hubo estática. Hubo un silencio tan limpio que se llevó el zumbido de la nevera, el tictac del reloj y hasta el rumor de la carretera. Leo contuvo la respiración, se oyó el corazón y luego ni eso. Dijo en voz muy baja que no era ruido, que era como si alguien hubiera puesto el mundo en mute.
Marco estaba tumbado sobre un amplificador con los cascos al cuello. Marco no entendía de válvulas. Entendía de pulso. Era el que corría por el espigón al amanecer con el walkman a todo volumen, siempre con la misma cinta, un tema de actualidad que su hermano le había grabado, con un bombo que parecía un motor. Contestó que eso era imposible y le pidió que pusiera algo que vibrara.
Leo conectó el walkman a la radio con un cable pelado. Cuando sonó el arpegio, la aguja muerta vibró. Una vez. Luego otra. Marcaba un latido lento, regular, como un corazón bajo el agua. Leo miró su cuaderno y vio que había escrito 64. Marco subió el volumen sin decir nada. Su tema de actualidad iba exactamente al doble de rápido.
Aquella noche entendieron dos cosas. Que había un silencio que no era ausencia sino presencia. Y que Marco no ponía esa música para animarse, sino para recordarse quién era cuando todo lo demás se callaba.`},
{type:'story',pageNum:2,chapterTitle:'Capítulo 2: El colegio',illustrationSrc:'storycard/clubdelfaro/imagen2.png',voiceSrc:'storycard/clubdelfaro/voz2.wav',text:`Al día siguiente el instituto olía a tiza mojada. La niebla se había metido en el patio y las voces sonaban amortiguadas. En la cola del desayuno tres alumnos de segundo contaban lo mismo sin haberse puesto de acuerdo. Todos se habían despertado a las 3:33 y no oían su propia respiración.
Sofía lo anotó todo con bolígrafo rojo. Era la que subrayaba, la que archivaba, la que pedía fuentes. Murmuró que no podía ser histeria colectiva si ni siquiera se conocían.
Elena no levantó la vista. Abrió su carpeta de dibujo y se podía ver el temblor en sus dedos manchados de carboncillo. Página tras página aparecía el mismo faro apagado, rodeado de espirales negras que se cerraban como un desagüe. En el centro, una figura sin rostro hecha solo de círculos concéntricos. Cuando Leo le preguntó cuándo lo había dibujado, ella respondió que no lo recordaba, que se había acostado a las once y se había despertado a las cuatro con la mano negra y doce páginas llenas, como si alguien le dictara.
Marco pasó la mano por el papel y notó el surco. Dijo que no era un dibujo, que era una grabación, que anoche la radio latía a 64 y que ella estaba copiando esas ondas. Elena cerró la carpeta de golpe, avergonzada, y Sofía escribió en rojo en su libreta dos palabras: Conexión Elena frecuencia.`},
{type:'story',pageNum:3,chapterTitle:'Capítulo 3: El club del faro',illustrationSrc:'storycard/clubdelfaro/imagen3.png',voiceSrc:'storycard/clubdelfaro/voz3.wav',text:`Esa tarde el garaje dejó de ser taller. Sofía trajo chinchetas y un mapa catastral de 1976. Leo soldó una antena de cobre a una percha. Elena colgó sus dibujos con pinzas de la ropa, como radiografías. Marco delimitó el suelo con cinta aislante.
Escribieron dos reglas en un cartón. La primera, que nadie iría solo al faro. La segunda, que todo se registraría, incluso lo que no entendieran. Sofía dijo que si iban a meterse con algo del gobierno, al menos tendrían actas. Marco contestó que no era un juego, que era escuchar más fuerte que ellos. Leo propuso el nombre y todos asintieron. Lo llamarían el club del faro, porque ahí era donde todo dejaba de sonar.
Allí estaban, brindando con latas de cola, sin saber que acababan de fundar una guardia nocturna.`},
{type:'story',pageNum:4,chapterTitle:'Capítulo 4: La biblioteca',illustrationSrc:'storycard/clubdelfaro/imagen4.png',voiceSrc:'storycard/clubdelfaro/voz4.wav',text:`Mientras Leo y Marco probaban bobinas, Sofía bajó al sótano de la biblioteca. Allí la humedad huele a papel viejo. Pidió las actas del puerto entre 1970 y 1985 y doña Amparo volvió con una caja con un sello rojo descolorido que decía Proyecto Eco 1978 Confidencial.
Dentro había fotos de marinos con auriculares enormes sentados dentro del faro, planos que mostraban la torre convertida en una antena de infrasonido para hablar con submarinos, y partes meteorológicos con una anotación al margen: Respuesta a las 03:33. Al fondo, una nota manuscrita con tinta corrida decía que en el día 47 habían recibido respuesta, que no era eco sino imitación, que repetía con retraso de 1,2 segundos y que aprendía.
Sofía lo fotografió todo y corrió al garaje con la niebla calándole los huesos. Les explicó que no querían iluminar, que querían escuchar bajo el mar, y que algo les había contestado desde más abajo. Que lo llamaron Eco porque devolvía lo que oía, pero que no era un rebote. Era algo que aprendía.
Leo abrió su cuaderno en la página del 64. Elena abrió su carpeta en la página de las ondas. Marco puso en pausa su tema de actualidad. Todo encajaba y nada encajaba.`},
{type:'story',pageNum:5,chapterTitle:'Capítulo 5: El corredor',illustrationSrc:'storycard/clubdelfaro/imagen5.png',voiceSrc:'storycard/clubdelfaro/voz5.wav',text:`Marco no durmió esa noche. Puso en la mesa de la cocina el metrónomo de su hermana, el walkman y el cuaderno de Leo. Contó el latido de la frecuencia silenciosa. Sesenta y cuatro golpes por minuto, exactos como un reloj enfermo. Puso su tema de actualidad: ciento veintiocho. El doble. Perfecto.
A las cinco de la mañana llamó al timbre de Leo y escribió dos números en la pizarra del garaje: 64 y 128. Les dijo que la frecuencia silenciosa latía a 64, que su tema de actualidad iba a 128, que era el doble exacto y que si la tocaban al revés se cancelarían. Leo le preguntó si quería usar una canción para cerrar una puerta y Marco contestó que no, que quería usarla para que lo que estuviera al otro lado bailara y se delatara.
Leo lo miró y entendió. Marco no tenía radio como él, ni visiones como Elena, ni archivos como Sofía. Lo que tenía era ritmo. Para él ser un corredor no era ganar. Era mantener el pulso cuando todo lo demás se quedaba en silencio, seguir corriendo aunque no hubiera meta, solo para que el corazón no se olvidara de latir.
Grabaron el tema de actualidad al revés. La cinta chirrió y cuando la pusieron en la Hallicrafters la aguja se quedó clavada en el punto muerto y luego tembló, como un animal que oye un silbato que los humanos no oyen. El silencio había respondido.`},
{type:'story',pageNum:6,chapterTitle:'Capítulo 6: El faro',illustrationSrc:'storycard/clubdelfaro/imagen6.png',voiceSrc:'storycard/clubdelfaro/voz6.wav',text:`Subieron al faro el sábado con la marea baja. La niebla les llegaba a las rodillas. La puerta principal estaba soldada desde el 83, pero Leo había encontrado una trampilla en los planos del Proyecto Eco.
Dentro olía a hierro oxidado. La escalera devolvía cada paso multiplicado. Arriba la sala de lámparas estaba vacía, pero la sala de máquinas vibraba aunque el generador llevaba muerto cuarenta años.
Elena puso la palma en la pared de acero y la retiró como si quemara. Dijo que allí no había luz porque no la necesitaban, que allí escuchaban. Leo preguntó quiénes.
Conectó la radio a la antena central con pinzas de cocodrilo y giró al punto muerto. El silencio salió por los altavoces y llenó la torre. Luego llegó una voz que no era voz, era el recuerdo de una voz con el mismo retraso de 1,2 segundos de la nota. Dijo una sola palabra: Devuélvanme.
No era una amenaza. Era una petición hecha con sus propias frecuencias mezcladas. Un frío helado bajaba por la nuca de los cuatro. No estaban solos. Nunca lo habían estado.`},
{type:'story',pageNum:7,chapterTitle:'Capítulo 7: El Vacío',illustrationSrc:'storycard/clubdelfaro/imagen7.png',voiceSrc:'storycard/clubdelfaro/voz7.wav',text:`La pared del fondo no se abrió. Se hizo menos. Un rectángulo de silencio tan denso que podías entrar en él como en agua negra. Al otro lado no había monstruos. Estaba Puerto Sombrío al revés, sin color, con las gaviotas congeladas a medio grito y las farolas apagadas por dentro. Flotando en el aire había frases a medio decir, como polvo.
Elena dio dos pasos dentro y volvió llorando. Se arrodilló y dibujó frenética con una tiza. Les explicó entre sollozos que no estaba vacío, que estaba lleno de todo lo que no habían dicho, de cada "te quiero" tragado y cada "lo siento" que no salió; que por eso dibujaba, que nadie le dictaba, que se lo enseñaban. Sofía le susurró que por eso la elegía a ella, porque era la única que sabía traducirlo.
Sofía comparó el dibujo con la foto del Proyecto Eco. Las espirales de Elena eran idénticas a las ondas de infrasonido del plano. Quedaba claro entonces que Elena no estaba enferma. Estaba sintonizada desde antes de que Leo encontrara la frecuencia.`},
{type:'story',pageNum:8,chapterTitle:'Capítulo 8: El origen',illustrationSrc:'storycard/clubdelfaro/imagen8.png',voiceSrc:'storycard/clubdelfaro/voz8.wav',text:`Con la linterna roja entre los dientes, Sofía leyó el resto del informe. Contaba que en el día 62 el operador se quitó los auriculares y siguió oyendo el mar dentro de su cabeza durante tres días, y que en el día 71 dieron orden de cierre, de tapiar la sala y de informar a la población de una avería eléctrica.
El eco de su voz rebotó en el metal. Marco dijo que no lo habían cerrado, que solo habían bajado el volumen. Leo añadió que ellos lo habían vuelto a subir con la antena.
Elena seguía dibujando. Ahora se dibujaba a los cuatro dentro del faro, con cables saliendo de sus pechos hacia la antena. Marco puso la mano sobre el walkman y comprendió que su tema de actualidad no era un capricho. Era la única cosa humana, imperfecta, con tempo variable, que el Eco no podía imitar bien. Porque el Eco copiaba, pero no sentía el cansancio de correr.`},
{type:'story',pageNum:9,chapterTitle:'Capítulo 9: El Eco sin rostro',illustrationSrc:'storycard/clubdelfaro/imagen9.png',voiceSrc:'storycard/clubdelfaro/voz9.wav',text:`Salió del centro del Vacío cuando Leo subió la ganancia. No tenía cara porque estaba hecho de todas las frecuencias que faltaban. Cada paso absorbía el sonido de sus zapatillas.
Se presentó diciendo que era el lugar donde caen las palabras que no dijiste. Leo le preguntó qué quería y contestó que salir, que ellos habían abierto y que ellos eran la puerta.
En ese instante el tiempo pareció detenerse. Leo descubre. Elena traduce. Sofía explica. Marco corre. No eran investigadores. Eran la cerradura.
Elena se puso delante de la criatura y por primera vez en meses no dibujó. Habló con la voz rota y le dijo que no, que lo había visto cada noche en sus dibujos, que no quería salir, que quería que lo escucharan para dejar de estar solo, que por eso imitaba.
La criatura se detuvo. En su superficie lisa apareció un segundo el reflejo borroso de los cuatro, como en agua turbia. No era amenaza. Era soledad aprendida.`},
{type:'story',pageNum:10,chapterTitle:'Capítulo 10: Cerrar sin olvidar',illustrationSrc:'storycard/clubdelfaro/imagen10.png',voiceSrc:'storycard/clubdelfaro/voz10.wav',text:`No podían destruir la frecuencia. Era parte del pueblo como la niebla. Entendieron que el Vacío no se alimentaba de ruido sino de su ausencia, que gritarle era inútil porque se tragaba el grito. Lo que sí podían hacer era darle un ritmo tan constante y tan humano que no supiera copiarlo sin cansarse.
Marco propuso cancelar la frecuencia con su tema de actualidad invertido mientras Leo transmitía en la silenciosa, para crear un nudo, no un cierre, sino una amarra. Sofía preguntó qué pasaría si volvía a soltarse y Leo contestó que entonces estarían allí, que el club del faro no era para cazar monstruos sino para vigilar el silencio.
Conectaron la Hallicrafters al viejo transmisor. Marco lanzó su tema de actualidad al revés. Era como ponerle un metrónomo a un fantasma, obligarlo a llevar el compás en vez de robarte el tuyo. El bombo a 128 invertido chocaba contra el latido de 64 y lo ataba. Elena colocó sus dibujos sobre la bobina como si fueran partitura, para que el Eco viera que alguien lo había entendido. Leo habló al micrófono, no al Vacío sino a sus amigos, y dejó grabado que si alguien los escuchaba al otro lado supiera que no estaban en venta, que si querían compañía aprendieran a tocar la puerta.
La frecuencia silenciosa gritó una vez, un quejido agudo que recorrió la torre, y luego se plegó sobre sí misma como una vela que se apaga. El Eco retrocedió, no derrotado sino contenido, como una nota sostenida que vuelve al compás.
El faro no se encendió. No hacía falta luz.
Bajaron entre la niebla agotados. En el garaje la radio quedó sintonizada en el punto muerto, vigilando, con el piloto rojo encendido. En la libreta de Elena el último dibujo ya no era el faro apagado. Era el faro con cuatro siluetas dentro escuchando, y fuera la niebla retrocediendo un metro.
Sofía dijo que mañana había clase. Marco contestó que mañana volverían a ensayar. Leo añadió que a las 3:33, por si el silencio volvía a respirar.
No lo decía como un héroe. Lo decía como un entrenamiento. Todo cobraba sentido al entender lo que Marco supo desde el principio. No era una historia sobre velocidad. Era sobre alguien que sigue corriendo aunque la única carrera sea quedarse despierto para que los demás puedan dormir.
Y Puerto Sombrío siguió sin aparecer en los mapas nuevos. Pero ahora, cada madrugada a las 3:33, si pegabas la oreja al suelo del espigón, podías oír muy lejos, bajo la niebla, un bombo latiendo al revés. El club del faro estaba de guardia.`},

// ── AUDIO ENGINE ────────────────────────────────────────────
const musicAudio  = new Audio();
musicAudio.loop   = true;
musicAudio.volume = 0.4;
if (MUSIC_SRC) musicAudio.src = MUSIC_SRC;

let voiceAudio   = null;
let voicePaused  = false;
let musicMuted   = false;
let musicPaused  = false;
let bookOpened   = false;

function startMusic() {
  if (!MUSIC_SRC || musicMuted) return;
  musicAudio.currentTime = 0;
  musicAudio.play().catch(() => {});
  updateMusicPauseIcon(true);
}

function stopAllAudio() {
  if (voiceAudio) { voiceAudio.pause(); voiceAudio.currentTime = 0; }
  voicePaused = false;
  setVoiceIndicator(false);
  updateVoicePauseIcon(false);
}

function playPageVoice(src) {
  stopAllAudio();
  if (!src) return;
  voiceAudio = new Audio(src);
  voiceAudio.volume = 1;
  voiceAudio.play().catch(() => {});
  voiceAudio.onplay  = () => { setVoiceIndicator(true);  updateVoicePauseIcon(true); };
  voiceAudio.onended = () => { setVoiceIndicator(false); updateVoicePauseIcon(false); voicePaused = false; };
  voiceAudio.onpause = () => { setVoiceIndicator(false); };
}

function setVoiceIndicator(playing) {
  const el = document.getElementById('voiceIndicator');
  if (el) el.className = 'voice-indicator' + (playing ? ' playing' : '');
}

function updateVoicePauseIcon(isPlaying) {
  const icon = document.getElementById('iconVoicePause');
  if (!icon) return;
  icon.innerHTML = isPlaying
    ? `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`
    : `<polygon points="5 3 19 12 5 21 5 3"/>`;
}

function toggleVoicePause() {
  if (!voiceAudio) return;
  if (voicePaused) {
    voiceAudio.play().catch(() => {});
    voicePaused = false;
    setVoiceIndicator(true);
    updateVoicePauseIcon(true);
  } else {
    voiceAudio.pause();
    voicePaused = true;
    setVoiceIndicator(false);
    updateVoicePauseIcon(false);
  }
}

function stopVoice() {
  if (voiceAudio) {
    voiceAudio.pause();
    voiceAudio.currentTime = 0;
    voicePaused = false;
    setVoiceIndicator(false);
    updateVoicePauseIcon(false);
  }
}

// ── MÚSICA: pausa dedicada ───────────────────────────────────
function updateMusicPauseIcon(isPlaying) {
  const icon = document.getElementById('iconMusicPause');
  if (!icon) return;
  icon.innerHTML = isPlaying
    ? `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`
    : `<polygon points="5 3 19 12 5 21 5 3"/>`;
}

function toggleMusicPause() {
  if (musicMuted) return;
  if (musicPaused) {
    musicAudio.play().catch(() => {});
    musicPaused = false;
    updateMusicPauseIcon(true);
  } else {
    musicAudio.pause();
    musicPaused = true;
    updateMusicPauseIcon(false);
  }
}

function setMusicVolume(val) {
  musicAudio.volume = parseFloat(val);
  if (parseFloat(val) === 0) {
    musicMuted = true;
    document.getElementById('iconMusic').innerHTML =
      `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
       <line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/>`;
    musicAudio.pause();
    updateMusicPauseIcon(false);
  } else if (musicMuted) {
    musicMuted = false;
    document.getElementById('iconMusic').innerHTML =
      `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>`;
    musicAudio.play().catch(() => {});
    updateMusicPauseIcon(true);
  }
}

function toggleMusic() {
  musicMuted = !musicMuted;
  const icon   = document.getElementById('iconMusic');
  const slider = document.getElementById('musicVolume');
  if (musicMuted) {
    musicAudio.pause();
    musicPaused = false;
    icon.innerHTML = `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      <line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/>`;
    if (slider) slider.value = 0;
    updateMusicPauseIcon(false);
  } else {
    musicAudio.volume = 0.4;
    musicAudio.play().catch(() => {});
    icon.innerHTML = `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>`;
    if (slider) slider.value = 0.4;
    updateMusicPauseIcon(true);
  }
}

// ── STATE ────────────────────────────────────────────────────
let currentPage = 0;
let animating   = false;

const bookCard  = document.getElementById('bookCard');
const navDotsEl = document.getElementById('navDots');
const navLeft   = document.getElementById('navLeft');
const navRight  = document.getElementById('navRight');

// Drop cap helper
function withDropCap(text) {
  const t = text.trimStart();
  if (!t.length) return text;
  return `<span class="drop-cap">${t.charAt(0)}</span>${t.slice(1)}`;
}

// ── NAV DOTS ────────────────────────────────────────────────
function buildDots() {
  navDotsEl.innerHTML = '';
  pages.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentPage ? ' active' : '');
    d.onclick = () => goToPage(i);
    navDotsEl.appendChild(d);
  });
}

// ── UPDATE NAV ARROWS ────────────────────────────────────────
function updateArrows() {
  const p = pages[currentPage];
  navLeft.classList.toggle('hidden',  !bookOpened || currentPage <= 0);
  navRight.classList.toggle('hidden', !bookOpened || p.type === 'end' || currentPage >= pages.length - 1);
}

// ── BUILD PAGE ELEMENT ──────────────────────────────────────
function buildPageElement(p) {
  const el = document.createElement('div');

  if (p.type === 'cover') {
    el.className = 'cover-page';

    // DETECTAR SI ES MÓVIL (Ancho menor o igual a 767px)
    const isMobile = window.innerWidth <= 767;
    const imgSrc = (isMobile && p.coverMobileImg) ? p.coverMobileImg : p.coverImg;

    el.innerHTML = imgSrc
      ? `<img src="${imgSrc}" alt="Portada: ${p.title}">`
      : `<div class="cover-bg-placeholder">⚔️</div>`;
    el.innerHTML += `
      <div class="cover-overlay">
        <h1>${p.title}</h1>
        <p class="author">${p.author}</p>
      </div>`;
    el.onclick = openBook;

  } else if (p.type === 'end') {
    el.className = 'end-page';
    el.innerHTML = `
      <div class="end-page-content">
        <div class="ornament">✦ ✦ ✦</div>
        <h2>Fin de la historia</h2>
        <p>LaIAmusical</p>
        <button class="back-btn" onclick="goToPage(0)">Volver al inicio</button>
      </div>`;
    stopAllAudio();

  } else {
    const imgHtml = p.illustrationSrc
      ? `<img src="${p.illustrationSrc}" alt="${p.chapterTitle || 'Ilustración página ' + p.pageNum}">`
      : `<div class="img-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 15l5-5 4 4 3-3 6 6"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
          </svg>
         </div>`;

    el.className = 'story-page';
    el.innerHTML = `
      <div class="page-illustration">${imgHtml}</div>
      <div class="page-text-section">
        <div class="chapter-label">${p.chapterTitle || `Capítulo ${p.pageNum}`}</div>
        <div class="page-text"><p>${withDropCap(p.text)}</p></div>
        <div class="page-number">${p.pageNum}</div>
      </div>
      <div class="swipe-hint">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
        Desliza para pasar
      </div>`;
  }

  return el;
}

// ── RENDER ──────────────────────────────────────────────────
function renderBook(direction) {
  const p = pages[currentPage];

  // Actualizar título en header
  const headerTitle = p.type === 'cover'
    ? p.title
    : p.type === 'end'
      ? 'Fin de la historia'
      : (p.chapterTitle || `Capítulo ${p.pageNum}`);
  const headerEl = document.querySelector('.book-title-header');
  if (headerEl) headerEl.textContent = headerTitle;

  const newEl = buildPageElement(p);

  if (direction && bookOpened) {
    const inClass  = direction === 'forward' ? 'anim-in-forward'  : 'anim-in-backward';
    const outClass = direction === 'forward' ? 'anim-out-forward' : 'anim-out-backward';

    newEl.style.position = 'absolute';
    newEl.style.inset    = '0';
    newEl.style.zIndex   = '2';

    const oldEl = bookCard.firstElementChild;
    if (oldEl && !oldEl.classList.contains('page-shadow-overlay')) {
      oldEl.style.position = 'absolute';
      oldEl.style.inset    = '0';
      oldEl.style.zIndex   = '1';
      oldEl.classList.add(outClass);
    }

    const shadow = document.createElement('div');
    shadow.className = 'page-shadow-overlay' + (direction === 'backward' ? ' backward' : '');
    shadow.style.zIndex = '5';
    bookCard.appendChild(shadow);

    setTimeout(() => {
      bookCard.appendChild(newEl);
      newEl.classList.add(inClass);
    }, 80);

    setTimeout(() => {
      while (bookCard.children.length > 1) bookCard.removeChild(bookCard.firstChild);
      newEl.style.position = '';
      newEl.style.inset    = '';
      newEl.style.zIndex   = '';
    }, 520);

  } else {
    bookCard.innerHTML = '';
    bookCard.appendChild(newEl);
  }

  buildDots();
  updateArrows();
}

// ── OPEN BOOK ────────────────────────────────────────────────
function openBook() {
  if (!bookOpened) {
    bookOpened = true;
    document.getElementById('openHintBadge').classList.add('hidden');
    document.getElementById('audioBar').classList.add('visible');
    startMusic();
  }
  nextPage();
}

// ── NAVIGATION ──────────────────────────────────────────────
function nextPage() {
  if (currentPage < pages.length - 1) goToPage(currentPage + 1, 'forward');
}
function prevPage() {
  if (currentPage > 0) goToPage(currentPage - 1, 'backward');
}

function goToPage(target, dir) {
  if (animating || target === currentPage || target < 0 || target >= pages.length) return;
  const forward = dir ? dir === 'forward' : target > currentPage;
  animating = true;
  stopAllAudio();
  currentPage = target;
  renderBook(forward ? 'forward' : 'backward');
  setTimeout(() => {
    animating = false;
    const p = pages[currentPage];
    if (p && p.voiceSrc) playPageVoice(p.voiceSrc);
  }, 540);
}

// ── SWIPE GESTURES ───────────────────────────────────────────
let touchStartX = 0;
let touchStartY = 0;

bookCard.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

bookCard.addEventListener('touchend', e => {
  if (!bookOpened) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) * 1.2 && Math.abs(dx) > 45) {
    if (dx < 0) nextPage();
    else        prevPage();
  }
}, { passive: true });

// ── KEYBOARD ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextPage();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prevPage();
});

// ── INIT ─────────────────────────────────────────────────────
renderBook();
</script>

<script>
(function () {
    // Asegura que el viewport respete el "notch"/barra de gestos en iPhone,
    // para que env(safe-area-inset-bottom) funcione aunque la página no
    // tuviera viewport-fit=cover configurado en su <meta viewport>.
    var vp = document.querySelector('meta[name="viewport"]');
    if (vp && vp.content.indexOf('viewport-fit') === -1) {
        vp.content = vp.content + ', viewport-fit=cover';
    } else if (!vp) {
        var m = document.createElement('meta');
        m.name = 'viewport';
        m.content = 'width=device-width, initial-scale=1.0, viewport-fit=cover';
        document.head.appendChild(m);
    }

    var returnUrl   = sessionStorage.getItem('lastRoomUrl');
    var returnTopic = sessionStorage.getItem('lastRoomTopicLabel') || sessionStorage.getItem('lastRoomTopic');
    var btn   = document.getElementById('backToRoomBtn');
    var label = document.getElementById('backToRoomLabel');

    // Solo mostrar el botón si llegamos aquí desde reproductor.html
    if (returnUrl) {
        btn.style.display = 'flex';
        if (returnTopic) {
            label.textContent = 'Volver a ' + returnTopic;
        }
    }

    window.goBackToRoom = function () {
        window.location.href = returnUrl || 'reproductor.html';
    };
})();
</script>
