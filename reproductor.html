        /* Estilo para el botón de play en el centro de la carta */
        .play-btn-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(72, 187, 120, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s ease;
            cursor: pointer;
            z-index: 10;
        }
        .song-card:hover .play-btn-overlay {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }
        .play-btn-overlay i {
            color: white;
            font-size: 24px;
            margin-left: 3px;
        }
        .song-card {
            position: relative;
            overflow: hidden;
        }
        .progress-bar-custom {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: #475569;
            outline: none;
            border-radius: 2px;
        }
        .progress-bar-custom::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #14b8a6;
            cursor: pointer;
            border-radius: 50%;
        }
        .progress-bar-custom::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #14b8a6;
            cursor: pointer;
            border-radius: 50%;
            border: none;
        }
    </style>

        /**
         * Calcula el próximo lunes a medianoche.
         */
        function getNextMondayMidnight() {
            const now = new Date();
            const dayOfWeek = now.getDay(); // 0 = Domingo, 1 = Lunes, ...
            const daysUntilMonday = dayOfWeek === 0 ? 1 : 8 - dayOfWeek;
            const nextMonday = new Date(now.getTime() + daysUntilMonday * DAY_IN_MS);
            nextMonday.setHours(0, 0, 0, 0); // Medianoche
            return Timestamp.fromDate(nextMonday);
        }

        /**
         * Inicializa las estrellas de las canciones usando datos reales de Firestore.
         * Es llamada una sola vez después de que el usuario se autentique.
         */
        async function initializeRankingStars() {
            try {
                console.log("Inicializando puntuación de canciones desde Firestore...");
                const songsRef = collection(db, 'songs');
                const songDocs = await getDocs(songsRef);
                
                if (!songDocs.empty) {
                    songDocs.forEach((doc) => {
                        const firestoreData = doc.data();
                        const songId = parseInt(doc.id);
                        
                        // Buscar la canción en el array local
                        const localSong = songs.find(s => s.id === songId);
                        if (localSong) {
                            localSong.totalStars = firestoreData.totalStars || 0;
                            console.log(`Canción ${localSong.title}: ${localSong.totalStars} estrellas`);
                        }
                    });
                } else {
                    console.log("No hay datos de canciones en Firestore. Usando valores predeterminados (0).");
                }
            } catch (error) {
                console.error("Error al cargar estrellas desde Firestore:", error);
            }
        }
        window.initializeRankingStars = initializeRankingStars;

        /**
         * Carga los datos del usuario desde Firestore, aplica la lógica de reseteo diario/semanal
         * y los sincroniza con las variables de estado locales.
         */
        async function loadUserData() {
            if (!currentUserId) return;
            try {
                console.log("Cargando datos de usuario...");
                const userRef = doc(db, 'users', currentUserId);
                const docSnap = await getDoc(userRef);
                const now = Timestamp.now();
                const nowTime = now.toMillis();
                const updateData = {}; // Objeto para almacenar los cambios a guardar en Firebase
                
                // Si el documento no existe, crear uno con valores iniciales
                if (!docSnap.exists()) {
                    console.log("Creando documento de usuario inicial...");
                    await setDoc(userRef, {
                        userStars: 0,
                        userDiamonds: 0,
                        userCoins: 0,
                        votesRemaining: maxVotes,
                        quizLog: {},
                        voteLog: {},
                        lastQuizLogResetDate: now,
                        weeklyVotesResetDate: getNextMondayMidnight(),
                        lastVoteLogResetDate: now,
                        createdAt: now
                    });
                    // Recargar después de crear
                    return loadUserData();
                }

                const data = docSnap.data();
                // 1. CARGA INICIAL DE DATOS
                userStars = data.userStars || 0;
                userDiamonds = data.userDiamonds || 0;
                userCoins = data.userCoins || 0;
                votesRemaining = data.votesRemaining !== undefined ? data.votesRemaining : maxVotes;
                userQuizLog = data.quizLog || {};
                userVoteLog = data.voteLog || {};
                // 2. MONEDAS DIARIAS AHORA SE MANEJAN SOLO DESDE PERFIL.HTML
                // No hay lógica automática de monedas diarias en el reproductor
                // 3. LÓGICA DE RESET SEMANAL DE QUIZ LOG
                const lastQuizLogReset = data.lastQuizLogResetDate ? data.lastQuizLogResetDate.toDate().getTime() : 0;
                if (nowTime - lastQuizLogReset >= WEEK_IN_MS) {
                    console.log("Reiniciando quiz log semanal...");
                    userQuizLog = {};
                    updateData.quizLog = {};
                    updateData.lastQuizLogResetDate = now;
                }
                // 4. LÓGICA DE RESET SEMANAL DE VOTOS
                const weeklyVotesResetDate = data.weeklyVotesResetDate ? data.weeklyVotesResetDate.toDate().getTime() : 0;
                if (nowTime >= weeklyVotesResetDate) {
                    console.log("Reiniciando votos semanales...");
                    votesRemaining = maxVotes;
                    userVoteLog = {};
                    updateData.votesRemaining = maxVotes;
                    updateData.voteLog = {};
                    updateData.lastVoteLogResetDate = now;
                    updateData.weeklyVotesResetDate = getNextMondayMidnight();
                }
                // 5. ACTUALIZAR FIREBASE SI HAY CAMBIOS
                if (Object.keys(updateData).length > 0) {
                    console.log("Actualizando datos de reseteo en Firebase...", updateData);
                    await updateDoc(userRef, updateData);
                }
                console.log("Estado del usuario actualizado:", {
                    userStars, userDiamonds, userCoins, votesRemaining,
                    quizLogCount: Object.keys(userQuizLog).length,
                    voteLogCount: Object.keys(userVoteLog).length
                });
                // Actualizar UI
                updateHeaderDisplays();
                
            } catch (error) {
                console.error('Error al cargar datos de usuario:', error);
                console.log("Error de conexión. Usando valores predeterminados.");
            }
        }
        window.loadUserData = loadUserData;

        // --- 7. LÓGICA DEL REPRODUCTOR (Ahora con funcionalidad de audio) ---
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }
        // Inicializar el reproductor de audio y sus listeners
        function setupAudioPlayer() {
            // Reproducir/Pausar
            playPauseBtn = document.getElementById('playPauseBtn');
            progressBar = document.querySelector('.progress-bar-custom');
            currentTimeDisplay = document.getElementById('currentTimeDisplay');
            durationDisplay = document.getElementById('durationDisplay');
            volumeControl = document.getElementById('volumeControl');
            
            if (playPauseBtn) {
                playPauseBtn.onclick = togglePlayPause;
            }
            
            // Actualizar progreso
            currentAudio.ontimeupdate = () => {
                if (progressBar && currentAudio.duration) {
                    const progress = (currentAudio.currentTime / currentAudio.duration) * 100;
                    progressBar.value = progress;
                }
                if (currentTimeDisplay) {
                    currentTimeDisplay.textContent = formatTime(currentAudio.currentTime);
                }
            };
            
            // Fin de la canción
            currentAudio.onended = () => {
                isPlaying = false;
                if (playPauseBtn) {
                    playPauseBtn.innerHTML = '<i class="fas fa-play text-xs"></i>';
                }
            };
            
            // Carga de metadatos (para obtener duración)
            currentAudio.onloadedmetadata = () => {
                if (durationDisplay) {
                    durationDisplay.textContent = formatTime(currentAudio.duration);
                }
            };
            
            // Control de barra de progreso (arrastrar)
            if (progressBar) {
                progressBar.onchange = () => {
                    if (currentAudio.duration) {
                        currentAudio.currentTime = (progressBar.value / 100) * currentAudio.duration;
                    }
                };
            }
            
            // Control de volumen
            if (volumeControl) {
                volumeControl.onchange = () => {
                    currentAudio.volume = volumeControl.value / 100;
                };
            }
        }

        function togglePlayPause() {
            if (isPlaying) {
                pauseSong();
            } else {
                if (currentSongId) {
                    resumeSong();
                }
            }
        }

        function playSong(songId) {
            const song = songs.find(s => s.id === songId);
            if (!song) return;
            
            // Si hay una canción reproduciéndose, pararla
            if (currentSongId !== songId) {
                currentAudio.pause();
                currentAudio.src = song.audio;
                currentAudio.load();
                currentSongId = songId;
                
                // Actualizar info del reproductor en el pie de página
                const playerCover = document.getElementById('playerCover');
                const playerTitle = document.getElementById('playerTitle');
                const playerAuthor = document.getElementById('playerAuthor');
                
                if (playerCover) playerCover.style.backgroundImage = `url('${song.cover}')`;
                if (playerTitle) playerTitle.textContent = song.title;
                if (playerAuthor) playerAuthor.textContent = song.author;
            }
            
            currentAudio.play();
            isPlaying = true;
            if (playPauseBtn) {
                playPauseBtn.innerHTML = '<i class="fas fa-pause text-xs"></i>';
            }
        }

        function pauseSong() {
            currentAudio.pause();
            isPlaying = false;
            if (playPauseBtn) {
                playPauseBtn.innerHTML = '<i class="fas fa-play text-xs"></i>';
            }
        }

        function resumeSong() {
            currentAudio.play();
            isPlaying = true;
            if (playPauseBtn) {
                playPauseBtn.innerHTML = '<i class="fas fa-pause text-xs"></i>';
            }
        }

        // Nueva función para reproducir desde la carta
        function playFromCard(songId) {
            playSong(songId);
        }

        // --- 9. QUIZ ---
        function startQuiz(songId) {
            const song = songs.find(s => s.id === songId);
            if (!song || !song.quiz) {
                console.error("Error: Canción no encontrada o sin quiz.");
                return;
            }
            
            // Reset variables del quiz
            activeQuizSongId = songId;
            currentQuestionIndex = 0;
            correctQuizAnswers = 0;
            
            // Mostrar modal del quiz
            document.getElementById('quizModal').classList.remove('hidden');
            document.getElementById('quizModal').classList.add('flex');
            renderQuizQuestion(0);
        }
        window.startQuiz = startQuiz;

        function renderQuizQuestion(questionIndex) {
            const song = songs.find(s => s.id === activeQuizSongId);
            if (!song || !song.quiz[questionIndex]) return;
            
            const currentQ = song.quiz[questionIndex];
            const totalQuestions = song.quiz.length;
            
            // Actualizar contenido del modal
            document.getElementById('quizSongTitle').textContent = song.title;
            document.getElementById('quizProgress').textContent = `Pregunta ${questionIndex + 1} de ${totalQuestions}`;
            document.getElementById('quizQuestion').textContent = currentQ.q;
            
            // Renderizar opciones
            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';
            
            currentQ.a.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'quiz-option w-full text-left p-3 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors';
                button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
                button.onclick = () => selectAnswer(index);
                optionsContainer.appendChild(button);
            });
            
            // Reset feedback y botón
            document.getElementById('quizFeedback').classList.add('hidden');
            const btn = document.getElementById('verifyAnswerButton');
            btn.textContent = 'Verificar Respuesta';
            btn.onclick = verifyAnswer;
            btn.disabled = true;
        }

        function selectAnswer(optionIndex) {
            // Remover selección previa
            document.querySelectorAll('.quiz-option').forEach(opt => {
                opt.classList.remove('bg-blue-600', 'bg-slate-600');
                opt.classList.add('bg-slate-700');
            });
            
            // Marcar la opción seleccionada
            const selectedOption = document.querySelectorAll('.quiz-option')[optionIndex];
            selectedOption.classList.remove('bg-slate-700');
            selectedOption.classList.add('bg-blue-600');
            
            // Habilitar el botón
            document.getElementById('verifyAnswerButton').disabled = false;
            
            // Guardar la respuesta seleccionada
            window.selectedAnswerIndex = optionIndex;
        }

        function verifyAnswer() {
            if (window.selectedAnswerIndex === undefined) return;
            
            const song = songs.find(s => s.id === activeQuizSongId);
            const currentQ = song.quiz[currentQuestionIndex];
            const isCorrect = window.selectedAnswerIndex === currentQ.correct;
            
            if (isCorrect) {
                correctQuizAnswers++;
            }
            
            // Mostrar feedback
            const feedbackDiv = document.getElementById('quizFeedback');
            const feedbackText = document.getElementById('quizFeedbackText');
            
            if (isCorrect) {
                feedbackText.textContent = "¡Correcto! 🎉";
                feedbackText.className = "text-lg font-semibold text-green-400";
            } else {
                feedbackText.textContent = "Incorrecto. La respuesta correcta es: " + currentQ.a[currentQ.correct];
                feedbackText.className = "text-lg font-semibold text-red-400";
            }
            feedbackDiv.classList.remove('hidden');
            
            // Para la última pregunta, finalizar automáticamente después de 1.5s
            if (currentQuestionIndex === song.quiz.length - 1) {
                setTimeout(() => submitQuiz(), 1500);
            } else {
                // Cambiar botón a Siguiente
                const btn = document.getElementById('verifyAnswerButton');
                btn.textContent = `Siguiente Pregunta (${currentQuestionIndex + 2}/${song.quiz.length})`;
                btn.onclick = nextQuestion;
            }
        }
        
        function nextQuestion() {
            currentQuestionIndex++;
            renderQuizQuestion(currentQuestionIndex);
        }
        
        async function submitQuiz() {
            if (!currentUserId) return;
            const score = correctQuizAnswers;
            const song = songs.find(s => s.id === activeQuizSongId);
            const userRef = doc(db, 'users', currentUserId);
            
            // 1. Calcular recompensas (Sistema actualizado)
            const starsEarned = score * 5; // 5 estrellas por respuesta correcta
            
            let diamondsEarned = 0;
            let bonusStars = 0;
            
            if (score >= 5) {
                // Acertando 5+ preguntas: 1 diamante + 10 estrellas bonus
                diamondsEarned += 1;
                bonusStars += 10;
            }
            
            if (score === 7) {
                // Acertando todas (7/7): el doble (1 diamante + 10 estrellas bonus adicionales)
                diamondsEarned += 1; // +1 diamante adicional = 2 total
                bonusStars += 10; // +10 estrellas adicionales = 20 total de bonus
            }
            
            const totalStarsGained = starsEarned + bonusStars;
            
            // 2. Actualizar estado local (Optimista)
            userStars += totalStarsGained;
            userDiamonds += diamondsEarned;
            
            // Registrar información detallada del quiz para perfil.html
            userQuizLog[song.id] = {
                completed: true,
                score: score,
                stars: totalStarsGained,
                diamonds: diamondsEarned,
                timestamp: new Date().toISOString()
            };
            
            // 3. Cerrar modal inmediatamente y mostrar recompensas (UI optimista)
            closeQuizModal();
            updateHeaderDisplays();
            renderRanking();

            // Mostrar mensaje de recompensas
            let rewardMsg = `¡Quiz completado!\\n\\n`;
            rewardMsg += `📊 Puntuación: ${score}/7\\n`;
            rewardMsg += `⭐ Estrellas ganadas: ${totalStarsGained}\\n`;
            if (diamondsEarned > 0) {
                rewardMsg += `💎 Diamantes ganados: ${diamondsEarned}\\n`;
            }
            alert(rewardMsg);

            // 4. Actualizar datos en Firebase (en background)
            try {
                await updateDoc(userRef, {
                    userStars: userStars,
                    userDiamonds: userDiamonds,
                    quizLog: userQuizLog
                });
                console.log("Quiz guardado en Firebase correctamente");
            } catch (error) {
                console.error('Error al guardar quiz en Firebase:', error);
            }
        }
        window.submitQuiz = submitQuiz;

        function closeQuizModal() {
            document.getElementById('quizModal').classList.add('hidden');
            document.getElementById('quizModal').classList.remove('flex');
            // Reset
            activeQuizSongId = null;
            window.selectedAnswerIndex = undefined;
        }
        window.closeQuizModal = closeQuizModal;

        // --- 10. VOTOS ---
        function openVoteModal(songId) {
            const song = songs.find(s => s.id === songId);
            if (!song) return;
            
            selectedSongIdForVote = songId;
            selectedStarsForVote = 1; // Default
            
            // Actualizar contenido del modal
            document.getElementById('voteSongTitle').textContent = song.title;
            document.getElementById('voteStarsDisplay').textContent = selectedStarsForVote;
            
            // Reset slider
            document.getElementById('starsRange').value = 1;
            
            // Mostrar modal
            document.getElementById('voteModal').classList.remove('hidden');
            document.getElementById('voteModal').classList.add('flex');
        }
        window.openVoteModal = openVoteModal;

        function updateVoteStars(value) {
            selectedStarsForVote = parseInt(value);
            document.getElementById('voteStarsDisplay').textContent = selectedStarsForVote;
        }
        window.updateVoteStars = updateVoteStars;

        async function submitVote() {
            if (!currentUserId || !selectedSongIdForVote || selectedStarsForVote < 1) return;
            
            // Verificar que el usuario tenga votos disponibles
            if (votesRemaining <= 0) {
                alert("No tienes votos restantes esta semana.");
                return;
            }
            
            const songRef = doc(db, 'songs', selectedSongIdForVote.toString());
            const userRef = doc(db, 'users', currentUserId);
            
            // 1. Actualizar estado local inmediatamente (UI optimista)
            votesRemaining--;
            userVoteLog[selectedSongIdForVote] = {
                stars: selectedStarsForVote,
                timestamp: new Date().toISOString()
            };
            
            // Actualizar totalStars local
            const localSong = songs.find(s => s.id === selectedSongIdForVote);
            if (localSong) {
                localSong.totalStars += selectedStarsForVote;
            }
            
            // 2. Cerrar modal y actualizar UI inmediatamente
            closeVoteModal();
            updateHeaderDisplays();
            renderRanking();
            
            // Mostrar mensaje de confirmación
            alert(`¡Voto enviado! Has dado ${selectedStarsForVote} estrella${selectedStarsForVote > 1 ? 's' : ''} a esta canción.`);
            
            // 3. Actualizar Firebase en background
            try {
                // Actualizar estrellas de la canción
                const songSnap = await getDoc(songRef);
                if (songSnap.exists()) {
                    const currentStars = songSnap.data().totalStars || 0;
                    await updateDoc(songRef, {
                        totalStars: currentStars + selectedStarsForVote
                    });
                } else {
                    await setDoc(songRef, {
                        totalStars: selectedStarsForVote
                    });
                }
                
                // Actualizar datos del usuario
                await updateDoc(userRef, {
                    votesRemaining: votesRemaining,
                    voteLog: userVoteLog
                });
                
                console.log("Voto guardado en Firebase correctamente");
            } catch (error) {
                console.error('Error al guardar voto en Firebase:', error);
                // En caso de error, revertir cambios locales
                votesRemaining++;
                delete userVoteLog[selectedSongIdForVote];
                if (localSong) {
                    localSong.totalStars -= selectedStarsForVote;
                }
                updateHeaderDisplays();
                renderRanking();
                alert("Error al enviar el voto. Inténtalo de nuevo.");
            }
        }
        window.submitVote = submitVote;

        function closeVoteModal() {
            document.getElementById('voteModal').classList.add('hidden');
            document.getElementById('voteModal').classList.remove('flex');
            // Reset
            selectedSongIdForVote = null;
            selectedStarsForVote = 0;
        }
        window.closeVoteModal = closeVoteModal;

        // --- 11. LETRA ---
        function showLyrics(songId) {
            const song = songs.find(s => s.id === songId);
            if (!song) return;
            
            document.getElementById('lyricsSongTitle').textContent = song.title;
            document.getElementById('lyricsContent').innerHTML = song.lyrics.replace(/\n/g, '<br>');
            
            document.getElementById('lyricsModal').classList.remove('hidden');
            document.getElementById('lyricsModal').classList.add('flex');
        }
        window.showLyrics = showLyrics;

        function closeLyricsModal() {
            document.getElementById('lyricsModal').classList.add('hidden');
            document.getElementById('lyricsModal').classList.remove('flex');
        }
        window.closeLyricsModal = closeLyricsModal;

        // --- 12. SURVEY MODAL (Opcional - para feedback) ---
        function closeSurveyModal() {
            document.getElementById('surveyModal').classList.add('hidden');
            document.getElementById('surveyModal').classList.remove('flex');
        }
        window.closeSurveyModal = closeSurveyModal;
        
        function closeErrorModal() {
            document.getElementById('errorModal').classList.add('hidden');
            document.getElementById('errorModal').classList.remove('flex');
        }
        window.closeErrorModal = closeErrorModal;
        
        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Página cargada, inicializando...");
            initAuthObserver();
            setupAudioPlayer();
        });
    </script>
</head>
<body>
    <header class="p-4 bg-slate-900/95 backdrop-blur-md sticky top-0 z-50 shadow-lg border-b border-teal-800">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 md:gap-0">
            
            <div class="flex items-center justify-between w-full md:w-auto md:justify-start gap-6">
                <div class="flex items-center gap-6">
                    <h1 class="text-2xl font-bold text-white">La IA Musical</h1>
                    <nav class="hidden md:flex gap-4">
                        <a href="temas.html" class="text-gray-300 hover:text-white transition-colors">🏠 Inicio</a>
                        <a href="perfil.html" class="text-gray-300 hover:text-white transition-colors">👤 Perfil</a>
                    </nav>
                </div>
            </div>

            <!-- Estadísticas del usuario -->
            <div class="flex items-center gap-4 text-sm">
                <div class="flex items-center gap-1 bg-slate-800/80 px-3 py-1 rounded-full">
                    <span class="text-yellow-400">⭐</span>
                    <span id="starCount" class="font-semibold">0</span>
                </div>
                <div class="flex items-center gap-1 bg-slate-800/80 px-3 py-1 rounded-full">
                    <span class="text-blue-400">💎</span>
                    <span id="diamondCount" class="font-semibold">0</span>
                </div>
                <div class="flex items-center gap-1 bg-slate-800/80 px-3 py-1 rounded-full">
                    <span class="text-green-400">🪙</span>
                    <span id="coinCount" class="font-semibold">0</span>
                </div>
                <div class="flex items-center gap-1 bg-slate-800/80 px-3 py-1 rounded-full">
                    <span class="text-purple-400">🗳️</span>
                    <span id="voteCount" class="font-semibold">0</span>
                </div>

                <!-- Botón de logout -->
                <button onclick="logout()" class="bg-red-600/80 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm transition-colors">
                    Salir
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 mt-6">
        <h2 class="text-2xl font-bold mb-6 border-l-4 border-teal-500 pl-3">Sala <span id="currentTopicDisplay">Literatura</span></h2>
        
        <div id="songsContainer" class="grid grid-cols-1 gap-6">
            <!-- Las canciones se cargarán aquí dinámicamente -->
        </div>
    </main>

    <!-- Reproductor de audio (pie de página) -->
    <div class="fixed bottom-0 left-0 w-full bg-slate-900/95 border-t border-teal-800 p-3 shadow-2xl z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
            <!-- Info de la canción -->
            <div class="flex items-center gap-3 w-1/4">
                <div id="playerCover" class="w-12 h-12 bg-slate-700 rounded bg-cover bg-center" style="background-image: url('./imagenportada2/default.jpg');"></div>
                <div class="overflow-hidden">
                    <p id="playerTitle" class="text-sm font-semibold text-white truncate">Título</p>
                    <p id="playerAuthor" class="text-xs text-gray-400 truncate">Autor</p>
                </div>
            </div>

            <!-- Controles de reproducción -->
            <div class="flex flex-col items-center w-1/2">
                <div class="flex items-center gap-4 mb-2">
                    <button id="playPauseBtn" class="w-8 h-8 bg-teal-600 rounded-full flex items-center justify-center hover:bg-teal-700 transition-colors">
                        <i class="fas fa-play text-xs"></i>
                    </button>
                </div>
                
                <!-- Barra de progreso -->
                <div class="w-full flex items-center gap-2 text-xs text-gray-400">
                    <span id="currentTimeDisplay">0:00</span>
                    <input type="range" class="progress-bar-custom flex-1" value="0" max="100">
                    <span id="durationDisplay">0:00</span>
                </div>
            </div>

            <!-- Control de volumen -->
            <div class="flex items-center gap-2 w-1/4 justify-end">
                <i class="fas fa-volume-up text-gray-400"></i>
                <input id="volumeControl" type="range" class="w-20" min="0" max="100" value="50">
            </div>
        </div>
    </div>

    <!-- Modal de Quiz -->
    <div id="quizModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-slate-800 rounded-xl max-w-2xl w-full max-h-[80vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-white">Quiz: <span id="quizSongTitle"></span></h3>
                    <button onclick="closeQuizModal()" class="text-gray-400 hover:text-white">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                
                <p id="quizProgress" class="text-sm text-gray-400 mb-4">Pregunta 1 de 7</p>
                
                <div class="mb-6">
                    <h4 id="quizQuestion" class="text-lg font-semibold text-white mb-4">Pregunta...</h4>
                    <div id="quizOptions" class="space-y-2">
                        <!-- Opciones se generan dinámicamente -->
                    </div>
                </div>
                
                <div id="quizFeedback" class="hidden mb-4 p-4 bg-slate-700 rounded-lg">
                    <p id="quizFeedbackText" class="text-center font-semibold"></p>
                </div>
                
                <div class="flex justify-center">
                    <button id="verifyAnswerButton" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        Verificar Respuesta
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Voto -->
    <div id="voteModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-slate-800 rounded-xl max-w-md w-full">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-white">Votar: <span id="voteSongTitle"></span></h3>
                    <button onclick="closeVoteModal()" class="text-gray-400 hover:text-white">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                
                <div class="mb-6">
                    <label class="block text-gray-300 text-sm font-semibold mb-2">
                        ¿Cuántas estrellas quieres dar a esta canción?
                    </label>
                    <div class="flex items-center gap-4">
                        <input 
                            id="starsRange" 
                            type="range" 
                            min="1" 
                            max="5" 
                            value="1" 
                            class="flex-1"
                            onchange="updateVoteStars(this.value)"
                        >
                        <div class="flex items-center gap-1">
                            <span id="voteStarsDisplay" class="text-2xl font-bold text-yellow-400">1</span>
                            <span class="text-yellow-400">⭐</span>
                        </div>
                    </div>
                </div>
                
                <div class="flex gap-3">
                    <button onclick="closeVoteModal()" class="flex-1 bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded-lg font-semibold transition-colors">
                        Cancelar
                    </button>
                    <button onclick="submitVote()" class="flex-1 bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg font-semibold transition-colors">
                        Enviar Voto
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Letra -->
    <div id="lyricsModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-slate-800 rounded-xl max-w-2xl w-full max-h-[80vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-white">🎵 <span id="lyricsSongTitle"></span></h3>
                    <button onclick="closeLyricsModal()" class="text-gray-400 hover:text-white">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                
                <div class="bg-slate-700 p-6 rounded-lg">
                    <div id="lyricsContent" class="text-gray-200 leading-relaxed whitespace-pre-wrap">
                        <!-- Letra se carga dinámicamente -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Survey (para feedback opcional) -->
    <div id="surveyModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-slate-800 rounded-xl max-w-md w-full">
            <div class="p-6 text-center">
                <h3 class="text-xl font-bold text-white mb-4">¡Gracias por participar!</h3>
                <p class="text-gray-300 mb-6">Tu feedback es importante para nosotros.</p>
                <button onclick="closeSurveyModal()" class="bg-teal-600 hover:bg-teal-700 px-6 py-2 rounded-lg font-semibold transition-colors">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Error -->
    <div id="errorModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-slate-800 rounded-xl max-w-md w-full">
            <div class="p-6 text-center">
                <div class="text-red-400 text-4xl mb-4">⚠️</div>
                <h3 class="text-xl font-bold text-white mb-2">Error</h3>
                <p id="errorMessage" class="text-gray-300 mb-6">Ha ocurrido un error inesperado.</p>
                <button onclick="closeErrorModal()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-semibold transition-colors">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <style>
        .quiz-option:hover {
            background-color: #475569;
        }
        .quiz-option.selected {
            background-color: #2563eb;
        }
        
        /* Responsive para móviles */
        @media (max-width: 768px) {
            .fixed.bottom-0 .max-w-6xl {
                flex-direction: column;
                gap: 2px;
            }
            .fixed.bottom-0 .w-1\\/4, .fixed.bottom-0 .w-1\\/2 {
                width: 100%;
            }
            #playerCover {
                width: 40px;
                height: 40px;
            }
        }
        
        /* Estilo para scrollbar personalizado */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #0d9488;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #14b8a6;
        }
    </style>

</body>
</html>
