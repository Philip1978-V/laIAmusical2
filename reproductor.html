    <style>
        /* Ajuste de colores base */
        body {
            background-color: #0f172a; 
            background: linear-gradient(180deg, #0f172a 0%, #0d9488 100%);
            color: white;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 80px; 
        }
        
        .progress-bar-custom {
            -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
            background: #334155; border-radius: 5px; outline: none; cursor: pointer;
        }
        .progress-bar-custom::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
            background: #2dd4bf; border-radius: 50%; cursor: pointer;
            transition: transform 0.1s;
        }
        .progress-bar-custom::-webkit-slider-thumb:hover { transform: scale(1.2); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #0d9488; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #14b8a6; }

        /* Estilos de animación para resultados del quiz */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* Estilos para el hover en las estrellas de voto */
        .star-vote {
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }
        .star-vote:hover {
            transform: scale(1.1);
        }
    </style>

        // --- 5. FUNCIONES AUXILIARES DE RENDERIZADO ---
        
        function getAuthorAndSynopsis(song) {
            const author = song.author.startsWith("Inspirada en") ? song.author.replace("Inspirada en *", "").replace("*", "") : song.author;
            return { author: author, synopsis: song.synopsis || 'Sinopsis no disponible.' };
        }
        window.getAuthorAndSynopsis = getAuthorAndSynopsis;

        function createSongCard(song, rank, containerType) {
            let trophyColor = 'text-gray-400';
            if (rank === 1) trophyColor = 'text-yellow-400';
            if (rank === 2) trophyColor = 'text-gray-300';
            if (rank === 3) trophyColor = 'text-amber-600';

            const coverHeight = containerType === 'top' ? 'h-64' : 'h-48';
            let cardClasses = containerType === 'top' 
                ? 'bg-slate-800/80 rounded-xl overflow-hidden shadow-2xl group relative hover:bg-slate-700/80 transition transform hover:scale-[1.02] border border-teal-700'
                : 'bg-slate-800/80 rounded-lg overflow-hidden shadow-lg group relative hover:bg-slate-700/80 transition';
            
            // --- Lógica de Botones ---
            const isQuizCompleted = userQuizLog[song.id];
            let quizBtnClasses = "flex-1 py-2 rounded-lg text-white font-semibold transition text-sm";
            let quizBtnHandler = `onclick="openQuizModal(${song.id})"`;
            let quizBtnContent = `<i class="fas fa-question-circle mr-1"></i> Quiz`;

            if (isQuizCompleted) {
                quizBtnClasses = "flex-1 py-2 rounded-lg bg-green-700/80 text-white font-semibold cursor-default text-sm border border-green-600";
                quizBtnHandler = `onclick="alert('Ya has completado el Quiz para esta canción.')"`;
                quizBtnContent = `<i class="fas fa-check-circle mr-1"></i> Completado`;
            } else {
                quizBtnClasses += " bg-teal-600 hover:bg-teal-500";
            }

            let voteBtnClasses = "flex-1 py-2 rounded-lg text-white font-semibold transition text-sm";
            let voteBtnHandler = `onclick="openVoteModal(${song.id})"`;
            let voteBtnContent = `<i class="fas fa-vote-yea mr-1"></i> Votar`;

            const hasVotedThisWeek = userVoteLog[song.id];

            if (votesRemaining <= 0) {
                // Sin votos disponibles
                voteBtnClasses = "flex-1 py-2 rounded-lg bg-slate-700 text-gray-400 font-semibold cursor-not-allowed border border-slate-600";
                voteBtnHandler = `onclick="alert('No te quedan votos disponibles. Espera al reseteo semanal para votar.')"`;
                voteBtnContent = `<i class="fas fa-vote-yea mr-1"></i> Sin Votos`;
            } else if (hasVotedThisWeek) {
                // Ya votó esta semana
                voteBtnClasses = "flex-1 py-2 rounded-lg bg-yellow-700/80 text-white font-semibold cursor-default text-sm border border-yellow-600";
                voteBtnHandler = `onclick="alert('Ya has votado por esta canción esta semana.')"`;
                voteBtnContent = `<i class="fas fa-star mr-1"></i> Votado`;
            } else {
                // Disponible para votar
                voteBtnClasses += " bg-teal-600 hover:bg-teal-500";
            }
            // --- Fin Lógica de Botones ---


            const { author, synopsis } = getAuthorAndSynopsis(song);

            const card = document.createElement('div');
            card.className = cardClasses;
            card.innerHTML = `
                <div class="relative ${coverHeight} overflow-hidden">
                    <img src="${song.cover}" alt="${song.title}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                    <div class="absolute top-2 left-2 bg-black/70 px-2 py-1 rounded text-sm font-bold ${trophyColor} flex items-center">
                        <i class="fas fa-trophy mr-1"></i> #${rank}
                    </div>
                    <button onclick="playSong(${song.id})" class="absolute inset-0 flex items-center justify-center bg-black/30 opacity-0 group-hover:opacity-100 transition duration-300">
                        <i class="fas fa-play text-white text-4xl bg-teal-600 p-4 rounded-full hover:bg-teal-500 transition shadow-xl"></i>
                    </button>
                    <div class="absolute bottom-0 w-full p-3 bg-black/60 backdrop-blur-sm">
                        <h3 class="text-lg font-bold truncate">${song.title}</h3>
                        <p class="text-xs text-teal-400 truncate">${author}</p>
                    </div>
                </div>
                <div class="p-4">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-1 text-yellow-400 font-bold text-lg">
                            <i class="fas fa-star"></i>
                            <span class="text-white">${song.totalStars}</span>
                        </div>
                        <span class="text-xs text-gray-400">${song.category} - ${song.year}</span>
                    </div>
                    <p class="text-sm text-gray-300 mb-4 line-clamp-3">${synopsis}</p>
                    <div class="flex gap-2">
                        <button class="${quizBtnClasses}" ${quizBtnHandler}>
                            ${quizBtnContent}
                        </button>
                        <button class="${voteBtnClasses}" ${voteBtnHandler}>
                            ${voteBtnContent}
                        </button>
                    </div>
                </div>
            `;
            return card;
        }

        function renderRanking() {
            // 1. Filtrar y ordenar las canciones por el tema actual
            const filteredSongs = songs.filter(s => s.topic === currentTopic);
            filteredSongs.sort((a, b) => b.totalStars - a.totalStars);

            const top3 = filteredSongs.slice(0, 3);
            const others = filteredSongs.slice(3);

            const container = document.getElementById('songsContainer');
            container.innerHTML = ''; // Limpiar contenido anterior

            // 2. Renderizar TOP 3
            const topContainer = document.createElement('div');
            topContainer.className = 'grid grid-cols-1 md:grid-cols-3 gap-6';
            top3.forEach((song, index) => {
                topContainer.appendChild(createSongCard(song, index + 1, 'top'));
            });
            container.appendChild(topContainer);

            // 3. Renderizar el resto
            if (others.length > 0) {
                const othersContainer = document.createElement('div');
                othersContainer.className = "col-span-full";
                othersContainer.innerHTML = `
                    <h3 class="text-2xl font-bold text-teal-300 mb-4 flex items-center border-t border-slate-700 pt-6">
                        <i class="fas fa-list-ol mr-2"></i> Más Canciones 
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"> 
                    </div> 
                `;
                const othersCardsWrapper = othersContainer.querySelector('.grid-cols-1.md\\:grid-cols-2.lg\\:grid-cols-3');
                others.forEach((song, index) => {
                    othersCardsWrapper.appendChild(createSongCard(song, index + 4, 'others'));
                });
                container.appendChild(othersContainer);
            }
        }
        window.renderRanking = renderRanking;

        function updateHeaderDisplays() {

        /**
         * Inicializa el ranking de canciones desde Firestore o lo resetea semanalmente.
         * @returns {Promise<boolean>} Devuelve true si el ranking fue reseteado.
         */
        async function initializeRankingStars() {
            const rankingRef = db.collection('ranking').doc('stars');
            const doc = await rankingRef.get();
            const data = doc.data() || {};
            const now = new Date().getTime();
            
            const lastStarsResetTime = data.lastStarsResetDate ? data.lastStarsResetDate.toDate().getTime() : 0;
            
            let shouldReset = false;
            
            // Si no hay fecha de reseteo o ha pasado una semana (WEEK_IN_MS)
            if (now - lastStarsResetTime >= WEEK_IN_MS) {
                shouldReset = true;
                
                // 1. Resetear todas las estrellas a 0 localmente
                songs.forEach(song => song.totalStars = 0); 

                // 2. Preparar el nuevo objeto de ranking y actualizar la fecha en la nube
                const newRankingStars = songs.reduce((acc, song) => {
                    acc[song.id] = 0;
                    return acc;
                }, {});
                
                await rankingRef.set({
                    rankingStars: newRankingStars,
                    lastStarsResetDate: firebase.firestore.Timestamp.now()
                });
                
            } else {
                // Cargar las estrellas guardadas
                const rankingStars = data.rankingStars || {};
                songs.forEach(song => {
                    song.totalStars = rankingStars[song.id] || 0;
                });
            }

            return shouldReset;
        }
        window.initializeRankingStars = initializeRankingStars;


        /**
         * Carga los datos del usuario desde Firestore, aplica la lógica de reseteo diario/semanal
         * y los sincroniza con las variables de estado locales.
         */
        async function loadUserData() {
            if (!currentUserId) return;

            const userRef = db.collection('users').doc(currentUserId);
            const doc = await userRef.get();
            const now = firebase.firestore.Timestamp.now();
            const nowTime = now.toMillis();
            const updateData = {}; // Objeto para almacenar los cambios a guardar en Firebase
            
            // Si el documento no existe, crear uno con valores iniciales
            if (!doc.exists) {
                const initialData = {
                    userStars: 0,
                    userDiamonds: 0,
                    userCoins: 0,
                    votesRemaining: maxVotes,
                    quizLog: {},
                    voteLog: {},
                    lastDailyCoinDate: now,
                    lastVoteDate: now,
                    lastVoteLogResetDate: now,
                    lastQuizLogResetDate: now,
                    createdAt: now
                };
                await userRef.set(initialData);
                // Inicializar variables locales
                Object.assign(window, {
                    userStars: 0, userDiamonds: 0, userCoins: 0, votesRemaining: maxVotes, userQuizLog: {}, userVoteLog: {}
                });
                updateHeaderDisplays();
                return;
            }


            const data = doc.data();

            // 1. CARGA INICIAL DE DATOS
            userStars = data.userStars || 0;
            userDiamonds = data.userDiamonds || 0;
            userCoins = data.userCoins || 0;
            votesRemaining = data.votesRemaining !== undefined ? data.votesRemaining : maxVotes;
            userQuizLog = data.quizLog || {};
            userVoteLog = data.voteLog || {};


            // 2. LÓGICA DE RECOMPENSA DIARIA DE MONEDAS
            const lastDailyCoinCheck = data.lastDailyCoinDate ? data.lastDailyCoinDate.toDate().getTime() : 0;
            if (nowTime - lastDailyCoinCheck >= DAY_IN_MS) {
                userCoins += DAILY_COIN_REWARD;
                updateData.userCoins = userCoins;
                updateData.lastDailyCoinDate = now;
            }

            // 3. LÓGICA DE RESET SEMANAL DE QUIZ LOG
            const lastQuizLogReset = data.lastQuizLogResetDate ? data.lastQuizLogResetDate.toDate().getTime() : 0;
            if (nowTime - lastQuizLogReset >= WEEK_IN_MS) {
                userQuizLog = {}; 
                updateData.quizLog = {};
                updateData.lastQuizLogResetDate = now;
            }

            // 4. LÓGICA DE RESET SEMANAL DE VOTOS DISPONIBLES
            const lastVoteCheck = data.lastVoteDate ? data.lastVoteDate.toDate().getTime() : 0;
            if (nowTime - lastVoteCheck >= WEEK_IN_MS) {
                votesRemaining = maxVotes;
                updateData.votesRemaining = maxVotes;
                updateData.lastVoteDate = now;
            } else {
                votesRemaining = data.votesRemaining !== undefined ? data.votesRemaining : maxVotes;
            }

            // 5. LÓGICA DE RESET SEMANAL DEL REGISTRO DE VOTOS (voteLog)
            const lastVoteLogReset = data.lastVoteLogResetDate ? data.lastVoteLogResetDate.toDate().getTime() : 0;
            if (nowTime - lastVoteLogReset >= WEEK_IN_MS) {
                userVoteLog = {}; 
                updateData.voteLog = {}; 
                updateData.lastVoteLogResetDate = now;
            }

            // 6. GUARDAR CAMBIOS DE VOTOS, MONEDAS Y FECHAS DE RESETEO
            if (Object.keys(updateData).length > 0) {
                await userRef.update(updateData);
            }

            // 7. Actualizar la interfaz con los valores finales
            updateHeaderDisplays();
        }
        window.loadUserData = loadUserData;


        function logout() {
            auth.signOut().then(() => {
                // Detener audio al cerrar sesión
                if (currentAudio) currentAudio.pause();
                window.location.href = 'index.html'; 
            }).catch((error) => {
                console.error("Error al cerrar sesión:", error);
                alert("Error al cerrar sesión.");
            });
        }
        window.logout = logout;


        /**
         * Observador de autenticación. Se ejecuta al cargar la página para mantener la sesión.
         */
        function initAuthObserver() {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    currentUser = user;
                    currentUserId = user.uid;
                    document.getElementById('currentTopicDisplay').textContent = currentTopic;
                    
                    try {
                        // 1. Cargar datos del usuario (contadores, logs, reseteos)
                        await loadUserData(); 
                        
                        // 2. Inicializar o resetear el ranking global
                        await initializeRankingStars(); 

                        // 3. Renderizar el ranking y la interfaz
                        renderRanking(); 
                    } catch (error) {
                        console.error("Error al inicializar datos:", error);
                        document.getElementById('errorDetails').textContent = "No se pudieron cargar los datos. Revisa la conexión a Firebase.";
                        document.getElementById('errorModal').classList.remove('hidden');
                    }
                } else {
                    // No logueado, redirigir al login
                    window.location.href = 'index.html';
                }
            });
        }
        window.initAuthObserver = initAuthObserver; // Hacerla global

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Inicializar el reproductor de audio y sus listeners
        function setupAudioPlayer() {
            // Reproducir/Pausar
            playPauseBtn.onclick = togglePlayPause;

            // Actualizar progreso
            currentAudio.ontimeupdate = () => {
                const currentTime = currentAudio.currentTime;
                const duration = currentAudio.duration;
                if (duration && isPlaying) {
                    // Actualizar barra de progreso (porcentaje)
                    progressBar.value = (currentTime / duration) * 100;
                    // Actualizar tiempo en el display
                    currentTimeDisplay.textContent = formatTime(currentTime);
                    durationDisplay.textContent = formatTime(duration);
                }
            };

            // Fin de la canción
            currentAudio.onended = () => {
                isPlaying = false;
                playPauseBtn.innerHTML = '<i class="fas fa-play text-xs"></i>';
                progressBar.value = 0;
                currentTimeDisplay.textContent = formatTime(0);
            };
            
            // Carga de metadatos (para obtener duración)
            currentAudio.onloadedmetadata = () => {
                durationDisplay.textContent = formatTime(currentAudio.duration);
            };

            // Control de barra de progreso (arrastrar)
            progressBar.onchange = () => {
                const time = currentAudio.duration * (progressBar.value / 100);
                currentAudio.currentTime = time;
                if (!isPlaying) {
                     // Si estaba pausada, reproducir al mover la barra
                     togglePlayPause();
                }
            };
            // Mostrar el tiempo al arrastrar (opcional, para feedback inmediato)
            progressBar.oninput = () => {
                const time = currentAudio.duration * (progressBar.value / 100);
                currentTimeDisplay.textContent = formatTime(time);
            };
            
            // Control de volumen
            volumeControl.oninput = () => {
                currentAudio.volume = volumeControl.value / 100;
            };
            currentAudio.volume = 0.5; // Volumen inicial
            volumeControl.value = 50;
        }


        function togglePlayPause() {
            if (!currentSongId) {
                document.getElementById('playerTitle').textContent = "Selecciona primero una canción para reproducir.";
                return;
            } 

            if (isPlaying) {
                currentAudio.pause();
                isPlaying = false;
                playPauseBtn.innerHTML = '<i class="fas fa-play text-xs"></i>';
            } else {
                currentAudio.play().catch(e => {
                    console.error("Error al reproducir. Es posible que el navegador requiera interacción del usuario:", e);
                    // No hacer nada si falla el autoplay, dejar el botón en 'play'
                });
                isPlaying = true;
                playPauseBtn.innerHTML = '<i class="fas fa-pause text-xs"></i>';
            }
        }


        function playSong(id) {
            const song = songs.find(s => s.id === id);
            if (!song) return;

            // Actualizar datos del reproductor en la interfaz
            document.getElementById('playerTitle').textContent = song.title;
            document.getElementById('playerAuthor').textContent = getAuthorAndSynopsis(song).author;
            document.getElementById('playerCover').style.backgroundImage = `url('${song.cover}')`;
            
            // 1. Si es la misma canción, solo togglee el estado
            if (id === currentSongId) {
                togglePlayPause();
                return;
            }

            // 2. Si es una nueva canción, cargarla y reproducirla
            currentSongId = id;
            
            // Cargar el nuevo archivo de audio
            currentAudio.src = song.audio; 
            currentAudio.load();
            progressBar.value = 0; // Resetear barra al cargar nueva canción

            currentAudio.oncanplaythrough = () => {
                currentAudio.play().then(() => {
                    isPlaying = true;
                    playPauseBtn.innerHTML = '<i class="fas fa-pause text-xs"></i>';
                }).catch(e => {
                    console.error("Error al intentar reproducir automáticamente. Click de usuario necesario.", e);
                    isPlaying = false;
                    playPauseBtn.innerHTML = '<i class="fas fa-play text-xs"></i>';
                });
            };
        }
        window.playSong = playSong;

        // --- 8. LÓGICA DE VOTACIÓN ---

        function openVoteModal(songId) {
            if (userVoteLog[songId]) {
                alert("Ya has votado por esta canción esta semana.");
                return;
            }
            if (votesRemaining <= 0) {
                alert("No te quedan votos disponibles. Espera al reseteo semanal para poder votar.");
                return;
            }

            selectedSongIdForVote = songId;
            selectedStarsForVote = 0;
            const song = songs.find(s => s.id === songId);
            document.getElementById('voteSongTitle').textContent = song ? song.title : '';
            document.getElementById('votesRemainingDisplayModal').textContent = votesRemaining;

            renderStarsInModal();
            updateVoteButton();
            document.getElementById('voteModal').classList.remove('hidden');
            document.getElementById('voteModal').classList.add('flex');
        }
        window.openVoteModal = openVoteModal;

        function renderStarsInModal() {
            const container = document.getElementById('starContainer');
            container.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('i');
                star.className = `fas fa-star text-3xl star-vote ${i <= selectedStarsForVote ? 'text-yellow-400' : 'text-gray-600'}`;
                star.onclick = () => selectStars(i);
                container.appendChild(star);
            }
        }

        function selectStars(stars) {
            selectedStarsForVote = stars;
            renderStarsInModal();
            updateVoteButton();
        }

        function updateVoteButton() {
            const btn = document.getElementById('submitVoteButton');
            btn.disabled = selectedStarsForVote === 0;
        }

        async function submitVote() {
            if (!currentUserId || selectedStarsForVote === 0 || votesRemaining <= 0) return;

            const song = songs.find(s => s.id === selectedSongIdForVote);
            if (!song) return;
            
            const starsGiven = selectedStarsForVote;

            // 1. Actualizar estado local
            song.totalStars += starsGiven;
            votesRemaining--;
            userVoteLog[selectedSongIdForVote] = true; 

            try {
                const userRef = db.collection('users').doc(currentUserId);
                const rankingRef = db.collection('ranking').doc('stars'); // Referencia correcta al ranking GLOBAL

                // 2. Actualizar datos del usuario (decremento de voto, registro de log)
                await userRef.update({
                    votesRemaining: firebase.firestore.FieldValue.increment(-1),
                    // Usar un mapa anidado para registrar el voto
                    [`voteLog.${song.id}`]: true, 
                    lastVoteDate: firebase.firestore.Timestamp.now(),
                    activityLog: firebase.firestore.FieldValue.arrayUnion({
                        type: 'vote',
                        songId: song.id,
                        songTitle: song.title,
                        starsGiven: starsGiven,
                        usedFreeVote: true,
                        timestamp: new Date().toISOString()
                    })
                });

                // 3. Actualizar ranking global (incremento de estrellas)
                await rankingRef.update({
                    [`rankingStars.${song.id}`]: firebase.firestore.FieldValue.increment(starsGiven)
                });
                
                closeVoteSelectionModal();
                updateHeaderDisplays();
                renderRanking();
                alert(`¡Voto exitoso! Has añadido ${starsGiven} estrellas. Votos restantes: ${votesRemaining}`);

            } catch (e) {
                console.error("Error guardando voto", e);
                alert("Error de conexión al guardar el voto. Inténtalo de nuevo.");
                
                // Revertir estado local en caso de error
                song.totalStars -= starsGiven;
                votesRemaining++;
                delete userVoteLog[selectedSongIdForVote];
                renderRanking();
            }
        }
        window.submitVote = submitVote;

        function closeVoteSelectionModal() {
            document.getElementById('voteModal').classList.add('hidden');
            document.getElementById('voteModal').classList.remove('flex');
            selectedStarsForVote = 0;
            selectedSongIdForVote = null;
        }
        window.closeVoteSelectionModal = closeVoteSelectionModal;

        // --- 9. LÓGICA DE QUIZ DINÁMICO ---
        
        function openQuizModal(songId) {
            const song = songs.find(s => s.id === songId);
            if (!song || !song.quiz || song.quiz.length !== 5) {
                document.getElementById('errorDetails').textContent = "El Quiz debe tener exactamente 5 preguntas.";
                document.getElementById('errorModal').classList.remove('hidden');
                document.getElementById('errorModal').classList.add('flex');
                return;
            }

            if (userQuizLog[songId]) {
                document.getElementById('errorDetails').textContent = "Ya has completado el Quiz para esta canción esta semana.";
                document.getElementById('errorModal').classList.remove('hidden');
                document.getElementById('errorModal').classList.add('flex');
                return;
            }

            activeQuizSongId = songId;
            currentQuestionIndex = 0;
            correctQuizAnswers = 0;

            document.getElementById('quizSongTitle').textContent = song.title;
            document.getElementById('quizResults').classList.add('hidden');
            document.getElementById('quizControls').classList.remove('hidden');

            renderQuizQuestion(currentQuestionIndex);
            
            document.getElementById('quizModal').classList.remove('hidden');
            document.getElementById('quizModal').classList.add('flex');
        }
        window.openQuizModal = openQuizModal;

        function renderQuizQuestion(index) {
            const song = songs.find(s => s.id === activeQuizSongId);
            const content = document.getElementById('quizContent');
            content.innerHTML = ''; // Limpiar
            document.getElementById('nextQuestionButton').disabled = true;

            if (!song) return;

            const totalQuestions = song.quiz.length;
            const questionData = song.quiz[index];

            const questionDiv = document.createElement('div');
            questionDiv.className = 'bg-slate-700/50 p-4 rounded-lg border border-teal-800';
            questionDiv.innerHTML = `
                <p class="font-bold text-teal-300 mb-3 text-lg">Pregunta ${index + 1}/${totalQuestions}:</p>
                <p class="text-white mb-4">${questionData.q}</p>
                <div class="space-y-3">
                    ${questionData.a.map((answer, aIndex) => `
                        <label class="flex items-center text-gray-300 cursor-pointer p-2 rounded-lg transition hover:bg-slate-700">
                            <input type="radio" name="question_current" value="${aIndex}" class="w-4 h-4 text-teal-600 bg-gray-700 border-gray-600 focus:ring-teal-500 mr-3" onchange="document.getElementById('nextQuestionButton').disabled = false;">
                            <span>${answer}</span>
                        </label>
                    `).join('')}
                </div>
            `;
            content.appendChild(questionDiv);

            const btn = document.getElementById('nextQuestionButton');
            const btnText = index < totalQuestions - 1 ? `Siguiente Pregunta (${index + 2}/${totalQuestions})` : "Finalizar Quiz";
            btn.textContent = btnText;
        }

        function nextQuizQuestion() {
            const song = songs.find(s => s.id === activeQuizSongId);
            const currentQ = song.quiz[currentQuestionIndex];
            const selected = document.querySelector('input[name="question_current"]:checked');

            if (!selected) {
                alert("Por favor, selecciona una respuesta.");
                return;
            }

            const selectedAnswerIndex = parseInt(selected.value);
            if (selectedAnswerIndex === currentQ.correct) {
                correctQuizAnswers++;
            }

            // Mover a la siguiente pregunta o finalizar
            currentQuestionIndex++;
            if (currentQuestionIndex < song.quiz.length) {
                renderQuizQuestion(currentQuestionIndex);
            } else {
                submitQuiz();
            }
        }
        window.nextQuizQuestion = nextQuizQuestion;

        async function submitQuiz() {
            if (!currentUserId) return;

            const score = correctQuizAnswers;
            const song = songs.find(s => s.id === activeQuizSongId);
            const userRef = db.collection('users').doc(currentUserId);
            
            // 1. Calcular recompensas
            const starsEarned = score * 5; // 5 estrellas por respuesta correcta
            const diamondsEarned = score === 5 ? 1 : 0; // 1 Diamante por 5/5
            const bonusStars = score === 5 ? BONUS_STARS_PERFECT_SCORE : 0;
            const totalStarsGained = starsEarned + bonusStars;

            // 2. Actualizar estado local
            userStars += totalStarsGained;
            userDiamonds += diamondsEarned;
            userQuizLog[song.id] = true; // Marcar como completado

            try {
                // 3. Guardar en Firebase
                const updateData = {
                    userStars: firebase.firestore.FieldValue.increment(totalStarsGained),
                    userDiamonds: firebase.firestore.FieldValue.increment(diamondsEarned),
                    // Registrar que el quiz se ha completado
                    [`quizLog.${song.id}`]: true 
                };
                
                await userRef.update(updateData);
                
                // Registrar log de actividad
                await userRef.update({ 
                    activityLog: firebase.firestore.FieldValue.arrayUnion({
                        type: 'quiz',
                        songId: song.id,
                        songTitle: song.title,
                        score: score,
                        starsGained: totalStarsGained,
                        diamondsGained: diamondsEarned,
                        timestamp: new Date().toISOString()
                    })
                });

                // 4. Mostrar Resultados
                document.getElementById('quizContent').innerHTML = ''; // Limpiar preguntas
                document.getElementById('quizControls').classList.add('hidden');
                
                const scoreText = `${score}/5 Correctas`;
                let rewardHTML = `<p class="text-white"><i class="fas fa-star text-yellow-400 mr-2"></i>+${starsEarned} Estrellas</p>`;
                if (score === 5) {
                    rewardHTML += `<p class="text-white"><i class="fas fa-star text-yellow-400 mr-2"></i>+${bonusStars} Estrellas (Bonus)</p>`;
                    rewardHTML += `<p class="text-white"><i class="fas fa-gem text-blue-400 mr-2"></i>+${diamondsEarned} Diamante (Perfecto)</p>`;
                }

                document.getElementById('quizScore').textContent = scoreText;
                document.getElementById('quizRewardContainer').innerHTML = rewardHTML;
                
                document.getElementById('quizResults').classList.remove('hidden');

                updateHeaderDisplays();
                // No es necesario llamar a renderRanking, el quiz no afecta al ranking de estrellas de la comunidad, solo al usuario
                // renderRanking(); 

            } catch (e) {
                console.error("Error al registrar quiz y recompensa:", e);
                alert("Error de conexión al guardar tu progreso.");
                // Restaurar estado local en caso de error
                userStars -= totalStarsGained;
                userDiamonds -= diamondsEarned;
            }
        }
        window.submitQuiz = submitQuiz;


        function closeQuizModal() {
            document.getElementById('quizModal').classList.add('hidden');
            document.getElementById('quizModal').classList.remove('flex');
            activeQuizSongId = null;
        }
        window.closeQuizModal = closeQuizModal;
        
        function closeErrorModal() {
            document.getElementById('errorModal').classList.add('hidden');
            document.getElementById('errorModal').classList.remove('flex');
        }
        window.closeErrorModal = closeErrorModal;

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            initAuthObserver();
            setupAudioPlayer();
        });

    </script>
</body>
