<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Animación 🧸 - Votación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> 

    <style>
        :root {
            --primary-color: #FF8C00;
            --dark-color: #E67E22;
            --star-gold: #ffc107;
            --bg-light: #f8f8f8;
            --disabled-grey: #ccc;
            --ia-blue: #007bff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: var(--bg-light);
            color: #333;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        .header-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .back-link { text-decoration: none; color: #007bff; font-weight: bold; }

        .temas-btn {
            background-color: #BEF264;
            color: #1a1a1a;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #a7e555;
        }

        .info-panel {
            background: #fff9f0;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #ffe0b2;
            text-align: center;
            font-weight: bold;
        }

        .ia-notice {
            display: block;
            margin-top: 10px;
            color: #e65100;
            font-size: 0.95em;
            border-top: 1px solid #ffe0b2;
            padding-top: 10px;
        }

        .entrada-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #eee;
            background-color: #fff;
        }

        .titulo-autor { flex-grow: 1; text-align: left; }
        .titulo-original { font-size: 1.1em; font-weight: bold; color: #444; }
        .autor { font-size: 0.9em; color: #777; font-style: italic; }
        .titulo-ia { 
            font-size: 1.15em; 
            font-weight: 800; 
            color: var(--ia-blue); 
            margin-top: 6px;
            display: block;
        }

        .controles-votacion {
            display: flex;
            gap: 15px;
            align-items: center;
            min-width: 250px;
            justify-content: flex-end;
        }
        
        .vote-btn {
            background: var(--primary-color); 
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .vote-btn:disabled { background: var(--disabled-grey); cursor: not-allowed; }

        .vote-stats {
            display: flex;
            flex-direction: column;
            font-size: 0.85em;
            background: #fffdf5;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #fff3e0;
        }
        
        .rating-avg { color: var(--star-gold); font-weight: 800; }
        .genre-top { color: var(--ia-blue); font-weight: 600; }

        .stars-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            flex-direction: row-reverse;
        }

        .stars-container i {
            font-size: 3em;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s;
        }

        .stars-container i:hover,
        .stars-container i:hover ~ i {
            color: var(--star-gold);
        }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .modal-content { background: #fff; margin: 10vh auto; padding: 40px; width: 90%; max-width: 500px; border-radius: 20px; text-align: center; position: relative; }
        .close { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; color: #aaa; }
        .genre-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .genre-btn { padding: 10px; border: 2px solid var(--primary-color); border-radius: 8px; background: none; cursor: pointer; font-weight: bold; }
        .genre-btn:hover { background: var(--primary-color); color: #fff; }

        @media (max-width: 600px) {
            .entrada-item { flex-direction: column; text-align: center; }
            .controles-votacion { margin-top: 15px; width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-links">
        <a href="biblioteca.html" class="back-link">← Atras</a>
        <a href="temas.html" class="temas-btn">Volver a Temas</a>
    </div>

    <h1>Sala de Animación 🧸</h1>
    
    <div class="info-panel">
        <div id="votos-info">Cargando disponibilidad...</div>
        <span class="ia-notice">
            Al finalizar la semana, se añadirá un título creado por la IA a las 3 obras más votadas.
        </span>
    </div>

    <div id="lista-entradas"></div>
</div>

<div id="voteModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModals()">&times;</span>
        <h2 id="vote-title" style="color:var(--primary-color)">Califica esta obra</h2>
        <div class="stars-container">
            <i class="fas fa-star" onclick="selectStar(5)"></i>
            <i class="fas fa-star" onclick="selectStar(4)"></i>
            <i class="fas fa-star" onclick="selectStar(3)"></i>
            <i class="fas fa-star" onclick="selectStar(2)"></i>
            <i class="fas fa-star" onclick="selectStar(1)"></i>
        </div>
        <p>Selecciona de 1 a 5 estrellas</p>
    </div>
</div>

<div id="genreModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModals()">&times;</span>
        <h2 style="color:var(--primary-color)">Estilo musical para la versión IA</h2>
        <div class="genre-grid">
            <button class="genre-btn" onclick="finishVote('Infantil')">Infantil</button>
            <button class="genre-btn" onclick="finishVote('Aventura')">Aventura</button>
            <button class="genre-btn" onclick="finishVote('Synthwave')">Synthwave</button>
            <button class="genre-btn" onclick="finishVote('Orquestal')">Orquestal</button>
            <button class="genre-btn" onclick="finishVote('Pop')">Pop</button>
            <button class="genre-btn" onclick="finishVote('Jazz')">Jazz</button>
            <button class="genre-btn" onclick="finishVote('Rock')">Rock</button>
            <button class="genre-btn" onclick="finishVote('Electrónica')">Electrónica</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, increment, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDW3Yv0AQAVlf3zTuxlqNq6dkZ6kQtpysM",
        authDomain: "laiamusical-4fba7.firebaseapp.com",
        projectId: "laiamusical-4fba7",
        storageBucket: "laiamusical-4fba7.firebasestorage.app",
        messagingSenderId: "49783369602",
        appId: "1:49783369602:web:91e287c094a8f2403d699b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let userVotesCount = 0;
    let userVotedTitles = [];
    let currentItemIndex = null;
    let selectedRating = 0;

    const entradasBase = [
        { id: "totoro", titulo: "Mi vecino Totoro", autor: "Hayao Miyazaki" },
        { id: "toy_story", titulo: "Toy Story", autor: "John Lasseter" },
        { id: "chihiro", titulo: "El viaje de Chihiro", autor: "Hayao Miyazaki" },
        { id: "rey_leon_ani", titulo: "El Rey León", autor: "Roger Allers" },
        { id: "spider_verse", titulo: "Spider-Man: Un nuevo universo", autor: "Bob Persichetti" },
        { id: "shrek", titulo: "Shrek", autor: "Andrew Adamson" },
        { id: "walle", titulo: "WALL-E", autor: "Andrew Stanton" },
        { id: "coco", titulo: "Coco", autor: "Lee Unkrich" }
    ].sort((a, b) => a.titulo.localeCompare(b.titulo));

    window.openVoteModal = (index) => {
        if (userVotesCount >= 3) return alert("Límite de 3 votos alcanzado.");
        currentItemIndex = index;
        document.getElementById('vote-title').innerText = `¿Calificar "${entradasBase[index].titulo}"?`;
        document.getElementById('voteModal').style.display = 'block';
    };

    window.selectStar = (rating) => {
        selectedRating = rating;
        document.getElementById('voteModal').style.display = 'none';
        document.getElementById('genreModal').style.display = 'block';
    };

    window.closeModals = () => {
        document.getElementById('voteModal').style.display = 'none';
        document.getElementById('genreModal').style.display = 'none';
    };

    window.finishVote = async (genre) => {
        const item = entradasBase[currentItemIndex];
        const now = new Date();
        const monday = new Date(now.setDate(now.getDate() - (now.getDay() || 7) + 1));
        monday.setHours(0,0,0,0);
        const weekId = `week-anim-${monday.getTime()}`;

        try {
            const globalRef = doc(db, "global_votes_anim", item.id);
            await setDoc(globalRef, { 
                totalRating: increment(selectedRating),
                voteCount: increment(1),
                [`genres.${genre}`]: increment(1)
            }, { merge: true });

            const userDocRef = doc(db, "users", currentUser.uid, "weekly_stats_anim", weekId);
            userVotedTitles.push(item.id);
            userVotesCount++;
            await setDoc(userDocRef, { count: userVotesCount, voted_ids: userVotedTitles }, { merge: true });

            closeModals();
            await checkUserVoteStatus();
            renderList();
        } catch (e) { console.error(e); }
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) { 
            currentUser = user; 
            await checkUserVoteStatus(); 
            renderList(); 
            onSnapshot(collection(db, "global_votes_anim"), () => renderList());
        } else { window.location.href = 'index.html'; }
    });

    async function checkUserVoteStatus() {
        const now = new Date();
        const monday = new Date(now.setDate(now.getDate() - (now.getDay() || 7) + 1));
        monday.setHours(0,0,0,0);
        const weekId = `week-anim-${monday.getTime()}`;
        const docSnap = await getDoc(doc(db, "users", currentUser.uid, "weekly_stats_anim", weekId));
        if (docSnap.exists()) {
            userVotesCount = docSnap.data().count || 0;
            userVotedTitles = docSnap.data().voted_ids || [];
        }
        document.getElementById('votos-info').innerText = `Votos realizados esta semana: ${userVotesCount}/3`;
    }

    async function renderList() {
        const contenedor = document.getElementById('lista-entradas');
        const querySnapshot = await getDocs(collection(db, "global_votes_anim"));
        const globalData = {};
        querySnapshot.forEach(d => globalData[d.id] = d.data());
        contenedor.innerHTML = ''; 
        entradasBase.forEach((e, i) => {
            const data = globalData[e.id] || { totalRating: 0, voteCount: 0, genres: {} };
            const avg = data.voteCount > 0 ? (data.totalRating / data.voteCount).toFixed(1) : "0.0";
            let topGenre = "", maxVotes = 0;
            for (const g in data.genres) { if (data.genres[g] > maxVotes) { maxVotes = data.genres[g]; topGenre = g; } }
            const tituloIA = maxVotes > 0 ? `${e.titulo} (${topGenre})` : "";
            const yaVoto = userVotedTitles.includes(e.id);
            const div = document.createElement('div');
            div.className = 'entrada-item';
            div.innerHTML = `
                <div class="titulo-autor">
                    <span class="titulo-original">🧸 ${e.titulo}</span><br>
                    <span class="autor">🎬 ${e.autor}</span><br>
                    <span class="titulo-ia">✨ Título IA: ${tituloIA}</span>
                </div>
                <div class="controles-votacion">
                    <div class="vote-stats">
                        <span class="rating-avg"><i class="fas fa-star"></i> ${avg}</span>
                        <span class="genre-top"><i class="fas fa-magic"></i> ${topGenre || "---"}</span>
                    </div>
                    <button class="vote-btn" ${yaVoto || userVotesCount >= 3 ? 'disabled' : ''} onclick="window.openVoteModal(${i})">${yaVoto ? 'Votado' : 'Votar'}</button>
                </div>`;
            contenedor.appendChild(div);
        });
    }
</script>
</body>
</html>
