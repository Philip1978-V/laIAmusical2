<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Storybook</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Fredoka+One&family=Nunito:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1209;
      --parchment: #f5ede0;
      --gold: #c9933a;
      --gold-light: #e8b96a;
      --adult-bg: #12100e;
      --adult-accent: #9b7e46;
      --adult-silver: #b8c4cc;
    }

    html, body {
      min-height: 100vh;
      background-color: var(--parchment);
      font-family: 'Cormorant Garamond', Georgia, serif;
      overflow-x: hidden;
    }

    /* ---- HEADER ---- */
    header {
      text-align: center;
      padding: 60px 20px 30px;
      position: relative;
    }

    header::after {
      content: '';
      display: block;
      width: 180px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 24px auto 0;
    }

    .header-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 0.3em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 12px;
      animation: fadeDown 0.8s ease both;
    }

    .header-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 700;
      color: var(--ink);
      line-height: 1;
      letter-spacing: -0.01em;
      animation: fadeDown 0.8s 0.15s ease both;
    }

    .header-title span { color: var(--gold); }

    /* ---- MAIN LAYOUT ---- */
    main {
      display: flex;
      justify-content: center;
      min-height: calc(100vh - 200px);
    }

    /* ---- SECTION BASE ---- */
    .section {
      position: relative;
      padding: 60px 60px 80px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      overflow: hidden;
      width: 100%;
    }

    @media (max-width: 768px) {
      .section { padding: 40px 28px 60px; }
    }

    /* ---- STORYBOOK SECTION ---- */
    .section--adults {
      background-color: var(--adult-bg);
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(155,126,70,0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(155,126,70,0.10) 0%, transparent 50%);
    }

    .section-tag--adults {
      display: inline-block;
      border: 1px solid var(--adult-accent);
      color: var(--adult-accent);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      padding: 4px 16px;
      margin-bottom: 24px;
      text-transform: uppercase;
      animation: popIn 0.6s 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    .section-heading--adults {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      color: var(--adult-silver);
      margin-bottom: 36px;
      line-height: 1.15;
      font-style: italic;
      max-width: 600px;
      animation: fadeRight 0.7s 0.5s ease both;
    }

    /* ---- PROXIMAMENTE CARD ---- */
    .proximamente-card--adults {
      position: relative;
      background: transparent;
      border: 1px dashed rgba(155,126,70,0.5);
      padding: 48px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 480px;
      text-align: center;
      gap: 16px;
      animation: fadeRight 0.7s 0.65s ease both;
    }

    .proximamente-icon--adults {
      font-size: 3rem;
      opacity: 0.35;
      animation: float 5s ease-in-out infinite alternate;
    }

    .proximamente-label--adults {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      color: var(--adult-accent);
      text-transform: uppercase;
      border: 1px solid rgba(155,126,70,0.35);
      padding: 4px 16px;
    }

    .proximamente-text--adults {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      color: var(--adult-silver);
      line-height: 1.6;
      font-style: italic;
      opacity: 0.7;
    }

    /* ---- DECORATIVE LINES ---- */
    .deco-lines {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .deco-lines::before {
      content: '';
      position: absolute;
      width: 1px;
      height: 40%;
      background: linear-gradient(to bottom, transparent, rgba(155,126,70,0.3), transparent);
      right: 20%;
      top: 15%;
    }

    .deco-lines::after {
      content: '';
      position: absolute;
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(155,126,70,0.3));
      right: 10%;
      top: 60%;
    }

    /* ---- FOOTER ---- */
    footer {
      text-align: center;
      padding: 30px 20px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.85rem;
      color: rgba(26,18,9,0.35);
      letter-spacing: 0.1em;
      border-top: 1px solid rgba(201,147,58,0.15);
    }

    /* ---- ANIMATIONS ---- */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeRight {
      from { opacity: 0; transform: translateX(24px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes float {
      from { transform: translateY(0) rotate(0deg); }
      to   { transform: translateY(-12px) rotate(15deg); }
    }
  </style>
</head>
<body>

  <header>
    <p class="header-subtitle">Contenido exclusivo de LaIAmusical</p>
    <h1 class="header-title">Story<span>book</span></h1>
  </header>

  <main>

    <!-- ====== STORYBOOK ====== -->
    <section class="section section--adults">
      <div class="deco-lines"></div>

      <span class="section-tag--adults">Storybook</span>
      <h2 class="section-heading--adults">Descubre un nuevo relato con música, narrador e imágenes</h2>

      <div class="proximamente-card--adults">
        <div class="proximamente-icon--adults">✦</div>
        <span class="proximamente-label--adults">Próximamente</span>
        <p class="proximamente-text--adults">Próximamente, nuevo contenido basado en esta carta de LaIAmusical</p>
      </div>
    </section>

  </main>

  <footer>
    &copy; 2026 Storybook — Cada página, un mundo nuevo
  </footer>

</body>
</html>
