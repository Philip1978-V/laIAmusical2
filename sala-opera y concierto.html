<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ópera y Conciertos 🎻 - Votación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> 

    <style>
        :root {
            --primary-color: #4B0082;
            --dark-color: #2E0854;
            --star-gold: #FFD700;
            --bg-light: #f4f4f4;
            --disabled-grey: #ccc;
            --ia-blue: #007bff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: var(--bg-light);
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        .header-links { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-link { text-decoration: none; color: #007bff; font-weight: bold; }
        .temas-btn { background-color: #BEF264; color: #1a1a1a; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; }

        .info-panel {
            background: #f3e5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #d1c4e9;
            text-align: center;
            font-weight: bold;
        }

        .ia-notice {
            display: block;
            margin-top: 10px;
            color: var(--primary-color);
            font-size: 0.95em;
            border-top: 1px solid #d1c4e9;
            padding-top: 10px;
        }

        .entrada-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #eee;
            background-color: #fff;
        }

        .titulo-ia { font-size: 1.15em; font-weight: 800; color: var(--ia-blue); display: block; margin-top: 5px; }

        .controles-votacion { display: flex; gap: 15px; align-items: center; min-width: 250px; justify-content: flex-end; }
        
        .vote-btn {
            background: var(--primary-color); 
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .vote-btn:disabled { background: var(--disabled-grey); }

        .vote-stats {
            display: flex;
            flex-direction: column;
            font-size: 0.85em;
            background: #f8f0ff;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e1bee7;
        }
        
        .rating-avg { color: #ccac00; font-weight: 800; }

        .stars-container { display: flex; justify-content: center; gap: 10px; margin: 30px 0; flex-direction: row-reverse; }
        .stars-container i { font-size: 3em; color: #ddd; cursor: pointer; transition: 0.2s; }
        .stars-container i:hover, .stars-container i:hover ~ i { color: var(--star-gold); }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .modal-content { background: #fff; margin: 10vh auto; padding: 40px; width: 90%; max-width: 500px; border-radius: 20px; text-align: center; position: relative; }
        .close { position: absolute; right: 20px; top: 15px; font-size: 28px; cursor: pointer; }
        .genre-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .genre-btn { padding: 10px; border: 2px solid var(--primary-color); border-radius: 8px; background: none; cursor: pointer; font-weight: bold; }
        .genre-btn:hover { background: var(--primary-color); color: #fff; }

        @media (max-width: 600px) {
            .entrada-item { flex-direction: column; text-align: center; }
            .controles-votacion { margin-top: 15px; width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-links">
        <a href="biblioteca.html" class="back-link">← Atras</a>
        <a href="temas.html" class="temas-btn">Volver a Temas</a>
    </div>

    <h1>Sala de Ópera y Conciertos 🎻</h1>
    
    <div class="info-panel">
        <div id="votos-info">Cargando...</div>
        <span class="ia-notice">Selecciona los conciertos que inspirarán las próximas creaciones de la IA.</span>
    </div>

    <div id="lista-entradas"></div>
</div>

<div id="voteModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModals()">&times;</span>
        <h2 id="vote-title">Califica esta obra</h2>
        <div class="stars-container">
            <i class="fas fa-star" onclick="selectStar(5)"></i>
            <i class="fas fa-star" onclick="selectStar(4)"></i>
            <i class="fas fa-star" onclick="selectStar(3)"></i>
            <i class="fas fa-star" onclick="selectStar(2)"></i>
            <i class="fas fa-star" onclick="selectStar(1)"></i>
        </div>
    </div>
</div>

<div id="genreModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModals()">&times;</span>
        <h2>¿Qué estilo IA prefieres?</h2>
        <div class="genre-grid">
            <button class="genre-btn" onclick="finishVote('Barroco')">Barroco</button>
            <button class="genre-btn" onclick="finishVote('Moderno')">Moderno</button>
            <button class="genre-btn" onclick="finishVote('Épico')">Épico</button>
            <button class="genre-btn" onclick="finishVote('Ambient')">Ambient</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, increment, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDW3Yv0AQAVlf3zTuxlqNq6dkZ6kQtpysM",
        authDomain: "laiamusical-4fba7.firebaseapp.com",
        projectId: "laiamusical-4fba7",
        storageBucket: "laiamusical-4fba7.firebasestorage.app",
        messagingSenderId: "49783369602",
        appId: "1:49783369602:web:91e287c094a8f2403d699b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null, userVotesCount = 0, userVotedTitles = [], currentItemIndex = null, selectedRating = 0;

    const entradasBase = [
        { id: "flauta_magica", titulo: "La flauta mágica", autor: "W.A. Mozart" },
        { id: "traviata", titulo: "La Traviata", autor: "Giuseppe Verdi" },
        { id: "carmen", titulo: "Carmen", autor: "Georges Bizet" },
        { id: "sinfonia9", titulo: "9ª Sinfonía", autor: "L. van Beethoven" },
        { id: "estaciones", titulo: "Las cuatro estaciones", autor: "Antonio Vivaldi" },
        { id: "barbero", titulo: "El barbero de Sevilla", autor: "Gioachino Rossini" }
    ].sort((a, b) => a.titulo.localeCompare(b.titulo));

    window.openVoteModal = (i) => {
        if (userVotesCount >= 3) return alert("Límite alcanzado.");
        currentItemIndex = i;
        document.getElementById('voteModal').style.display = 'block';
    };

    window.selectStar = (r) => {
        selectedRating = r;
        document.getElementById('voteModal').style.display = 'none';
        document.getElementById('genreModal').style.display = 'block';
    };

    window.closeModals = () => { document.getElementById('voteModal').style.display = 'none'; document.getElementById('genreModal').style.display = 'none'; };

    window.finishVote = async (genre) => {
        const item = entradasBase[currentItemIndex];
        const weekId = `week-opera-${new Date().setDate(new Date().getDate() - (new Date().getDay() || 7) + 1)}`;
        try {
            await setDoc(doc(db, "global_votes_opera", item.id), { totalRating: increment(selectedRating), voteCount: increment(1), [`genres.${genre}`]: increment(1) }, { merge: true });
            userVotedTitles.push(item.id); userVotesCount++;
            await setDoc(doc(db, "users", currentUser.uid, "weekly_stats_opera", weekId), { count: userVotesCount, voted_ids: userVotedTitles }, { merge: true });
            closeModals(); await checkUserVoteStatus(); renderList();
        } catch (e) { console.error(e); }
    };

    onAuthStateChanged(auth, async (u) => { if (u) { currentUser = u; await checkUserVoteStatus(); renderList(); onSnapshot(collection(db, "global_votes_opera"), renderList); } });

    async function checkUserVoteStatus() {
        const weekId = `week-opera-${new Date().setDate(new Date().getDate() - (new Date().getDay() || 7) + 1)}`;
        const docSnap = await getDoc(doc(db, "users", currentUser.uid, "weekly_stats_opera", weekId));
        if (docSnap.exists()) { userVotesCount = docSnap.data().count; userVotedTitles = docSnap.data().voted_ids; }
        document.getElementById('votos-info').innerText = `Votos: ${userVotesCount}/3`;
    }

    async function renderList() {
        const cont = document.getElementById('lista-entradas');
        const snap = await getDocs(collection(db, "global_votes_opera"));
        const dataMap = {}; snap.forEach(d => dataMap[d.id] = d.data());
        cont.innerHTML = '';
        entradasBase.forEach((e, i) => {
            const v = dataMap[e.id] || { totalRating: 0, voteCount: 0, genres: {} };
            const avg = v.voteCount > 0 ? (v.totalRating / v.voteCount).toFixed(1) : "0.0";
            let topG = ""; let maxV = 0; for(let g in v.genres) { if(v.genres[g] > maxV) { maxV = v.genres[g]; topG = g; } }
            const yaV = userVotedTitles.includes(e.id);
            const div = document.createElement('div'); div.className = 'entrada-item';
            div.innerHTML = `<div><b>🎻 ${e.titulo}</b><br><i>${e.autor}</i><br><span class="titulo-ia">✨ IA: ${topG ? e.titulo + " ("+topG+")" : ""}</span></div>
            <div class="controles-votacion"><div class="vote-stats"><span class="rating-avg">⭐ ${avg}</span></div>
            <button class="vote-btn" ${yaV || userVotesCount >= 3 ? 'disabled' : ''} onclick="openVoteModal(${i})">${yaV ? 'Votado' : 'Votar'}</button></div>`;
            cont.appendChild(div);
        });
    }
</script>
</body>
</html>
