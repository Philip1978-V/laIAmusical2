<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>El Secreto del Monte Silencio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f8f3ea;
    --cream-dark: #ede5d4;
    --ink: #2a1f14;
    --ink-light: #6b5a47;
    --gold: #c8a96e;
    --spine: #8b6e50;
  }

  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
  }

  body {
    background: radial-gradient(ellipse at center, #3a2a1a 0%, #1a1008 100%);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-family: 'Crimson Text', Georgia, serif;
    overflow: hidden;
    position: relative;
    padding: 0;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* ── UI WRAPPER ── */
  .ui-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100dvh;
    position: relative;
    z-index: 10;
    padding: 10px 10px 8px;
    gap: 8px;
  }

  /* ── TOP BAR ── */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 440px;
    flex-shrink: 0;
  }

  .book-title-header {
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.75;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
  }

  /* ── AUDIO CONTROLS BAR ── */
  .audio-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
  }
  .audio-bar.visible { opacity: 1; pointer-events: all; }

  .audio-btn {
    background: rgba(200,169,110,0.12);
    border: 1px solid rgba(200,169,110,0.3);
    border-radius: 50%;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
    color: var(--gold);
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .audio-btn:active { background: rgba(200,169,110,0.25); }
  .audio-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  .audio-label {
    font-family: 'Playfair Display', serif;
    font-size: 0.55rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(200,169,110,0.5);
  }

  /* Voice indicator */
  .voice-indicator {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 14px;
  }
  .voice-indicator span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: var(--gold);
    opacity: 0;
    animation: none;
  }
  .voice-indicator.playing span { opacity: 0.7; animation: voiceBar 1s ease-in-out infinite; }
  .voice-indicator.playing span:nth-child(1) { animation-delay: 0s; }
  .voice-indicator.playing span:nth-child(2) { animation-delay: 0.15s; }
  .voice-indicator.playing span:nth-child(3) { animation-delay: 0.3s; }
  .voice-indicator.playing span:nth-child(4) { animation-delay: 0.15s; }
  @keyframes voiceBar {
    0%, 100% { height: 4px; }
    50%       { height: 13px; }
  }

  #musicVolume {
    width: 52px;
    accent-color: var(--gold);
    cursor: pointer;
    vertical-align: middle;
  }

  /* ── BOOK WRAPPER ── */
  .book-wrapper {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  /* ── OPEN HINT ── */
  .open-hint-badge {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(200,169,110,0.15);
    border: 1px solid rgba(200,169,110,0.35);
    backdrop-filter: blur(6px);
    border-radius: 30px;
    padding: 6px 16px;
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 0.66rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    animation: pulseHint 2.4s ease-in-out infinite;
    transition: opacity 0.4s;
    z-index: 30;
    white-space: nowrap;
  }
  .open-hint-badge.hidden { opacity: 0; pointer-events: none; }
  .open-hint-badge svg { opacity: 0.7; flex-shrink: 0; }
  @keyframes pulseHint {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200,169,110,0); }
    50%       { box-shadow: 0 0 0 6px rgba(200,169,110,0.12); }
  }

  /* ── BOOK CARD ── */
  .book-card {
    width: 100%;
    height: 100%;
    border-radius: 14px;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.05),
      inset -3px 0 8px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
    background: var(--cream);
    -webkit-tap-highlight-color: transparent;
  }

  /* Lomo del libro */
  .book-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 8px;
    background: linear-gradient(to right, var(--spine), rgba(139,110,80,0.3));
    z-index: 20;
    pointer-events: none;
  }

  /* ── COVER PAGE ── */
  .cover-page {
    width: 100%;
    height: 100%;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .cover-page img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cover-bg-placeholder {
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, #4a3520, #1a1008);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6rem;
    opacity: 0.5;
  }
  .cover-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, transparent 55%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 28px 24px;
  }
  .cover-overlay h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: #fff;
    line-height: 1.2;
    text-shadow: 0 2px 16px rgba(0,0,0,0.8);
    margin-bottom: 8px;
  }
  .cover-overlay .author {
    font-family: 'Crimson Text', serif;
    font-size: 1rem;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.1em;
  }
  .cover-page::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(200,169,110,0);
    transition: background 0.3s;
    pointer-events: none;
  }
  .cover-page:active::after { background: rgba(200,169,110,0.08); }

  /* ─────────────────────────────────────────────────────────
     STORY PAGE — imagen completa sin ningún recorte
     La página es scrollable verticalmente para que la imagen
     (a altura automática) y el texto se muestren íntegros.
  ───────────────────────────────────────────────────────── */
  .story-page {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    background: var(--cream);
  }

  /* Contenedor de la ilustración: ancho completo, altura automática */
  .page-illustration {
    width: 100%;
    flex-shrink: 0;
    position: relative;
    background: var(--cream-dark);
    line-height: 0;
  }

  /* LA CLAVE: height:auto respeta la proporción original de la imagen */
  .page-illustration img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;  /* nunca recorta */
  }

  .img-placeholder {
    width: 100%;
    padding: 40px 0;
    background: var(--cream-dark);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .img-placeholder svg {
    opacity: 0.15;
    width: 70px; height: 70px;
  }

  /* Degradado suave imagen → texto */
  .page-illustration::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 40px;
    background: linear-gradient(to bottom, transparent, var(--cream));
    pointer-events: none;
  }

  /* Sección de texto */
  .page-text-section {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 16px 22px 20px 26px;
    position: relative;
    background: var(--cream);
  }

  /* Líneas de cuaderno */
  .page-text-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      transparent, transparent 31px,
      rgba(180,160,130,0.13) 31px,
      rgba(180,160,130,0.13) 32px
    );
    background-position: 0 52px;
    pointer-events: none;
  }

  .chapter-label {
    font-family: 'Playfair Display', serif;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 14px;
    opacity: 0.6;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .drop-cap {
    font-family: 'Playfair Display', serif;
    font-size: 4.4rem;
    font-weight: 700;
    line-height: 0.75;
    float: left;
    margin-right: 6px;
    margin-top: 4px;
    color: var(--ink);
  }

  .page-text {
    font-family: 'Crimson Text', serif;
    font-size: 1.12rem;
    line-height: 1.7;
    color: var(--ink);
    text-align: justify;
    position: relative;
    z-index: 1;
  }
  .page-text p { margin-bottom: 0.8em; }
  .page-text p::after { content: ''; display: table; clear: both; }

  .page-number {
    margin-top: 10px;
    text-align: right;
    font-family: 'Playfair Display', serif;
    font-size: 0.72rem;
    color: var(--ink-light);
    opacity: 0.5;
    position: relative;
    z-index: 2;
  }

  /* Indicador "desliza" al final del contenido */
  .swipe-hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 14px 0 16px;
    color: var(--ink-light);
    font-size: 0.65rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-family: 'Playfair Display', serif;
    opacity: 0.4;
    flex-shrink: 0;
    background: var(--cream);
  }

  /* ── NAVIGATION ARROWS ── */
  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(200,169,110,0.15);
    border: 1px solid rgba(200,169,110,0.3);
    border-radius: 50%;
    color: var(--gold);
    cursor: pointer;
    transition: background 0.2s, opacity 0.3s;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(4px);
  }
  .nav-arrow:active { background: rgba(200,169,110,0.3); }
  .nav-arrow.hidden { opacity: 0; pointer-events: none; }
  .nav-arrow svg { width: 16px; height: 16px; }
  .nav-arrow-left  { left: -18px; }
  .nav-arrow-right { right: -18px; }

  /* ── END PAGE ── */
  .end-page {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
  }
  .end-page-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 30px;
    text-align: center;
  }
  .end-page-content .ornament { color: var(--gold); font-size: 1.8rem; opacity: 0.6; }
  .end-page-content h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--ink);
  }
  .end-page-content p {
    font-family: 'Crimson Text', serif;
    font-size: 0.95rem;
    color: var(--ink-light);
    opacity: 0.7;
    letter-spacing: 0.1em;
  }
  .back-btn {
    margin-top: 6px;
    padding: 10px 24px;
    border: 1px solid var(--gold);
    background: none;
    color: var(--ink-light);
    font-family: 'Playfair Display', serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn:active { background: var(--gold); color: var(--cream); }

  /* ── NAV DOTS ── */
  .nav-dots {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    padding: 2px 0;
    z-index: 10;
    position: relative;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(200,169,110,0.3);
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid rgba(200,169,110,0.4);
    -webkit-tap-highlight-color: transparent;
  }
  .dot.active { background: var(--gold); transform: scale(1.3); }

  /* ── PAGE TURN ANIMATIONS ── */
  @keyframes slideInRight {
    from { transform: translateX(100%); opacity: 0.6; }
    to   { transform: translateX(0);    opacity: 1; }
  }
  @keyframes slideInLeft {
    from { transform: translateX(-100%); opacity: 0.6; }
    to   { transform: translateX(0);     opacity: 1; }
  }
  .anim-in-forward  { animation: slideInRight 0.42s cubic-bezier(0.4,0,0.2,1) forwards; }
  .anim-in-backward { animation: slideInLeft  0.42s cubic-bezier(0.4,0,0.2,1) forwards; }
</style>
</head>
<body>

<div class="ui-wrapper">

  <!-- TOP BAR -->
  <div class="top-bar">
    <p class="book-title-header">✦ El Secreto del Monte Silencio ✦</p>

    <!-- Audio controls (visibles al abrir el libro) -->
    <div class="audio-bar" id="audioBar">
      <div class="voice-indicator" id="voiceIndicator">
        <span></span><span></span><span></span><span></span>
      </div>
      <span class="audio-label">Narr.</span>
      <button class="audio-btn" id="btnVoicePause" title="Pausar/Reanudar" onclick="toggleVoicePause()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="iconVoicePause">
          <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
        </svg>
      </button>
      <button class="audio-btn" title="Detener narración" onclick="stopVoice()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="4" y="4" width="16" height="16"/>
        </svg>
      </button>
      <span class="audio-label" style="margin-left:4px;">Mús.</span>
      <button class="audio-btn" title="Silenciar música" onclick="toggleMusic()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="iconMusic">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </button>
      <input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.4"
        title="Volumen música" oninput="setMusicVolume(this.value)">
    </div>
  </div>

  <!-- BOOK WRAPPER -->
  <div class="book-wrapper" id="bookWrapper">

    <!-- Pista "Toca para abrir" -->
    <div class="open-hint-badge" id="openHintBadge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      Toca para abrir
    </div>

    <!-- Flechas de navegación -->
    <div class="nav-arrow nav-arrow-left hidden" id="navLeft" onclick="prevPage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </div>
    <div class="nav-arrow nav-arrow-right hidden" id="navRight" onclick="nextPage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </div>

    <!-- Tarjeta libro -->
    <div class="book-card" id="bookCard"></div>
  </div>

  <!-- NAV DOTS -->
  <div class="nav-dots" id="navDots"></div>

</div>

<script>
/* ============================================================
   ░░  CONFIGURACIÓN DE AUDIO  ░░
   ─────────────────────────────────────────────────────────────
   MÚSICA DE FONDO:
     · Pon la ruta del archivo de música en `MUSIC_SRC`.
     · Se reproducirá en bucle al abrir el libro.
     · Formatos: mp3, ogg, wav
     · Ejemplo: 'audio/musica_fondo.mp3'

   VOZ POR PÁGINA:
     · Cada página de tipo 'story' tiene un campo `voiceSrc`.
     · El audio se reproduce automáticamente al llegar a esa página.
     · Se detiene al pasar de página.
     · Deja '' si esa página no tiene narración.
============================================================ */

const MUSIC_SRC = 'storybook/elsecretodelmonte.mp3';

/* ============================================================
   ░░  CONFIGURACIÓN DEL LIBRO  ░░
   ─────────────────────────────────────────────────────────────
   IMÁGENES:
     · illustrationSrc: ruta relativa a la imagen de la página.
     · coverImg: ruta de la imagen de portada.
     · Deja '' para mostrar fondo neutro.
     · Las imágenes se mostrarán COMPLETAS, sin ningún recorte.

   TEXTO:
     · Edita el campo `text` de cada página.
     · Drop cap automático en la primera letra.
     · Acepta HTML básico: <b>, <i>, <br>

   VOZ:
     · voiceSrc: ruta del audio de narración.
     · Deja '' si no hay narración para esa página.
============================================================ */

const pages = [

  // ── PORTADA ──────────────────────────────────────────────
  {
    type: 'cover',
    coverImg: 'images/secretodelmontesilencio.png',   // ← 'images/portada.jpg'
    title:    'El Secreto del Monte Silencio',
    author:   'De LaIAmusical'
  },

  // ── PÁGINA 1 ─────────────────────────────────────────────
  {
    type: 'story',
    pageNum: 1,
    illustrationSrc: 'storybook/elsecretodelmonte/imagen1.png',
    voiceSrc:        'storybook/elsecretodelmonte/voz1.wav',
    text: `En el pequeño pueblo de Valleclaro, los ancianos siempre hablaban con miedo y respeto del Monte Silencio. Decían que la montaña guardaba las memorias del mundo, pero que solo aquel con el corazón valiente podría escucharlas. Braulio, el viejo relojero del pueblo, le entregó a Leo un mapa antiguo y desgastado, advirtiéndole que el camino no sería fácil.`
  },

  // ── PÁGINA 2 ─────────────────────────────────────────────
  {
    type: 'story',
    pageNum: 2,
    illustrationSrc: 'storybook/elsecretodelmonte/imagen2.png',
    voiceSrc:        'storybook/elsecretodelmonte/voz2.wav',
    text: `Con su mochila amarilla bien ajustada a la espalda, Leo se detuvo sobre el antiguo puente de piedra que marcaba el límite del pueblo. Desde allí, observó la imponente silueta del Monte Silencio. La cima estaba envuelta en nubes oscuras y un aura de misterio que parecía desafiarlo a dar el primer paso hacia lo desconocido.`
  },

  // ── PÁGINA 3 ─────────────────────────────────────────────
  {
    type: 'story',
    pageNum: 3,
    illustrationSrc: 'storybook/elsecretodelmonte/imagen3.png',
    voiceSrc:        'storybook/elsecretodelmonte/voz3.wav',
    text: `La ascensión comenzó bajo un cielo que pronto se tornó gris. A medida que Leo subía por los senderos escarpados, los sonidos del bosque desaparecieron. El canto de los pájaros fue reemplazado por un viento gélido que soplaba entre las rocas. El aislamiento era total, y el joven explorador sentía que cada paso lo alejaba más de la realidad.`
  },

  // ── PÁGINA 4 ─────────────────────────────────────────────
  {
    type: 'story',
    pageNum: 4,
    illustrationSrc: 'storybook/elsecretodelmonte/imagen4.png',
    voiceSrc:        'storybook/elsecretodelmonte/voz4.wav',
    text: `De repente, una niebla espesa y blanca como la leche lo envolvió todo. Leo ya no podía ver el pueblo allá abajo, ni siquiera el sendero bajo sus pies. El silencio era tan profundo que podía escuchar el latido de su propio corazón. Estaba solo en medio de la nada blanca, guiado únicamente por su determinación.`
  },

  // ── PÁGINA 5 ─────────────────────────────────────────────
  {
    type: 'story',
    pageNum: 5,
    illustrationSrc: 'storybook/elsecretodelmonte/imagen5.png',
    voiceSrc:        'storybook/elsecretodelmonte/voz5.wav',
    text: `Al cruzar un estrecho saliente junto a un precipicio que parecía no tener fin, la niebla se partió como una cortina. Allí, incrustada en la pared de roca viva, Leo encontró una grieta vertical que emanaba una luz azul intensa y vibrante. Era la Puerta de la Memoria, el umbral hacia los secretos de la montaña.`
  },

// ── PÁGINA 6 ─────────────────────────────────────────────
  {
    type: 'story',
    pageNum: 6,

/* ============================================================
   FIN DE LA CONFIGURACIÓN — No edites debajo de esta línea
   a menos que quieras modificar el comportamiento del libro.
============================================================ */

// ── AUDIO ENGINE ────────────────────────────────────────────
const musicAudio  = new Audio();
musicAudio.loop   = true;
musicAudio.volume = 0.4;
if (MUSIC_SRC) musicAudio.src = MUSIC_SRC;

let voiceAudio  = null;
let voicePaused = false;
let musicMuted  = false;
let bookOpened  = false;

function startMusic() {
  if (!MUSIC_SRC || musicMuted) return;
  musicAudio.currentTime = 0;
  musicAudio.play().catch(() => {});
}

function stopAllAudio() {
  if (voiceAudio) { voiceAudio.pause(); voiceAudio.currentTime = 0; }
  voicePaused = false;
  setVoiceIndicator(false);
  updatePauseIcon(false);
}

function playPageVoice(src) {
  stopAllAudio();
  if (!src) return;
  voiceAudio = new Audio(src);
  voiceAudio.volume = 1;
  voiceAudio.play().catch(() => {});
  voiceAudio.onplay  = () => { setVoiceIndicator(true);  updatePauseIcon(true); };
  voiceAudio.onended = () => { setVoiceIndicator(false); updatePauseIcon(false); voicePaused = false; };
  voiceAudio.onpause = () => { setVoiceIndicator(false); };
}

function setVoiceIndicator(playing) {
  const el = document.getElementById('voiceIndicator');
  if (el) el.className = 'voice-indicator' + (playing ? ' playing' : '');
}

function updatePauseIcon(isPlaying) {
  const icon = document.getElementById('iconVoicePause');
  if (!icon) return;
  icon.innerHTML = isPlaying
    ? `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`
    : `<polygon points="5 3 19 12 5 21 5 3"/>`;
}

function toggleVoicePause() {
  if (!voiceAudio) return;
  if (voicePaused) {
    voiceAudio.play().catch(() => {});
    voicePaused = false;
    setVoiceIndicator(true);
    updatePauseIcon(true);
  } else {
    voiceAudio.pause();
    voicePaused = true;
    setVoiceIndicator(false);
    updatePauseIcon(false);
  }
}

function stopVoice() {
  if (voiceAudio) {
    voiceAudio.pause();
    voiceAudio.currentTime = 0;
    voicePaused = false;
    setVoiceIndicator(false);
    updatePauseIcon(false);
  }
}

function setMusicVolume(val) {
  musicAudio.volume = parseFloat(val);
  if (parseFloat(val) === 0) {
    musicMuted = true;
    document.getElementById('iconMusic').innerHTML =
      `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
       <line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/>`;
    musicAudio.pause();
  } else if (musicMuted) {
    musicMuted = false;
    document.getElementById('iconMusic').innerHTML =
      `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>`;
    musicAudio.play().catch(() => {});
  }
}

function toggleMusic() {
  musicMuted = !musicMuted;
  const icon   = document.getElementById('iconMusic');
  const slider = document.getElementById('musicVolume');
  if (musicMuted) {
    musicAudio.pause();
    icon.innerHTML = `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      <line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/>`;
    if (slider) slider.value = 0;
  } else {
    musicAudio.volume = 0.4;
    musicAudio.play().catch(() => {});
    icon.innerHTML = `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>`;
    if (slider) slider.value = 0.4;
  }
}

// ── STATE ────────────────────────────────────────────────────
let currentPage = 0;
let animating   = false;

const bookCard  = document.getElementById('bookCard');
const navDotsEl = document.getElementById('navDots');
const navLeft   = document.getElementById('navLeft');
const navRight  = document.getElementById('navRight');

// Drop cap helper
function withDropCap(text) {
  const t = text.trimStart();
  if (!t.length) return text;
  return `<span class="drop-cap">${t.charAt(0)}</span>${t.slice(1)}`;
}

// ── NAV DOTS ────────────────────────────────────────────────
function buildDots() {
  navDotsEl.innerHTML = '';
  pages.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentPage ? ' active' : '');
    d.onclick = () => goToPage(i);
    navDotsEl.appendChild(d);
  });
}

// ── UPDATE NAV ARROWS ────────────────────────────────────────
function updateArrows() {
  const p = pages[currentPage];
  navLeft.classList.toggle('hidden',  !bookOpened || currentPage <= 0);
  navRight.classList.toggle('hidden', !bookOpened || p.type === 'end' || currentPage >= pages.length - 1);
}

// ── RENDER ──────────────────────────────────────────────────
function renderBook(direction) {
  const p     = pages[currentPage];
  const newEl = document.createElement('div');

  // ── PORTADA ──
  if (p.type === 'cover') {
    newEl.className = 'cover-page';
    newEl.innerHTML = p.coverImg
      ? `<img src="${p.coverImg}" alt="Portada">`
      : `<div class="cover-bg-placeholder">⛰</div>`;
    newEl.innerHTML += `
      <div class="cover-overlay">
        <h1>${p.title}</h1>
        <p class="author">${p.author}</p>
      </div>`;
    newEl.onclick = openBook;

  // ── FIN ──
  } else if (p.type === 'end') {
    newEl.className = 'end-page';
    newEl.innerHTML = `
      <div class="end-page-content">
        <div class="ornament">✦ ✦ ✦</div>
        <h2>Fin de la historia</h2>
        <p>LaIAmusical</p>
        <button class="back-btn" onclick="goToPage(0)">Volver al inicio</button>
      </div>`;
    stopAllAudio();

  // ── HISTORIA ──
  } else {
    const imgHtml = p.illustrationSrc
      ? `<img src="${p.illustrationSrc}" alt="Ilustración página ${p.pageNum}">`
      : `<div class="img-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 15l5-5 4 4 3-3 6 6"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
          </svg>
         </div>`;

    newEl.className = 'story-page';
    newEl.innerHTML = `
      <div class="page-illustration">${imgHtml}</div>
      <div class="page-text-section">
        <div class="chapter-label">LaIAmusical</div>
        <div class="page-text"><p>${withDropCap(p.text)}</p></div>
        <div class="page-number">${p.pageNum}</div>
      </div>
      <div class="swipe-hint">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
        Desliza para pasar
      </div>`;
  }

  // ── ANIMAR ──
  if (direction && bookOpened) {
    newEl.style.position = 'absolute';
    newEl.style.inset    = '0';
    newEl.classList.add(direction === 'forward' ? 'anim-in-forward' : 'anim-in-backward');
    bookCard.appendChild(newEl);
    setTimeout(() => {
      while (bookCard.children.length > 1) bookCard.removeChild(bookCard.firstChild);
      newEl.style.position = '';
      newEl.style.inset    = '';
    }, 430);
  } else {
    bookCard.innerHTML = '';
    bookCard.appendChild(newEl);
  }

  buildDots();
  updateArrows();
}

// ── OPEN BOOK ────────────────────────────────────────────────
function openBook() {
  if (!bookOpened) {
    bookOpened = true;
    document.getElementById('openHintBadge').classList.add('hidden');
    document.getElementById('audioBar').classList.add('visible');
    startMusic();
  }
  nextPage();
}

// ── NAVIGATION ──────────────────────────────────────────────
function nextPage() {
  if (currentPage < pages.length - 1) goToPage(currentPage + 1, 'forward');
}
function prevPage() {
  if (currentPage > 0) goToPage(currentPage - 1, 'backward');
}

function goToPage(target, dir) {
  if (animating || target === currentPage || target < 0 || target >= pages.length) return;
  const forward = dir ? dir === 'forward' : target > currentPage;
  animating = true;
  stopAllAudio();
  currentPage = target;
  renderBook(forward ? 'forward' : 'backward');
  setTimeout(() => {
    animating = false;
    const p = pages[currentPage];
    if (p && p.voiceSrc) playPageVoice(p.voiceSrc);
  }, 440);
}

// ── SWIPE GESTURES ───────────────────────────────────────────
let touchStartX = 0;
let touchStartY = 0;

bookCard.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

bookCard.addEventListener('touchend', e => {
  if (!bookOpened) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  // Solo si el gesto horizontal domina claramente al vertical
  if (Math.abs(dx) > Math.abs(dy) * 1.2 && Math.abs(dx) > 45) {
    if (dx < 0) nextPage();
    else        prevPage();
  }
}, { passive: true });

// ── KEYBOARD ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextPage();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prevPage();
});

// ── INIT ─────────────────────────────────────────────────────
renderBook();
</script>
