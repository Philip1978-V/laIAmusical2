<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Secreto del Monte Silencio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f8f3ea;
    --cream-dark: #ede5d4;
    --ink: #2a1f14;
    --ink-light: #6b5a47;
    --gold: #c8a96e;
    --spine: #8b6e50;
  }

  body {
    background: radial-gradient(ellipse at center, #3a2a1a 0%, #1a1008 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Crimson Text', Georgia, serif;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* ── TOP AREA ── */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 820px;
    margin-bottom: 14px;
    z-index: 10;
    position: relative;
  }

  .book-title-header {
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 0.9rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    opacity: 0.75;
  }

  /* ── OPEN HINT (top of cover side) ── */
  .open-hint-wrapper {
    position: absolute;
    top: -46px;
    right: 0;
    width: 50%;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }

  .open-hint-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(200, 169, 110, 0.15);
    border: 1px solid rgba(200, 169, 110, 0.35);
    backdrop-filter: blur(6px);
    border-radius: 30px;
    padding: 7px 18px;
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    animation: pulseHint 2.4s ease-in-out infinite;
    transition: opacity 0.4s;
  }

  .open-hint-badge.hidden { opacity: 0; pointer-events: none; }

  .open-hint-badge svg { opacity: 0.7; flex-shrink: 0; }

  @keyframes pulseHint {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200,169,110,0); }
    50%       { box-shadow: 0 0 0 6px rgba(200,169,110,0.12); }
  }

  /* ── AUDIO CONTROLS BAR ── */
  .audio-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
  }

  .audio-bar.visible { opacity: 1; pointer-events: all; }

  .audio-btn {
    background: rgba(200,169,110,0.12);
    border: 1px solid rgba(200,169,110,0.3);
    border-radius: 50%;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
    color: var(--gold);
    padding: 0;
  }

  .audio-btn:hover { background: rgba(200,169,110,0.25); }

  .audio-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

  .audio-label {
    font-family: 'Playfair Display', serif;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(200,169,110,0.5);
  }

  /* Voice playing indicator */
  .voice-indicator {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 14px;
  }
  .voice-indicator span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: var(--gold);
    opacity: 0;
    animation: none;
  }
  .voice-indicator.playing span { opacity: 0.7; animation: voiceBar 1s ease-in-out infinite; }
  .voice-indicator.playing span:nth-child(1) { animation-delay: 0s; }
  .voice-indicator.playing span:nth-child(2) { animation-delay: 0.15s; }
  .voice-indicator.playing span:nth-child(3) { animation-delay: 0.3s; }
  .voice-indicator.playing span:nth-child(4) { animation-delay: 0.15s; }

  @keyframes voiceBar {
    0%, 100% { height: 4px; }
    50%       { height: 13px; }
  }

  /* ── BOOK WRAPPER ── */
  .book-wrapper {
    position: relative;
    z-index: 10;
    perspective: 2500px;
  }

  .book {
    display: flex;
    width: 820px;
    height: 540px;
    border-radius: 6px 14px 14px 6px;
    box-shadow:
      -8px 0 20px rgba(0,0,0,0.5),
      20px 20px 60px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.04);
    position: relative;
    transform-style: preserve-3d;
  }

  /* Spine */
  .book::before {
    content: '';
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 14px;
    transform: translateX(-50%);
    background: linear-gradient(to right, #5a3e28, var(--spine), #5a3e28);
    z-index: 20;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
  }

  /* ── LEFT PAGE ── */
  .page-left {
    width: 50%;
    height: 100%;
    background: var(--cream);
    border-radius: 6px 0 0 6px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page-left::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 30px; height: 100%;
    background: linear-gradient(to left, rgba(0,0,0,0.12), transparent);
    pointer-events: none;
    z-index: 2;
  }

  .page-left-inner {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  .page-left-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .img-placeholder {
    width: 100%;
    height: 100%;
    background: var(--cream-dark);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .img-placeholder svg {
    opacity: 0.15;
    width: 80px; height: 80px;
  }

  .page-left-inner::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--cream-dark) 45%, transparent 55%);
    border-radius: 6px 0 0 0;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 4;
    pointer-events: none;
  }
  .page-left.clickable:hover .page-left-inner::after { opacity: 1; }

  .back-hint {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-light);
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: 'Playfair Display', serif;
    z-index: 5;
    white-space: nowrap;
    pointer-events: none;
  }
  .back-hint svg { opacity: 0.5; }
  .page-left.clickable:hover .back-hint { opacity: 1; }

  /* ── RIGHT PAGE ── */
  .page-right {
    width: 50%;
    height: 100%;
    background: var(--cream);
    border-radius: 0 14px 14px 0;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    transform-origin: left center;
    transform-style: preserve-3d;
  }

  .page-right:hover .turn-hint { opacity: 1; }

  .page-content {
    padding: 42px 44px 50px 32px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    position: relative;
    z-index: 2;
    backface-visibility: hidden;
  }

  .page-content::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      transparent, transparent 31px,
      rgba(180,160,130,0.13) 31px,
      rgba(180,160,130,0.13) 32px
    );
    background-position: 0 60px;
    pointer-events: none;
  }

  .chapter-label {
    font-family: 'Playfair Display', serif;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 22px;
    opacity: 0.6;
  }

  .drop-cap {
    font-family: 'Playfair Display', serif;
    font-size: 5.2rem;
    font-weight: 700;
    line-height: 0.75;
    float: left;
    margin-right: 8px;
    margin-top: 6px;
    color: var(--ink);
  }

  .page-text {
    font-family: 'Crimson Text', serif;
    font-size: 1.18rem;
    line-height: 1.72;
    color: var(--ink);
    text-align: justify;
    flex: 1;
  }
  .page-text p { margin-bottom: 1em; }

  .page-number {
    position: absolute;
    bottom: 20px; right: 30px;
    font-family: 'Playfair Display', serif;
    font-size: 0.75rem;
    color: var(--ink-light);
    opacity: 0.5;
  }

  .turn-hint {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-light);
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: 'Playfair Display', serif;
    white-space: nowrap;
  }
  .turn-hint svg { opacity: 0.5; }

  .page-right::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 40px; height: 40px;
    background: linear-gradient(225deg, var(--cream-dark) 45%, transparent 55%);
    border-radius: 0 0 14px 0;
    opacity: 0.7;
    z-index: 4;
    transition: opacity 0.2s;
  }
  .page-right:hover::after { opacity: 1; }

  .page-right::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.08) 0%, transparent 12%);
    pointer-events: none;
    z-index: 3;
  }

  /* ── COVER PAGE ── */
  .cover-page {
    width: 50%;
    height: 100%;
    border-radius: 0 14px 14px 0;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transform-origin: left center;
    transform-style: preserve-3d;
  }

  .cover-page img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .cover-bg-placeholder {
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, #4a3520, #1a1008);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5rem;
    opacity: 0.5;
  }

  .cover-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 55%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 30px;
  }

  .cover-overlay h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: #fff;
    line-height: 1.2;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    margin-bottom: 6px;
  }

  .cover-overlay .author {
    font-family: 'Crimson Text', serif;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.1em;
  }

  /* ── BACK COVER ── */
  .back-cover-left {
    width: 100%;
    height: 100%;
    background: #1a1008;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back-cover-left span {
    font-family: 'Playfair Display', serif;
    color: rgba(200,169,110,0.2);
    font-size: 2rem;
    letter-spacing: 0.3em;
  }

  /* ── END PAGE ── */
  .end-page-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 14px;
  }
  .end-page-content .ornament { color: var(--gold); font-size: 1.8rem; opacity: 0.6; }
  .end-page-content h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    color: var(--ink);
    text-align: center;
  }
  .end-page-content p {
    font-family: 'Crimson Text', serif;
    font-size: 0.9rem;
    color: var(--ink-light);
    opacity: 0.7;
    letter-spacing: 0.1em;
  }
  .back-btn {
    margin-top: 10px;
    padding: 8px 20px;
    border: 1px solid var(--gold);
    background: none;
    color: var(--ink-light);
    font-family: 'Playfair Display', serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }
  .back-btn:hover { background: var(--gold); color: var(--cream); }

  /* ── NAV DOTS ── */
  .nav-dots {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    z-index: 10;
    position: relative;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(200,169,110,0.3);
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid rgba(200,169,110,0.4);
  }
  .dot.active { background: var(--gold); transform: scale(1.3); }

  /* ── PAGE TURN ANIMATIONS ── */
  @keyframes turnPageForward {
    0%   { transform: rotateY(0deg); }
    40%  { transform: rotateY(-70deg); box-shadow: -20px 0 40px rgba(0,0,0,0.3); }
    100% { transform: rotateY(-180deg); opacity: 0; }
  }
  @keyframes turnPageBackward {
    0%   { transform: rotateY(0deg); }
    40%  { transform: rotateY(70deg); box-shadow: 20px 0 40px rgba(0,0,0,0.3); }
    100% { transform: rotateY(180deg); opacity: 0; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <p class="book-title-header">✦ El Secreto del Monte Silencio ✦</p>

  <!-- Audio controls (visible once book opens) -->
  <div class="audio-bar" id="audioBar">
    <!-- NARRACIÓN -->
    <div class="voice-indicator" id="voiceIndicator">
      <span></span><span></span><span></span><span></span>
    </div>
    <span class="audio-label">Narración</span>
    <button class="audio-btn" id="btnVoicePause" title="Pausar/Reanudar narración" onclick="toggleVoicePause()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="iconVoicePause">
        <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
      </svg>
    </button>
    <button class="audio-btn" id="btnVoiceStop" title="Detener y reiniciar narración" onclick="stopVoice()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="4" y="4" width="16" height="16"/>
      </svg>
    </button>
    <!-- MÚSICA -->
    <span class="audio-label" style="margin-left:6px;">Música</span>
    <button class="audio-btn" id="btnMusic" title="Silenciar música" onclick="toggleMusic()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="iconMusic">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </button>
    <input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.4"
      title="Volumen música" oninput="setMusicVolume(this.value)"
      style="width:62px; accent-color:var(--gold); cursor:pointer; vertical-align:middle;">
  </div>
</div>

<!-- BOOK -->
<div class="book-wrapper" style="position:relative;">

  <!-- "Clic para abrir" hint shown ABOVE the cover (right half) -->
  <div class="open-hint-wrapper" id="openHintWrapper">
    <div class="open-hint-badge" id="openHintBadge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      Clic en la portada para abrir
    </div>
  </div>

  <div class="book" id="book">
    <div class="page-left" id="pageLeft"></div>
    <div id="pageRight"></div>
  </div>
</div>

<div class="nav-dots" id="navDots"></div>

<script>
/* ============================================================
   ░░  CONFIGURACIÓN DE AUDIO  ░░
   ─────────────────────────────────────────────────────────────
   MÚSICA DE FONDO:
     · Pon la ruta del archivo de música en `musicSrc`.
     · Se reproducirá en bucle al abrir el libro.
     · Formatos compatibles: mp3, ogg, wav
     · Ejemplo: 'audio/musica_fondo.mp3'

   VOZ POR PÁGINA:
     · Cada página de tipo 'story' tiene un campo `voiceSrc`.
     · Pon la ruta del audio de narración de esa página.
     · El audio se reproduce automáticamente al llegar a la página.
     · Se detiene automáticamente al pasar de página.
     · Ejemplo: 'audio/voz_pag1.mp3'
     · Deja '' si esa página no tiene narración.
============================================================ */

const MUSIC_SRC = 'storybook/elsecretodelmonte.mp3';          // ← ej: 'audio/musica_fondo.mp3'

/* ============================================================
   ░░  CONFIGURACIÓN DEL LIBRO  ░░
   ─────────────────────────────────────────────────────────────
   IMÁGENES:
     · illustrationSrc: ruta relativa a la imagen de la página.
     · coverImg: ruta de la imagen de portada.
     · Deja '' para mostrar fondo neutro.

   TEXTO:
     · Edita el campo `text` de cada página.
     · Drop cap automático en la primera letra.
     · Acepta HTML básico: <b>, <i>, <br>

   VOZ:
     · voiceSrc: ruta del audio de narración de esa página.
     · Deja '' si no hay narración para esa página.
============================================================ */

const pages = [

  // ── PORTADA ──────────────────────────────────────────────
  {
    type: 'cover',
    coverImg:  'images/secretomontesilencio.png',                         // ← 'images/portada.jpg'
    title:     'El Secreto del Monte Silencio',
    author:    'De LaIAmusical'
  },

  // ── PÁGINA 1 ─────────────────────────────────────────────
  {
    type: 'story',
    pageNum: 1,
    illustrationSrc: 'storybook/elsecretodelmonte/imagen1.png',                   // ← 'storybook/imagen1.png'
    voiceSrc: 'storybook/elsecretodelmonte/voz1.wav',                          // ← 'storybook/voz1.wav'
    text: `En el pequeño pueblo de Valleclaro, los ancianos siempre hablaban con miedo y respeto del Monte Silencio. Decían que la montaña guardaba las memorias del mundo, pero que solo aquel con el corazón valiente podría escucharlas. Braulio, el viejo relojero del pueblo, le entregó a Leo un mapa antiguo y desgastado, advirtiéndole que el camino no sería fácil.`
  },

  // ── PÁGINA 2 ─────────────────────────────────────────────
  {
    type: 'story',
    pageNum: 2,
    illustrationSrc: 'storybook/elsecretodelmonte/imagen2.png',                   // ← 'imagenes/pag2.jpg'
    voiceSrc: 'storybook/elsecretodelmonte/voz2.wav',                          // ← 'audio/voz_pag2.mp3'
    text: `Con su mochila amarilla bien ajustada a la espalda, Leo se detuvo sobre el antiguo puente de piedra que marcaba el límite del pueblo. Desde allí, observó la imponente silueta del Monte Silencio. La cima estaba envuelta en nubes oscuras y un aura de misterio que parecía desafiarlo a dar el primer paso hacia lo desconocido.`
  },

  // ── PÁGINA 3 ─────────────────────────────────────────────
  {
    type: 'story',
    pageNum: 3,
    illustrationSrc: 'storybook/elsecretodelmonte/imagen3.png',                   // ← 'imagenes/pag3.jpg'
    voiceSrc: 'storybook/elsecretodelmonte/voz3.wav',                          // ← 'audio/voz_pag3.mp3'
    text: `La ascensión comenzó bajo un cielo que pronto se tornó gris. A medida que Leo subía por los senderos escarpados, los sonidos del bosque desaparecieron. El canto de los pájaros fue reemplazado por un viento gélido que soplaba entre las rocas. El aislamiento era total, y el joven explorador sentía que cada paso lo alejaba más de la realidad.`
  },

  // ── PÁGINA 4 ─────────────────────────────────────────────
  {
    type: 'story',
    pageNum: 4,
    illustrationSrc: 'storybook/elsecretodelmonte/imagen4.png',                   // ← 'imagenes/pag4.jpg'
    voiceSrc: 'storybook/elsecretodelmonte/voz4.wav',                          // ← 'audio/voz_pag4.mp3'
    text: `De repente, una niebla espesa y blanca como la leche lo envolvió todo. Leo ya no podía ver el pueblo allá abajo, ni siquiera el sendero bajo sus pies. El silencio era tan profundo que podía escuchar el latido de su propio corazón. Estaba solo en medio de la nada blanca, guiado únicamente por su determinación.`
  },

// ── PÁGINA 5 ─────────────────────────────────────────────
  {
    type: 'story',
    pageNum: 5,
    illustrationSrc: 'storybook/elsecretodelmonte/imagen5.png',                   // ← 'imagenes/pag4.jpg'
    voiceSrc: 'storybook/elsecretodelmonte/voz5.wav',                          // ← 'audio/voz_pag4.mp3'
    text: `Al cruzar un estrecho saliente junto a un precipicio que parecía no tener fin, la niebla se partió como una cortina. Allí, incrustada en la pared de roca viva, Leo encontró una grieta vertical que emanaba una luz azul intensa y vibrante. Era la Puerta de la Memoria, el umbral hacia los secretos de la montaña.`
  },

  // ── PÁGINA FINAL ─────────────────────────────────────────
  { type: 'end' }

];

/* ============================================================
   FIN DE LA CONFIGURACIÓN — No edites debajo de esta línea
   a menos que quieras modificar el comportamiento del libro.
============================================================ */

// ── AUDIO ENGINE ────────────────────────────────────────────
const musicAudio = new Audio();
musicAudio.loop   = true;
musicAudio.volume = 0.4;
if (MUSIC_SRC) musicAudio.src = MUSIC_SRC;

let voiceAudio    = null;
let voicePaused   = false;
let musicMuted    = false;
let bookOpened    = false;

function startMusic() {
  if (!MUSIC_SRC || musicMuted) return;
  musicAudio.currentTime = 0;
  musicAudio.play().catch(() => {});
}

function stopAllAudio() {
  if (voiceAudio) { voiceAudio.pause(); voiceAudio.currentTime = 0; }
  voicePaused = false;
  setVoiceIndicator(false);
  updatePauseIcon(false);
}

function playPageVoice(src) {
  stopAllAudio();
  if (!src) return;
  voiceAudio = new Audio(src);
  voiceAudio.volume = 1;
  voiceAudio.play().catch(() => {});
  voiceAudio.onplay  = () => { setVoiceIndicator(true); updatePauseIcon(true); };
  voiceAudio.onended = () => { setVoiceIndicator(false); updatePauseIcon(false); voicePaused = false; };
  voiceAudio.onpause = () => { setVoiceIndicator(false); };
}

function setVoiceIndicator(playing) {
  const el = document.getElementById('voiceIndicator');
  if (el) el.className = 'voice-indicator' + (playing ? ' playing' : '');
}

function updatePauseIcon(isPlaying) {
  const icon = document.getElementById('iconVoicePause');
  if (!icon) return;
  if (isPlaying) {
    // Show pause bars
    icon.innerHTML = `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;
  } else {
    // Show play triangle
    icon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"/>`;
  }
}

function toggleVoicePause() {
  if (!voiceAudio) return;
  if (voicePaused) {
    // Resume
    voiceAudio.play().catch(() => {});
    voicePaused = false;
    setVoiceIndicator(true);
    updatePauseIcon(true);
  } else {
    // Pause
    voiceAudio.pause();
    voicePaused = true;
    setVoiceIndicator(false);
    updatePauseIcon(false);
  }
}

function stopVoice() {
  if (voiceAudio) {
    voiceAudio.pause();
    voiceAudio.currentTime = 0;
    voicePaused = false;
    setVoiceIndicator(false);
    updatePauseIcon(false);
  }
}

function setMusicVolume(val) {
  musicAudio.volume = parseFloat(val);
  if (parseFloat(val) === 0) {
    musicMuted = true;
    document.getElementById('iconMusic').innerHTML =
      `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
       <line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/>`;
    musicAudio.pause();
  } else if (musicMuted) {
    musicMuted = false;
    document.getElementById('iconMusic').innerHTML =
      `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>`;
    musicAudio.play().catch(() => {});
  }
}

function toggleMusic() {
  musicMuted = !musicMuted;
  const icon = document.getElementById('iconMusic');
  const slider = document.getElementById('musicVolume');
  if (musicMuted) {
    musicAudio.pause();
    icon.innerHTML = `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      <line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/>`;
    if (slider) slider.value = 0;
  } else {
    musicAudio.volume = 0.4;
    musicAudio.play().catch(() => {});
    icon.innerHTML = `<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>`;
    if (slider) slider.value = 0.4;
  }
}

// ── STATE ────────────────────────────────────────────────────
let currentPage = 0;
let animating   = false;

const book      = document.getElementById('book');
const pageLeft  = document.getElementById('pageLeft');
const pageRight = document.getElementById('pageRight');
const navDotsEl = document.getElementById('navDots');

// Drop cap helper
function withDropCap(text) {
  const t = text.trimStart();
  if (!t.length) return text;
  return `<span class="drop-cap">${t.charAt(0)}</span>${t.slice(1)}`;
}

// ── NAV DOTS ────────────────────────────────────────────────
function buildDots() {
  navDotsEl.innerHTML = '';
  pages.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentPage ? ' active' : '');
    d.onclick = () => goToPage(i);
    navDotsEl.appendChild(d);
  });
}

// ── RENDER ──────────────────────────────────────────────────
function renderBook() { renderLeft(); renderRight(); buildDots(); }

function renderLeft() {
  const p         = pages[currentPage];
  const canGoBack = currentPage > 0;

  if (p.type === 'cover') {
    pageLeft.className        = 'page-left';
    pageLeft.style.background = '#1a1008';
    pageLeft.style.cursor     = 'default';
    pageLeft.onclick          = null;
    pageLeft.innerHTML        = `<div class="back-cover-left"><span>✦</span></div>`;
    return;
  }

  pageLeft.style.background = 'var(--cream)';
  pageLeft.className        = 'page-left' + (canGoBack ? ' clickable' : '');
  pageLeft.style.cursor     = canGoBack ? 'pointer' : 'default';
  pageLeft.onclick          = canGoBack ? prevPage : null;

  const imgHtml = p.illustrationSrc
    ? `<img src="${p.illustrationSrc}" alt="Ilustración página ${p.pageNum || ''}">`
    : `<div class="img-placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 15l5-5 4 4 3-3 6 6"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
        </svg>
       </div>`;

  const hintHtml = canGoBack
    ? `<div class="back-hint">
         <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
           <path d="M19 12H5M12 19l-7-7 7-7"/>
         </svg>
         Página anterior
       </div>`
    : '';

  pageLeft.innerHTML = `
    <div class="page-left-inner">
      ${imgHtml}
      ${hintHtml}
    </div>`;
}

function renderRight() {
  const p = pages[currentPage];
  pageRight.style.cssText = '';

  // COVER
  if (p.type === 'cover') {
    pageRight.className = 'cover-page';
    pageRight.innerHTML = `
      ${p.coverImg
        ? `<img src="${p.coverImg}" alt="Portada">`
        : `<div class="cover-bg-placeholder">⛰</div>`}
      <div class="cover-overlay">
        <h1>${p.title}</h1>
        <p class="author">${p.author}</p>
      </div>`;
    pageRight.onclick = openBook;
    return;
  }

  // END
  if (p.type === 'end') {
    pageRight.className       = 'page-right';
    pageRight.style.cursor    = 'default';
    pageRight.innerHTML = `
      <div class="page-content">
        <div class="end-page-content">
          <div class="ornament">✦ ✦ ✦</div>
          <h2>Fin de la historia</h2>
          <p>LaIAmusical</p>
          <button class="back-btn" onclick="goToPage(0)">Volver al inicio</button>
        </div>
        <div class="page-number">${pages.length - 1}</div>
      </div>`;
    pageRight.onclick = null;
    stopAllAudio();
    return;
  }

  // STORY
  pageRight.className = 'page-right';
  pageRight.innerHTML = `
    <div class="page-content">
      <div class="chapter-label">LaIAmusical</div>
      <div class="page-text"><p>${withDropCap(p.text)}</p></div>
      <div class="page-number">${p.pageNum}</div>
      <div class="turn-hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
        Pasar página
      </div>
    </div>`;
  pageRight.onclick = nextPage;
}

// ── OPEN BOOK (cover click) ──────────────────────────────────
function openBook() {
  if (!bookOpened) {
    bookOpened = true;
    // Hide the hint badge
    document.getElementById('openHintBadge').classList.add('hidden');
    // Show audio controls
    document.getElementById('audioBar').classList.add('visible');
    // Start background music
    startMusic();
  }
  nextPage();
}

// ── NAVIGATION ──────────────────────────────────────────────
function nextPage() {
  if (currentPage < pages.length - 1) goToPage(currentPage + 1, 'forward');
}
function prevPage() {
  if (currentPage > 0) goToPage(currentPage - 1, 'backward');
}

function goToPage(target, dir) {
  if (animating || target === currentPage || target < 0 || target >= pages.length) return;
  const forward = dir ? dir === 'forward' : target > currentPage;
  animating = true;

  // Stop current voice before turning
  stopAllAudio();

  const sourceEl = forward ? pageRight : pageLeft;
  const flipEl   = sourceEl.cloneNode(true);

  if (forward) {
    Object.assign(flipEl.style, {
      position: 'absolute', top: '0', left: '50%',
      width: '50%', height: '100%',
      zIndex: '30', transformOrigin: 'left center',
      transformStyle: 'preserve-3d',
      borderRadius: '0 14px 14px 0',
      overflow: 'hidden', pointerEvents: 'none',
      animation: 'turnPageForward 0.65s cubic-bezier(0.4,0,0.2,1) forwards'
    });
  } else {
    Object.assign(flipEl.style, {
      position: 'absolute', top: '0', left: '0',
      width: '50%', height: '100%',
      zIndex: '30', transformOrigin: 'right center',
      transformStyle: 'preserve-3d',
      borderRadius: '6px 0 0 6px',
      overflow: 'hidden', pointerEvents: 'none',
      animation: 'turnPageBackward 0.65s cubic-bezier(0.4,0,0.2,1) forwards'
    });
  }

  book.appendChild(flipEl);

  // Mid-animation content swap
  setTimeout(() => {
    currentPage = target;
    renderLeft();
    buildDots();
  }, 300);

  // End of animation
  setTimeout(() => {
    if (book.contains(flipEl)) book.removeChild(flipEl);
    renderRight();
    animating = false;
    // Play voice for new page
    const p = pages[currentPage];
    if (p && p.voiceSrc) playPageVoice(p.voiceSrc);
  }, 650);
}

// ── INIT ────────────────────────────────────────────────────
renderBook();
</script>
</body>
</html>
