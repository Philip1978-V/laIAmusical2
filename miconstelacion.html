<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Despierta mi constelación</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f8f3ea;
    --cream-dark: #ede5d4;
    --ink: #2a1f14;
    --ink-light: #6b5a47;
    --gold: #c8a96e;
    --spine: #8b6e50;
  }

  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
  }

  body {
    background: radial-gradient(ellipse at center, #3a2a1a 0%, #1a1008 100%);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-family: 'Crimson Text', Georgia, serif;
    overflow: hidden;
    position: relative;
    padding: 0;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* ── UI WRAPPER ── */
  .ui-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100dvh;
    position: relative;
    z-index: 10;
    padding: 10px 10px 8px;
    gap: 8px;
  }

  /* ── TOP BAR ── */
  .top-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    max-width: 440px;
    flex-shrink: 0;
    gap: 6px;
  }

  .book-title-header {
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.75;
    white-space: nowrap;
    flex-shrink: 0;
    text-align: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── AUDIO CONTROLS BAR ── */
  .audio-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
    flex-wrap: wrap;
    width: 100%;
    max-width: 100%;
  }
  .audio-bar.visible { opacity: 1; pointer-events: all; }

  .audio-btn {
    background: rgba(200,169,110,0.12);
    border: 1px solid rgba(200,169,110,0.3);
    border-radius: 50%;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
    color: var(--gold);
    padding: 0;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .audio-btn:active { background: rgba(200,169,110,0.25); }
  .audio-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

  .audio-label {
    font-family: 'Playfair Display', serif;
    font-size: 0.46rem;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: rgba(200,169,110,0.55);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .audio-divider {
    width: 1px;
    height: 18px;
    background: rgba(200,169,110,0.2);
    flex-shrink: 0;
    margin: 0 2px;
  }

  .voice-indicator {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 14px;
    flex-shrink: 0;
  }
  .voice-indicator span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: var(--gold);
    opacity: 0;
    animation: none;
  }
  .voice-indicator.playing span { opacity: 0.7; animation: voiceBar 1s ease-in-out infinite; }
  .voice-indicator.playing span:nth-child(1) { animation-delay: 0s; }
  .voice-indicator.playing span:nth-child(2) { animation-delay: 0.15s; }
  .voice-indicator.playing span:nth-child(3) { animation-delay: 0.3s; }
  .voice-indicator.playing span:nth-child(4) { animation-delay: 0.15s; }
  @keyframes voiceBar {
    0%, 100% { height: 4px; }
    50%       { height: 13px; }
  }

  #musicVolume {
    width: 44px;
    accent-color: var(--gold);
    cursor: pointer;
    vertical-align: middle;
    flex-shrink: 0;
  }

  /* ── BOOK WRAPPER ── */
  .book-wrapper {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    overflow: hidden;
  }

  .open-hint-badge {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(200,169,110,0.15);
    border: 1px solid rgba(200,169,110,0.35);
    backdrop-filter: blur(6px);
    border-radius: 30px;
    padding: 6px 16px;
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 0.66rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    animation: pulseHint 2.4s ease-in-out infinite;
    transition: opacity 0.4s;
    z-index: 30;
    white-space: nowrap;
  }
  .open-hint-badge.hidden { opacity: 0; pointer-events: none; }
  .open-hint-badge svg { opacity: 0.7; flex-shrink: 0; }
  @keyframes pulseHint {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200,169,110,0); }
    50%       { box-shadow: 0 0 0 6px rgba(200,169,110,0.12); }
  }

  /* ── BOOK CARD ── */
  .book-card {
    width: 100%;
    height: 100%;
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05), inset -3px 0 8px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
    background: var(--cream);
    -webkit-tap-highlight-color: transparent;
    perspective: 1400px;
  }

  .book-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 8px;
    background: linear-gradient(to right, var(--spine), rgba(139,110,80,0.3));
    z-index: 20;
    pointer-events: none;
  }

  /* ── COVER PAGE ── */
  .cover-page {
    width: 100%;
    height: 100%;
    position: relative;
    cursor: pointer;
    overflow: hidden;
  }
  .cover-page img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cover-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 60%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 30px 24px;
  }
  .cover-overlay h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.9rem;
    color: #fff;
    line-height: 1.2;
    text-shadow: 0 2px 16px rgba(0,0,0,0.8);
    margin-bottom: 8px;
  }
  .cover-overlay .author {
    font-family: 'Crimson Text', serif;
    font-size: 1.1rem;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.1em;
  }

  /* ── STORY PAGE ── */
  .story-page {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    background: var(--cream);
  }

  .page-illustration {
    width: 100%;
    flex-shrink: 0;
    position: relative;
    background: var(--cream-dark);
    line-height: 0;
  }
  .page-illustration img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }

  .page-illustration::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    box-shadow: inset 0 30px 22px -8px var(--cream), inset 0 -42px 28px -8px var(--cream), inset 28px 0 22px -8px var(--cream), inset -28px 0 22px -8px var(--cream);
  }

  .page-text-section {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 16px 22px 20px 26px;
    position: relative;
    background: var(--cream);
  }

  .chapter-label {
    font-family: 'Playfair Display', serif;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 14px;
    opacity: 0.6;
    position: relative;
    z-index: 1;
  }

  .drop-cap {
    font-family: 'Playfair Display', serif;
    font-size: 4.4rem;
    font-weight: 700;
    line-height: 0.75;
    float: left;
    margin-right: 8px;
    margin-top: 4px;
    color: var(--ink);
  }

  .page-text {
    font-family: 'Crimson Text', serif;
    font-size: 1.15rem;
    line-height: 1.7;
    color: var(--ink);
    text-align: justify;
    position: relative;
    z-index: 1;
  }
  .page-text p { margin-bottom: 0.8em; }

  .page-number {
    margin-top: 10px;
    text-align: right;
    font-family: 'Playfair Display', serif;
    font-size: 0.75rem;
    color: var(--ink-light);
    opacity: 0.5;
  }

  /* ── NAVIGATION ── */
  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(200,169,110,0.22);
    border: 1.5px solid rgba(200,169,110,0.7);
    border-radius: 50%;
    color: var(--gold);
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.3s;
  }
  .nav-arrow.hidden { opacity: 0; pointer-events: none; }
  .nav-arrow-left  { left: 6px; }
  .nav-arrow-right { right: 6px; }

  .nav-dots { display: flex; gap: 8px; padding: 2px 0; z-index: 10; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(200,169,110,0.3); cursor: pointer; transition: all 0.3s; }
  .dot.active { background: var(--gold); transform: scale(1.3); }

  /* ── ANIMATIONS ── */
  @keyframes pageFlipInForward {
    0%   { transform: perspective(1400px) rotateY(-88deg); opacity: 0; }
    100% { transform: perspective(1400px) rotateY(0deg); opacity: 1; }
  }
  @keyframes pageFlipInBackward {
    0%   { transform: perspective(1400px) rotateY(88deg); opacity: 0; }
    100% { transform: perspective(1400px) rotateY(0deg); opacity: 1; }
  }
  .anim-in-forward  { animation: pageFlipInForward 0.45s ease-out both; transform-origin: left center; }
  .anim-in-backward { animation: pageFlipInBackward 0.45s ease-out both; transform-origin: right center; }
</style>
</head>
<body>

<div class="ui-wrapper">
  <div class="top-bar">
    <p class="book-title-header">✦ Despierta mi constelación ✦</p>
    <div class="audio-bar" id="audioBar">
      <div class="voice-indicator" id="voiceIndicator"><span></span><span></span><span></span><span></span></div>
      <span class="audio-label">NARRADOR</span>
      <button class="audio-btn" id="btnVoicePause" onclick="toggleVoicePause()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="iconVoicePause">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
      <div class="audio-divider"></div>
      <span class="audio-label">MÚSICA</span>
      <button class="audio-btn" onclick="toggleMusic()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="iconMusic">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </button>
      <input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.4" oninput="setMusicVolume(this.value)">
    </div>
  </div>

  <div class="book-wrapper" id="bookWrapper">
    <div class="open-hint-badge" id="openHintBadge">Toca para abrir</div>
    <div class="nav-arrow nav-arrow-left hidden" id="navLeft" onclick="prevPage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="nav-arrow nav-arrow-right hidden" id="navRight" onclick="nextPage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
    </div>
    <div class="book-card" id="bookCard"></div>
  </div>

  <div class="nav-dots" id="navDots"></div>
</div>

<script>
const MUSIC_SRC = 'storycard/miconstelacion.mp3';

const pages = [
  {
    type: 'cover',
    coverImg: 'storycard/miconstelacion/portada.png',
    title: 'Despierta mi constelación',
    author: 'De LaIAmusical'
  },
  {
    type: 'story',
    pageNum: 1,
    chapterTitle: 'Capítulo 1: La estrella que se apaga',
    illustrationSrc: 'storycard/miconstelacion/imagen1.png',
    voiceSrc: 'storycard/miconstelacion/voz1.wav',
    text: 'En un mundo bañado por la luz de las estrellas, cada persona nacía con una marca en su muñeca: una constelación personal que le otorgaba un poder único. Elara, sin embargo, era la excepción. Su muñeca estaba desnuda, salvo por una diminuta y casi imperceptible mancha de luz, una estrella solitaria y moribunda que nunca había brillado. Mientras los demás niños manifestaban dones asombrosos —la fuerza de Hércules, la velocidad de Perseo—, Elara permanecía sin poder, una sombra en un universo de luz. Su mundo se enfrentaba a una amenaza silenciosa: el Vacío, una oscuridad reptante que devoraba las constelaciones en el cielo. Cuando una estrella caía, su portador en la tierra se convertía en un "Hueco", una cáscara vacía sin recuerdos ni poder. La aldea de Elara, antes vibrante, se estaba convirtiendo en un pueblo de fantasmas. Ella observaba con impotencia cómo la constelación de su padre, el robusto Boyero, parpadeaba y se desvanecía. El miedo era un nudo constante en su garganta. Una noche, mientras el cielo se oscurecía un poco más, una anciana cuya constelación casi se había extinguido la llamó. "Hay una leyenda", susurró con voz temblorosa, "sobre alguien que nacerá sin estrella. No como una carencia, sino como un lienzo en blanco. Solo esa persona puede encontrar y despertar la Piedra Solar, un artefacto capaz de reavivar la luz de todas las constelaciones".'
  },
  {
    type: 'story',
    pageNum: 2,
    chapterTitle: 'Capítulo 2: La llamada del eclipse',
    illustrationSrc: 'storycard/miconstelacion/imagen2.png',
    voiceSrc: 'storycard/miconstelacion/voz2.wav',
    text: 'La leyenda se convirtió en una necesidad desesperada cuando el Vacío atacó la aldea. No con sigilo, sino con una furia hambrienta. Bestias hechas de sombras se materializaron, y sus garras no herían la carne, sino la luz. Elara vio con horror cómo un zarcillo de oscuridad rozaba a su madre. La constelación de Casiopea en su muñeca parpadeó violentamente y luego se apagó. Su madre la miró, pero sus ojos ya no la reconocían. El dolor se transformó en determinación. Elara no podía quedarse a esperar. Empacó lo poco que tenía y se dispuso a buscar la mítica Piedra Solar. En las afueras de la aldea, se encontró con Kael, un guerrero cuya constelación de Orión, el Cazador, ardía con una luz desafiante, aunque inestable. Él había visto caer ciudades enteras y, aunque cínico sobre las viejas leyendas, estaba dispuesto a luchar. "No creo en cuentos de hadas", dijo Kael, con la mirada fija en el horizonte oscuro, "pero sí creo en la supervivencia. La leyenda dice que la Piedra Solar se encuentra en la Aguja Celeste. Es un largo camino". Elara asintió. Juntos, partieron hacia la torre que, según los mitos, rozaba las propias estrellas.'
  },
  {
    type: 'story',
    pageNum: 3,
    chapterTitle: 'Capítulo 3: El bosque de estrellas susurrantes',
    illustrationSrc: 'storycard/miconstelacion/imagen3.png',
    voiceSrc: 'storycard/miconstelacion/voz3.wav',
    text: 'Su viaje los llevó al Bosque de los Susurros, un lugar donde los árboles ancestrales habían atrapado la luz de las estrellas en su savia. Pero ahora, el bosque moría. La luz era tenue y parpadeante, y las sombras entre los troncos eran más profundas que nunca. Las bestias del Vacío los acechaban, atraídas por la brillante constelación de Kael como polillas a una llama agonizante. Kael luchó con una destreza increíble. Su arco disparaba flechas de luz pura que desintegraban a las criaturas. Sin embargo, su poder era errático. En medio de un salto, la luz de su muñeca vaciló y cayó pesadamente. Una bestia se abalanzó sobre él, pero Elara, usando su ingenio, arrojó una savia pegajosa y brillante a los ojos de la criatura, cegándola lo suficiente para que Kael se recuperara. A pesar de no tener poder, demostró que su valor era real.'
  },
  {
    type: 'story',
    pageNum: 4,
    chapterTitle: 'Capítulo 4: La ciudad de los cielos rotos',
    illustrationSrc: 'storycard/miconstelacion/imagen4.png',
    voiceSrc: 'storycard/miconstelacion/voz4.wav',
    text: 'Llegaron a Aethel, la Ciudad de los Cielos Rotos. Antaño una metrópolis resplandeciente, ahora era una ruina donde solo unas pocas constelaciones rebeldes parpadeaban en el firmamento devorado por el Vacío. Los supervivientes se aferraban a la vida en facciones enfrentadas: algunos buscaban poder en la oscuridad, otros protegían los últimos vestigios de su cultura. Para encontrar el camino a la Aguja Celeste, necesitaban información. Se adentraron en las ruinas, donde encontraron a Lyra, una erudita cuya constelación de Libra, fuente de su vasto conocimiento, apenas era visible. "La Aguja es real", confirmó, entregándoles un mapa celestial grabado en un trozo de obsidiana. "Pero está custodiada. No por bestias, sino por algo mucho más antiguo. Un Guardián Celestial que no pone a prueba la fuerza, sino el corazón".'
  },
  {
    type: 'story',
    pageNum: 5,
    chapterTitle: 'Capítulo 5: El Guardián de la Aguja',
    illustrationSrc: 'storycard/miconstelacion/imagen5.png',
    voiceSrc: 'storycard/miconstelacion/voz5.wav',
    text: 'La Aguja Celeste era una torre imposible de cristal y luz que se alzaba hasta perforar el velo de la noche. En su entrada, una figura hecha de puro resplandor estelar les bloqueó el paso: el Guardián Celestial. "Solo aquellos con un propósito puro pueden entrar", resonó su voz, que no era un sonido, sino un sentimiento. El Guardián enfrentó a Kael con sus mayores miedos: la imagen de todos a los que no pudo salvar, el terror de convertirse en un Hueco. La luz de Orión parpadeó, y Kael cayó de rodillas, abrumado. Luego, el Guardián se volvió hacia Elara. La enfrentó con su propia nada, con su sentimiento de ser una inútil, una pieza defectuosa en el universo. Pero Elara, en lugar de quebrarse, levantó la vista. "No tengo poder que proteger", dijo con una calma sorprendente. "No tengo una constelación que perder. Solo estoy aquí por ellos. Por todos los que se están apagando". El Guardián se hizo a un lado. "Tu vacío no es una carencia", resonó. "Es un recipiente. No naciste para tener una constelación. Naciste para contenerlas a todas".'
  },
  {
    type: 'story',
    pageNum: 6,
    chapterTitle: 'Capítulo 6: La cámara de los ecos',
    illustrationSrc: 'storycard/miconstelacion/imagen6.png',
    voiceSrc: 'storycard/miconstelacion/voz6.wav',
    text: 'En el corazón de la Aguja, encontraron la Piedra Solar. Era un cristal colosal, pero oscuro y sin vida. Cuando Elara lo tocó, su mente fue inundada por visiones. Vio la creación del cosmos, el nacimiento de las constelaciones y el origen del Vacío. Comprendió que el Vacío no era malvado por naturaleza, sino una fuerza de equilibrio cósmico. La noche que sigue al día. Pero su agresión actual no era natural. Vio a un rey de antaño, cuyo poder se desvanecía, intentando acaparar toda la luz de las estrellas para sí mismo. Al hacerlo, rompió el equilibrio, dando al Vacío una grieta por la que podía devorarlo todo. La Piedra Solar no era una fuente de poder, sino un ancla que mantenía ese equilibrio. Y solo alguien sin una constelación propia podía restaurarla.'
  },
  {
    type: 'story',
    pageNum: 7,
    chapterTitle: 'Capítulo 7: La traición',
    illustrationSrc: 'storycard/miconstelacion/imagen7.png',
    voiceSrc: 'storycard/miconstelacion/voz7.wav',
    text: 'Justo cuando Elara se preparaba para verter su esencia en la Piedra, una nueva figura apareció en la cámara. Era Cygnus, un hombre carismático cuya constelación del Cisne brillaba con una luz negra y absorbente. Era un descendiente de aquel rey que rompió el equilibrio y creía que la solución no era restaurar la luz, sino controlar la oscuridad. "El futuro no está en esas luces moribundas", dijo Cygnus, extendiendo una mano hacia Elara. "Está en el Vacío. Únete a mí y gobernaremos un imperio eterno de sombras". Kael se interpuso, y las luces de Orión y el Cisne Negro chocaron en una batalla espectacular. Mientras luchaban, Elara se dio cuenta de la terrible verdad: no podía simplemente "despertar" la Piedra. Necesitaba un ancla opuesta, una constelación que representara el poder del Vacío. Necesitaba a Cygnus.'
  },
  {
    type: 'story',
    pageNum: 8,
    chapterTitle: 'Capítulo 8: El sacrificio del cazador',
    illustrationSrc: 'storycard/miconstelacion/imagen8.png',
    voiceSrc: 'storycard/miconstelacion/voz8.wav',
    text: 'La batalla era desigual. El poder de Cygnus era constante y voraz, mientras que el de Kael parpadeaba, fallándole en los momentos cruciales. Cygnus desarmó a Kael y se preparó para dar el golpe final. "Eres un eco del pasado", se burló. En ese instante, Kael miró a Elara y sonrió, una sonrisa triste pero decidida. "Mi luz nunca fue para mí", dijo. Y con un último grito de guerra, canalizó toda la esencia restante de su constelación, no hacia Cygnus, sino hacia Elara. Una ola de luz pura y dorada la envolvió. La estrella solitaria en su muñeca explotó en un torbellino de colores. Cuando la luz se disipó, Kael cayó al suelo. La marca de Orión en su muñeca había desaparecido por completo. Se había convertido en un Hueco.'
  },
  {
    type: 'story',
    pageNum: 9,
    chapterTitle: 'Capítulo 9: Despierta, mi constelación',
    illustrationSrc: 'storycard/miconstelacion/imagen9.png',
    voiceSrc: 'storycard/miconstelacion/voz9.wav',
    text: 'Elara sintió el poder de Orión ardiendo dentro de ella, junto a la energía que Cygnus emanaba. Se dio cuenta de que no tenía que derrotarlo. Tenía que equilibrarlo. Corrió hacia la Piedra Solar, colocando una mano sobre su superficie fría. Con la otra mano, agarró la de Cygnus. "¡Tú necesitas mi poder!", gritó él, tratando de soltarse. "No", respondió ella, su voz resonando con la fuerza de mil estrellas. "La Piedra te necesita a ti". El poder de Orión surgió de ella como un sol naciente, mientras que la oscuridad de Cygnus era absorbida como una noche infinita. La luz y la sombra se entrelazaron dentro de la Piedra Solar. La estrella solitaria de Elara se expandió, transformándose en una galaxia en espiral en su piel. Era la Constelación Cero, el punto de equilibrio.'
  },
  {
    type: 'story',
    pageNum: 10,
    chapterTitle: 'Capítulo 10: La nueva aurora',
    illustrationSrc: 'storycard/miconstelacion/imagen10.png',
    voiceSrc: 'storycard/miconstelacion/voz10.wav',
    text: 'La Piedra Solar pulsó una vez, y una onda de energía pura recorrió el mundo. En el cielo, las estrellas devoradas por el Vacío comenzaron a parpadear, una por una, hasta volver a la vida. Abajo, en la tierra, los Huecos se detuvieron. La luz regresó a sus ojos, y las constelaciones reaparecieron en sus muñecas, débiles pero presentes. Cygnus, drenado de su poder oscuro, se desplomó. La Piedra lo había dejado con una sola estrella tenue, como la que Elara solía tener. Era una segunda oportunidad. Elara se arrodilló junto a Kael. Su rostro estaba en blanco, pero ella le tomó la mano. En su muñeca desnuda, dibujó con su dedo la forma del Cazador. Una diminuta chispa de luz apareció. No era la vieja constelación, sino el comienzo de una nueva, un recuerdo de su sacrificio. El mundo estaba a salvo, pero cambiado. El Vacío no había sido destruido, sino apaciguado, devuelto a su ciclo natural. Y Elara, la chica que nació sin estrella, se había convertido en su guardiana, el faro que velaría para que la noche nunca más devorara por completo al día. Su constelación no era una sola forma en el cielo, sino la promesa de todas ellas, brillando en una nueva aurora.'
  },
  { type: 'end' }
];

let musicAudio = new Audio(MUSIC_SRC);
musicAudio.loop = true;
musicAudio.volume = 0.4;
let voiceAudio = null;
let currentPage = 0;
let bookOpened = false;
let voicePaused = false;

function renderBook(dir) {
  const p = pages[currentPage];
  const card = document.getElementById('bookCard');
  const newEl = document.createElement('div');
  
  if(p.type === 'cover') {
    newEl.className = 'cover-page';
    newEl.innerHTML = `<img src="${p.coverImg}" alt="${p.title}"><div class="cover-overlay"><h1>${p.title}</h1><p class="author">${p.author}</p></div>`;
    newEl.onclick = openBook;
  } else if(p.type === 'end') {
    newEl.className = 'story-page';
    newEl.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:40px;">
      <h2 style="font-family:'Playfair Display';color:var(--gold);">Fin de la aventura</h2>
      <p style="margin:20px 0;opacity:0.7;">Gracias por leer "Despierta mi constelación"</p>
      <button onclick="goToPage(0)" style="background:none;border:1px solid var(--gold);color:var(--gold);padding:10px 20px;cursor:pointer;">Volver al inicio</button>
    </div>`;
  } else {
    newEl.className = 'story-page';
    newEl.innerHTML = `
      <div class="page-illustration"><img src="${p.illustrationSrc}" alt="${p.chapterTitle}"></div>
      <div class="page-text-section">
        <div class="chapter-label">${p.chapterTitle}</div>
        <div class="page-text"><span class="drop-cap">${p.text.charAt(0)}</span>${p.text.slice(1)}</div>
        <div class="page-number">${p.pageNum}</div>
      </div>`;
  }

  if(dir) newEl.classList.add(dir === 'forward' ? 'anim-in-forward' : 'anim-in-backward');
  card.innerHTML = '';
  card.appendChild(newEl);
  updateUI();
}

function openBook() {
  bookOpened = true;
  document.getElementById('openHintBadge').classList.add('hidden');
  document.getElementById('audioBar').classList.add('visible');
  musicAudio.play();
  nextPage();
}

function updateUI() {
  document.getElementById('navLeft').classList.toggle('hidden', currentPage === 0);
  document.getElementById('navRight').classList.toggle('hidden', currentPage === pages.length - 1 || !bookOpened);
  const dots = document.getElementById('navDots');
  dots.innerHTML = '';
  pages.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentPage ? ' active' : '');
    d.onclick = () => goToPage(i);
    dots.appendChild(d);
  });
}

function nextPage() { if(currentPage < pages.length - 1) goToPage(currentPage + 1, 'forward'); }
function prevPage() { if(currentPage > 0) goToPage(currentPage - 1, 'backward'); }

function goToPage(index, dir) {
  if(voiceAudio) { voiceAudio.pause(); voiceAudio = null; }
  setVoiceIndicator(false);
  currentPage = index;
  renderBook(dir);
  if(pages[currentPage].voiceSrc) {
    voiceAudio = new Audio(pages[currentPage].voiceSrc);
    voiceAudio.play();
    setVoiceIndicator(true);
    voiceAudio.onended = () => setVoiceIndicator(false);
  }
}

function setVoiceIndicator(play) {
  document.getElementById('voiceIndicator').classList.toggle('playing', play);
  const icon = document.getElementById('iconVoicePause');
  icon.innerHTML = play ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>' : '<polygon points="5 3 19 12 5 21 5 3"/>';
}

function toggleVoicePause() {
  if(!voiceAudio) return;
  if(voiceAudio.paused) { voiceAudio.play(); setVoiceIndicator(true); }
  else { voiceAudio.pause(); setVoiceIndicator(false); }
}

function toggleMusic() {
  if(musicAudio.paused) musicAudio.play();
  else musicAudio.pause();
}

function setMusicVolume(v) { musicAudio.volume = v; }

renderBook();
</script>
