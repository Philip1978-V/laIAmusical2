<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificaciones - La IA Musical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f172a;
            background-image: url('./images/fondo3.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            padding-bottom: 3rem;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(20, 184, 166, 0.3);
            border-radius: 1.5rem;
        }

        .podium-card {
            transition: transform 0.3s ease;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(20, 184, 166, 0.2);
        }

        .podium-card:hover {
            transform: translateY(-10px);
            border-color: rgba(20, 184, 166, 0.6);
        }

        .user-row {
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
        }

        .user-row:hover {
            background: rgba(20, 184, 166, 0.1);
        }

        .rank-badge {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: bold;
        }

        .gold { background: linear-gradient(135deg, #fbbf24, #d97706); box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); }
        .silver { background: linear-gradient(135deg, #cbd5e1, #64748b); }
        .bronze { background: linear-gradient(135deg, #d97706, #78350f); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #0d9488; border-radius: 10px; }
    </style>
</head>
<body>

    <header class="p-4 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 shadow-lg border-b border-teal-800">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-gradient-to-r from-teal-600 to-cyan-600 hover:from-teal-500 hover:to-cyan-500 transition-all duration-300 shadow-lg">
                    <i class="fas fa-music text-xl text-white"></i>
                    <span class="font-bold tracking-wide text-white uppercase" data-i18n="header.title">La IA Musical</span>
                </a>
            </div>
            <div class="flex items-center gap-4">
                <a href="perfil.html" class="text-teal-400 hover:text-teal-200 transition font-medium text-sm uppercase">
                    <i class="fas fa-user-circle mr-1"></i> <span data-i18n="nav.perfil">Mi Perfil</span>
                </a>
                <button onclick="logout()" class="text-gray-400 hover:text-white transition flex items-center gap-2 py-1 px-3 rounded-md bg-slate-800 hover:bg-slate-700" data-i18n="header.salir">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 mt-8">
        <!-- Título -->
        <div class="text-center mb-10">
            <h2 class="text-4xl font-black text-white uppercase tracking-tighter mb-2 italic">
                <i class="fas fa-trophy text-amber-500 mr-3"></i>
                <span data-i18n="rankings.global_title">Ranking de Usuarios</span>
            </h2>
            <p class="text-teal-400 font-medium" data-i18n="rankings.subtitle">Los mejores melómanos de la comunidad</p>
        </div>

        <!-- SECCIÓN TOP 3 DE LA SEMANA -->
        <section class="mb-12">
            <h3 class="text-xl font-bold text-teal-300 uppercase mb-6 flex items-center gap-2">
                <i class="fas fa-calendar-week"></i> <span data-i18n="rankings.top_week">Top 3 de la Semana</span>
            </h3>
            <div id="podium-container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- El podio se carga aquí dinámicamente -->
                <div class="col-span-full text-center py-10 text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i> Cargando...</div>
            </div>
        </section>

        <!-- SECCIÓN RANKING GENERAL -->
        <section>
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h3 class="text-xl font-bold text-teal-300 uppercase flex items-center gap-2">
                    <i class="fas fa-list-ol"></i> <span data-i18n="rankings.top_general">Clasificación General</span>
                </h3>
                
                <div class="flex gap-2 p-1 bg-slate-900/50 rounded-full border border-teal-900/50">
                    <button onclick="changeCriteria('userStars')" id="btn-stars" class="px-4 py-1.5 rounded-full text-xs font-bold transition-all">
                        <i class="fas fa-star mr-1"></i> <span data-i18n="perfil.label_estrellas">Estrellas</span>
                    </button>
                    <button onclick="changeCriteria('userDiamonds')" id="btn-diamonds" class="px-4 py-1.5 rounded-full text-xs font-bold transition-all text-gray-400">
                        <i class="fas fa-gem mr-1"></i> <span data-i18n="perfil.label_diamantes">Diamantes</span>
                    </button>
                </div>
            </div>

            <div class="glass-panel overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/50 text-teal-300 text-[10px] uppercase tracking-widest border-b border-teal-900">
                            <th class="p-4 w-20 text-center" data-i18n="rankings.pos">Pos</th>
                            <th class="p-4" data-i18n="rankings.user">Usuario</th>
                            <th class="p-4 hidden md:table-cell" data-i18n="perfil.label_rank">Rango</th>
                            <th class="p-4 text-right" data-i18n="rankings.score">Puntos</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-body">
                        <!-- Filas cargadas dinámicamente -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDW3Yv0AQAVlf3zTuxlqNq6dkZ6kQtpysM",
            authDomain: "laiamusical-4fba7.firebaseapp.com",
            projectId: "laiamusical-4fba7",
            storageBucket: "laiamusical-4fba7.firebasestorage.app",
            messagingSenderId: "49783369602",
            appId: "1:49783369602:web:91e287c094a8f2403d699b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const translations = {
            es: {
                "header.title": "La IA Musical",
                "header.salir": "Salir",
                "nav.perfil": "Mi Perfil",
                "rankings.global_title": "Ranking de Usuarios",
                "rankings.subtitle": "Los mejores melómanos de la comunidad",
                "rankings.top_week": "Top 3 de la Semana",
                "rankings.top_general": "Clasificación General",
                "rankings.pos": "Pos",
                "rankings.user": "Usuario",
                "rankings.score": "Puntos",
                "perfil.label_estrellas": "Estrellas",
                "perfil.label_diamantes": "Diamantes",
                "perfil.label_rank": "Rango",
                "rankings.anonimo": "Anónimo"
            },
            en: {
                "header.title": "The Musical AI",
                "header.salir": "Logout",
                "nav.perfil": "My Profile",
                "rankings.global_title": "User Rankings",
                "rankings.subtitle": "The best music lovers in the community",
                "rankings.top_week": "Weekly Top 3",
                "rankings.top_general": "General Standing",
                "rankings.pos": "Rank",
                "rankings.user": "User",
                "rankings.score": "Score",
                "perfil.label_estrellas": "Stars",
                "perfil.label_diamantes": "Diamonds",
                "perfil.label_rank": "Rank",
                "rankings.anonimo": "Anonymous"
            }
        };

        function getRankName(stars) {
            if (stars > 13000) return "DIOS IA";
            if (stars > 8500) return "Leyenda";
            if (stars > 5200) return "Maestro";
            if (stars > 2800) return "Virtuoso";
            if (stars > 1200) return "Melómano";
            if (stars > 400) return "Aprendiz";
            return "Novato";
        }

        let currentCriteria = 'userStars';

        async function loadRankings() {
            const podiumContainer = document.getElementById('podium-container');
            const rankingBody = document.getElementById('ranking-body');
            const lang = localStorage.getItem('selectedLanguage') || 'es';

            updateButtonsUI();

            try {
                const snapshot = await db.collection('users')
                    .orderBy(currentCriteria, 'desc')
                    .limit(50)
                    .get();

                const users = [];
                snapshot.forEach(doc => users.push({ id: doc.id, ...doc.data() }));

                // Renderizar Podio (Top 3)
                podiumContainer.innerHTML = '';
                const top3 = users.slice(0, 3);
                
                // Reordenar para visual (2, 1, 3)
                const podiumOrder = [top3[1], top3[0], top3[2]];

                podiumOrder.forEach((user, index) => {
                    if (!user) return;
                    const realPos = users.indexOf(user) + 1;
                    const colorClass = realPos === 1 ? 'gold' : (realPos === 2 ? 'silver' : 'bronze');
                    const icon = realPos === 1 ? 'fa-crown' : 'fa-medal';
                    
                    podiumContainer.innerHTML += `
                        <div class="podium-card p-6 rounded-2xl text-center flex flex-col items-center ${realPos === 1 ? 'md:-mt-6 border-amber-500/40 bg-slate-800/80 shadow-2xl' : ''}">
                            <div class="rank-badge ${colorClass} mb-4 text-xl">
                                <i class="fas ${icon}"></i>
                            </div>
                            <div class="w-16 h-16 rounded-full bg-slate-700 mb-3 border-2 border-teal-500/30 flex items-center justify-center">
                                <i class="fas fa-user text-2xl text-slate-400"></i>
                            </div>
                            <h4 class="font-bold text-lg truncate w-full">${user.displayName || user.userName || translations[lang]['rankings.anonimo']}</h4>
                            <p class="text-teal-400 text-xs font-bold uppercase mb-2">${getRankName(user.userStars || 0)}</p>
                            <div class="bg-slate-900/80 px-4 py-1 rounded-full border border-teal-900">
                                <span class="font-black text-white">${(user[currentCriteria] || 0).toLocaleString()}</span>
                                <i class="fas ${currentCriteria === 'userStars' ? 'fa-star text-yellow-400' : 'fa-gem text-blue-400'} text-xs"></i>
                            </div>
                        </div>
                    `;
                });

                // Renderizar Tabla General (del 4 al 50)
                rankingBody.innerHTML = '';
                const restUsers = users.slice(3);

                restUsers.forEach((user, index) => {
                    const pos = index + 4;
                    const isMe = auth.currentUser && user.id === auth.currentUser.uid;
                    
                    rankingBody.innerHTML += `
                        <tr class="user-row ${isMe ? 'bg-teal-900/20' : ''}">
                            <td class="p-4 text-center font-bold text-gray-500 text-sm">#${pos}</td>
                            <td class="p-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center border border-slate-700">
                                        <i class="fas fa-user text-xs text-slate-500"></i>
                                    </div>
                                    <span class="font-bold text-sm ${isMe ? 'text-teal-400' : ''}">${user.displayName || user.userName || translations[lang]['rankings.anonimo']}</span>
                                </div>
                            </td>
                            <td class="p-4 hidden md:table-cell">
                                <span class="text-[10px] px-2 py-0.5 rounded bg-slate-800 border border-slate-700 text-teal-500 font-bold uppercase">
                                    ${getRankName(user.userStars || 0)}
                                </span>
                            </td>
                            <td class="p-4 text-right font-black text-sm ${currentCriteria === 'userStars' ? 'text-yellow-500/80' : 'text-blue-500/80'}">
                                ${(user[currentCriteria] || 0).toLocaleString()}
                                <i class="fas ${currentCriteria === 'userStars' ? 'fa-star' : 'fa-gem'} ml-1 text-[10px]"></i>
                            </td>
                        </tr>
                    `;
                });

            } catch (error) {
                console.error("Error:", error);
            }
        }

        function changeCriteria(c) {
            currentCriteria = c;
            loadRankings();
        }

        function updateButtonsUI() {
            const starBtn = document.getElementById('btn-stars');
            const gemBtn = document.getElementById('btn-diamonds');
            
            if (currentCriteria === 'userStars') {
                starBtn.className = "px-4 py-1.5 rounded-full text-xs font-bold bg-teal-600 text-white shadow-lg";
                gemBtn.className = "px-4 py-1.5 rounded-full text-xs font-bold text-gray-400 hover:text-white";
            } else {
                gemBtn.className = "px-4 py-1.5 rounded-full text-xs font-bold bg-blue-600 text-white shadow-lg";
                starBtn.className = "px-4 py-1.5 rounded-full text-xs font-bold text-gray-400 hover:text-white";
            }
        }

        function applyTranslations() {
            const lang = localStorage.getItem('selectedLanguage') || 'es';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = translations[lang][key] || key;
            });
        }

        function logout() {
            auth.signOut().then(() => window.location.href = 'index.html');
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyTranslations();
            loadRankings();
        });
    </script>
</body>
</html>
