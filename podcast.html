        // Mapa de categoría interna (ES, usada como clave de filtrado) -> clave de traducción de categoría
        const podcastCategoryKeyMap = {
            "Literatura": "podcast.cat_literatura",

            "Animación": "podcast.cat_animacion",
            "Extras y documentales": "podcast.cat_extras",

            "Series": "podcast.cat_series",
            "Animes": "podcast.cat_animes"
        };

        function pGetCurrentLanguage() {
            return localStorage.getItem('selectedLanguage') || 'es';
        }

        function pt(key, lang) {
            const l = lang || pGetCurrentLanguage();
            return (podcastTranslations[l] && podcastTranslations[l][key])
                || (podcastTranslations['es'] && podcastTranslations['es'][key])
                || key;
        }

        // Devuelve el texto visible (traducido) de una categoría interna
        function pCategoryLabel(categoryKey, lang) {
            const transKey = podcastCategoryKeyMap[categoryKey];
            return transKey ? pt(transKey, lang) : categoryKey;
        }

        // Devuelve { title, suggestedTitle } de un episodio en el idioma activo
        function pEpisodeText(episode, lang) {
            const l = lang || pGetCurrentLanguage();
            if (l === 'en' && podcastEpisodeTranslationsEN[episode.id]) {
                return {
                    title: podcastEpisodeTranslationsEN[episode.id].title,
                    suggestedTitle: podcastEpisodeTranslationsEN[episode.id].suggestedTitle
                };
            }
            return { title: episode.title, suggestedTitle: episode.suggestedTitle };
        }

        function pSetLanguage(lang) {
            localStorage.setItem('selectedLanguage', lang);
            document.documentElement.lang = lang;

            // Actualizar todos los elementos con data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const val = pt(key, lang);
                if (val) el.textContent = val;
            });

            // Título de la pestaña del navegador
            document.title = pt('podcast.titulo_pagina', lang);

            // Re-renderizar el listado de episodios si ya hay un tema seleccionado
            if (typeof currentTheme !== 'undefined' && currentTheme && typeof renderPodcastList === 'function') {
                renderPodcastList(currentTheme);
                const headerTitle = document.getElementById('header-title');
                const themeName = document.getElementById('current-theme-name');
                if (headerTitle) {
                    headerTitle.innerHTML = `${pt('podcast.header_titulo_base', lang)} <span style="display: block; font-size: 0.9em;">${pCategoryLabel(currentTheme, lang)}</span>`;
                }
                if (themeName) {
                    themeName.textContent = pCategoryLabel(currentTheme, lang);
                }
            }

            // Sincronizar la interfaz del selector de idioma
            pUpdateLanguageSelectorUI(lang);
        }

        // --- SELECTOR DE IDIOMA / LANGUAGE SELECTOR (UI) ---
        function pUpdateLanguageSelectorUI(lang) {
            const selectedLanguageLabel = document.getElementById('selectedLanguageLabel');
            const dropdown = document.getElementById('languageDropdown');
            const options = dropdown ? dropdown.querySelectorAll('.language-option') : null;

            if (selectedLanguageLabel) {
                selectedLanguageLabel.textContent = lang === 'en' ? 'EN' : 'ES';
            }
            if (options) {
                options.forEach(option => {
                    option.classList.toggle('active', option.dataset.lang === lang);
                });
            }
        }

        function toggleLanguageDropdown() {
            const dropdown = document.getElementById('languageDropdown');
            const toggle = document.getElementById('languageToggle');
            if (!dropdown || !toggle) return;
            const isOpen = dropdown.classList.toggle('open');
            toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        }
        window.toggleLanguageDropdown = toggleLanguageDropdown;

        function selectLanguage(lang) {
            pSetLanguage(lang);
            const dropdown = document.getElementById('languageDropdown');
            const toggle = document.getElementById('languageToggle');
            if (dropdown) dropdown.classList.remove('open');
            if (toggle) toggle.setAttribute('aria-expanded', 'false');
        }
        window.selectLanguage = selectLanguage;

        // Cerrar el desplegable al hacer clic fuera de él
        document.addEventListener('click', function (e) {
            const languageSelector = document.getElementById('languageSelector');
            const languageDropdown = document.getElementById('languageDropdown');
            const languageToggle = document.getElementById('languageToggle');
            if (languageDropdown && languageToggle && languageSelector && !languageSelector.contains(e.target)) {
                languageDropdown.classList.remove('open');
                languageToggle.setAttribute('aria-expanded', 'false');
            }
        });

        // Escuchar cambios de idioma desde otras páginas (index.html, login.html, etc.)
        window.addEventListener('storage', function (e) {
            if (e.key === 'selectedLanguage' && e.newValue) {
                pSetLanguage(e.newValue);
            }
        });
    </script>

        /* ESTILOS UNIFICADOS Y VANGUARDISTAS PARA LOS BOTONES DEL MODAL */

        /* Ajuste para que los botones de cabecera se muestren debajo del título en el centro */

        }
        
        /* --- MEDIA QUERIES PARA ADAPTACIÓN MÓVIL (MODIFICADO AQUÍ) --- */

            .modal-inner-content {

            background: rgba(20, 184, 166, 0.3);
            border-color: rgba(20, 184, 166, 0.4);
        }

        .language-dropdown {
            position: absolute;
            top: calc(100% + 0.5rem);

            min-width: 170px;
            background: rgba(8, 51, 68, 0.97);
            border: 1px solid rgba(20, 184, 166, 0.25);

            <span id="selectedLanguageLabel">ES</span>

        // --- FUNCIONES DEL MODAL ---
        function showModal() {
            document.getElementById('theme-modal').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
        }

        function hideModal() {
            document.getElementById('theme-modal').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
        }

        function selectTheme(theme) {
            currentTheme = theme;
            // La lógica para que el título no se recorte se mantiene en JS
            document.getElementById('header-title').innerHTML = `${pt('podcast.header_titulo_base')} <span style="display: block; font-size: 0.9em;">${pCategoryLabel(theme)}</span>`;
            document.getElementById('current-theme-name').textContent = pCategoryLabel(theme);
            renderPodcastList(theme);
            hideModal();
        }

        // --- FUNCIÓN DE RENDERIZADO FILTRADO ---
        function renderPodcastList(filterTheme) {
            const listContainer = document.getElementById('podcastList');
            let html = '';
            const lang = pGetCurrentLanguage();
            
            // 1. Filtrar los episodios por el tema seleccionado
            const filteredEpisodes = podcastEpisodes.filter(episode => episode.category === filterTheme);

            if (filteredEpisodes.length === 0) {
                listContainer.innerHTML = `<p class="text-xl text-center text-cyan-200 col-span-full">
                    ${pt('podcast.no_episodios', lang).replace('{tema}', pCategoryLabel(filterTheme, lang))}
                </p>`;
                return;
            }

            // 2. Generar el HTML para los episodios filtrados
            filteredEpisodes.forEach((episode) => {
                
                // Textos del episodio en el idioma activo (title / suggestedTitle)
                const episodeText = pEpisodeText(episode, lang);
                const categoryLabel = pCategoryLabel(episode.category, lang);

                // Variables de estilo y contenido para la tarjeta
                let cardClasses = "podcast-card backdrop-blur-sm rounded-xl overflow-hidden shadow-2xl transition-all duration-300 ";
                let titleClasses = "text-2xl font-bold mb-2 leading-snug transition-colors";
                let labelClasses = "text-sm font-light text-yellow-300 mb-1";
                let labelText = `${categoryLabel} | ${pt('podcast.label_episodio', lang)} #${episode.id}`;
                let originalWorkText; 
                let audioLinkText = pt('podcast.escuchar_audio', lang); // Texto por defecto

                // Asignar estilos basados en la categoría
                switch(episode.category) {
                    case "Literatura":
                        cardClasses += "bg-cyan-900/50 border border-cyan-700/50 hover:shadow-cyan-400/30";
                        originalWorkText = `${pt('podcast.obra_original', lang)}: ${episodeText.title} (${episode.author})`;
                        if (episode.id === 0) { // Estilo especial para la Presentación (ID 0)
                            labelText = pt('podcast.presentacion', lang);
                            labelClasses = "text-sm font-bold text-teal-300 mb-1";
                            cardClasses = cardClasses.replace("bg-cyan-900/50", "bg-teal-900/50");
                            titleClasses = 'text-2xl font-bold mb-2 leading-snug text-cyan-300';
                        }
                        break;
                    case "Cine":
                        cardClasses += "bg-purple-900/50 border border-purple-500/50 hover:shadow-purple-400/50";
                        originalWorkText = `${pt('podcast.pelicula_saga', lang)}: ${episodeText.title} (${episode.author})`;
                        titleClasses += " text-purple-300";
                        audioLinkText = pt('podcast.ver_escuchar_fuente', lang);
                        break;
                    case "Extras y documentales": // CATEGORÍA DEL BOTÓN Y DEL DATA
                        cardClasses += "bg-purple-900/50 border border-purple-500/50 hover:shadow-purple-400/50";
                        originalWorkText = `${pt('podcast.documental_saga', lang)}: ${episodeText.title} (${episode.author})`;
                        titleClasses += " text-purple-300";
                        audioLinkText = pt('podcast.ver_escuchar_fuente', lang);
                        break;
                    case "Animes":
                        cardClasses += "bg-pink-900/50 border border-pink-500/50 hover:shadow-pink-400/50";
                        originalWorkText = `${pt('podcast.anime_estudio', lang)}: ${episodeText.title} (${episode.author})`;
                        titleClasses += " text-pink-300";
                        audioLinkText = pt('podcast.ver_escuchar_fuente', lang);
                        break;
                    case "Series":
                        cardClasses += "bg-gray-900/50 border border-gray-700/50 hover:shadow-gray-400/50";
                        originalWorkText = `${pt('podcast.serie', lang)}: ${episodeText.title} (${episode.author})`;
                        titleClasses += " text-gray-300";
                        audioLinkText = pt('podcast.ver_escuchar_fuente', lang);
                        break;
                    case "Animación":
                        cardClasses += "bg-orange-900/50 border border-orange-500/50 hover:shadow-orange-400/50";
                        originalWorkText = `${pt('podcast.cuento', lang)}: ${episodeText.title} (${episode.author})`;
                        titleClasses += " text-orange-300";
                        break;
                    case "Ópera y conciertos":
                        cardClasses += "bg-rose-900/50 border border-rose-500/50 hover:shadow-rose-400/50";
                        originalWorkText = `${pt('podcast.obra', lang)}: ${episodeText.title} (${episode.author})`;
                        titleClasses += " text-rose-300";
                        break;
                    case "Teatro y Musicales":
                        cardClasses += "bg-green-900/50 border border-green-500/50 hover:shadow-green-400/50";
                        originalWorkText = `${pt('podcast.obra', lang)}: ${episodeText.title} (${episode.author})`;
                        titleClasses += " text-green-300";
                        break;
                    default:
                        cardClasses += "bg-gray-800/50 border border-gray-600/50";
                        originalWorkText = `${pt('podcast.fuente', lang)}: ${episodeText.title} (${episode.author})`;
                        titleClasses += " text-gray-300";
                }
                
                // Si la URL es placeholder, ajustamos el texto del enlace
                if (episode.audioUrl === "#") {
                    audioLinkText = pt('podcast.proximamente', lang);
                }

                html += `
                    <div class="${cardClasses}">
                        <div class="block">
                            <div class="overflow-hidden">
                                <img src="${episode.image}" alt="${episodeText.title}" 
                                     class="podcast-img w-full h-48 object-cover" />
                            </div>
                            <div class="p-6">
                                <p class="${labelClasses}">
                                    ${labelText}
                                </p>
                                <h3 class="${titleClasses}">
                                    ${episodeText.suggestedTitle}
                                </h3>
                                <p class="text-cyan-200 text-base">${originalWorkText}</p>
                                
                                <a href="${episode.audioUrl}" target="_blank" rel="noopener noreferrer" class="mt-4 flex items-center justify-between group">
                                    <span class="text-teal-400 font-semibold flex items-center gap-2 group-hover:text-yellow-300 transition-colors">
                                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                                        </svg>
                                        ${audioLinkText} </span>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
        }

        // --- Carga inicial: aplicar idioma activo y mostrar el modal ---
        window.onload = function () {
            pSetLanguage(pGetCurrentLanguage());
            showModal();
        };
    </script>
</body>
</html>
