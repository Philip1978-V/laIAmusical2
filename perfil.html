<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - La IA Musical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f172a; 
            background: linear-gradient(180deg, #0f172a 0%, #0d9488 100%);
            min-height: 100vh;
            color: white;
            padding-bottom: 3rem; 
        }

        .scroll-container {
            overflow-x: auto;
            scrollbar-width: none;
            display: flex;
            gap: 1rem;
            padding: 10px;
        }

        .scroll-container::-webkit-scrollbar { display: none; }

        .song-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #134e4a;
            flex: 0 0 auto;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .song-card:hover { transform: translateY(-5px); border-color: #2dd4bf; }

        .mission-item {
            background: rgba(15, 23, 42, 0.5);
            border-left: 4px solid #0d9488;
        }
    </style>
</head>
<body>

    <header class="p-4 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 shadow-lg border-b border-teal-800">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="temas.html" class="text-xl font-bold tracking-wide text-white hover:text-teal-200 transition-colors uppercase">
                    La IA Musical
                </a>
            </div>
            <button onclick="logout()" class="text-gray-400 hover:text-white transition flex items-center gap-2 py-1 px-3 rounded-md bg-slate-800 hover:bg-slate-700">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 mt-6">

        <div class="bg-slate-800 p-6 rounded-xl shadow-2xl border border-teal-700 mb-8">
            <div class="flex flex-col md:flex-row items-center gap-6">
                <div class="flex-grow text-center md:text-left">
                    <h2 id="userNameDisplay" class="text-3xl font-bold text-teal-200 mb-1 italic">Cargando...</h2>
                    <p id="userEmailDisplay" class="text-gray-400 text-sm mb-4">...</p>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 bg-slate-900 p-4 rounded-lg border border-teal-800">
                        <div class="text-center">
                            <i class="fas fa-star text-yellow-400 text-2xl"></i>
                            <p id="userStarsDisplay" class="text-xl font-bold mt-1">0</p>
                            <span class="text-[10px] text-gray-400 uppercase">Estrellas</span>
                        </div>
                        <div class="text-center">
                            <i class="fas fa-gem text-blue-400 text-2xl"></i>
                            <p id="userDiamondsDisplay" class="text-xl font-bold mt-1">0</p>
                            <span class="text-[10px] text-gray-400 uppercase">Diamantes</span>
                        </div>
                        <div class="text-center">
                            <i class="fas fa-coins text-amber-500 text-2xl"></i>
                            <p id="userCoinsDisplay" class="text-xl font-bold mt-1">0</p>
                            <span class="text-[10px] text-gray-400 uppercase">Monedas</span>
                        </div>
                        <div class="text-center">
                            <i class="fas fa-vote-yea text-teal-400 text-2xl"></i>
                            <p id="votesRemainingDisplay" class="text-xl font-bold mt-1">0/5</p>
                            <span class="text-[10px] text-gray-400 uppercase">Votos</span>
                        </div>
                    </div>
                </div>

                <div class="w-full md:w-auto flex flex-col items-center bg-slate-900/50 p-6 rounded-xl border border-dashed border-teal-600">
                    <i class="fas fa-gift text-3xl text-amber-500 mb-2"></i>
                    <p class="text-xs text-center text-gray-300 mb-3 font-bold uppercase">Premio Diario</p>
                    <button id="dailyRewardBtn" onclick="claimDailyReward()" class="bg-teal-600 hover:bg-teal-500 disabled:bg-slate-700 text-white font-bold py-2 px-8 rounded-full transition-all shadow-lg text-sm">
                        RECLAMAR 10 <i class="fas fa-coins text-yellow-400 ml-1"></i>
                    </button>
                    <p id="dailyRewardTimer" class="text-[10px] mt-2 text-teal-400 hidden italic">Reclamado hoy</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-8">
                <section>
                    <h3 class="text-2xl font-bold mb-4 text-teal-300 flex items-center uppercase tracking-tighter">
                        <i class="fas fa-layer-group mr-3"></i> Mis Cartas Coleccionadas
                    </h3>
                    <div id="votedSongsContainerWrapper" class="scroll-container min-h-[210px] bg-slate-900/40 rounded-xl border border-slate-800">
                        </div>
                </section>

                <section>
                    <h3 class="text-xl font-bold mb-4 text-teal-300 flex items-center uppercase">
                        <i class="fas fa-history mr-2"></i> Mi Actividad Reciente
                    </h3>
                    <div id="activityLogContainer" class="space-y-2">
                        </div>
                </section>
            </div>

            <div class="lg:col-span-1 space-y-8">
                <section>
                    <h3 class="text-xl font-bold mb-4 text-teal-300 flex items-center"><i class="fas fa-award mr-2"></i> Mi Rango</h3>
                    <div id="userRankContainer" class="bg-slate-800 p-4 rounded-xl border border-teal-700"></div>
                </section>

                <section>
                    <h3 class="text-xl font-bold mb-4 text-amber-400 flex items-center">
                        <i class="fas fa-star mr-2"></i> Objetivos Semanales
                    </h3>
                    <div id="missionsContainer" class="space-y-3 bg-slate-800/50 p-4 rounded-xl border border-amber-600/20"></div>
                </section>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDW3Yv0AQAVlf3zTuxlqNq6dkZ6kQtpysM",
            authDomain: "laiamusical-4fba7.firebaseapp.com",
            projectId: "laiamusical-4fba7",
            storageBucket: "laiamusical-4fba7.firebasestorage.app",
            messagingSenderId: "49783369602",
            appId: "1:49783369602:web:91e287c094a8f2403d699b",
            measurementId: "G-WC2JT6DRF4"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let userProfileData = {};

        // Base de datos sincronizada con reproductor.html
        const songsList = [
            { id: 5, title: "El lenguaje del mundo", cover: "./imagenportada/lit_alquimista.png" },
            { id: 6, title: "El ciclo de Macondo", cover: "./imagenportada/lit_soledad.png" },
            { id: 10, title: "La Reina de la Noche", cover: "./imagenportada/mus_flauta.png" },
            { id: 14, title: "La oferta que no pudo rechazar", cover: "./imagenportada/cin_padrino.png" },
            { id: 1, title: "Sinfonía del Nuevo Mundo", cover: "./imagenportada2/default.jpg" }
        ];

        async function renderVotedSongs(voteLog) {
            const container = document.getElementById('votedSongsContainerWrapper');
            const votedIds = Object.keys(voteLog || {});
            
            if (votedIds.length === 0) {
                container.innerHTML = '<div class="w-full text-center py-10 text-gray-500 text-sm">Vota canciones en el reproductor para ver tus cartas aquí.</div>';
                return;
            }

            container.innerHTML = '';
            for (const songId of votedIds) {
                const song = songsList.find(s => s.id == songId);
                if (song) {
                    const starsGiven = voteLog[songId];
                    const card = document.createElement('div');
                    card.className = 'w-44 song-card overflow-hidden shadow-2xl';
                    card.innerHTML = `
                        <img src="${song.cover}" class="w-full h-28 object-cover opacity-80">
                        <div class="p-3 bg-slate-800">
                            <h4 class="text-[9px] font-black truncate text-white mb-2 uppercase tracking-tighter">${song.title}</h4>
                            <div class="flex justify-between text-[9px] bg-slate-900/80 p-1.5 rounded">
                                <span class="text-gray-500 uppercase">Tu Voto</span>
                                <span class="text-yellow-400 font-bold">${starsGiven}★</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            }
        }

        function renderActivity(log) {
            const container = document.getElementById('activityLogContainer');
            container.innerHTML = '';
            if (!log || log.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-xs py-4">Sin actividad reciente registrada.</p>';
                return;
            }

            log.slice(-5).reverse().forEach(entry => {
                const div = document.createElement('div');
                div.className = "flex items-center p-3 bg-slate-800/60 rounded-lg border border-slate-700/50 text-[10px]";
                let icon = entry.type === 'vote' ? 'fa-star text-yellow-500' : 'fa-gift text-amber-500';
                
                div.innerHTML = `
                    <i class="fas ${icon} mr-3 text-sm"></i>
                    <div class="flex-grow">
                        <span class="text-gray-200 font-bold uppercase mr-1">[${entry.type}]</span>
                        <span class="text-gray-400">${entry.description}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderMissions(data) {
            const container = document.getElementById('missionsContainer');
            const missions = [
                { t: "Votos Semanales", c: (5 - (data.votesRemaining || 0)), g: 5, r: "50★" },
                { t: "Premios Diarios", c: (data.activityLog || []).filter(a => a.type === 'reward').length, g: 7, r: "20💰" }
            ];
            container.innerHTML = '';
            missions.forEach(m => {
                const perc = Math.min((m.c / m.g) * 100, 100);
                container.innerHTML += `
                    <div class="mission-item p-3 rounded-r-lg">
                        <div class="flex justify-between text-[10px] mb-1">
                            <span class="font-bold text-gray-200 uppercase">${m.t}</span>
                            <span class="font-black text-amber-500">${m.r}</span>
                        </div>
                        <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-teal-500 h-full" style="width: ${perc}%"></div>
                        </div>
                    </div>`;
            });
        }

        async function claimDailyReward() {
            const userRef = db.collection('users').doc(auth.currentUser.uid);
            const today = new Date().toISOString().split('T')[0];
            if (userProfileData.lastClaimDate === today) return;

            await userRef.update({
                userCoins: (userProfileData.userCoins || 0) + 10,
                lastClaimDate: today,
                activityLog: firebase.firestore.FieldValue.arrayUnion({
                    type: 'reward',
                    description: 'Recogiste el regalo de 10 monedas',
                    timestamp: new Date().toISOString()
                })
            });
        }

        function updateUI(data) {
            userProfileData = data;
            document.getElementById('userNameDisplay').textContent = data.username || "Músico";
            document.getElementById('userEmailDisplay').textContent = auth.currentUser.email;
            document.getElementById('userStarsDisplay').textContent = data.userStars || 0;
            document.getElementById('userDiamondsDisplay').textContent = data.userDiamonds || 0;
            document.getElementById('userCoinsDisplay').textContent = data.userCoins || 0;
            document.getElementById('votesRemainingDisplay').textContent = `${data.votesRemaining || 0}/5`;

            // Lógica botón regalo
            const btn = document.getElementById('dailyRewardBtn');
            const timer = document.getElementById('dailyRewardTimer');
            const today = new Date().toISOString().split('T')[0];
            if (data.lastClaimDate === today) {
                btn.disabled = true;
                btn.innerHTML = 'RECLAMADO';
                timer.classList.remove('hidden');
            } else {
                btn.disabled = false;
                btn.innerHTML = 'RECLAMAR 10 <i class="fas fa-coins text-yellow-400 ml-1"></i>';
                timer.classList.add('hidden');
            }

            // Barra de rango
            const progress = Math.min(((data.userStars || 0) / 500) * 100, 100);
            document.getElementById('userRankContainer').innerHTML = `
                <div class="flex justify-between text-[10px] mb-1 font-bold"><span class="text-teal-400 uppercase">Novato</span><span class="text-gray-500">${data.userStars || 0}/500★</span></div>
                <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden"><div class="bg-teal-500 h-full" style="width: ${progress}%"></div></div>`;

            renderVotedSongs(data.voteLog || {});
            renderActivity(data.activityLog || []);
            renderMissions(data);
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection('users').doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) updateUI(doc.data());
                });
            } else {
                window.location.href = 'index.html';
            }
        });

        function logout() { auth.signOut(); }
    </script>
</body>
</html>
