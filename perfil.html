<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - La IA Musical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f172a;
            background-image: url('./images/fondo3.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: white;
            padding-bottom: 3rem;
        }

        /* Rank progress bar animation */
        .rank-progress {
            transition: width 0.8s ease-in-out;
        }

        /* Marker card hover */
        .marker-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .marker-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(13, 148, 136, 0.3);
        }

        /* Rank container glow */
        .rank-container {
            background: linear-gradient(135deg, rgba(13,148,136,0.15) 0%, rgba(15,23,42,0.9) 100%);
            border: 1px solid rgba(45, 212, 191, 0.3);
        }

        /* Tier badge */
        .tier-badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .tier-novato     { background: rgba(45,212,191,0.15); color: #2dd4bf; border: 1px solid #2dd4bf44; }
        .tier-aprendiz   { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid #4ade8044; }
        .tier-melomano   { background: rgba(96,165,250,0.15); color: #60a5fa; border: 1px solid #60a5fa44; }
        .tier-virtuoso   { background: rgba(192,132,252,0.15); color: #c084fc; border: 1px solid #c084fc44; }
        .tier-maestro    { background: rgba(251,191,36,0.15);  color: #fbbf24; border: 1px solid #fbbf2444; }
        .tier-leyenda    { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid #f8717144; }
        .tier-legend     { background: rgba(253,224,71,0.2);   color: #fde047; border: 1px solid #fde04744; }

        /* ─── ACTIVIDAD RECIENTE ─── */
        .activity-item {
            animation: slideIn 0.3s ease-out both;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-16px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        #activityPanel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1), opacity 0.35s ease;
            opacity: 0;
        }
        #activityPanel.open {
            max-height: 900px;
            opacity: 1;
        }
        .badge-act {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 1px 8px; border-radius: 4px;
            font-size: 9px; font-weight: 800; letter-spacing: 0.08em;
            text-transform: uppercase; color: #fff; flex-shrink: 0;
        }
        .badge-voto   { background: #0d9488; }
        .badge-prize  { background: #d97706; }
        .badge-quiz   { background: #0891b2; }
        .badge-canje  { background: #16a34a; }
        .badge-mision { background: #7c3aed; }
    </style>
</head>

                      hover:from-teal-500 hover:to-cyan-500 transition-all duration-300 shadow-lg hover:-translate-y-0.5">
                <i class="fas fa-music text-xl text-white"></i>
                <span class="font-bold tracking-wide text-white uppercase" data-i18n="header.title">La IA Musical</span>
            </a>
            <button onclick="logout()"
                    class="text-gray-400 hover:text-white transition flex items-center gap-2 py-1 px-3 rounded-md bg-slate-800 hover:bg-slate-700"
                    data-i18n="header.salir">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </header>

                    <span class="text-[10px] text-gray-400 uppercase tracking-wide" data-i18n="perfil.label_estrellas">Estrellas</span>

                </div>

                    <span class="text-[10px] text-gray-400 uppercase tracking-wide" data-i18n="perfil.label_monedas">Monedas</span>

                <div class="marker-card text-center bg-slate-800/60 rounded-lg p-2 flex flex-col items-center gap-1">
                    <i class="fas fa-vote-yea text-teal-400 text-xl"></i>

                </div>

                <!-- RANK BADGE -->

                    <i id="userRankIcon" class="fas fa-medal text-teal-400 text-xl"></i>
                    <p id="userRankLevel" class="text-base font-bold leading-none">1</p>
                    <span id="userRankName" class="text-[10px] text-gray-400 uppercase tracking-wide">Rank</span>
                </div>

                <!-- BONUSES -->
                <div class="marker-card text-center bg-slate-800/60 rounded-lg p-2 flex flex-col items-center gap-1">
                    <i class="fas fa-ticket text-orange-400 text-xl"></i>

        </div>

        <!-- ── MY RANK ── -->
        <section>

                <i class="fas fa-award mr-3"></i>

            </h3>

                    <i class="fas fa-spinner fa-spin mr-2"></i>

                </div>
            </div>
        </section>

        <!-- ══════════════════ ACTIVIDAD RECIENTE ══════════════════ -->
        <section>
            <!-- Toggle button — fully i18n -->
            <button id="btnActivity"
                    onclick="toggleActivity()"
                    class="w-full flex items-center justify-between px-5 py-4 rounded-2xl
                           bg-gradient-to-r from-teal-700/40 to-cyan-800/30
                           border border-teal-600/50 hover:border-teal-400/70
                           transition-all duration-300 hover:shadow-lg hover:shadow-teal-900/40

                <span class="flex items-center gap-2">
                    <span id="activityCount"

                                 px-2 py-0.5 rounded-full font-bold hidden">
                        0

                    <i id="activityChevron"
                       class="fas fa-chevron-down text-teal-400 transition-transform duration-300"></i>
                </span>
            </button>

                        <i class="fas fa-clock-rotate-left"></i>
                        <span data-i18n="activity.subtitulo">Últimas 10 actividades</span>

                        <p class="text-gray-500 text-xs py-4 text-center">
                            <i class="fas fa-spinner fa-spin mr-2"></i>
                            <span data-i18n="perfil.cargando">Cargando...</span>
                        </p>
                    </div>
                </div>
            </div>
        </section>

    </main>

        function getCurrentLanguage() {
            return localStorage.getItem('selectedLanguage') || 'es';
        }

        function t(key, lang) {
            const l = lang || getCurrentLanguage();
            return (translations[l]?.[key]) ?? (translations['es']?.[key]) ?? key;
        }

        function applyLanguage(lang) {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const val = t(key, lang);
                if (val) el.innerHTML = val;
            });
            // Re-render rank block
            if (window._lastRankData) renderUserRank(window._lastRankData, lang);
            // Re-render activity log (descriptions change with language)
            if (window._lastActivityLog) renderActivity(window._lastActivityLog);
        }

        // Sync language whenever index.html (or any tab) changes it
        window.addEventListener('storage', (e) => {
            if (e.key === 'selectedLanguage') applyLanguage(e.newValue || 'es');
        });

        // Also listen for in-page custom event (same-page calls)
        window.addEventListener('languageChanged', (e) => {
            applyLanguage(e.detail?.lang || getCurrentLanguage());
        });

        ];

        function getUserRank(stars) {
            for (let i = 0; i < rankingSystem.length; i++) {
                if (stars >= rankingSystem[i].minStars && stars <= rankingSystem[i].maxStars) {
                    return { current: rankingSystem[i], next: rankingSystem[i + 1] || null, level: i + 1 };
                }
            }
            return { current: rankingSystem[rankingSystem.length - 1], next: null, level: rankingSystem.length };
        }


        // ════════════════════════════════════════════════════════════
        //  Render rank block (bilingual)
        // ════════════════════════════════════════════════════════════
        function renderUserRank(data, lang) {
            lang = lang || getCurrentLanguage();
            window._lastRankData = data;

            const stars = data.userStars || 0;
            const rank  = getUserRank(stars);
            const r     = rank.current;

            const rankName  = (lang === 'en' && r.nameEn) ? r.nameEn : r.name;
            const tierLabel = t('tier.' + r.tier, lang);
            const tierClass = 'tier-' + r.tier;

            const range    = r.maxStars - r.minStars;
            const progress = range > 0 ? Math.min(100, Math.max(0, ((stars - r.minStars) / range) * 100)) : 100;

            let nextHtml = '';
            if (rank.next) {
                const nextName    = (lang === 'en' && rank.next.nameEn) ? rank.next.nameEn : rank.next.name;
                const starsNeeded = rank.next.minStars - stars;
                nextHtml = `
                    <p class="text-xs text-teal-400 mt-2">
                        ${t('rank.proximo', lang)}: <strong>${nextName}</strong>
                        (${starsNeeded} ⭐ ${t('rank.restantes', lang)})
                    </p>`;
            } else {
                nextHtml = `<p class="text-xs text-yellow-400 mt-2">🏆 ${t('rank.maximo', lang)}</p>`;
            }

            document.getElementById('userRankContainer').innerHTML = `
                <div class="text-center relative">
                    <a href="maparanking.html"
                       class="absolute top-0 right-0 text-teal-400 hover:text-teal-300 text-xs font-bold underline">
                        ${t('rank.ver_mapa', lang)}
                    </a>
                    <i class="fas ${r.icon} ${r.color} text-5xl mb-3 block"></i>
                    <h3 class="text-2xl font-bold text-white mb-1">${rankName}</h3>
                    <span class="tier-badge ${tierClass} mb-4 inline-block">${tierLabel}</span>
                    <div class="bg-slate-700/70 rounded-full h-3 mt-4 mb-2 overflow-hidden">
                        <div class="rank-progress bg-gradient-to-r from-teal-500 to-cyan-400 h-3 rounded-full"
                             style="width: ${progress}%"></div>
                    </div>
                    <p class="text-xs text-gray-400">
                        ${stars} / ${r.maxStars} ${t('rank.estrellas', lang)}
                    </p>
                    ${nextHtml}
                    <p class="text-xs text-gray-500 mt-3 italic">${t('rank.nota', lang)}</p>
                </div>
            `;
        }


        // ════════════════════════════════════════════════════════════
        //  Update markers display
        // ════════════════════════════════════════════════════════════
        function updateUserDisplay(data) {
            document.getElementById('userNameDisplay').textContent     = data.username || 'Usuario';
            document.getElementById('userEmailDisplay').textContent    = auth.currentUser.email;
            document.getElementById('userStarsDisplay').textContent    = data.userStars    || 0;
            document.getElementById('userDiamondsDisplay').textContent = data.userDiamonds || 0;
            document.getElementById('userCoinsDisplay').textContent    = data.userCoins    || 0;
            document.getElementById('votesUsedDisplay').textContent    = 5 - (data.votesRemaining || 0);
            document.getElementById('userBonosDisplay').textContent    = data.userBonos    || 0;

            const rank = getUserRank(data.userStars || 0);
            const lang = getCurrentLanguage();
            document.getElementById('userRankIcon').className    = `fas ${rank.current.icon} ${rank.current.color} text-xl`;
            document.getElementById('userRankLevel').textContent = rank.level;
            document.getElementById('userRankName').textContent  =
                (lang === 'en' && rank.current.nameEn) ? rank.current.nameEn : rank.current.name;
        }


        // ════════════════════════════════════════════════════════════
        //  Auth + Firestore listener
        // ════════════════════════════════════════════════════════════
        auth.onAuthStateChanged((user) => {
            if (user) {
                db.collection('users').doc(user.uid).onSnapshot((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        updateUserDisplay(data);
                        renderUserRank(data);
                        renderActivity(data.activityLog || []);
                    } else {
                        db.collection('users').doc(user.uid).set({
                            username:       user.displayName || user.email.split('@')[0],
                            userStars:      0,
                            userDiamonds:   0,
                            userCoins:      0,
                            userBonos:      0,
                            votesRemaining: 5,
                            voteLog:        {},
                            quizLog:        {},
                            activityLog:    [],
                            discardedCards: [],
                            createdAt:      new Date().toISOString()
                        });
                    }
                });
            } else {
                window.location.href = 'index.html';
            }
        });


        // ════════════════════════════════════════════════════════════
        //  Logout
        // ════════════════════════════════════════════════════════════
        function logout() {
            auth.signOut()
                .then(() => { window.location.href = 'index.html'; })
                .catch(console.error);
        }


        // ════════════════════════════════════════════════════════════
        //  ACTIVIDAD RECIENTE — toggle
        // ════════════════════════════════════════════════════════════
        let activityOpen = false;

        function toggleActivity() {
            activityOpen = !activityOpen;
            const panel   = document.getElementById('activityPanel');
            const chevron = document.getElementById('activityChevron');
            panel.classList.toggle('open', activityOpen);
            chevron.style.transform = activityOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        }


        // ════════════════════════════════════════════════════════════
        //  Bilingual "time ago" helper
        // ════════════════════════════════════════════════════════════
        function getTimeAgo(timestamp) {
            const lang = getCurrentLanguage();
            if (!timestamp) return t('activity.time.momento', lang);

            const now       = new Date();
            const past      = new Date(timestamp);
            const diffMins  = Math.floor((now - past) / 60000);
            const diffHours = Math.floor(diffMins  / 60);
            const diffDays  = Math.floor(diffHours / 24);

            if (diffMins < 1)   return t('activity.time.ahora', lang);

            if (lang === 'en') {
                // English: "5m ago", "2h ago", "3d ago"
                if (diffMins  < 60)  return `${diffMins}${t('activity.time.min',  lang)}`;
                if (diffHours < 24)  return `${diffHours}${t('activity.time.hora', lang)}`;
                return `${diffDays}${t('activity.time.dia',  lang)}`;
            } else {
                // Spanish: "Hace 5m", "Hace 2h", "Hace 3d"
                const hace = t('activity.time.hace', lang);
                if (diffMins  < 60)  return `${hace} ${diffMins}${t('activity.time.min',  lang)}`;
                if (diffHours < 24)  return `${hace} ${diffHours}${t('activity.time.hora', lang)}`;
                return `${hace} ${diffDays}${t('activity.time.dia',  lang)}`;
            }
        }


        // ════════════════════════════════════════════════════════════
        //  Render activity log — fully bilingual
        // ════════════════════════════════════════════════════════════
        function renderActivity(log) {
            const container  = document.getElementById('activityLogContainer');
            const countBadge = document.getElementById('activityCount');
            if (!container) return;

            // Cache log so applyLanguage() can re-render on language change
            window._lastActivityLog = log;

            const lang    = getCurrentLanguage();
            const entries = [...(log || [])].reverse().slice(0, 10);

            // Update count badge
            if (entries.length > 0) {
                countBadge.textContent = entries.length;
                countBadge.classList.remove('hidden');
            } else {
                countBadge.classList.add('hidden');
            }

            if (entries.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-xs py-4 text-center italic">${t('activity.vacia', lang)}</p>`;
                return;
            }

            container.innerHTML = '';

            entries.forEach((entry, index) => {

                // ── Defaults ──
                let iconClass   = 'fa-star text-yellow-400';
                let badgeClass  = 'badge-voto';
                let badgeLabel  = t('activity.badge.voto', lang);
                let description = entry.description || t('activity.desc.actividad', lang);

                // ── Type-specific overrides ──
                switch (entry.type) {

                    case 'reward':
                        iconClass   = 'fa-gift text-amber-500';
                        badgeClass  = 'badge-prize';
                        badgeLabel  = t('activity.badge.premio', lang);
                        // Keep entry.description if available; already translated in the source
                        description = entry.description || t('activity.desc.actividad', lang);
                        break;

                    case 'quiz': {
                        iconClass   = 'fa-circle-question text-cyan-400';
                        badgeClass  = 'badge-quiz';
                        badgeLabel  = t('activity.badge.quiz', lang);
                        const song  = entry.songTitle || t('activity.desc.quiz_cancion', lang);
                        const score = entry.score || 0;
                        description = `${t('activity.desc.quiz', lang)}: ${song} (${score}/5)`;
                        break;
                    }

                    case 'vote': {
                        iconClass   = 'fa-star text-yellow-400';
                        badgeClass  = 'badge-voto';
                        badgeLabel  = t('activity.badge.voto', lang);
                        const song  = entry.songTitle || t('activity.desc.quiz_cancion', lang);
                        const stars = entry.starsGiven || 0;
                        description = `${t('activity.desc.voto', lang)} "${song}" ${t('activity.desc.voto_con', lang)} ${stars}★`;
                        break;
                    }

                    case 'exchange':
                        iconClass   = 'fa-right-left text-green-400';
                        badgeClass  = 'badge-canje';
                        badgeLabel  = t('activity.badge.canje', lang);
                        description = entry.description || t('activity.desc.actividad', lang);
                        break;

                    case 'mission':
                        iconClass   = 'fa-trophy text-purple-400';
                        badgeClass  = 'badge-mision';
                        badgeLabel  = t('activity.badge.mision', lang);
                        description = entry.description || t('activity.desc.actividad', lang);
                        break;
                }

                const timeAgo = getTimeAgo(entry.timestamp);

                const div = document.createElement('div');
                div.className  = 'activity-item flex items-center gap-3 p-3 bg-slate-900/60 rounded-xl border border-slate-700/40 hover:bg-slate-700/40 transition-colors';
                div.style.animationDelay = `${index * 0.05}s`;
                div.innerHTML = `
                    <i class="fas ${iconClass} text-lg w-5 text-center flex-shrink-0"></i>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-0.5">
                            <span class="badge-act ${badgeClass}">${badgeLabel}</span>
                            <span class="text-gray-500 text-[9px]">${timeAgo}</span>
                        </div>
                        <p class="text-gray-300 text-[11px] leading-snug truncate">${description}</p>
                    </div>`;
                container.appendChild(div);
            });
        }

    </script>
