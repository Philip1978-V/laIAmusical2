<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - La IA Musical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f172a; 
            background: linear-gradient(180deg, #0f172a 0%, #0d9488 100%);
            min-height: 100vh;
            color: white;
            padding-bottom: 3rem; 
        }

        .scroll-container {
            overflow-x: auto;
            scrollbar-width: none;
            display: flex;
            gap: 1rem;
            padding: 10px 0;
        }

        .scroll-container::-webkit-scrollbar { display: none; }

        .song-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #134e4a;
            flex: 0 0 auto;
            transition: transform 0.3s ease;
        }
        .song-card:hover { transform: translateY(-5px); border-color: #2dd4bf; }

        .mission-item {
            background: rgba(15, 23, 42, 0.5);
            border-left: 4px solid #0d9488;
            transition: all 0.3s;
        }
        .mission-completed { border-left-color: #f59e0b; opacity: 0.8; }
    </style>
</head>
<body>

    <header class="p-4 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 shadow-lg border-b border-teal-800">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="temas.html" class="text-xl font-bold tracking-wide text-white hover:text-teal-200 transition-colors">
                    La IA Musical
                </a>
            </div>
            <button onclick="logout()" class="text-gray-400 hover:text-white transition flex items-center gap-2 py-1 px-3 rounded-md bg-slate-800 hover:bg-slate-700">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 mt-6">

        <div class="bg-slate-800 p-6 rounded-xl shadow-2xl border border-teal-700 mb-8">
            <div class="flex flex-col md:flex-row items-center gap-6">
                <div class="flex-grow text-center md:text-left">
                    <h2 id="userNameDisplay" class="text-3xl font-bold text-teal-200 mb-1 italic">Cargando...</h2>
                    <p id="userEmailDisplay" class="text-gray-400 text-sm mb-4">...</p>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 bg-slate-900 p-4 rounded-lg border border-teal-800">
                        <div class="text-center">
                            <i class="fas fa-star text-yellow-400 text-2xl"></i>
                            <p id="userStarsDisplay" class="text-xl font-bold mt-1">0</p>
                            <span class="text-[10px] text-gray-400 uppercase tracking-widest">Estrellas</span>
                        </div>
                        <div class="text-center">
                            <i class="fas fa-gem text-blue-400 text-2xl"></i>
                            <p id="userDiamondsDisplay" class="text-xl font-bold mt-1">0</p>
                            <span class="text-[10px] text-gray-400 uppercase tracking-widest">Diamantes</span>
                        </div>
                        <div class="text-center">
                            <i class="fas fa-coins text-amber-500 text-2xl"></i>
                            <p id="userCoinsDisplay" class="text-xl font-bold mt-1">0</p>
                            <span class="text-[10px] text-gray-400 uppercase tracking-widest">Monedas</span>
                        </div>
                        <div class="text-center">
                            <i class="fas fa-vote-yea text-teal-400 text-2xl"></i>
                            <p id="votesRemainingDisplay" class="text-xl font-bold mt-1">0/5</p>
                            <span class="text-[10px] text-gray-400 uppercase tracking-widest">Votos</span>
                        </div>
                    </div>
                </div>

                <div class="w-full md:w-auto flex flex-col items-center bg-slate-900/50 p-6 rounded-xl border border-dashed border-teal-600">
                    <i class="fas fa-gift text-3xl text-amber-500 mb-2"></i>
                    <p class="text-xs text-center text-gray-300 mb-3 font-bold">RECOMPENSA DIARIA</p>
                    <button id="dailyRewardBtn" onclick="claimDailyReward()" class="bg-teal-600 hover:bg-teal-500 disabled:bg-slate-700 text-white font-bold py-2 px-8 rounded-full transition-all shadow-lg text-sm whitespace-nowrap">
                        RECLAMAR 10 <i class="fas fa-coins text-yellow-400 ml-1"></i>
                    </button>
                    <p id="dailyRewardTimer" class="text-[10px] mt-2 text-teal-400 hidden italic">Vuelve mañana para más monedas</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-8">
                <section>
                    <h3 class="text-2xl font-bold mb-4 text-teal-300 flex items-center uppercase tracking-tighter">
                        <i class="fas fa-id-card mr-3"></i> Mis Cartas Coleccionadas
                    </h3>
                    <div id="votedSongsContainerWrapper" class="scroll-container min-h-[200px] p-2 bg-slate-900/30 rounded-xl">
                        <p class="text-gray-500 italic text-sm p-4">Cargando colección musical...</p>
                    </div>
                </section>

                <section>
                    <h3 class="text-xl font-bold mb-4 text-teal-300 flex items-center">
                        <i class="fas fa-stream mr-2"></i> Actividad Reciente
                    </h3>
                    <div id="activityLogContainer" class="space-y-3"></div>
                </section>
            </div>

            <div class="lg:col-span-1 space-y-8">
                <section>
                    <h3 class="text-xl font-bold mb-4 text-teal-300 flex items-center"><i class="fas fa-award mr-2"></i> Mi Rango</h3>
                    <div id="userRankContainer" class="bg-slate-800 p-4 rounded-xl border border-teal-700"></div>
                </section>

                <section>
                    <h3 class="text-xl font-bold mb-4 text-amber-400 flex items-center">
                        <i class="fas fa-rocket mr-2"></i> Objetivos Semanales
                    </h3>
                    <div id="missionsContainer" class="space-y-3 bg-slate-800/50 p-4 rounded-xl border border-amber-600/20"></div>
                </section>

                <section>
                    <div class="bg-slate-800 p-4 rounded-xl border border-amber-600/30">
                        <h4 class="font-bold text-amber-500 mb-2 text-sm uppercase"><i class="fas fa-sync-alt mr-2"></i> Casa de Cambio</h4>
                        <button onclick="exchangeCoinsForStars()" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-lg flex justify-between items-center hover:bg-slate-700 transition">
                            <span class="text-xs">10 Monedas <i class="fas fa-arrow-right mx-1 text-gray-500"></i> 100 Estrellas</span>
                            <i class="fas fa-exchange-alt text-amber-500"></i>
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDW3Yv0AQAVlf3zTuxlqNq6dkZ6kQtpysM",
            authDomain: "laiamusical-4fba7.firebaseapp.com",
            projectId: "laiamusical-4fba7",
            storageBucket: "laiamusical-4fba7.firebasestorage.app",
            messagingSenderId: "49783369602",
            appId: "1:49783369602:web:91e287c094a8f2403d699b",
            measurementId: "G-WC2JT6DRF4"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let userProfileData = {};

        // Base de datos de canciones sincronizada
        const songs = [
            { id: 1, title: "Sinfonía del Nuevo Mundo", author: "Antonín Dvořák", cover: "https://picsum.photos/id/10/300/300" },
            { id: 5, title: "El lenguaje del mundo", author: "Paulo Coelho", cover: "https://picsum.photos/id/20/300/300" },
            { id: 6, title: "El ciclo de Macondo", author: "Gabriel García Márquez", cover: "https://picsum.photos/id/21/300/300" },
            { id: 10, title: "La Reina de la Noche", author: "Mozart", cover: "https://picsum.photos/id/32/300/300" },
            { id: 14, title: "La oferta que no pudo rechazar", author: "Francis Ford Coppola", cover: "https://picsum.photos/id/29/300/300" }
        ];

        function getSongById(id) { return songs.find(s => s.id == id); }

        async function renderVotedSongs(voteLog, activityLog) {
            const container = document.getElementById('votedSongsContainerWrapper');
            const votedIds = Object.keys(voteLog || {});
            
            if (votedIds.length === 0) {
                container.innerHTML = '<div class="w-full text-center py-10 text-gray-500 text-sm italic">Vota canciones en el Reproductor para verlas aquí</div>';
                return;
            }

            container.innerHTML = '';
            
            for (const songId of votedIds) {
                const song = getSongById(songId);
                if (song) {
                    const starsGiven = voteLog[songId];
                    const quizPoints = (activityLog || [])
                        .filter(a => a.type === 'quiz' && a.songId == songId)
                        .reduce((sum, current) => sum + (current.score || 0), 0);
                    
                    let globalVotes = 0;
                    try {
                        const songDoc = await db.collection('songs_stats').doc(songId.toString()).get();
                        if (songDoc.exists) globalVotes = songDoc.data().totalVotes || 0;
                    } catch (e) {}

                    const card = document.createElement('div');
                    card.className = 'w-44 song-card rounded-xl overflow-hidden shadow-2xl';
                    card.innerHTML = `
                        <div class="relative">
                            <img src="${song.cover}" class="w-full h-28 object-cover">
                            <div class="absolute top-2 right-2 bg-teal-500 text-slate-900 text-[8px] font-black px-1.5 py-0.5 rounded shadow">COLECCIÓN</div>
                        </div>
                        <div class="p-3 bg-slate-800">
                            <h4 class="text-[10px] font-black truncate text-white mb-2 uppercase tracking-tighter">${song.title}</h4>
                            <div class="space-y-1.5">
                                <div class="flex justify-between text-[9px] bg-slate-900 p-1.5 rounded border border-teal-900/30">
                                    <span class="text-gray-500 font-bold uppercase">Tus Votos</span>
                                    <span class="text-yellow-400 font-black">${starsGiven} ★</span>
                                </div>
                                <div class="flex justify-between text-[9px] bg-slate-900 p-1.5 rounded border border-teal-900/30">
                                    <span class="text-gray-500 font-bold uppercase">Globales</span>
                                    <span class="text-teal-400 font-black">${globalVotes}</span>
                                </div>
                                <div class="flex justify-between text-[9px] bg-indigo-950/40 p-1.5 rounded">
                                    <span class="text-gray-400 font-bold uppercase">Quiz pts</span>
                                    <span class="text-blue-300 font-black">${quizPoints}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            }
        }

        function renderMissions(data) {
            const container = document.getElementById('missionsContainer');
            const missions = [
                { text: "Completar tus 5 votos", curr: (5 - (data.votesRemaining || 0)), goal: 5, rew: "50★" },
                { text: "Gana 100★ en Quizzes", curr: (data.activityLog || []).filter(a => a.type === 'quiz').reduce((s, c) => s + (c.score || 0), 0), goal: 100, rew: "10💎" },
                { text: "Reclamar 3 Regalos", curr: (data.activityLog || []).filter(a => a.type === 'reward').length, goal: 3, rew: "20💰" },
                { text: "Usar Casa de Cambio", curr: (data.activityLog || []).filter(a => a.type === 'exchange').length >= 1 ? 1 : 0, goal: 1, rew: "50★" }
            ];

            container.innerHTML = '';
            missions.forEach(m => {
                const isDone = m.curr >= m.goal;
                const perc = Math.min((m.curr / m.goal) * 100, 100);
                const div = document.createElement('div');
                div.className = `mission-item p-3 rounded-r-lg ${isDone ? 'mission-completed' : ''}`;
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <p class="text-[10px] font-bold text-gray-200 uppercase">${m.text}</p>
                        <span class="text-[9px] font-black text-amber-500">${m.rew}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex-grow bg-slate-900 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-teal-500 h-full" style="width: ${perc}%"></div>
                        </div>
                        <span class="text-[9px] text-gray-500">${Math.min(m.curr, m.goal)}/${m.goal}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function claimDailyReward() {
            const userRef = db.collection('users').doc(auth.currentUser.uid);
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];

            if (userProfileData.lastClaimDate === todayStr) return;

            try {
                await userRef.update({
                    userCoins: (userProfileData.userCoins || 0) + 10,
                    lastClaimDate: todayStr,
                    activityLog: firebase.firestore.FieldValue.arrayUnion({
                        type: 'reward',
                        description: 'Recogiste tu regalo diario (+10 Monedas)',
                        timestamp: now.toISOString()
                    })
                });
            } catch (e) { console.error(e); }
        }

        function updateUI(data) {
            userProfileData = data;
            document.getElementById('userNameDisplay').textContent = data.username || "Músico";
            document.getElementById('userEmailDisplay').textContent = auth.currentUser.email;
            document.getElementById('userStarsDisplay').textContent = data.userStars || 0;
            document.getElementById('userDiamondsDisplay').textContent = data.userDiamonds || 0;
            document.getElementById('userCoinsDisplay').textContent = data.userCoins || 0;
            document.getElementById('votesRemainingDisplay').textContent = `${data.votesRemaining || 0}/5`;

            // Control botón regalo
            const btn = document.getElementById('dailyRewardBtn');
            const timer = document.getElementById('dailyRewardTimer');
            const today = new Date().toISOString().split('T')[0];
            if (data.lastClaimDate === today) {
                btn.disabled = true;
                btn.innerHTML = 'RECLAMADO';
                timer.classList.remove('hidden');
            } else {
                btn.disabled = false;
                btn.innerHTML = 'RECLAMAR 10 <i class="fas fa-coins text-yellow-400 ml-1"></i>';
                timer.classList.add('hidden');
            }

            renderVotedSongs(data.voteLog || {}, data.activityLog || []);
            renderMissions(data);
            
            // Render actividad simplificado
            const logContainer = document.getElementById('activityLogContainer');
            logContainer.innerHTML = '';
            (data.activityLog || []).slice(-5).reverse().forEach(entry => {
                const div = document.createElement('div');
                div.className = "flex items-center p-2 bg-slate-800/40 rounded-lg text-[10px] border border-slate-700";
                div.innerHTML = `<span class="text-teal-400 mr-2 font-bold">[${entry.type.toUpperCase()}]</span> ${entry.description}`;
                logContainer.appendChild(div);
            });

            // Rango
            const rankNext = 500;
            const progress = Math.min(((data.userStars || 0) / rankNext) * 100, 100);
            document.getElementById('userRankContainer').innerHTML = `
                <div class="flex justify-between text-[10px] mb-1 font-bold"><span class="text-teal-400">NOVATO</span><span class="text-gray-500">${data.userStars || 0}/${rankNext}★</span></div>
                <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden"><div class="bg-teal-500 h-full" style="width: ${progress}%"></div></div>
            `;
        }

        async function exchangeCoinsForStars() {
            if ((userProfileData.userCoins || 0) < 10) return alert("Faltan monedas.");
            const userRef = db.collection('users').doc(auth.currentUser.uid);
            await userRef.update({
                userCoins: userProfileData.userCoins - 10,
                userStars: (userProfileData.userStars || 0) + 100,
                activityLog: firebase.firestore.FieldValue.arrayUnion({
                    type: 'exchange',
                    description: 'Canje de 10 monedas por 100★',
                    timestamp: new Date().toISOString()
                })
            });
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection('users').doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) updateUI(doc.data());
                });
            } else {
                window.location.href = 'index.html';
            }
        });

        function logout() { auth.signOut(); }
    </script>
</body>
</html>
