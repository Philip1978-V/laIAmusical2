<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual · La IA Musical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body {
            background-image: url('./images/fondostorycards.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Fallback gradient si no carga la imagen de fondo */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, #0a2a3a 0%, #0d3d54 30%, #1a1035 70%, #0a0a1a 100%);
        }

        .chat-container {
            height: calc(100vh - 195px);
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(14px);
        }

        .message-bot {
            background: #1e293b;
            border-left: 4px solid #f59e0b;
        }

        .message-user {
            background: #0369a1;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.5s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40%            { transform: translateY(-10px); }
        }

        .suggestion-chip {
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
        }

        .suggestion-chip:hover {
            background: #f59e0b;
            color: black;
            transform: scale(1.05);
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* Animación de entrada para mensajes */
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .msg-animate { animation: msgIn 0.25s ease forwards; }

        /* Badge modelo */
        .model-badge {
            font-size: 10px;
            background: rgba(245,158,11,0.15);
            border: 1px solid rgba(245,158,11,0.4);
            color: #f59e0b;
            padding: 1px 6px;
            border-radius: 999px;
        }
    </style>
</head>
<body class="text-white">

    <!-- ═══════════════════════════════ HEADER ═══════════════════════════════ -->
    <header class="p-4 flex justify-between items-center bg-black/40 border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-yellow-500 rounded-full flex items-center justify-center text-black">
                <i class="fas fa-robot text-xl"></i>
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="font-bold text-lg leading-tight">Asistente Gemini IA</h1>
                    <span class="model-badge">gemini-2.0-flash</span>
                </div>
                <span class="text-xs text-green-400"><i class="fas fa-circle text-[8px]"></i> Sistema Activo</span>
            </div>
        </div>
        <a href="index.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm transition">
            Volver al inicio
        </a>
    </header>

    <!-- ═══════════════════════════════ MAIN ════════════════════════════════ -->
    <main class="max-w-4xl mx-auto p-4">

        <!-- Chat area -->
        <div id="chatBox" class="chat-container rounded-t-2xl p-4 overflow-y-auto custom-scroll flex flex-col gap-4">
            <div class="message-bot p-4 rounded-r-xl rounded-bl-xl max-w-[85%] self-start msg-animate">
                <p>¡Hola! Soy la inteligencia artificial de <b>La IA Musical</b> impulsada por Gemini. Puedo ayudarte con dudas sobre la web, crear letras de canciones o analizar historias. ¿Qué necesitas?</p>
            </div>
        </div>

        <!-- Typing indicator -->
        <div id="typingIndicator" class="hidden ml-4 mb-2 flex gap-1 items-center">
            <div class="typing-dot" style="animation-delay: 0s"></div>
            <div class="typing-dot" style="animation-delay: 0.2s"></div>
            <div class="typing-dot" style="animation-delay: 0.4s"></div>
        </div>

        <!-- Sugerencias rápidas -->
        <div id="suggestions" class="bg-black/20 p-3 flex flex-wrap gap-2 overflow-x-auto border-t border-white/5">
            <button onclick="sendQuick('¿Qué puedo hacer en esta web?')"            class="suggestion-chip px-3 py-1.5 rounded-full text-xs">🤔 Guía de inicio</button>
            <button onclick="sendQuick('Ayúdame a escribir una letra de trap')"      class="suggestion-chip px-3 py-1.5 rounded-full text-xs">🎙️ Escribir canción</button>
            <button onclick="sendQuick('¿Cómo funciona el Duelo de Cartas?')"       class="suggestion-chip px-3 py-1.5 rounded-full text-xs">🎴 Reglas del juego</button>
            <button onclick="sendQuick('Dame ideas para una historia de trap')"      class="suggestion-chip px-3 py-1.5 rounded-full text-xs">💡 Ideas de historia</button>
        </div>

        <!-- Input bar -->
        <div class="bg-slate-900/90 p-4 rounded-b-2xl flex gap-2">
            <input
                type="text"
                id="userInput"
                placeholder="Escribe tu mensaje aquí..."
                class="bg-white/5 border border-white/10 rounded-xl px-4 py-3 flex-1 focus:outline-none focus:border-yellow-500 transition"
            >
            <button id="sendBtn" class="bg-yellow-500 hover:bg-yellow-400 text-black w-12 h-12 rounded-xl flex items-center justify-center transition">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

    </main>

<!-- ═══════════════════════════════════════════════════════════════════════════
     SCRIPT PRINCIPAL
     ═══════════════════════════════════════════════════════════════════════ -->
<script>

    // ══════════════════════════════════════════════════════════════
    //  ⚙️  CONFIGURACIÓN — Solo necesitas cambiar esta línea
    // ══════════════════════════════════════════════════════════════
    const GEMINI_API_KEY = "AIzaSyB1P6k9hAK1RWJw37E8sVbbDTD7SGdfcoM";
    //  Obtén tu clave GRATIS en: https://aistudio.google.com/apikey
    // ══════════════════════════════════════════════════════════════

    const MODEL      = "gemini-2.0-flash";
    const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${GEMINI_API_KEY}`;

    // System prompt — personalidad del asistente
    const SYSTEM_PROMPT = `Eres el asistente experto de "La IA Musical", una plataforma musical creativa.
Tu tono es moderno, creativo y servicial. Usas lenguaje cercano y juvenil, pero siempre profesional.
Puedes ayudar con:
- Letras de canciones (trap, reggaeton, pop, etc.)
- Historias y narrativas musicales
- Reglas del juego StoryCard Duel
- Rankings y puntos de la plataforma
- Cualquier duda general sobre la web
Responde siempre en español salvo que el usuario escriba en otro idioma. Sé conciso pero útil.`;

    // Base de conocimiento local (respuestas instantáneas sin API)
    const LOCAL_KNOWLEDGE = [
        {
            keys: ['ranking', 'puntos', 'ganar', 'clasificación'],
            answer: "Puedes ver quién va ganando en la sección de <a href='storycardsranking.html' class='text-yellow-400 underline'>Rankings</a>. ¡Compite y sube posiciones creando las mejores historias! 🏆"
        },
        {
            keys: ['juego', 'cartas', 'duelo', 'storycard'],
            answer: "El <b>StoryCard Duel</b> se basa en estrategia y combos. Cada carta tiene atributos únicos y puedes combinarlas para crear jugadas devastadoras. ¡Prueba tu mazo en la sección de juegos! 🎴"
        },
        {
            keys: ['biblioteca', 'salas', 'explorar'],
            answer: "En la <a href='biblioteca.html' class='text-yellow-400 underline'>Biblioteca</a> puedes explorar y votar por las mejores creaciones de la comunidad. ¡Hay historias increíbles esperándote! 📚"
        }
    ];

    // Historial de conversación para contexto multi-turn
    // Formato Gemini: { role: "user" | "model", parts: [{ text: "..." }] }
    const conversationHistory = [];

    // Referencias DOM
    const chatBox         = document.getElementById('chatBox');
    const userInput       = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');
    const sendBtn         = document.getElementById('sendBtn');

    // ─── Llama a la API de Gemini ─────────────────────────────────────────────
    async function fetchGemini(userMessage) {
        if (GEMINI_API_KEY === "PEGA_AQUÍ_TU_API_KEY_DE_GOOGLE") {
            return "⚠️ <b>Configura tu API Key primero.</b> Abre el archivo HTML, localiza la variable <code>GEMINI_API_KEY</code> y pega tu clave de <a href='https://aistudio.google.com/apikey' class='text-yellow-400 underline' target='_blank'>aistudio.google.com</a>.";
        }

        // Añadir mensaje del usuario al historial (formato Gemini)
        conversationHistory.push({
            role: "user",
            parts: [{ text: userMessage }]
        });

        try {
            const response = await fetch(GEMINI_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    // System instruction (personalidad del bot)
                    systemInstruction: {
                        parts: [{ text: SYSTEM_PROMPT }]
                    },
                    // Historial completo para conversación con memoria
                    contents: conversationHistory,
                    generationConfig: {
                        maxOutputTokens: 1024,
                        temperature: 0.85
                    }
                })
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                console.error("Error API Gemini:", errData);
                if (response.status === 400) return "❌ API Key inválida o solicitud incorrecta. Comprueba tu clave en <a href='https://aistudio.google.com/apikey' class='text-yellow-400 underline' target='_blank'>aistudio.google.com</a>.";
                if (response.status === 429) return "⏳ Demasiadas solicitudes. Espera un momento e inténtalo de nuevo.";
                if (response.status === 403) return "❌ API Key sin permisos. Asegúrate de activar la API en Google AI Studio.";
                return `❌ Error del servidor (${response.status}). Inténtalo de nuevo.`;
            }

            const data = await response.json();
            const assistantText = data.candidates?.[0]?.content?.parts?.[0]?.text
                                || "No obtuve respuesta. Inténtalo de nuevo.";

            // Guardar respuesta del modelo en historial
            conversationHistory.push({
                role: "model",
                parts: [{ text: assistantText }]
            });

            // Limitar historial a últimos 20 mensajes para no exceder contexto
            if (conversationHistory.length > 20) conversationHistory.splice(0, 2);

            return assistantText;

        } catch (error) {
            console.error("Error de red:", error);
            // Si hay error de red, quitar el último mensaje del historial para no desincronizar
            conversationHistory.pop();
            return "⚠️ Error de conexión. Comprueba tu internet e inténtalo de nuevo.";
        }
    }

    // ─── Añade un mensaje al chat ────────────────────────────────────────────
    function addMessage(text, isBot = true) {
        const div = document.createElement('div');
        div.className = isBot
            ? "message-bot p-4 rounded-r-xl rounded-bl-xl max-w-[85%] self-start msg-animate"
            : "message-user p-4 rounded-l-xl rounded-br-xl max-w-[85%] self-end msg-animate";

        // Conversión básica de Markdown a HTML
        const formatted = text
            .replace(/\n\n/g, '</p><p class="mt-2">')
            .replace(/\n/g,   '<br>')
            .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
            .replace(/\*(.*?)\*/g,     '<i>$1</i>')
            .replace(/`(.*?)`/g,       '<code class="bg-black/30 px-1 rounded text-yellow-300 text-sm">$1</code>');

        div.innerHTML = `<p>${formatted}</p>`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // ─── Controla el indicador de escritura ──────────────────────────────────
    function showTyping(show) {
        typingIndicator.classList.toggle('hidden', !show);
        if (show) chatBox.scrollTop = chatBox.scrollHeight;
    }

    // ─── Bloquea / desbloquea el input mientras procesa ──────────────────────
    function setLoading(loading) {
        sendBtn.disabled   = loading;
        userInput.disabled = loading;
        sendBtn.innerHTML  = loading
            ? '<i class="fas fa-spinner fa-spin"></i>'
            : '<i class="fas fa-paper-plane"></i>';
    }

    // ─── Lógica principal de envío ───────────────────────────────────────────
    async function handleChat() {
        const query = userInput.value.trim();
        if (!query) return;

        addMessage(query, false);
        userInput.value = '';
        setLoading(true);
        showTyping(true);

        // 1. Respuesta local instantánea
        const lowQuery   = query.toLowerCase();
        const localMatch = LOCAL_KNOWLEDGE.find(item => item.keys.some(k => lowQuery.includes(k)));

        let finalResponse;
        if (localMatch) {
            await new Promise(r => setTimeout(r, 500));
            finalResponse = localMatch.answer;
        } else {
            // 2. API de Gemini
            finalResponse = await fetchGemini(query);
        }

        showTyping(false);
        setLoading(false);
        addMessage(finalResponse, true);
    }

    // ─── Eventos ─────────────────────────────────────────────────────────────
    sendBtn.addEventListener('click', handleChat);
    userInput.addEventListener('keypress', e => { if (e.key === 'Enter') handleChat(); });

    // Función global para los botones de sugerencia
    window.sendQuick = (text) => {
        userInput.value = text;
        handleChat();
    };

</script>
</body>
</html>
