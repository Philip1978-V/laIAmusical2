<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Inheritance of Oblivion</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f8f3ea;
    --cream-dark: #ede5d4;
    --ink: #2a1f14;
    --ink-light: #6b5a47;
    --gold: #c8a96e;
    --spine: #8b6e50;
  }

  html, body {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
  }

  body {
    background: radial-gradient(ellipse at center, #3a2a1a 0%, #1a1008 100%);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-family: 'Crimson Text', Georgia, serif;
    overflow: hidden;
    position: relative;
    padding: 0;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* ── UI WRAPPER ── */
  .ui-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    height: 100dvh;
    position: relative;
    z-index: 10;
    padding: 10px 10px 8px;
    gap: 8px;
  }

  /* ── TOP BAR ── */
  .top-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    max-width: 440px;
    flex-shrink: 0;
    gap: 6px;
  }

  .book-title-header {
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.75;
    white-space: nowrap;
    flex-shrink: 0;
    text-align: center;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── AUDIO CONTROLS BAR ── */
  .audio-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
    flex-wrap: wrap;
    width: 100%;
    max-width: 100%;
  }
  .audio-bar.visible { opacity: 1; pointer-events: all; }

  .audio-btn {
    background: rgba(200,169,110,0.12);
    border: 1px solid rgba(200,169,110,0.3);
    border-radius: 50%;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
    color: var(--gold);
    padding: 0;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .audio-btn:active { background: rgba(200,169,110,0.25); }
  .audio-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

  .audio-label {
    font-family: 'Playfair Display', serif;
    font-size: 0.46rem;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: rgba(200,169,110,0.55);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .audio-divider {
    width: 1px;
    height: 18px;
    background: rgba(200,169,110,0.2);
    flex-shrink: 0;
    margin: 0 2px;
  }

  .voice-indicator {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 14px;
    flex-shrink: 0;
  }
  .voice-indicator span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: var(--gold);
    opacity: 0;
  }
  .voice-indicator.playing span { opacity: 0.7; animation: voiceBar 1s ease-in-out infinite; }
  .voice-indicator.playing span:nth-child(1) { animation-delay: 0s; }
  .voice-indicator.playing span:nth-child(2) { animation-delay: 0.15s; }
  .voice-indicator.playing span:nth-child(3) { animation-delay: 0.3s; }
  .voice-indicator.playing span:nth-child(4) { animation-delay: 0.15s; }
  @keyframes voiceBar {
    0%, 100% { height: 4px; }
    50%       { height: 13px; }
  }

  #musicVolume {
    width: 44px;
    accent-color: var(--gold);
    cursor: pointer;
    vertical-align: middle;
    flex-shrink: 0;
  }

  /* ── BOOK WRAPPER ── */
  .book-wrapper {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    overflow: hidden;
  }

  .open-hint-badge {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(200,169,110,0.15);
    border: 1px solid rgba(200,169,110,0.35);
    backdrop-filter: blur(6px);
    border-radius: 30px;
    padding: 6px 16px;
    color: var(--gold);
    font-family: 'Playfair Display', serif;
    font-size: 0.66rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    animation: pulseHint 2.4s ease-in-out infinite;
    transition: opacity 0.4s;
    z-index: 30;
    white-space: nowrap;
  }
  .open-hint-badge.hidden { opacity: 0; pointer-events: none; }
  @keyframes pulseHint {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200,169,110,0); }
    50%       { box-shadow: 0 0 0 6px rgba(200,169,110,0.12); }
  }

  /* ── BOOK CARD ── */
  .book-card {
    width: 100%;
    height: 100%;
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
    background: var(--cream);
    perspective: 1400px;
  }

  .book-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 8px;
    background: linear-gradient(to right, var(--spine), rgba(139,110,80,0.3));
    z-index: 20;
    pointer-events: none;
  }

  /* ── COVER PAGE ── */
  .cover-page {
    width: 100%; height: 100%;
    position: relative; cursor: pointer; overflow: hidden;
  }
  .cover-page img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, transparent 55%);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 28px 24px;
  }
  .cover-overlay h1 {
    font-family: 'Playfair Display', serif; font-size: 1.8rem;
    color: #fff; line-height: 1.2; text-shadow: 0 2px 16px rgba(0,0,0,0.8);
    margin-bottom: 8px;
  }
  .cover-overlay .author {
    font-family: 'Crimson Text', serif; font-size: 1rem;
    color: rgba(255,255,255,0.75); letter-spacing: 0.1em;
  }

  /* ── STORY PAGE ── */
  .story-page {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    position: relative; overflow-y: auto; overflow-x: hidden;
    background: var(--cream);
  }

  .page-illustration {
    width: 100%; flex-shrink: 0; position: relative;
    background: var(--cream-dark); line-height: 0;
  }
  .page-illustration img { width: 100%; height: auto; display: block; object-fit: contain; }

  .page-illustration::before {
    content: ''; position: absolute; inset: 0; z-index: 2;
    box-shadow: inset 0 30px 22px -8px var(--cream), inset 0 -42px 28px -8px var(--cream);
    pointer-events: none;
  }

  .page-text-section {
    flex-shrink: 0; display: flex; flex-direction: column;
    padding: 16px 22px 20px 26px; position: relative;
    background: var(--cream);
  }

  .chapter-label {
    font-family: 'Playfair Display', serif; font-size: 0.6rem;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--ink-light); margin-bottom: 14px; opacity: 0.6;
  }

  .drop-cap {
    font-family: 'Playfair Display', serif; font-size: 4.4rem;
    font-weight: 700; line-height: 0.75; float: left;
    margin-right: 6px; margin-top: 4px; color: var(--ink);
  }

  .page-text {
    font-family: 'Crimson Text', serif; font-size: 1.12rem;
    line-height: 1.7; color: var(--ink); text-align: justify;
  }
  .page-text p { margin-bottom: 0.8em; }

  .page-number {
    margin-top: 10px; text-align: right;
    font-family: 'Playfair Display', serif; font-size: 0.72rem;
    color: var(--ink-light); opacity: 0.5;
  }

  .swipe-hint {
    display: flex; align-items: center; justify-content: center;
    gap: 5px; padding: 14px 0 16px; color: var(--ink-light);
    font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase;
    font-family: 'Playfair Display', serif; opacity: 0.4;
  }

  /* ── NAVIGATION ARROWS ── */
  .nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    z-index: 25; width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(200,169,110,0.22); border: 1.5px solid rgba(200,169,110,0.7);
    border-radius: 50%; color: var(--gold); cursor: pointer;
    transition: all 0.3s; backdrop-filter: blur(6px);
    animation: arrowPulse 1.5s ease-in-out infinite;
  }
  .nav-arrow.hidden { opacity: 0; pointer-events: none; animation: none; }
  .nav-arrow-left  { left: 6px; }
  .nav-arrow-right { right: 6px; }
  @keyframes arrowPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(200,169,110,0.55); background: rgba(200,169,110,0.22); }
    50% { box-shadow: 0 0 0 8px rgba(200,169,110,0); background: rgba(200,169,110,0.42); }
  }

  /* ── END PAGE ── */
  .end-page {
    width: 100%; height: 100%; display: flex;
    align-items: center; justify-content: center; background: var(--cream);
  }
  .end-page-content { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .back-btn {
    margin-top: 6px; padding: 10px 24px; border: 1px solid var(--gold);
    background: none; color: var(--ink-light); font-family: 'Playfair Display', serif;
    font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer;
  }

  /* ── NAV DOTS ── */
  .nav-dots { display: flex; gap: 8px; z-index: 10; padding: 2px 0; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(200,169,110,0.3); cursor: pointer; transition: all 0.3s;
    border: 1px solid rgba(200,169,110,0.4);
  }
  .dot.active { background: var(--gold); transform: scale(1.3); }

  /* ANIMATIONS */
  @keyframes pageFlipInForward {
    0%   { transform: perspective(1400px) rotateY(-88deg); opacity: 0; }
    100% { transform: perspective(1400px) rotateY(0deg); opacity: 1; }
  }
  .anim-in-forward { animation: pageFlipInForward 0.45s ease-out both; }
</style>
</head>
<body>

<div class="ui-wrapper">

  <div class="top-bar">
    <p class="book-title-header">✦ THE INHERITANCE OF OBLIVION ✦</p>

    <div class="audio-bar" id="audioBar">
      <div class="voice-indicator" id="voiceIndicator">
        <span></span><span></span><span></span><span></span>
      </div>
      <span class="audio-label">NARRATOR</span>
      <button class="audio-btn" id="btnVoicePause" title="Pause/Resume Narration" onclick="toggleVoicePause()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" id="iconVoicePause">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
      <button class="audio-btn" title="Stop Narration" onclick="stopVoice()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="4" y="4" width="16" height="16" rx="1"/>
        </svg>
      </button>

      <div class="audio-divider"></div>

      <span class="audio-label">MUSIC</span>
      <button class="audio-btn" id="btnMusicPause" title="Pause/Resume Music" onclick="toggleMusicPause()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" id="iconMusicPause">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
      <button class="audio-btn" title="Mute Music" onclick="toggleMusic()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" id="iconMusic">
          <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
      </button>
      <input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.4" title="Music Volume" oninput="setMusicVolume(this.value)">
    </div>
  </div>

  <div class="book-wrapper" id="bookWrapper">
    <div class="open-hint-badge" id="openHintBadge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      Tap to open
    </div>

    <div class="nav-arrow nav-arrow-left hidden" id="navLeft" onclick="prevPage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="nav-arrow nav-arrow-right hidden" id="navRight" onclick="nextPage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div class="book-card" id="bookCard"></div>
  </div>

  <div class="nav-dots" id="navDots"></div>
</div>

<script>
const MUSIC_SRC = 'storycard/herenciadelolvido.mp3';

const pages = [
  {
    type: 'cover',
    coverImg: 'storycard/herenciadelolvido/portada.png',
    coverMobileImg: 'storycard/herenciadelolvido/portadamovil.png',
    title:    'The Inheritance of Oblivion',
    author:   'By The Musical AI'
  },
  {
    type: 'story',
    pageNum: 1,
    chapterTitle: 'Chapter 1: The Town That Forgot',
    illustrationSrc: 'storycard/herenciadelolvido/imagen1.png',
    voiceSrc:        'storycard/english/Inheritanceofoblivion/audio1.wav',
    text: `The town of San Jacinto del Viento was condemned to a strange illness: things vanished from memory before they vanished from the world. First, the names of streets were forgotten, then the faces of neighbors, and finally the memories of the dead. Lucía Valverde returned to the town after twenty years of absence, when she received a letter written in her grandmother's trembling hand. It contained only one sentence: "Come quickly. Here, they are forgetting even why they live." When she arrived, she discovered something unsettling: no one remembered sending that letter.`
  },
  {
    type: 'story',
    pageNum: 2,
    chapterTitle: 'Chapter 2: The House of Memories',
    illustrationSrc: 'storycard/herenciadelolvido/imagen2.png',
    voiceSrc:        'storycard/english/Inheritanceofoblivion/audio2.wav',
    text: `Her grandmother’s house, Elena Valverde, was the only one in town where the walls were covered with words written in charcoal: names, dates, promises, recipes, songs. "It's so that oblivion doesn't win," the old woman said. "When a memory is erased from the head, it stays stuck on the wall." Lucía found notebooks full of stories of people no one in the town remembered meeting. Then her grandmother revealed something that had remained hidden for generations: "Our family guards what the world tries to forget."`
  },
  {
    type: 'story',
    pageNum: 3,
    chapterTitle: 'Chapter 3: The River That Remembered',
    illustrationSrc: 'storycard/herenciadelolvido/imagen3.png',
    voiceSrc:        'storycard/english/Inheritanceofoblivion/audio3.wav',
    text: `The only place where people seemed to remember anything was the Amaranto River. The elders said the water whispered names when night fell. Lucía began to visit it every dawn. One night, she thought she heard the voice of her grandfather Esteban, who had died decades ago. The river didn't return memories. It preserved them.`
  },
  {
    type: 'story',
    pageNum: 4,
    chapterTitle: 'Chapter 4: The Lost Names',
    illustrationSrc: 'storycard/herenciadelolvido/imagen4.png',
    voiceSrc:        'storycard/english/Inheritanceofoblivion/audio4.wav',
    text: `Lucía began to compile all the names written in the house. She discovered that many belonged to people who had disappeared from the town's collective memory. But when she spoke those names aloud, some neighbors began to remember fragments of forgotten lives. Oblivion was not natural. Someone had provoked it.`
  },
  {
    type: 'story',
    pageNum: 5,
    chapterTitle: 'Chapter 5: The Woman Who Wrote Dreams',
    illustrationSrc: 'storycard/herenciadelolvido/imagen5.png',
    voiceSrc:        'storycard/english/Inheritanceofoblivion/audio5.wav',
    text: `In the market lived Marina Robles, a woman known for writing dreams before they happened. She was the first to recognize Lucía. "You are the last guardian," she told her. "If you forget, the town will disappear." In her notebook, she had drawn a house buried among black trees. "That's where it all began."`
  },
  {
    type: 'story',
    pageNum: 6,
    chapterTitle: 'Chapter 6: The Origin of Oblivion',
    illustrationSrc: 'storycard/herenciadelolvido/imagen6.png',
    voiceSrc:        'storycard/english/Inheritanceofoblivion/audio6.wav',
    text: `Following Marina's map, Lucía found an abandoned estate. There, she discovered documents from the town’s former mayor, Ramiro Villalba, a man obsessed with erasing the mistakes of the past. He ordered the destruction of letters, photographs, and archives. But something unexpected happened. By destroying written memories, the town began to forget them in their minds as well.`
  },
  {
    type: 'story',
    pageNum: 7,
    chapterTitle: 'Chapter 7: The Secret Archive',
    illustrationSrc: 'storycard/herenciadelolvido/imagen7.png',
    voiceSrc:        'storycard/english/Inheritanceofoblivion/audio7.wav',
    text: `Lucía returned to her grandmother's house and opened an old trunk hidden under the floorboards. Inside, she found letters, diaries, and photographs from several generations. It was her family's secret archive. For decades, the Valverdes had protected the town's memory.`
  },
  {
    type: 'story',
    pageNum: 8,
    chapterTitle: 'Chapter 8: The Night of Memories',
    illustrationSrc: 'storycard/herenciadelolvido/imagen8.png',
    voiceSrc:        'storycard/english/Inheritanceofoblivion/audio8.wav',
    text: `Lucía decided to read the stories aloud in the town square. As she progressed, the inhabitants began to remember: forgotten loves, lost friendships, unfulfilled promises. Some wept. Others could not bear what was returning to their memory. Remembering was also a way to face the past.`
  },
  {
    type: 'story',
    pageNum: 9,
    chapterTitle: 'Chapter 9: The Last Memory',
    illustrationSrc: 'storycard/herenciadelolvido/imagen9.png',
    voiceSrc:        'storycard/english/Inheritanceofoblivion/audio9.wav',
    text: `That same night, her grandmother Elena died. Before closing her eyes, she told her: "Oblivion always returns... but memory also learns to resist." Lucía then understood that the inheritance was not the house or the notebooks. It was the responsibility to remember.`
  },
  {
    type: 'story',
    pageNum: 10,
    chapterTitle: 'Chapter 10: The Inheritance of Oblivion',
    illustrationSrc: 'storycard/herenciadelolvido/imagen10.png',
    voiceSrc:        'storycard/english/Inheritanceofoblivion/audio10.wav',
    text: `Years later, San Jacinto del Viento was transformed once again. People still forgot small things: songs, keys, dates. But no one ever forgot the town's stories again. Lucía turned the old house into a memory library. At the entrance, she hung a sign that read: "Here, memories are kept before time tries to erase them." Because in the end, Lucía understood what her grandmother always knew: memory is the only thing that fights against destruction. And as long as someone remembers, nothing truly disappears.`
  },
  { type: 'end' }
];

const musicAudio = new Audio();
musicAudio.loop = true;
musicAudio.volume = 0.4;
if (MUSIC_SRC) musicAudio.src = MUSIC_SRC;

let voiceAudio = null;
let voicePaused = false;
let musicMuted = false;
let musicPaused = false;
let bookOpened = false;
let currentPage = 0;
let animating = false;

const bookCard = document.getElementById('bookCard');
const navDotsEl = document.getElementById('navDots');
const navLeft = document.getElementById('navLeft');
const navRight = document.getElementById('navRight');

function startMusic() { if (!MUSIC_SRC || musicMuted) return; musicAudio.play().catch(() => {}); updateMusicPauseIcon(true); }
function stopAllAudio() { if (voiceAudio) { voiceAudio.pause(); voiceAudio.currentTime = 0; } voicePaused = false; setVoiceIndicator(false); updateVoicePauseIcon(false); }

function playPageVoice(src) {
  stopAllAudio();
  if (!src) return;
  voiceAudio = new Audio(src);
  voiceAudio.play().catch(() => {});
  voiceAudio.onplay = () => { setVoiceIndicator(true); updateVoicePauseIcon(true); };
  voiceAudio.onended = () => { setVoiceIndicator(false); updateVoicePauseIcon(false); voicePaused = false; };
}

function setVoiceIndicator(playing) { document.getElementById('voiceIndicator').className = 'voice-indicator' + (playing ? ' playing' : ''); }
function updateVoicePauseIcon(isPlaying) {
  document.getElementById('iconVoicePause').innerHTML = isPlaying
    ? `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`
    : `<polygon points="5 3 19 12 5 21 5 3"/>`;
}
function toggleVoicePause() {
  if (!voiceAudio) return;
  if (voicePaused) { voiceAudio.play(); voicePaused = false; setVoiceIndicator(true); updateVoicePauseIcon(true); }
  else { voiceAudio.pause(); voicePaused = true; setVoiceIndicator(false); updateVoicePauseIcon(false); }
}
function stopVoice() { if (voiceAudio) { voiceAudio.pause(); voiceAudio.currentTime = 0; voicePaused = false; setVoiceIndicator(false); updateVoicePauseIcon(false); } }

function updateMusicPauseIcon(isPlaying) {
  document.getElementById('iconMusicPause').innerHTML = isPlaying
    ? `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`
    : `<polygon points="5 3 19 12 5 21 5 3"/>`;
}
function toggleMusicPause() {
  if (musicMuted) return;
  if (musicPaused) { musicAudio.play(); musicPaused = false; updateMusicPauseIcon(true); }
  else { musicAudio.pause(); musicPaused = true; updateMusicPauseIcon(false); }
}
function setMusicVolume(val) { musicAudio.volume = parseFloat(val); }
function toggleMusic() {
  musicMuted = !musicMuted;
  if (musicMuted) { musicAudio.pause(); updateMusicPauseIcon(false); }
  else { musicAudio.play(); updateMusicPauseIcon(true); }
}

function withDropCap(text) {
  const t = text.trimStart();
  return `<span class="drop-cap">${t.charAt(0)}</span>${t.slice(1)}`;
}

function renderBook(direction) {
  const p = pages[currentPage];
  const headerEl = document.querySelector('.book-title-header');
  if (headerEl) headerEl.textContent = p.type === 'cover' ? p.title : p.type === 'end' ? 'END OF STORY' : p.chapterTitle;

  const newEl = document.createElement('div');
  if (p.type === 'cover') {
    newEl.className = 'cover-page';

    // DETECT IF MOBILE (Width less than or equal to 767px)
    const isMobile = window.innerWidth <= 767;
    const imgSrc = (isMobile && p.coverMobileImg) ? p.coverMobileImg : p.coverImg;

    newEl.innerHTML = `<img src="${imgSrc}"> <div class="cover-overlay"><h1>${p.title}</h1><p class="author">${p.author}</p></div>`;
    newEl.onclick = openBook;
  } else if (p.type === 'end') {
    newEl.className = 'end-page';
    newEl.innerHTML = `<div class="end-page-content"><h2>End of the story</h2><p>LaIAmusical</p><button class="back-btn" onclick="goToPage(0)">Back to start</button></div>`;
  } else {
    newEl.className = 'story-page';
    newEl.innerHTML = `<div class="page-illustration"><img src="${p.illustrationSrc}"></div>
      <div class="page-text-section"><div class="chapter-label">${p.chapterTitle}</div>
      <div class="page-text"><p>${withDropCap(p.text)}</p></div><div class="page-number">${p.pageNum}</div></div>
      <div class="swipe-hint">Swipe to flip</div>`;
  }

  bookCard.innerHTML = '';
  bookCard.appendChild(newEl);
  if (direction) newEl.classList.add('anim-in-forward');

  navDotsEl.innerHTML = '';
  pages.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentPage ? ' active' : '');
    d.onclick = () => goToPage(i);
    navDotsEl.appendChild(d);
  });

  navLeft.classList.toggle('hidden', !bookOpened || currentPage <= 0);
  navRight.classList.toggle('hidden', !bookOpened || p.type === 'end' || currentPage >= pages.length - 1);
}

function openBook() { bookOpened = true; document.getElementById('openHintBadge').classList.add('hidden'); document.getElementById('audioBar').classList.add('visible'); startMusic(); nextPage(); }
function nextPage() { if (currentPage < pages.length - 1) goToPage(currentPage + 1, 'forward'); }
function prevPage() { if (currentPage > 0) goToPage(currentPage - 1, 'backward'); }

function goToPage(target, dir) {
  if (animating || target === currentPage) return;
  animating = true; stopAllAudio(); currentPage = target;
  renderBook(dir);
  setTimeout(() => { animating = false; if (pages[currentPage].voiceSrc) playPageVoice(pages[currentPage].voiceSrc); }, 500);
}

renderBook();
</script>

    /* ── Mobile: pinned to the bottom edge, respecting the notch/gesture

<button id="backToRoomBtn" onclick="goBackToRoom()">
    <i class="fas fa-arrow-left"></i>
    <span id="backToRoomLabel">Back to room</span>
</button>

<script>
(function () {
    // Ensures the viewport respects the iPhone notch/gesture bar, so that
    // env(safe-area-inset-bottom) works even if the page's <meta viewport>
    // didn't have viewport-fit=cover configured.
    var vp = document.querySelector('meta[name="viewport"]');
    if (vp && vp.content.indexOf('viewport-fit') === -1) {
        vp.content = vp.content + ', viewport-fit=cover';
    } else if (!vp) {
        var m = document.createElement('meta');
        m.name = 'viewport';
        m.content = 'width=device-width, initial-scale=1.0, viewport-fit=cover';
        document.head.appendChild(m);
    }

    var returnUrl   = sessionStorage.getItem('lastRoomUrl');
    var returnTopic = sessionStorage.getItem('lastRoomTopicLabel') || sessionStorage.getItem('lastRoomTopic');
    var btn   = document.getElementById('backToRoomBtn');
    var label = document.getElementById('backToRoomLabel');

    // Only show the button if we arrived here from reproductor.html
    if (returnUrl) {
        btn.style.display = 'flex';
        if (returnTopic) {
            label.textContent = 'Back to ' + returnTopic;
        }
    }

    window.goBackToRoom = function () {
        window.location.href = returnUrl || 'reproductor.html';
    };
})();
</script>
