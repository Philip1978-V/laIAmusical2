    <style>
        /* ── Base ── */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f172a;
            background-image: url('./images/fondo3.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: white;
            padding-bottom: 4rem;
        }

        /* ── Missions panel ── */
        .weekly-missions-panel {
            background: linear-gradient(180deg, rgba(15,23,42,0.95), rgba(15,23,42,0.80));
            border: 1px solid rgba(251,191,36,0.25);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* ── Mission item card ── */
        .mission-item {
            background: rgba(15,23,42,0.85);
            border: 1px solid rgba(45,212,191,0.2);
            border-radius: 20px;
            padding: 1rem;
            position: relative;
            overflow: visible;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            cursor: help;
        }
        .mission-item:hover {
            transform: translateY(-3px);
            border-color: #14b8a6;
            box-shadow: 0 18px 30px rgba(20,184,166,0.15);
        }
        .mission-item.complete {
            background: rgba(15,23,42,0.65);
            border-color: rgba(251,191,36,0.4);
        }

        /* ── Mission card layout ── */
        .mission-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.85rem;
        }
        .mission-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem; height: 2.5rem;
            border-radius: 14px;
            background: rgba(14,116,144,0.18);
            color: #2dd4bf;
            font-size: 1.15rem;
            flex-shrink: 0;
        }
        .mission-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f8fafc;
            line-height: 1.25;
        }
        .mission-reward {
            background: rgba(14,116,144,0.15);
            color: #7dd3fc;
            border-radius: 9999px;
            padding: 0.4rem 0.85rem;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .mission-reward.bono {
            background: rgba(249,115,22,0.15);
            color: #fb923c;
        }
        .mission-reward.stars {
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
        }
        .mission-reward.diamonds {
            background: rgba(96,165,250,0.15);
            color: #60a5fa;
        }

        /* ── Progress bar ── */
        .mission-progress-track {
            background: rgba(148,163,184,0.12);
            border-radius: 9999px;
            height: 0.7rem;
            overflow: hidden;
            margin-bottom: 0.4rem;
        }
        .mission-progress-fill {
            background: linear-gradient(90deg, #14b8a6, #0f766e);
            height: 100%;
            border-radius: 9999px;
            transition: width 0.6s ease;
        }
        .mission-progress-fill.complete {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
        }
        .mission-progress-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: #94a3b8;
        }

        /* ── Tooltip on hover / click ── */
        .mission-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg,#1e293b 0%,#0f172a 100%);
            border: 1px solid #0d9488;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 11px;
            color: #cbd5e1;
            width: 240px;
            z-index: 200;
            box-shadow: 0 8px 28px rgba(0,0,0,0.55);
            line-height: 1.55;
            text-align: left;
            pointer-events: none;
        }
        .mission-tooltip::after {
            content: '';
            position: absolute;
            top: 100%; left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: #0d9488;
        }
        .mission-item:hover .mission-tooltip,
        .mission-item.show-tooltip .mission-tooltip { display: block; }

        /* ── Notification toast ── */
        .mission-toast {
            animation: slideInRight 0.4s ease, fadeOut 0.5s ease 2.5s forwards;
        }
        @keyframes slideInRight {
            from { opacity:0; transform: translateX(60px); }
            to   { opacity:1; transform: translateX(0); }
        }
        @keyframes fadeOut {
            to { opacity:0; transform: translateX(60px); }
        }

        /* ── Reset timer chip ── */
        .reset-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(15,23,42,0.8);
            border: 1px solid #334155;
            border-radius: 9999px;

            border-radius: 16px;
            padding: 2rem;

    function getCurrentLanguage() {
        return localStorage.getItem('selectedLanguage') || 'es';
    }
    function t(key, lang) {
        const l = lang || getCurrentLanguage();
        return translations[l]?.[key] ?? translations['es']?.[key] ?? key;
    }

    function applyLanguage(lang) {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            const val = t(key, lang);
            if (val) el.innerHTML = val;
        });
        // Re-render missions if data already loaded
        if (window._lastUserData) renderMissions(window._lastUserData);
    }

    window.addEventListener('storage', (e) => {
        if (e.key === 'selectedLanguage') applyLanguage(e.newValue || 'es');
    });

        applyLanguage(e.detail?.lang || getCurrentLanguage());
    });

    //  Week helpers
    // ════════════════════════════════════════════════════════
    function getCurrentWeekMonday() {
        const now = new Date();
        const day = now.getDay(); // 0=Sun
        const diff = day === 0 ? -6 : 1 - day;
        const monday = new Date(now);
        monday.setDate(now.getDate() + diff);
        monday.setHours(0, 0, 0, 0);
        return monday;
    }

    function setWeekLabel() {
        const monday  = getCurrentWeekMonday();
        const sunday  = new Date(monday); sunday.setDate(monday.getDate() + 6);
        const fmt     = (d) => d.toLocaleDateString(getCurrentLanguage() === 'en' ? 'en-US' : 'es-ES', { day: 'numeric', month: 'short' });
        const el      = document.getElementById('weekLabel');
        if (el) el.textContent = `${t('misiones.semana')} ${fmt(monday)} – ${fmt(sunday)}`;
    }

    // Countdown to next Monday 00:00
    function updateCountdown() {
        const now     = new Date();
        const day     = now.getDay();
        const daysToMonday = day === 0 ? 1 : 8 - day;
        const next    = new Date(now);
        next.setDate(now.getDate() + (day === 1 ? 7 : daysToMonday));
        next.setHours(0, 0, 0, 0);
        const diff  = next - now;
        const d     = Math.floor(diff / 86400000);
        const h     = String(Math.floor((diff % 86400000) / 3600000)).padStart(2, '0');
        const m     = String(Math.floor((diff % 3600000)  / 60000)).padStart(2, '0');
        const s     = String(Math.floor((diff % 60000)    / 1000)).padStart(2, '0');
        const el    = document.getElementById('resetCountdown');
        if (el) el.textContent = d > 0 ? `${d}d ${h}:${m}:${s}` : `${h}:${m}:${s}`;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();


    // ════════════════════════════════════════════════════════
    //  Build missions list (bilingual)
    // ════════════════════════════════════════════════════════
    function buildMissions(data, lang) {
        const currentMonday   = getCurrentWeekMonday();
        const weeklyActivity  = (data.activityLog || []).filter(a => new Date(a.timestamp) >= currentMonday);

        const weeklyVotes      = weeklyActivity.filter(a => a.type === 'vote').length;
        const rewardsCollected = weeklyActivity.filter(a => a.type === 'reward').length;
        const quizzesCompleted = Object.keys(data.quizLog || {}).length;
        const perfectQuizzes   = weeklyActivity.filter(a => a.type === 'quiz' && a.score === 5).length;
        const storiesVoted     = Object.keys(data.voteLog || {}).length;
        const discardedCount   = (data.discardedCards || []).length;

        const voteLogKeys = new Set(Object.keys(data.voteLog || {}));
        const quizLogKeys = new Set(Object.keys(data.quizLog || {}));
        let storiesWithBoth = 0;
        voteLogKeys.forEach(id => { if (quizLogKeys.has(id)) storiesWithBoth++; });

        return [
            {
                id: "votes_weekly",
                t:    t('m.votes_weekly.t', lang),
                desc: t('m.votes_weekly.desc', lang),
                c: weeklyVotes, g: 5,
                r: "50⭐", rewardType: "stars", rewardAmount: 50,
                icon: "fa-vote-yea"
            },
            {
                id: "rewards_daily",
                t:    t('m.rewards_daily.t', lang),
                desc: t('m.rewards_daily.desc', lang),
                c: rewardsCollected, g: 7,
                r: "25⭐", rewardType: "stars", rewardAmount: 25,
                icon: "fa-gift"
            },
            {
                id: "quizzes_completed",

    // ════════════════════════════════════════════════════════
    //  Reward type CSS class
    // ════════════════════════════════════════════════════════
    function rewardClass(rewardType) {
        if (rewardType === 'stars')    return 'stars';
        if (rewardType === 'diamonds') return 'diamonds';
        return 'bono';
    }


    // ════════════════════════════════════════════════════════
    //  Render missions
    // ════════════════════════════════════════════════════════
    async function renderMissions(data) {
        const lang      = getCurrentLanguage();
        window._lastUserData = data;
        const container = document.getElementById('missionsContainer');

        setWeekLabel();

        // Weekly reset check
        const currentMonday = getCurrentWeekMonday();
        const lastReset     = data.lastMissionReset ? new Date(data.lastMissionReset) : null;

        if (!lastReset || lastReset < currentMonday) {
            const userRef          = db.collection('users').doc(auth.currentUser.uid);
            const completedMissions = data.completedMissions || [];
            const lostMissions     = data.lostMissions || [];
            const allMissions      = buildMissions(data, lang);
            const toLose           = allMissions
                .filter(m => !completedMissions.includes(m.id) && !lostMissions.includes(m.id))
                .slice(0, 5)
                .map(m => m.id);

            await userRef.update({
                completedMissions: [],
                lostMissions:      firebase.firestore.FieldValue.arrayUnion(...toLose),
                lastMissionReset:  currentMonday.toISOString()
            });
            data.completedMissions = [];
            data.lostMissions = [...(data.lostMissions || []), ...toLose];
        }

        const currentCompleted = data.completedMissions || [];
        const currentLost      = data.lostMissions || [];
        const allMissions      = buildMissions(data, lang);

        const incompleteMissions = allMissions.filter(m =>
            !currentCompleted.includes(m.id) && !currentLost.includes(m.id)
        );

        // Pick up to 5 visible missions — always try to include EntusiastaDePremios
        let visibleMissions = incompleteMissions.slice(0, 5);
        const rewardEnthusiast = incompleteMissions.find(m => m.id === 'EntusiastaDePremios');
        if (rewardEnthusiast && !visibleMissions.some(m => m.id === 'EntusiastaDePremios')) {
            visibleMissions[visibleMissions.length - 1] = rewardEnthusiast;
        }

        // Stats
        const totalAll       = allMissions.length;
        const totalCompleted = currentCompleted.length;
        const totalPending   = visibleMissions.length;
        document.getElementById('countTotal').textContent     = totalAll;
        document.getElementById('countCompleted').textContent = totalCompleted;
        document.getElementById('countPending').textContent   = totalPending;

        container.innerHTML = '';

        if (visibleMissions.length === 0) {
            container.innerHTML = `
                <div class="all-done-banner">
                    <i class="fas fa-trophy text-amber-400 text-4xl mb-3 block"></i>
                    <p class="text-amber-300 font-bold text-lg">${t('misiones.todas_completadas', lang)}</p>
                    <p class="text-gray-400 text-sm mt-1">${t('misiones.nuevas_lunes', lang)}</p>
                </div>`;
            return;
        }

        visibleMissions.forEach(mission => {
            const progress    = Math.min(mission.c / mission.g, 1);
            const isCompleted = progress >= 1;

            // Auto-complete
            if (isCompleted && !currentCompleted.includes(mission.id)) {
                if (!window.completingMissions) window.completingMissions = new Set();
                if (!window.completingMissions.has(mission.id)) {
                    window.completingMissions.add(mission.id);
                    completeMission(mission, lang).then(() => {
                        window.completingMissions.delete(mission.id);
                    });
                }
                return;
            }

            const div = document.createElement('div');
            div.className = `mission-item${isCompleted ? ' complete' : ''}`;

            div.innerHTML = `
                <div class="mission-tooltip">${mission.desc}</div>
                <div class="mission-card-top">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="mission-icon"><i class="fas ${mission.icon}"></i></div>
                        <div class="mission-name truncate">${mission.t}</div>
                    </div>
                    <div class="mission-reward ${rewardClass(mission.rewardType)}">${mission.r}</div>
                </div>
                <div class="mission-progress-track">
                    <div class="mission-progress-fill${isCompleted ? ' complete' : ''}"
                         style="width: ${progress * 100}%"></div>
                </div>
                <div class="mission-progress-label">
                    <span class="font-semibold">${mission.c}/${mission.g}</span>
                    <span>${isCompleted ? t('misiones.completada', lang) : t('misiones.en_progreso', lang)}</span>
                </div>
            `;

            // Toggle tooltip on click (mobile)
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                div.classList.toggle('show-tooltip');
            });

            container.appendChild(div);
        });

        // Close tooltips on outside click
        if (!window._missionClickOutside) {
            document.addEventListener('click', () => {
                document.querySelectorAll('.mission-item.show-tooltip').forEach(el => el.classList.remove('show-tooltip'));
            });
            window._missionClickOutside = true;
        }
    }


    // ════════════════════════════════════════════════════════
    //  Complete mission + toast notification
    // ════════════════════════════════════════════════════════
    async function completeMission(mission, lang) {
        lang = lang || getCurrentLanguage();
        const userRef    = db.collection('users').doc(auth.currentUser.uid);
        const rewardIcon = mission.rewardType === 'stars' ? '⭐' : mission.rewardType === 'diamonds' ? '💎' : '🔓';

        try {
            const update = {
                completedMissions: firebase.firestore.FieldValue.arrayUnion(mission.id),
                activityLog: firebase.firestore.FieldValue.arrayUnion({
                    type: 'mission_completed',
                    description: `${lang === 'en' ? 'Mission completed' : 'Misión completada'}: ${mission.t} — +${mission.rewardAmount}${rewardIcon}`,
                    timestamp: new Date().toISOString()
                })
            };
            if (mission.rewardType === 'stars')    update.userStars    = firebase.firestore.FieldValue.increment(mission.rewardAmount);
            if (mission.rewardType === 'diamonds')  update.userDiamonds = firebase.firestore.FieldValue.increment(mission.rewardAmount);
            if (mission.rewardType === 'bonos')     update.userBonos    = firebase.firestore.FieldValue.increment(mission.rewardAmount);

            await userRef.update(update);
            showMissionToast(mission, lang, rewardIcon);
        } catch (err) {
            console.error('Error completando misión:', err);
        }
    }

    function showMissionToast(mission, lang, icon) {
        const toast = document.createElement('div');
        toast.className = 'mission-toast fixed top-5 right-5 z-[9999] bg-green-600 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 max-w-xs';
        toast.innerHTML = `
            <i class="fas fa-check-circle text-2xl text-green-200 flex-shrink-0"></i>
            <div>
                <p class="font-bold text-sm">${t('notif.mision_ok', lang)}</p>
                <p class="text-green-100 text-xs">${mission.t} — +${mission.rewardAmount}${icon}</p>
            </div>
        `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3200);
    }


    // ════════════════════════════════════════════════════════
    //  Auth + Firestore listener
    // ════════════════════════════════════════════════════════
    auth.onAuthStateChanged((user) => {
        if (user) {
            db.collection('users').doc(user.uid).onSnapshot(async (doc) => {
                if (doc.exists) {
                    await renderMissions(doc.data());
                } else {
                    await db.collection('users').doc(user.uid).set({
                        username: user.displayName || user.email.split('@')[0],
                        userStars: 0, userDiamonds: 0, userCoins: 0, userBonos: 0,
                        votesRemaining: 5, voteLog: {}, quizLog: {},
                        activityLog: [], discardedCards: [],
                        completedMissions: [], lostMissions: [],
                        createdAt: new Date().toISOString()
                    });
                }
            });
        } else {
            window.location.href = 'index.html';
        }
    });


    // ════════════════════════════════════════════════════════
    //  Logout
    // ════════════════════════════════════════════════════════
    function logout() {
        auth.signOut().then(() => { window.location.href = 'index.html'; }).catch(console.error);
    }

    </script>
