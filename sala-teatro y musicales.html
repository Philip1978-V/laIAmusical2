<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teatro y Musicales 🎭 - Votación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> 

    <style>
        :root {
            --primary-color: #C00000;
            --dark-color: #800000;
            --star-gold: #FFD700;
            --bg-light: #1a1a1a;
            --disabled-grey: #555;
            --ia-blue: #00bfff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: var(--bg-light);
            color: #eee;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #2b2b2b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .header-links { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .back-link { text-decoration: none; color: var(--ia-blue); font-weight: bold; }
        .temas-btn { background-color: #BEF264; color: #1a1a1a; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: bold; }

        .info-panel {
            background: #3d0000;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid var(--primary-color);
            text-align: center;
            color: #ffcccc;
        }

        .entrada-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #444;
            background-color: #333;
        }

        .titulo-ia { font-size: 1.1em; color: var(--ia-blue); font-weight: bold; display: block; margin-top: 5px; }

        .vote-btn {
            background: var(--primary-color); 
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .vote-btn:disabled { background: var(--disabled-grey); color: #888; }

        .vote-stats {
            display: flex;
            flex-direction: column;
            font-size: 0.85em;
            background: #444;
            padding: 8px 12px;
            border-radius: 8px;
            margin-right: 10px;
        }
        
        .rating-avg { color: var(--star-gold); font-weight: bold; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); }
        .modal-content { background: #222; color: white; margin: 10vh auto; padding: 40px; width: 90%; max-width: 500px; border-radius: 20px; text-align: center; border: 2px solid var(--primary-color); }
        
        .stars-container { display: flex; justify-content: center; gap: 10px; margin: 30px 0; flex-direction: row-reverse; }
        .stars-container i { font-size: 3em; color: #444; cursor: pointer; }
        .stars-container i:hover, .stars-container i:hover ~ i { color: var(--star-gold); }

        .genre-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .genre-btn { padding: 10px; border: 2px solid var(--primary-color); color: white; border-radius: 8px; background: none; cursor: pointer; }
        .genre-btn:hover { background: var(--primary-color); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-links">
        <a href="biblioteca.html" class="back-link">← Atras</a>
        <a href="temas.html" class="temas-btn">Volver a Temas</a>
    </div>

    <h1>Sala de Teatro y Musicales 🎭</h1>
    
    <div class="info-panel">
        <div id="votos-info">Cargando función...</div>
        <p>Vota por los clásicos que quieres ver transformados por la IA esta semana.</p>
    </div>

    <div id="lista-entradas"></div>
</div>

<div id="voteModal" class="modal">
    <div class="modal-content">
        <h2 id="vote-title">Tu valoración</h2>
        <div class="stars-container">
            <i class="fas fa-star" onclick="selectStar(5)"></i>
            <i class="fas fa-star" onclick="selectStar(4)"></i>
            <i class="fas fa-star" onclick="selectStar(3)"></i>
            <i class="fas fa-star" onclick="selectStar(2)"></i>
            <i class="fas fa-star" onclick="selectStar(1)"></i>
        </div>
    </div>
</div>

<div id="genreModal" class="modal">
    <div class="modal-content">
        <h2>¿Estilo musical IA?</h2>
        <div class="genre-grid">
            <button class="genre-btn" onclick="finishVote('Broadway')">Broadway</button>
            <button class="genre-btn" onclick="finishVote('Gótico')">Gótico</button>
            <button class="genre-btn" onclick="finishVote('Disney-style')">Disney-style</button>
            <button class="genre-btn" onclick="finishVote('Rock-Opera')">Rock-Opera</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, increment, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDW3Yv0AQAVlf3zTuxlqNq6dkZ6kQtpysM", authDomain: "laiamusical-4fba7.firebaseapp.com", projectId: "laiamusical-4fba7", storageBucket: "laiamusical-4fba7.firebasestorage.app", messagingSenderId: "49783369602", appId: "1:49783369602:web:91e287c094a8f2403d699b" };
    const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

    let currentUser = null, userVotesCount = 0, userVotedTitles = [], currentItemIndex = null, selectedRating = 0;

    const entradasBase = [
        { id: "miserables", titulo: "Los Miserables", autor: "Victor Hugo" },
        { id: "fantasma", titulo: "El Fantasma de la Ópera", autor: "A.L. Webber" },
        { id: "hamlet", titulo: "Hamlet", autor: "W. Shakespeare" },
        { id: "rey_leon_mus", titulo: "El Rey León (Musical)", autor: "Julie Taymor" },
        { id: "bernarda_alba", titulo: "La casa de Bernarda Alba", autor: "F. García Lorca" }
    ].sort((a, b) => a.titulo.localeCompare(b.titulo));

    window.openVoteModal = (i) => { if (userVotesCount >= 3) return; currentItemIndex = i; document.getElementById('voteModal').style.display = 'block'; };
    window.selectStar = (r) => { selectedRating = r; document.getElementById('voteModal').style.display = 'none'; document.getElementById('genreModal').style.display = 'block'; };
    window.finishVote = async (genre) => {
        const item = entradasBase[currentItemIndex];
        const weekId = `week-teatro-${new Date().setDate(new Date().getDate() - (new Date().getDay() || 7) + 1)}`;
        await setDoc(doc(db, "global_votes_teatro", item.id), { totalRating: increment(selectedRating), voteCount: increment(1), [`genres.${genre}`]: increment(1) }, { merge: true });
        userVotedTitles.push(item.id); userVotesCount++;
        await setDoc(doc(db, "users", currentUser.uid, "weekly_stats_teatro", weekId), { count: userVotesCount, voted_ids: userVotedTitles }, { merge: true });
        document.getElementById('genreModal').style.display = 'none'; await checkUserVoteStatus(); renderList();
    };

    onAuthStateChanged(auth, u => { if (u) { currentUser = u; checkUserVoteStatus(); renderList(); onSnapshot(collection(db, "global_votes_teatro"), renderList); } });

    async function checkUserVoteStatus() {
        const weekId = `week-teatro-${new Date().setDate(new Date().getDate() - (new Date().getDay() || 7) + 1)}`;
        const snap = await getDoc(doc(db, "users", currentUser.uid, "weekly_stats_teatro", weekId));
        if (snap.exists()) { userVotesCount = snap.data().count; userVotedTitles = snap.data().voted_ids; }
        document.getElementById('votos-info').innerText = `Votos de la semana: ${userVotesCount}/3`;
    }

    async function renderList() {
        const cont = document.getElementById('lista-entradas');
        const snap = await getDocs(collection(db, "global_votes_teatro"));
        const dataMap = {}; snap.forEach(d => dataMap[d.id] = d.data());
        cont.innerHTML = '';
        entradasBase.forEach((e, i) => {
            const v = dataMap[e.id] || { totalRating: 0, voteCount: 0, genres: {} };
            const avg = v.voteCount > 0 ? (v.totalRating / v.voteCount).toFixed(1) : "0.0";
            let topG = ""; let maxV = 0; for(let g in v.genres) { if(v.genres[g] > maxV) { maxV = v.genres[g]; topG = g; } }
            const yaV = userVotedTitles.includes(e.id);
            const div = document.createElement('div'); div.className = 'entrada-item';
            div.innerHTML = `<div><b>🎭 ${e.titulo}</b><br><small>${e.autor}</small><br><span class="titulo-ia">✨ IA: ${topG ? e.titulo + " ("+topG+")" : ""}</span></div>
            <div class="controles-votacion"><div class="vote-stats"><span class="rating-avg">⭐ ${avg}</span></div>
            <button class="vote-btn" ${yaV || userVotesCount >= 3 ? 'disabled' : ''} onclick="openVoteModal(${i})">${yaV ? 'Votado' : 'Votar'}</button></div>`;
            cont.appendChild(div);
        });
    }
</script>
</body>
</html>
