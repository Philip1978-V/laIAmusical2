<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Storycards – La IA Musical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        /* ─── FONDO Y ESTILOS BASE ─── */
        body {
            background-image: url('./images/fondostorycards.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 60px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(2, 12, 28, 0.72);
            z-index: 0;
            pointer-events: none;
        }

        header, main, .fixed-footer { position: relative; z-index: 1; }

        /* ─── ANIMACIONES DE PODIO (TOP 3) ─── */
        @keyframes glow-gold {
            0%, 100% { box-shadow: 0 0 18px 4px rgba(250,204,21,0.55); border-color: rgba(250,204,21,0.7); }
            50% { box-shadow: 0 0 42px 12px rgba(250,204,21,0.9); border-color: rgba(250,204,21,1); }
        }
        @keyframes glow-silver {
            0%, 100% { box-shadow: 0 0 16px 3px rgba(209,213,219,0.45); border-color: rgba(209,213,219,0.6); }
            50% { box-shadow: 0 0 38px 10px rgba(209,213,219,0.85); border-color: rgba(209,213,219,0.95); }
        }
        @keyframes glow-bronze {
            0%, 100% { box-shadow: 0 0 16px 3px rgba(180,120,60,0.5); border-color: rgba(180,120,60,0.65); }
            50% { box-shadow: 0 0 36px 10px rgba(210,140,70,0.88); border-color: rgba(210,140,70,0.95); }
        }
        @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }

        /* ─── TARJETAS PODIO ─── */
        .podium-card {
            background: rgba(10, 25, 47, 0.82);
            backdrop-filter: blur(20px);
            border-radius: 22px;
            border: 2px solid transparent;
            overflow: hidden;
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }
        .rank-1 { animation: glow-gold 1.8s infinite ease-in-out; }
        .rank-2 { animation: glow-silver 1.8s infinite ease-in-out; }
        .rank-3 { animation: glow-bronze 1.8s infinite ease-in-out; }

        .podium-card .cover-wrap { position: relative; overflow: hidden; background: #0a1628; }
        .podium-card .cover-wrap img { width: 100%; height: 100%; object-fit: cover; }

        .rank-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 40px; height: 40px; border-radius: 50%; font-weight: 900;
        }
        .gold { background: linear-gradient(135deg,#f59e0b,#fbbf24); color:#422006; }
        .silver { background: linear-gradient(135deg,#9ca3af,#e5e7eb); color:#1f2937; }
        .bronze { background: linear-gradient(135deg,#b45309,#d97706); color:#fff; }

        .shimmer-text {
            background: linear-gradient(90deg, #fde68a, #fbbf24, #fff, #fbbf24, #fde68a);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 2.5s linear infinite;
        }

        /* ─── DISEÑO ADAPTABLE (MOBILE VS DESKTOP) ─── */
        @media (max-width: 767px) {
            #podiumGrid { display: flex !important; flex-direction: column !important; gap: 1.5rem !important; }
            .podium-card.rank-1 { order: 1; }
            .podium-card.rank-2 { order: 2; }
            .podium-card.rank-3 { order: 3; }
            .podium-card .cover-wrap { height: 320px !important; }
        }
        @media (min-width: 768px) {
            #podiumGrid { display: grid; grid-template-columns: repeat(3, 1fr); align-items: end; gap: 1.5rem; }
            .podium-center { margin-top: -28px; }
            .podium-card.rank-1 .cover-wrap { height: 260px; }
            .podium-card.rank-2 .cover-wrap, .podium-card.rank-3 .cover-wrap { height: 210px; }
        }

        /* ─── LISTA DE RANKING ─── */
        .ranking-row {
            background: rgba(13, 30, 55, 0.7);
            border-radius: 14px;
            border: 1px solid rgba(45, 212, 191, 0.12);
            transition: all 0.2s;
        }
        .star-bar-bg { height: 5px; border-radius: 999px; background: rgba(45, 212, 191, 0.12); overflow: hidden; }
        .star-bar-fill { height: 100%; background: linear-gradient(90deg, #fbbf24, #f59e0b); transition: width 1s ease; }
    </style>
</head>
<body>

<header class="sticky top-0 z-50 bg-black/50 backdrop-blur-lg border-b border-teal-800/40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
        <button onclick="window.location.href='index.html'" class="flex items-center gap-2 text-teal-300 font-bold uppercase text-xs tracking-widest">
            <i class="fas fa-music"></i> La IA Musical
        </button>
        <h1 id="pageTitle" class="text-lg font-black tracking-tight shimmer-text uppercase">🏆 CLASIFICACIÓN</h1>
        <div class="flex items-center gap-3">
            <button onclick="loadRanking()" class="text-teal-400 text-sm"><i class="fas fa-sync-alt"></i></button>
            <button onclick="logout()" class="text-gray-400 text-sm"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-8">
    <div id="infoBar" class="hidden grid grid-cols-3 gap-2 mb-8 bg-black/40 p-4 rounded-2xl border border-teal-900/30 text-center text-[10px] sm:text-xs">
        <div><p class="text-gray-500 uppercase">Cartas</p><p id="totalCards" class="font-bold text-teal-400">-</p></div>
        <div><p class="text-gray-500 uppercase">Estrellas</p><p id="totalStarsGlobal" class="font-bold text-yellow-500">-</p></div>
        <div><p class="text-gray-500 uppercase">Actualizado</p><p id="lastUpdate" class="font-bold text-gray-300">-</p></div>
    </div>

    <!-- PODIO TOP 3 -->
    <div id="podiumSection" class="hidden mb-12">
        <div id="podiumGrid"></div>
    </div>

    <!-- LISTA RESTANTE 4-30 -->
    <div id="divider" class="hidden flex items-center gap-3 mb-6">
        <div class="h-px flex-1 bg-teal-900/50"></div>
        <span id="lblPositions" class="text-[10px] font-bold text-teal-500 uppercase tracking-widest">TOP 4 – 30</span>
        <div class="h-px flex-1 bg-teal-900/50"></div>
    </div>
    <div id="rankingList" class="space-y-3"></div>

    <div id="loader" class="flex flex-col items-center py-20 gap-4">
        <div class="w-10 h-10 border-4 border-teal-500/20 border-t-teal-500 rounded-full animate-spin"></div>
        <p id="loadingText" class="text-teal-400 text-xs animate-pulse">Sincronizando ranking...</p>
    </div>
</main>

<script>
// ── CONFIGURACIÓN Y IDIOMA ──
const currentLang = localStorage.getItem('selectedLanguage') || 'es';
const translations = {
    es: { title: "🏆 CLASIFICACIÓN", loading: "Cargando ranking...", topFan: "Top Fan:", positions: "TOP 4 – 30" },
    en: { title: "🏆 RANKING", loading: "Loading ranking...", topFan: "Top Fan:", positions: "TOP 4 – 30" }
};

const firebaseConfig = {
    apiKey: "AIzaSyDW3Yv0AQAVlf3zTuxlqNq6dkZ6kQtpysM",
    authDomain: "laiamusical-4fba7.firebaseapp.com",
    projectId: "laiamusical-4fba7",
    storageBucket: "laiamusical-4fba7.firebasestorage.app",
    messagingSenderId: "49783369602",
    appId: "1:49783369602:web:91e287c094a8f2403d699b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ── CATALOGO TOP 30 ──
const songs = [
    { id: 1,   title: "La novena sinfonía del mundo", titleEn: "The 9th Symphony", cover: "./imagenportada/opera_sinfoniamundo.png", topic: "Ópera", topicEn: "Opera" },
    { id: 5,   title: "El lenguaje del mundo", titleEn: "Language of the World", cover: "./imagenportada/lit_lenguajedelmundo.png", topic: "Literatura", topicEn: "Literature" },
    { id: 7,   title: "El ojo que todo lo ve", titleEn: "The All-Seeing Eye", cover: "./imagenportada/lit_1984.png", topic: "Literatura", topicEn: "Literature" },
    { id: 13,  title: "Tiempos peligrosos", titleEn: "Dangerous Times", cover: "./imagenportada/cine_tiempospeligrosos.png", topic: "Cine", topicEn: "Cinema" },
    { id: 14,  title: "La línea temporal perdida", titleEn: "Lost Timeline", cover: "./imagenportada/cine_lineatemporal.png", topic: "Cine", topicEn: "Cinema" },
    { id: 15,  title: "Biblioteca de horizontes", titleEn: "Horizon Library", cover: "./imagenportada/cine_bibliotecadehorizontes.png", topic: "Cine", topicEn: "Cinema" },
    { id: 16,  title: "Alas de libertad", titleEn: "Wings of Freedom", cover: "./imagenportada/cine_alasdelibertad.png", topic: "Cine", topicEn: "Cinema" },
    { id: 18,  title: "La cicatriz invisible", titleEn: "Invisible Scar", cover: "./imagenportada/lit_cicatriz.png", topic: "Literatura", topicEn: "Literature" },
    { id: 20,  title: "El imperio del trueno", titleEn: "Empire of Thunder", cover: "./imagenportada/cine_imperiodeltrueno.png", topic: "Cine", topicEn: "Cinema" },
    { id: 21,  title: "La herencia del olvido", titleEn: "Inheritance of Oblivion", cover: "./imagenportada/lit_herencia.png", topic: "Literatura", topicEn: "Literature" },
    { id: 22,  title: "El Señor de los locos y sabios", titleEn: "Lord of Madmen", cover: "./imagenportada/lit_quijote.png", topic: "Literatura", topicEn: "Literature" },
    { id: 26,  title: "Voces entre chapas", titleEn: "Voices in Metal", cover: "./imagenportada/cine_vocesentrechapas.png", topic: "Cine", topicEn: "Cinema" },
    { id: 27,  title: "Semilla de luz", titleEn: "Seed of Light", cover: "./imagenportada/cine_semilladeluz.png", topic: "Cine", topicEn: "Cinema" },
    { id: 28,  title: "El Destino", titleEn: "The Destiny", cover: "./imagenportada/cine_eldestino.png", topic: "Cine", topicEn: "Cinema" },
    { id: 29,  title: "El grito en el espacio", titleEn: "Scream in Space", cover: "./imagenportada/cine_grito.png", topic: "Cine", topicEn: "Cinema" },
    { id: 100, title: "Vivir en un suspiro", titleEn: "Living in a Sigh", cover: "./imagenportada/opera_vivirenunsuspiro.png", topic: "Ópera", topicEn: "Opera" },
    { id: 101, title: "El reloj de la naturaleza", titleEn: "Nature's Clock", cover: "./imagenportada/opera_relojdelanaturaleza.png", topic: "Ópera", topicEn: "Opera" },
    { id: 102, title: "Donde muere la noche", titleEn: "Where Night Dies", cover: "./imagenportada/opera_dondemuerelanoche.png", topic: "Ópera", topicEn: "Opera" },
    { id: 103, title: "Sinfonía de los jardines", titleEn: "Garden Symphony", cover: "./imagenportada/opera_jardinesreales.png", topic: "Ópera", topicEn: "Opera" },
    { id: 104, title: "El ave sin jaula", titleEn: "Bird Without Cage", cover: "./imagenportada/opera_avesinjaula.png", topic: "Ópera", topicEn: "Opera" },
    { id: 200, title: "Una jungla divertida", titleEn: "Funny Jungle", cover: "./imagenportada/animacion_jungladivertida.png", topic: "Animación", topicEn: "Animation" },
    { id: 201, title: "Despierta mi constelación", titleEn: "Wake My Constellation", cover: "./imagenportada/animacion_miconstelacion.png", topic: "Animación", topicEn: "Animation" },
    { id: 202, title: "La aventura de tu vida", titleEn: "Adventure of Life", cover: "./imagenportada/animacion_aventuradetuvida.png", topic: "Animación", topicEn: "Animation" },
    { id: 203, title: "Latidos de papel", titleEn: "Paper Heartbeats", cover: "./imagenportada/animacion_latidosdepapel.png", topic: "Animación", topicEn: "Animation" },
    { id: 300, title: "El eco de la libertad", titleEn: "Echo of Freedom", cover: "./imagenportada/teatro_ecodelalibertad.png", topic: "Teatro", topicEn: "Theater" },
    { id: 400, title: "Canto de Escarcha", titleEn: "Frost Song", cover: "./imagenportada/series_cantoescarcha.png", topic: "Series", topicEn: "Series" },
    { id: 500, title: "El juramento de las murallas", titleEn: "Oath of Walls", cover: "./imagenportada/anime_juramentomurallas.png", topic: "Anime", topicEn: "Anime" },
    { id: 600, title: "Planeta Tierra", titleEn: "Planet Earth", cover: "./imagenportada/doc_planetatierra.png", topic: "Documentales", topicEn: "Documentary" },
    { id: 601, title: "Microcosmos", titleEn: "Microcosmos", cover: "./imagenportada/doc_microcosmos.png", topic: "Documentales", topicEn: "Documentary" },
    { id: 602, title: "Mundos perdidos", titleEn: "Lost Worlds", cover: "./imagenportada/doc_mundosperdidos.png", topic: "Documentales", topicEn: "Documentary" }
];

function buildPodiumCard(song, rank, topUser, maxStars) {
    const dTitle = currentLang === 'en' ? song.titleEn : song.title;
    const dTopic = currentLang === 'en' ? song.topicEn : song.topic;
    const badgeClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : 'bronze';
    const pct = Math.round((song.totalStars / maxStars) * 100) || 0;

    return `
    <div class="podium-card rank-${rank} ${rank === 1 ? 'podium-center' : ''}">
        <div class="cover-wrap">
            <img src="${song.cover}" onerror="this.src='./imagenportada/proximamente.png'">
            <div class="absolute top-3 left-3 rank-badge ${badgeClass}">${rank}</div>
        </div>
        <div class="p-4 bg-slate-900/90 flex-1">
            <span class="text-[9px] font-bold text-teal-400 uppercase tracking-widest">${dTopic}</span>
            <h3 class="mt-1 font-bold leading-tight ${rank === 1 ? 'shimmer-text text-lg' : 'text-sm'}">${dTitle}</h3>
            <div class="star-bar-bg mt-3"><div class="star-bar-fill" style="width:${pct}%"></div></div>
            <div class="mt-2 flex items-center justify-between">
                <span class="text-xs text-yellow-500 font-black">${song.totalStars} ⭐</span>
                <span class="text-[9px] text-gray-500 italic">${translations[currentLang].topFan} ${topUser}</span>
            </div>
        </div>
    </div>`;
}

async function loadRanking() {
    document.getElementById('pageTitle').textContent = translations[currentLang].title;
    document.getElementById('loadingText').textContent = translations[currentLang].loading;
    document.getElementById('loader').classList.remove('hidden');

    try {
        const snap = await db.collection('ranking').doc('stars').get();
        const rankingData = snap.data()?.rankingStars || {};

        let ranked = songs.map(s => ({ ...s, totalStars: rankingData[s.id] || 0 }))
                          .sort((a, b) => b.totalStars - a.totalStars)
                          .slice(0, 30);

        const topUserSnap = await db.collection('users').orderBy('userStars', 'desc').limit(1).get();
        const topUser = topUserSnap.docs[0]?.data()?.displayName || 'Anon';
        const maxStars = ranked[0]?.totalStars || 1;

        // Renderizar Podio (2-1-3 en Desktop)
        const top3 = ranked.slice(0, 3);
        const displayOrder = [top3[1], top3[0], top3[2]].filter(Boolean);
        document.getElementById('podiumGrid').innerHTML = displayOrder.map(s => {
            const rank = ranked.indexOf(s) + 1;
            return buildPodiumCard(s, rank, topUser, maxStars);
        }).join('');

        // Renderizar Lista 4-30
        const rest = ranked.slice(3);
        document.getElementById('rankingList').innerHTML = rest.map((s, i) => {
            const dTitle = currentLang === 'en' ? s.titleEn : s.title;
            const pct = Math.round((s.totalStars / maxStars) * 100);
            return `
            <div class="ranking-row flex items-center gap-4 p-3">
                <span class="w-6 text-center font-black text-gray-600">#${i+4}</span>
                <img src="${s.cover}" class="w-12 h-12 rounded-lg object-cover bg-black">
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-sm truncate uppercase">${dTitle}</p>
                    <div class="star-bar-bg w-full mt-1"><div class="star-bar-fill" style="width:${pct}%"></div></div>
                </div>
                <div class="text-right"><p class="text-xs font-bold text-yellow-500">${s.totalStars} ⭐</p></div>
            </div>`;
        }).join('');

        document.getElementById('totalCards').textContent = songs.length;
        document.getElementById('totalStarsGlobal').textContent = ranked.reduce((a,b) => a + b.totalStars, 0);
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString([], {hour: '2-min', minute:'2-min'});
        
        document.getElementById('podiumSection').classList.remove('hidden');
        document.getElementById('divider').classList.remove('hidden');
        document.getElementById('infoBar').classList.remove('hidden');
    } catch (e) { console.error(e); }
    document.getElementById('loader').classList.add('hidden');
}

function logout() { firebase.auth().signOut().then(() => window.location.href = 'index.html'); }

firebase.auth().onAuthStateChanged(user => user ? loadRanking() : window.location.href = 'index.html');
</script>
</body>
</html>
