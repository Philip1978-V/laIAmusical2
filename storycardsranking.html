<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Storycards – La IA Musical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        /* ─── FONDO ─── */
        body {
            background-image: url('./images/fondostorycards.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 60px;
        }

        /* ─── OVERLAY SEMI-OPACO PARA LEGIBILIDAD ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(2, 12, 28, 0.72);
            z-index: 0;
            pointer-events: none;
        }

        /* Todos los hijos directos de body por encima del overlay */
        header, main, .fixed-footer {
            position: relative;
            z-index: 1;
        }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar { width: 7px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #0d9488; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #14b8a6; }

        /* ─── PODIO: BRILLO INTERMITENTE TOP 3 ─── */
        @keyframes glow-gold {
            0%, 100% {
                box-shadow: 0 0 18px 4px rgba(250,204,21,0.55),
                            0 8px 32px rgba(0,0,0,0.6),
                            inset 0 1px 0 rgba(255,255,255,0.12);
                border-color: rgba(250,204,21,0.7);
            }
            50% {
                box-shadow: 0 0 42px 12px rgba(250,204,21,0.9),
                            0 8px 48px rgba(0,0,0,0.7),
                            inset 0 1px 0 rgba(255,255,255,0.18);
                border-color: rgba(250,204,21,1);
            }
        }
        @keyframes glow-silver {
            0%, 100% {
                box-shadow: 0 0 16px 3px rgba(209,213,219,0.45),
                            0 8px 32px rgba(0,0,0,0.6),
                            inset 0 1px 0 rgba(255,255,255,0.10);
                border-color: rgba(209,213,219,0.6);
            }
            50% {
                box-shadow: 0 0 38px 10px rgba(209,213,219,0.85),
                            0 8px 48px rgba(0,0,0,0.65),
                            inset 0 1px 0 rgba(255,255,255,0.16);
                border-color: rgba(209,213,219,0.95);
            }
        }
        @keyframes glow-bronze {
            0%, 100% {
                box-shadow: 0 0 16px 3px rgba(180,120,60,0.5),
                            0 8px 32px rgba(0,0,0,0.6),
                            inset 0 1px 0 rgba(255,255,255,0.08);
                border-color: rgba(180,120,60,0.65);
            }
            50% {
                box-shadow: 0 0 36px 10px rgba(210,140,70,0.88),
                            0 8px 48px rgba(0,0,0,0.65),
                            inset 0 1px 0 rgba(255,255,255,0.14);
                border-color: rgba(210,140,70,0.95);
            }
        }

        @keyframes badge-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.8; }
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ─── PODIO CARDS ─── */
        .podium-card {
            background: rgba(10, 25, 47, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            border: 2px solid transparent;
            overflow: hidden;
            transition: transform 0.3s;
            animation-duration: 1.8s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }
        .podium-card:hover { transform: translateY(-6px) scale(1.02); }

        .podium-card.rank-1 {
            animation-name: glow-gold;
            border-color: rgba(250,204,21,0.8);
        }
        .podium-card.rank-2 {
            animation-name: glow-silver;
            border-color: rgba(209,213,219,0.7);
        }
        .podium-card.rank-3 {
            animation-name: glow-bronze;
            border-color: rgba(180,120,60,0.7);
        }

        .podium-card .cover-wrap {
            position: relative;
            overflow: hidden;
        }
        .podium-card .cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.5s;
        }
        .podium-card:hover .cover-wrap img { transform: scale(1.07); }

        /* ─── BADGE POSICIÓN ─── */
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.15rem;
            font-weight: 900;
            animation: badge-pulse 1.8s ease-in-out infinite;
            flex-shrink: 0;
        }
        .rank-badge.gold   { background: linear-gradient(135deg,#f59e0b,#fbbf24); color:#422006; box-shadow: 0 0 18px rgba(251,191,36,0.7); }
        .rank-badge.silver { background: linear-gradient(135deg,#9ca3af,#e5e7eb); color:#1f2937; box-shadow: 0 0 14px rgba(209,213,219,0.6); }
        .rank-badge.bronze { background: linear-gradient(135deg,#b45309,#d97706); color:#fff; box-shadow: 0 0 14px rgba(180,120,60,0.6); }

        /* ─── STARS DISPLAY ─── */
        .stars-display {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .star-filled { color: #fbbf24; }
        .star-empty  { color: #374151; }

        /* ─── SHIMMER TEXT (título 1er puesto) ─── */
        .shimmer-text {
            background: linear-gradient(90deg, #fde68a 0%, #fbbf24 30%, #fff 50%, #fbbf24 70%, #fde68a 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 2.5s linear infinite;
        }

        /* ─── RANKING LIST ─── */
        .ranking-row {
            background: rgba(13, 30, 55, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(45, 212, 191, 0.12);
            border-radius: 14px;
            transition: transform 0.2s, background 0.2s, border-color 0.2s;
            animation: slideInLeft 0.4s ease-out both;
        }
        .ranking-row:hover {
            transform: translateX(6px);
            background: rgba(13, 45, 70, 0.85);
            border-color: rgba(45, 212, 191, 0.35);
        }
        .ranking-row .row-position {
            min-width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(13, 148, 136, 0.18);
            border: 1px solid rgba(45, 212, 191, 0.25);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .ranking-row .row-thumb {
            width: 52px;
            height: 52px;
            border-radius: 10px;
            object-fit: contain;
            background: #0f172a;
            flex-shrink: 0;
        }

        /* ─── TOPIC PILL ─── */
        .topic-pill {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(13, 148, 136, 0.22);
            border: 1px solid rgba(45, 212, 191, 0.3);
            color: #5eead4;
            white-space: nowrap;
        }

        /* ─── HEADER TITLE ─── */
        .page-title {
            background: linear-gradient(90deg, #2dd4bf, #38bdf8, #a78bfa, #2dd4bf);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s linear infinite;
        }

        /* ─── LOADER ─── */
        .loader-ring {
            display: inline-block;
            width: 56px; height: 56px;
            border: 5px solid rgba(45, 212, 191, 0.2);
            border-top-color: #2dd4bf;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── PODIO SECTION TITLE ─── */
        .section-label {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #64748b;
        }

        /* ─── PROGRESS BAR STARS ─── */
        .star-bar-bg {
            height: 5px;
            border-radius: 999px;
            background: rgba(45, 212, 191, 0.12);
            overflow: hidden;
        }
        .star-bar-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ─── PODIO: card central 1° más alto ─── */
        .podium-center { margin-top: -28px; }

        /* ─── FLOATING TROPHY ─── */
        .floating-trophy {
            animation: float 2.5s ease-in-out infinite;
            display: inline-block;
        }

        /* ─── DELAY ANIMATIONS RANKING LIST ─── */
        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.10s; }
        .delay-3 { animation-delay: 0.15s; }
        .delay-4 { animation-delay: 0.20s; }
        .delay-5 { animation-delay: 0.25s; }
        .delay-6 { animation-delay: 0.30s; }

        /* ─── REFRESH BTN ─── */
        .refresh-btn {
            background: rgba(13, 148, 136, 0.25);
            border: 1px solid rgba(45, 212, 191, 0.4);
            color: #2dd4bf;
            padding: 8px 20px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .refresh-btn:hover { background: rgba(13, 148, 136, 0.5); transform: scale(1.04); }

        @media (max-width: 640px) {
            body {
                background-attachment: scroll;
            }
            header > div {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            header .flex.items-center.gap-4 {
                justify-content: center;
            }
            header .flex.items-center.gap-3 {
                justify-content: center;
            }
            .refresh-btn {
                width: 100%;
                justify-content: center;
            }
            .page-title {
                font-size: 1.4rem;
            }
            #infoBar {
                flex-direction: column;
                align-items: stretch;
            }
            #infoBar > div {
                justify-content: flex-start;
            }
            .podium-card {
                border-radius: 18px;
            }
            .podium-card .cover-wrap {
                height: 180px !important;
            }
            .podium-card.rank-1 .cover-wrap {
                height: 200px !important;
            }
            .ranking-row {
                flex-direction: column;
                align-items: stretch;
            }
            .ranking-row .row-position {
                margin-bottom: 0.75rem;
            }
            .ranking-row .row-thumb {
                width: 100%;
                height: auto;
                object-fit: cover;
                border-radius: 18px;
            }
            .ranking-row .star-bar-bg {
                width: 100% !important;
            }
            .ranking-row > .flex-1 {
                margin-bottom: 0.75rem;
            }
            .ranking-row .flex-col.items-end {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                gap: 0.75rem;
            }
            .ranking-row .stars-display {
                justify-content: flex-start;
            }
            .topic-pill {
                font-size: 0.68rem;
                padding: 4px 8px;
            }
        }
    </style>
</head>

            <!-- Se rellena con JS -->
        </div>
    </div>

    <!-- ── DIVISOR ── -->
    <div id="divider" class="hidden flex items-center gap-3 mb-6">
        <div class="h-px flex-1 bg-gradient-to-r from-transparent via-teal-600/40 to-transparent"></div>
Posiciones 4 – 30
        <div class="h-px flex-1 bg-gradient-to-r from-transparent via-teal-600/40 to-transparent"></div>
    </div>

    <!-- ── LISTA 4-60 ── -->
    <div id="rankingList" class="space-y-2.5">
        <!-- Se rellena con JS -->
    </div>

    <!-- ── EMPTY STATE ── -->
    <div id="emptyState" class="hidden text-center py-16">
        <i class="fas fa-star text-gray-600 text-5xl mb-4"></i>

        <p class="text-gray-500 text-sm mt-1">¡Sé el primero en votar en el reproductor!</p>
    </div>

</main>

    "Cine":                  { bg: "rgba(234,179,8,0.15)",  border: "rgba(253,224,71,0.4)",  text: "#fde047" },
    "Animación":             { bg: "rgba(249,115,22,0.18)", border: "rgba(253,186,116,0.4)", text: "#fdba74" },
    "Teatro y musicales":    { bg: "rgba(236,72,153,0.18)", border: "rgba(249,168,212,0.4)", text: "#f9a8d4" },

// ── 4. HELPERS ──
function getTopicStyle(topic) {
    return topicColors[topic] || { bg: "rgba(45,212,191,0.12)", border: "rgba(45,212,191,0.3)", text: "#2dd4bf" };
}

function renderStars(count, max = 5) {
    // Show dots representing votes (max 5-star icons for readability)
    const display = Math.min(count, 500); // cap visual
    const numFull = Math.min(5, Math.ceil(count / Math.max(1, 10)));
    let html = '';
    for (let i = 0; i < 5; i++) {
        html += `<i class="fas fa-star text-xs ${i < numFull ? 'star-filled' : 'star-empty'}"></i>`;
    }
    return html;
}

function formatStars(n) {
    if (n >= 1000) return (n/1000).toFixed(1) + 'k';
    return n;
}

function formatTime(d) {
    return d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// ── 5. BUILD PODIUM CARD HTML ──
function buildPodiumCard(song, rank, maxStars) {
    const trophyIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : '🥉';
    const trophyClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : 'bronze';
    const titleClass  = rank === 1 ? 'shimmer-text text-lg' : 'text-base text-white font-bold';
    const ts = getTopicStyle(song.topic);
    const coverH = rank === 1 ? '220px' : '180px';
    const pct = maxStars > 0 ? Math.round((song.totalStars / maxStars) * 100) : 0;

    return `
    <div class="podium-card rank-${rank} ${rank === 1 ? 'podium-center' : ''} flex flex-col" style="animation-delay: ${(rank-1)*0.2}s">
        <!-- COVER -->
        <div class="cover-wrap" style="height:${coverH}; background:#0a1628;">
            <img src="${song.cover}" alt="${song.title}" loading="lazy"
                 onerror="this.src='./imagenportada/proximamente.png'">
            <!-- RANK OVERLAY -->
            <div class="absolute top-3 left-3">
                <div class="rank-badge ${trophyClass}">${rank}</div>
            </div>
            <!-- TROPHY -->
            <div class="absolute top-2 right-3 text-2xl">${trophyIcon}</div>
        </div>

        <!-- BODY -->
        <div class="p-3 flex flex-col gap-2 flex-1" style="background: rgba(5,15,30,0.6)">
            <!-- TOPIC PILL -->
            <div>
                <span class="topic-pill" style="background:${ts.bg}; border-color:${ts.border}; color:${ts.text}">
                    ${song.topic}
                </span>
            </div>

            <!-- TITLE -->
            <h3 class="${titleClass} leading-snug line-clamp-2 text-sm md:text-base">${song.title}</h3>

            <!-- STARS COUNT -->
            <div class="flex items-center justify-between mt-auto">
                <div class="stars-display">
                    ${renderStars(song.totalStars)}
                    <span class="text-xs text-gray-400 ml-1">${formatStars(song.totalStars)}</span>
                </div>
                <span class="text-xs text-gray-500">${song.category}</span>
            </div>

            <!-- BAR -->
            <div class="star-bar-bg">
                <div class="star-bar-fill" style="width:${pct}%"></div>
            </div>
        </div>
    </div>`;
}

// ── 6. BUILD RANKING ROW HTML ──
function buildRow(song, rank, maxStars, delayClass) {
    const ts = getTopicStyle(song.topic);
    const pct = maxStars > 0 ? Math.round((song.totalStars / maxStars) * 100) : 0;
    return `
    <div class="ranking-row flex items-center gap-3 px-3 py-2.5 ${delayClass}">
        <!-- POSITION -->
        <div class="row-position">#${rank}</div>

        <!-- THUMB -->
        <img src="${song.cover}" alt="${song.title}" class="row-thumb"
             onerror="this.src='./imagenportada/proximamente.png'" loading="lazy">

        <!-- INFO -->
        <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-1.5 mb-0.5">
                <span class="topic-pill" style="background:${ts.bg}; border-color:${ts.border}; color:${ts.text}">
                    ${song.topic}
                </span>
                <span class="text-xs text-gray-500">${song.category}</span>
            </div>
            <p class="font-bold text-sm text-gray-100 truncate">${song.title}</p>
            <div class="star-bar-bg mt-1" style="width:80%">
                <div class="star-bar-fill" style="width:${pct}%"></div>
            </div>
        </div>

        <!-- STARS -->
        <div class="flex flex-col items-end gap-1 flex-shrink-0">
            <div class="stars-display">${renderStars(song.totalStars)}</div>
            <span class="text-xs font-bold text-yellow-400">${formatStars(song.totalStars)} <i class="fas fa-star text-yellow-500 text-[10px]"></i></span>
        </div>
    </div>`;
}

// ── 7. LOAD RANKING FROM FIREBASE ──
async function loadRanking() {
    // Show loader
    document.getElementById('loader').classList.remove('hidden');
    document.getElementById('podiumSection').classList.add('hidden');
    document.getElementById('divider').classList.add('hidden');
    document.getElementById('rankingList').innerHTML = '';
    document.getElementById('emptyState').classList.add('hidden');
    document.getElementById('infoBar').classList.add('hidden');

    try {
        const rankingRef = db.collection('ranking').doc('stars');
        const snap = await rankingRef.get();
        const data = snap.data() || {};
        const rankingStars = data.rankingStars || {};

        // Assign stars to each song
        const ranked = songs.map(s => ({
            ...s,
            totalStars: rankingStars[s.id] || 0
        }));

        // Sort descending by stars
        ranked.sort((a, b) => b.totalStars - a.totalStars);

        // Slice to top 60
const top30 = ranked.slice(0, 30);
const top3   = top30.slice(0, 3);
const rest   = top30.slice(3);

const maxStars = top30[0]?.totalStars || 1;
        const totalVotes = ranked.reduce((acc, s) => acc + s.totalStars, 0);

        // Hide loader
        document.getElementById('loader').classList.add('hidden');

        // ── INFO BAR ──
        document.getElementById('totalCards').textContent = songs.length;
        document.getElementById('totalStarsGlobal').textContent = formatStars(totalVotes);
        document.getElementById('lastUpdate').textContent = formatTime(new Date());
        document.getElementById('infoBar').classList.remove('hidden');

        if (top3.length === 0 || top3.every(s => s.totalStars === 0)) {
            document.getElementById('emptyState').classList.remove('hidden');
            return;
        }

        // ── PODIO ──
        // Layout: 2nd - 1st - 3rd (visual podium)
        const podiumOrder = [top3[1], top3[0], top3[2]].filter(Boolean);
        const rankMap = {};
        top3.forEach((s, i) => { rankMap[s.id] = i + 1; });

        const podiumGrid = document.getElementById('podiumGrid');
        podiumGrid.innerHTML = podiumOrder.map(s => buildPodiumCard(s, rankMap[s.id], maxStars)).join('');
        document.getElementById('podiumSection').classList.remove('hidden');

        // Animate star bars after render
        setTimeout(() => {
            podiumGrid.querySelectorAll('.star-bar-fill').forEach(el => {
                el.style.width = el.style.width; // trigger reflow
            });
        }, 100);

        // ── LIST 4-60 ──
        if (rest.length > 0) {
            const delays = ['delay-1','delay-2','delay-3','delay-4','delay-5','delay-6'];
            const listHTML = rest.map((s, i) => {
                const rank = i + 4;
                const delay = delays[i % delays.length];
                return buildRow(s, rank, maxStars, delay);
            }).join('');

            document.getElementById('rankingList').innerHTML = listHTML;
            document.getElementById('divider').classList.remove('hidden');
        }

    } catch (err) {
        console.error("Error al cargar el ranking:", err);
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('emptyState').classList.remove('hidden');
        document.getElementById('emptyState').innerHTML = `
            <i class="fas fa-exclamation-triangle text-red-500 text-5xl mb-4"></i>
            <p class="text-red-400 text-lg">Error al conectar con Firebase.</p>
            <p class="text-gray-500 text-sm mt-1">${err.message}</p>
        `;
    }
}

// ── 8. AUTH + INIT ──
function logout() {
    auth.signOut().then(() => window.location.href = 'index.html').catch(console.error);
}

auth.onAuthStateChanged(user => {
    if (user) {
        loadRanking();
    } else {
        window.location.href = 'index.html';
    }
});

// Auto-refresh cada 60 segundos
setInterval(loadRanking, 60000);
</script>
