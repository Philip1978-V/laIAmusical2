<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Storycards – La IA Musical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <style>
        /* ─── FONDO Y ESTILOS BASE ─── */
        body {
            background-image: url('./images/fondostorycards.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 60px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(2, 12, 28, 0.75);
            z-index: 0;
            pointer-events: none;
        }

        header, main, .fixed-footer { position: relative; z-index: 1; }

        /* ─── ANIMACIONES DE PODIO ─── */
        @keyframes glow-gold {
            0%, 100% { box-shadow: 0 0 20px 2px rgba(250,204,21,0.4); border-color: rgba(250,204,21,0.6); }
            50% { box-shadow: 0 0 45px 10px rgba(250,204,21,0.8); border-color: rgba(250,204,21,1); }
        }
        @keyframes glow-silver {
            0%, 100% { box-shadow: 0 0 15px 2px rgba(209,213,219,0.3); border-color: rgba(209,213,219,0.5); }
            50% { box-shadow: 0 0 35px 8px rgba(209,213,219,0.7); border-color: rgba(209,213,219,0.9); }
        }
        @keyframes glow-bronze {
            0%, 100% { box-shadow: 0 0 15px 2px rgba(180,120,60,0.3); border-color: rgba(180,120,60,0.5); }
            50% { box-shadow: 0 0 35px 8px rgba(210,140,70,0.7); border-color: rgba(210,140,70,0.9); }
        }
        @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }

        /* ─── TARJETAS PODIO (ESTILO VERTICAL) ─── */
        .podium-card {
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 2px solid transparent;
            overflow: hidden;
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .podium-card .cover-wrap { 
            position: relative; 
            overflow: hidden; 
            background: #0a1628;
            width: 100%;
        }
        
        .podium-card .cover-wrap img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .rank-1 { animation: glow-gold 2s infinite ease-in-out; z-index: 10; }
        .rank-2 { animation: glow-silver 2s infinite ease-in-out; }
        .rank-3 { animation: glow-bronze 2s infinite ease-in-out; }

        .rank-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 44px; height: 44px; border-radius: 50%; font-weight: 900;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .gold { background: linear-gradient(135deg,#f59e0b,#fbbf24); color:#422006; }
        .silver { background: linear-gradient(135deg,#9ca3af,#e5e7eb); color:#1f2937; }
        .bronze { background: linear-gradient(135deg,#b45309,#d97706); color:#fff; }

        .shimmer-text {
            background: linear-gradient(90deg, #fde68a, #fbbf24, #fff, #fbbf24, #fde68a);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 2.5s linear infinite;
        }

        /* ─── DISEÑO RESPONSIVE ADAPTADO ─── */
        @media (max-width: 767px) {
            #podiumGrid { 
                display: flex; 
                flex-direction: column; 
                gap: 2rem; 
            }
            .podium-card { height: auto; }
            .podium-card .cover-wrap { height: 400px; } /* Muy vertical en móvil */
            .rank-1 { order: 1; }
            .rank-2 { order: 2; }
            .rank-3 { order: 3; }
        }

        @media (min-width: 768px) {
            #podiumGrid { 
                display: grid; 
                grid-template-columns: repeat(3, 1fr); 
                align-items: flex-end; 
                gap: 1.5rem; 
                padding-top: 40px;
            }
            /* Rank 1 es el más alto en el centro */
            .rank-1 .cover-wrap { height: 380px; }
            .rank-2 .cover-wrap { height: 300px; }
            .rank-3 .cover-wrap { height: 260px; }
            
            .podium-center { transform: translateY(-20px); }
        }

        /* ─── LISTA DE RANKING ─── */
        .ranking-row {
            background: rgba(13, 30, 55, 0.6);
            border-radius: 16px;
            border: 1px solid rgba(45, 212, 191, 0.1);
            transition: all 0.2s;
        }
        .star-bar-bg { height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.05); overflow: hidden; }
        .star-bar-fill { height: 100%; background: linear-gradient(90deg, #fbbf24, #f59e0b); transition: width 1s ease; }
    </style>
</head>
<body>

<header class="sticky top-0 z-50 bg-black/60 backdrop-blur-xl border-b border-teal-800/30">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
        <button onclick="window.location.href='index.html'" class="flex items-center gap-2 text-teal-400 font-bold uppercase text-xs tracking-widest">
            <i class="fas fa-music"></i> La IA Musical
        </button>
        <h1 id="pageTitle" class="text-xl font-black tracking-tighter shimmer-text uppercase">🏆 CLASIFICACIÓN</h1>
        <div class="flex items-center gap-4">
            <button onclick="loadRanking()" class="text-teal-400 hover:rotate-180 transition-transform duration-500"><i class="fas fa-sync-alt"></i></button>
            <button onclick="logout()" class="text-gray-400"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-10">
    <div id="infoBar" class="hidden grid grid-cols-3 gap-4 mb-12 bg-white/5 backdrop-blur-md p-5 rounded-3xl border border-white/10 text-center">
        <div><p class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Total Cartas</p><p id="totalCards" class="text-xl font-bold text-teal-400">-</p></div>
        <div><p class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Estrellas Global</p><p id="totalStarsGlobal" class="text-xl font-bold text-yellow-500">-</p></div>
        <div><p class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Sincronizado</p><p id="lastUpdate" class="text-xl font-bold text-gray-300">-</p></div>
    </div>

    <div id="podiumSection" class="hidden mb-16">
        <div id="podiumGrid"></div>
    </div>

    <div id="divider" class="hidden flex items-center gap-4 mb-8">
        <div class="h-px flex-1 bg-gradient-to-r from-transparent via-teal-900 to-transparent"></div>
        <span id="lblPositions" class="text-xs font-black text-teal-500 uppercase tracking-[0.3em]">Top 4 – 30</span>
        <div class="h-px flex-1 bg-gradient-to-r from-teal-900 via-teal-900 to-transparent"></div>
    </div>
    
    <div id="rankingList" class="space-y-4"></div>

    <div id="loader" class="flex flex-col items-center py-24 gap-6">
        <div class="relative">
            <div class="w-16 h-16 border-4 border-teal-500/10 border-t-teal-500 rounded-full animate-spin"></div>
            <i class="fas fa-trophy absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-teal-500 animate-pulse"></i>
        </div>
        <p id="loadingText" class="text-teal-400 text-sm font-medium tracking-widest uppercase animate-pulse">Calculando posiciones...</p>
    </div>
</main>

<script>
// ── CONFIGURACIÓN ──
const currentLang = localStorage.getItem('selectedLanguage') || 'es';
const translations = {
    es: { title: "🏆 CLASIFICACIÓN", loading: "Sincronizando ranking...", topFan: "Top Fan:", positions: "TOP 4 – 30" },
    en: { title: "🏆 RANKING", loading: "Syncing ranking...", topFan: "Top Fan:", positions: "TOP 4 – 30" }
};

const firebaseConfig = {
    apiKey: "AIzaSyDW3Yv0AQAVlf3zTuxlqNq6dkZ6kQtpysM",
    authDomain: "laiamusical-4fba7.firebaseapp.com",
    projectId: "laiamusical-4fba7",
    storageBucket: "laiamusical-4fba7.firebasestorage.app",
    messagingSenderId: "49783369602",
    appId: "1:49783369602:web:91e287c094a8f2403d699b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ── CATALOGO COMPLETO TOP 30 ──
const songs = [
    { id: 1,   title: "La novena sinfonía del mundo", titleEn: "The 9th Symphony", cover: "./imagenportada/opera_sinfoniamundo.png", topic: "Ópera", topicEn: "Opera" },
    { id: 5,   title: "El lenguaje del mundo", titleEn: "Language of the World", cover: "./imagenportada/lit_lenguajedelmundo.png", topic: "Literatura", topicEn: "Literature" },
    { id: 7,   title: "El ojo que todo lo ve", titleEn: "The All-Seeing Eye", cover: "./imagenportada/lit_1984.png", topic: "Literatura", topicEn: "Literature" },
    { id: 13,  title: "Tiempos peligrosos", titleEn: "Dangerous Times", cover: "./imagenportada/cine_tiempospeligrosos.png", topic: "Cine", topicEn: "Cinema" },
    { id: 14,  title: "La línea temporal perdida", titleEn: "Lost Timeline", cover: "./imagenportada/cine_lineatemporal.png", topic: "Cine", topicEn: "Cinema" },
    { id: 15,  title: "Biblioteca de horizontes", titleEn: "Horizon Library", cover: "./imagenportada/cine_bibliotecadehorizontes.png", topic: "Cine", topicEn: "Cinema" },
    { id: 16,  title: "Alas de libertad", titleEn: "Wings of Freedom", cover: "./imagenportada/cine_alasdelibertad.png", topic: "Cine", topicEn: "Cinema" },
    { id: 18,  title: "La cicatriz invisible", titleEn: "Invisible Scar", cover: "./imagenportada/lit_cicatriz.png", topic: "Literatura", topicEn: "Literature" },
    { id: 20,  title: "El imperio del trueno", titleEn: "Empire of Thunder", cover: "./imagenportada/cine_imperiodeltrueno.png", topic: "Cine", topicEn: "Cinema" },
    { id: 21,  title: "La herencia del olvido", titleEn: "Inheritance of Oblivion", cover: "./imagenportada/lit_herencia.png", topic: "Literatura", topicEn: "Literature" },
    { id: 22,  title: "El Señor de los locos y sabios", titleEn: "Lord of Madmen", cover: "./imagenportada/lit_quijote.png", topic: "Literatura", topicEn: "Literature" },
    { id: 26,  title: "Voces entre chapas", titleEn: "Voices in Metal", cover: "./imagenportada/cine_vocesentrechapas.png", topic: "Cine", topicEn: "Cinema" },
    { id: 27,  title: "Semilla de luz", titleEn: "Seed of Light", cover: "./imagenportada/cine_semilladeluz.png", topic: "Cine", topicEn: "Cinema" },
    { id: 28,  title: "El Destino", titleEn: "The Destiny", cover: "./imagenportada/cine_eldestino.png", topic: "Cine", topicEn: "Cinema" },
    { id: 29,  title: "El grito en el espacio", titleEn: "Scream in Space", cover: "./imagenportada/cine_grito.png", topic: "Cine", topicEn: "Cinema" },
    { id: 100, title: "Vivir en un suspiro", titleEn: "Living in a Sigh", cover: "./imagenportada/opera_vivirenunsuspiro.png", topic: "Ópera", topicEn: "Opera" },
    { id: 101, title: "El reloj de la naturaleza", titleEn: "Nature's Clock", cover: "./imagenportada/opera_relojdelanaturaleza.png", topic: "Ópera", topicEn: "Opera" },
    { id: 102, title: "Donde muere la noche", titleEn: "Where Night Dies", cover: "./imagenportada/opera_dondemuerelanoche.png", topic: "Ópera", topicEn: "Opera" },
    { id: 103, title: "Sinfonía de los jardines", titleEn: "Garden Symphony", cover: "./imagenportada/opera_jardinesreales.png", topic: "Ópera", topicEn: "Opera" },
    { id: 104, title: "El ave sin jaula", titleEn: "Bird Without Cage", cover: "./imagenportada/opera_avesinjaula.png", topic: "Ópera", topicEn: "Opera" },
    { id: 200, title: "Una jungla divertida", titleEn: "Funny Jungle", cover: "./imagenportada/animacion_jungladivertida.png", topic: "Animación", topicEn: "Animation" },
    { id: 201, title: "Despierta mi constelación", titleEn: "Wake My Constellation", cover: "./imagenportada/animacion_miconstelacion.png", topic: "Animación", topicEn: "Animation" },
    { id: 202, title: "La aventura de tu vida", titleEn: "Adventure of Life", cover: "./imagenportada/animacion_aventuradetuvida.png", topic: "Animación", topicEn: "Animation" },
    { id: 203, title: "Latidos de papel", titleEn: "Paper Heartbeats", cover: "./imagenportada/animacion_latidosdepapel.png", topic: "Animación", topicEn: "Animation" },
    { id: 300, title: "El eco de la libertad", titleEn: "Echo of Freedom", cover: "./imagenportada/teatro_ecodelalibertad.png", topic: "Teatro", topicEn: "Theater" },
    { id: 400, title: "Canto de Escarcha", titleEn: "Frost Song", cover: "./imagenportada/series_cantoescarcha.png", topic: "Series", topicEn: "Series" },
    { id: 500, title: "El juramento de las murallas", titleEn: "Oath of Walls", cover: "./imagenportada/anime_juramentomurallas.png", topic: "Anime", topicEn: "Anime" },
    { id: 600, title: "Planeta Tierra", titleEn: "Planet Earth", cover: "./imagenportada/doc_planetatierra.png", topic: "Documentales", topicEn: "Documentary" },
    { id: 601, title: "Microcosmos", titleEn: "Microcosmos", cover: "./imagenportada/doc_microcosmos.png", topic: "Documentales", topicEn: "Documentary" },
    { id: 602, title: "Mundos perdidos", titleEn: "Lost Worlds", cover: "./imagenportada/doc_mundosperdidos.png", topic: "Documentales", topicEn: "Documentary" }
];

function buildPodiumCard(song, rank, topUser, maxStars) {
    const dTitle = currentLang === 'en' ? song.titleEn : song.title;
    const dTopic = currentLang === 'en' ? song.topicEn : song.topic;
    const badgeClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : 'bronze';
    const pct = Math.round((song.totalStars / maxStars) * 100) || 0;

    return `
    <div class="podium-card rank-${rank} ${rank === 1 ? 'podium-center' : ''}">
        <div class="cover-wrap">
            <img src="${song.cover}" onerror="this.src='./imagenportada/proximamente.png'">
            <div class="absolute top-4 left-4 rank-badge ${badgeClass}">${rank}</div>
        </div>
        <div class="p-5 bg-slate-900/90 flex-1 border-t border-white/5">
            <span class="text-[9px] font-black text-teal-400 uppercase tracking-[0.2em]">${dTopic}</span>
            <h3 class="mt-2 font-bold leading-tight ${rank === 1 ? 'shimmer-text text-xl' : 'text-base'}">${dTitle}</h3>
            
            <div class="mt-6">
                <div class="flex justify-between items-end mb-1">
                   <span class="text-xs font-black text-yellow-500">${song.totalStars} ⭐</span>
                   <span class="text-[10px] text-gray-500">${pct}% Popularidad</span>
                </div>
                <div class="star-bar-bg"><div class="star-bar-fill" style="width:${pct}%"></div></div>
            </div>
            
            <p class="mt-4 text-[10px] text-gray-400 italic opacity-80">
                <i class="fas fa-user-crown text-yellow-600 mr-1"></i> ${translations[currentLang].topFan} <span class="text-gray-200">${topUser}</span>
            </p>
        </div>
    </div>`;
}

async function loadRanking() {
    document.getElementById('pageTitle').textContent = translations[currentLang].title;
    document.getElementById('loadingText').textContent = translations[currentLang].loading;
    document.getElementById('loader').classList.remove('hidden');

    try {
        const snap = await db.collection('ranking').doc('stars').get();
        const rankingData = snap.data()?.rankingStars || {};

        let ranked = songs.map(s => ({ ...s, totalStars: rankingData[s.id] || 0 }))
                          .sort((a, b) => b.totalStars - a.totalStars)
                          .slice(0, 30);

        const topUserSnap = await db.collection('users').orderBy('userStars', 'desc').limit(1).get();
        const topUser = topUserSnap.docs[0]?.data()?.displayName || 'Melómano Anon';
        const maxStars = ranked[0]?.totalStars || 1;

        // Renderizar Podio
        // En desktop: [2, 1, 3] / En Mobile: El CSS controla el orden
        const top3 = ranked.slice(0, 3);
        let podiumHTML = "";
        
        if (window.innerWidth >= 768) {
            // Orden visual: Plata(2), Oro(1), Bronce(3)
            const displayOrder = [top3[1], top3[0], top3[2]].filter(Boolean);
            podiumHTML = displayOrder.map(s => {
                const rank = ranked.indexOf(s) + 1;
                return buildPodiumCard(s, rank, topUser, maxStars);
            }).join('');
        } else {
            // Orden móvil: 1, 2, 3
            podiumHTML = top3.map((s, i) => buildPodiumCard(s, i + 1, topUser, maxStars)).join('');
        }
        
        document.getElementById('podiumGrid').innerHTML = podiumHTML;

        // Renderizar Lista 4-30
        const rest = ranked.slice(3);
        document.getElementById('rankingList').innerHTML = rest.map((s, i) => {
            const dTitle = currentLang === 'en' ? s.titleEn : s.title;
            const pct = Math.round((s.totalStars / maxStars) * 100);
            return `
            <div class="ranking-row flex items-center gap-4 p-4 hover:bg-teal-500/5 transition-colors">
                <span class="w-8 text-center font-black text-gray-500 text-lg">#${i+4}</span>
                <img src="${s.cover}" class="w-14 h-14 rounded-xl object-cover shadow-lg bg-black border border-white/5" onerror="this.src='./imagenportada/proximamente.png'">
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-sm sm:text-base truncate uppercase tracking-tight">${dTitle}</p>
                    <div class="star-bar-bg w-full mt-2"><div class="star-bar-fill" style="width:${pct}%"></div></div>
                </div>
                <div class="text-right pl-2">
                    <p class="text-sm font-black text-yellow-500">${s.totalStars} ⭐</p>
                </div>
            </div>`;
        }).join('');

        document.getElementById('totalCards').textContent = songs.length;
        document.getElementById('totalStarsGlobal').textContent = ranked.reduce((a,b) => a + b.totalStars, 0).toLocaleString();
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        
        document.getElementById('podiumSection').classList.remove('hidden');
        document.getElementById('divider').classList.remove('hidden');
        document.getElementById('infoBar').classList.remove('hidden');
    } catch (e) { 
        console.error("Error cargando ranking:", e); 
    }
    document.getElementById('loader').classList.add('hidden');
}

function logout() { firebase.auth().signOut().then(() => window.location.href = 'index.html'); }

// Listener para cambios de tamaño de ventana (para re-ordenar el podio)
window.addEventListener('resize', () => {
    if (document.getElementById('loader').classList.contains('hidden')) loadRanking();
});

firebase.auth().onAuthStateChanged(user => user ? loadRanking() : window.location.href = 'index.html');
</script>
</body>
</html>
