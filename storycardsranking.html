        }

        /* ─── ANIMACIONES DE PODIO ─── */
        @keyframes glow-gold {
            0%, 100% { box-shadow: 0 0 20px 2px rgba(250,204,21,0.4); border-color: rgba(250,204,21,0.6); }
            50%       { box-shadow: 0 0 45px 10px rgba(250,204,21,0.8); border-color: rgba(250,204,21,1); }
        }

            0%, 100% { box-shadow: 0 0 15px 2px rgba(209,213,219,0.3); border-color: rgba(209,213,219,0.5); }
            50%       { box-shadow: 0 0 35px 8px rgba(209,213,219,0.7); border-color: rgba(209,213,219,0.9); }
        }
        @keyframes glow-bronze {
            0%, 100% { box-shadow: 0 0 15px 2px rgba(180,120,60,0.3); border-color: rgba(180,120,60,0.5); }
            50%       { box-shadow: 0 0 35px 8px rgba(210,140,70,0.7); border-color: rgba(210,140,70,0.9); }
        }
        @keyframes shimmer {
            0%   { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* ─── TARJETAS PODIO ─── */
        .podium-card {
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 2px solid transparent;
            overflow: hidden;
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .podium-card .cover-wrap {
            position: relative;
            overflow: hidden;
            background: #0a1628;
            width: 100%;
        }
        .podium-card .cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rank-1 { animation: glow-gold   2s infinite ease-in-out; z-index: 10; }
        .rank-2 { animation: glow-silver 2s infinite ease-in-out; }
        .rank-3 { animation: glow-bronze 2s infinite ease-in-out; }

        .rank-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 44px; height: 44px; border-radius: 50%; font-weight: 900;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .gold   { background: linear-gradient(135deg,#f59e0b,#fbbf24); color:#422006; }
        .silver { background: linear-gradient(135deg,#9ca3af,#e5e7eb); color:#1f2937; }
        .bronze { background: linear-gradient(135deg,#b45309,#d97706); color:#fff; }

        .shimmer-text {
            background: linear-gradient(90deg, #fde68a, #fbbf24, #fff, #fbbf24, #fde68a);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 2.5s linear infinite;
        }

        @media (max-width: 767px) {
            #podiumGrid { display: flex; flex-direction: column; gap: 2rem; }
            .podium-card .cover-wrap { height: 350px; }
            .rank-1 { order: 1; }
            .rank-2 { order: 2; }
            .rank-3 { order: 3; }
        }
        @media (min-width: 768px) {
            #podiumGrid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                align-items: flex-end;
                gap: 1.5rem;
                padding-top: 40px;
            }
            .rank-1 .cover-wrap { height: 380px; }
            .rank-2 .cover-wrap { height: 300px; }
            .rank-3 .cover-wrap { height: 260px; }
            .podium-center { transform: translateY(-20px); }
        }

            background: rgba(13, 30, 55, 0.6);

            border: 1px solid rgba(45, 212, 191, 0.1);

// ══════════════════════════════════════════════════════════════
//  OBTENER VOTANTES REALES PARA UNA STORYCARD
//  Lee voteLog de cada usuario en Firestore y resuelve el nombre
//  real usando el campo correcto (username / userName / displayName)
// ══════════════════════════════════════════════════════════════
async function getTopVotersForSong(songId) {
    try {
        const usersSnap = await db.collection('users').get();
        const voters = [];

        usersSnap.forEach(doc => {
            const data = doc.data();
            if (!data.voteLog) return;

            // Comprobar tanto la clave numérica como la de string
            const voteEntry = data.voteLog[songId] ?? data.voteLog[String(songId)];
            if (!voteEntry) return;

            // Estrellas dadas a esta carta
            const starsGiven = typeof voteEntry === 'object'
                ? (voteEntry.starsGiven || 0)
                : (voteEntry || 0);

            // ── NOMBRE REAL del usuario ──
            // Orden de preferencia idéntico al usado en miscartas.html y usuarios.html:
            // username  →  userName  →  displayName  →  prefijo email  →  Anónimo
            const name = resolveUsername(data);

            voters.push({ name, starsGiven });
        });

        // Ordenar por estrellas dadas y devolver top 3
        return voters
            .sort((a, b) => b.starsGiven - a.starsGiven)
            .slice(0, 3);

    } catch (e) {
        console.error("Error obteniendo votantes:", e);
        return [];
    }
}

// ══════════════════════════════════════════════════════════════
//  CONSTRUIR TARJETA DE PODIO
// ══════════════════════════════════════════════════════════════
function buildPodiumCard(song, rank, voters) {
    const dTitle    = currentLang === 'en' ? song.titleEn : song.title;
    const dTopic    = currentLang === 'en' ? song.topicEn : song.topic;
    const badgeClass = rank === 1 ? 'gold' : rank === 2 ? 'silver' : 'bronze';
    const noVotesTxt = translations[currentLang].noVotes;

    // Lista de votantes con nombre real + avatar de inicial
    const votersHTML = voters.length > 0
        ? voters.map((v, i) => {
            // Inicial para el avatar (primera letra del nombre real)
            const initial = v.name.charAt(0).toUpperCase();
            return `
            <div class="flex items-center gap-2 mt-1.5">
                <span class="text-[8px] font-black text-teal-500 w-4 text-center">#${i + 1}</span>
                <div class="voter-avatar">${initial}</div>
                <span class="text-[9px] text-gray-200 truncate flex-1" title="${v.name}">${v.name}</span>
                <span class="text-[8px] text-yellow-500/80 ml-auto font-bold whitespace-nowrap">${v.starsGiven}⭐</span>
            </div>`;
          }).join('')
        : `<p class="text-[9px] text-gray-500 italic mt-1">${noVotesTxt}</p>`;

    return `
    <div class="podium-card rank-${rank} ${rank === 1 ? 'podium-center' : ''}">
        <div class="cover-wrap">
            <img src="${song.cover}" onerror="this.src='./imagenportada/proximamente.png'" alt="${dTitle}">
            <div class="absolute top-4 left-4 rank-badge ${badgeClass}">${rank}</div>
        </div>
        <div class="p-5 bg-slate-900/90 flex-1 border-t border-white/5">
            <span class="text-[9px] font-black text-teal-400 uppercase tracking-[0.2em]">${dTopic}</span>
            <h3 class="mt-2 font-bold leading-tight ${rank === 1 ? 'shimmer-text text-xl' : 'text-base'}">${dTitle}</h3>

            <div class="mt-4 pt-4 border-t border-white/5">
                <p class="text-xs font-black text-yellow-500 mb-2">${song.totalStars.toLocaleString()} ⭐</p>
                <p class="text-[10px] text-teal-400 font-bold uppercase tracking-tighter mb-2 italic">
                    <i class="fas fa-crown text-[8px] mr-1"></i>
                    ${translations[currentLang].topUsers}
                </p>
                <div class="grid grid-cols-1 gap-0.5">
                    ${votersHTML}
                </div>
            </div>
        </div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
//  CARGAR RANKING COMPLETO
// ══════════════════════════════════════════════════════════════
async function loadRanking() {
    // Actualizar textos según idioma
    document.getElementById('navBrand').textContent    = translations[currentLang].brand;
    document.getElementById('pageTitle').textContent   = translations[currentLang].title;
    document.getElementById('loadingText').textContent = translations[currentLang].loading;
    document.getElementById('lblTotalCards').textContent  = translations[currentLang].totalCards;
    document.getElementById('lblGlobalStars').textContent = translations[currentLang].globalStars;
    document.getElementById('lblSynced').textContent      = translations[currentLang].synced;
    document.getElementById('lblPositions').textContent   = translations[currentLang].positions;

    document.getElementById('loader').classList.remove('hidden');
    document.getElementById('podiumSection').classList.add('hidden');
    document.getElementById('divider').classList.add('hidden');
    document.getElementById('infoBar').classList.add('hidden');

    try {
        // 1. Leer ranking global de la colección 'ranking/stars'
        const snap        = await db.collection('ranking').doc('stars').get();
        const rankingData = snap.data()?.rankingStars || {};

        // 2. Construir lista ordenada
        const ranked = songs
            .map(s => ({ ...s, totalStars: rankingData[s.id] || 0 }))
            .sort((a, b) => b.totalStars - a.totalStars)
            .slice(0, 30);

        const top3 = ranked.slice(0, 3);

        // 3. Obtener votantes REALES para cada carta del podio (en paralelo)
        const top3WithVoters = await Promise.all(
            top3.map(async (s) => {
                const voters = await getTopVotersForSong(s.id);
                return { ...s, voters };
            })
        );

        // 4. Renderizar podio (desktop: orden visual 2-1-3 / mobile: 1-2-3)
        let podiumHTML = '';
        if (window.innerWidth >= 768) {
            const displayOrder = [
                top3WithVoters[1],
                top3WithVoters[0],
                top3WithVoters[2]
            ].filter(Boolean);

            podiumHTML = displayOrder.map(s => {
                const rank = ranked.findIndex(r => r.id === s.id) + 1;
                return buildPodiumCard(s, rank, s.voters);
            }).join('');
        } else {
            podiumHTML = top3WithVoters
                .map((s, i) => buildPodiumCard(s, i + 1, s.voters))
                .join('');
        }
        document.getElementById('podiumGrid').innerHTML = podiumHTML;

        // 5. Renderizar lista Top 4–30
        const rest = ranked.slice(3);
        document.getElementById('rankingList').innerHTML = rest.map((s, i) => {
            const dTitle = currentLang === 'en' ? s.titleEn : s.title;
            return `
            <div class="ranking-row flex items-center gap-4 p-4 hover:bg-teal-500/5 transition-colors">
                <span class="w-8 text-center font-black text-gray-500 text-lg">#${i + 4}</span>
                <img src="${s.cover}" alt="${dTitle}"
                     class="w-14 h-14 rounded-xl object-cover shadow-lg bg-black border border-white/5"
                     onerror="this.src='./imagenportada/proximamente.png'">
                <div class="flex-1 min-w-0">
                    <p class="font-bold text-sm sm:text-base truncate uppercase tracking-tight">${dTitle}</p>
                </div>
                <div class="text-right pl-2">
                    <p class="text-sm font-black text-yellow-500">${s.totalStars.toLocaleString()} ⭐</p>
                </div>
            </div>`;
        }).join('');

        // 6. Actualizar info bar
        document.getElementById('totalCards').textContent       = songs.length;
        document.getElementById('totalStarsGlobal').textContent = ranked.reduce((a, b) => a + b.totalStars, 0).toLocaleString();
        document.getElementById('lastUpdate').textContent       = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // 7. Mostrar secciones ocultas
        document.getElementById('podiumSection').classList.remove('hidden');
        document.getElementById('divider').classList.remove('hidden');
        document.getElementById('infoBar').classList.remove('hidden');

    } catch (e) {
        console.error("Error cargando ranking:", e);
    }

    document.getElementById('loader').classList.add('hidden');
}

// ══════════════════════════════════════════════════════════════
//  RESIZE: recargar si la vista cambia entre mobile y desktop
// ══════════════════════════════════════════════════════════════
let lastBreakpoint = window.innerWidth >= 768;
window.addEventListener('resize', () => {
    const isDesktop = window.innerWidth >= 768;
    if (isDesktop !== lastBreakpoint) {
        lastBreakpoint = isDesktop;
        if (document.getElementById('loader').classList.contains('hidden')) {
            loadRanking();
        }
    }
});

// ══════════════════════════════════════════════════════════════
//  AUTH & LOGOUT
// ══════════════════════════════════════════════════════════════
firebase.auth().onAuthStateChanged(user => {
    if (user) {
        loadRanking();
    } else {
        window.location.href = 'index.html';
    }
});

function logout() {
    firebase.auth().signOut().then(() => window.location.href = 'index.html');
}
</script>
